  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - merger notification
      - Section 11
      - merger filing
    - - divestiture notification
      - Section 12
      - divestiture filing
      - contingency
    - - different filing types
      - two different filings
      - distinct regulatory triggers
      - separate filing requirements
- name: Determined correct authoritative deadline
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - April 10
      - 10 April
      - April 10th
      - 10th of April
    - - merger notification
      - Section 11
      - primary filing
      - Lakitoimisto Virtanen scope
    - - March 27
      - share purchase agreement execution
      - transaction trigger
      - SPA execution
- name: Recognized divestiture filing as contingency scenario
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - contingency
      - secondary scenario
      - remedies scenario
      - fallback
      - not primary
    - - EcoCompliance
      - divestiture planning
    - - April 15
      - 21-day
      - divestiture deadline
- name: Verified engagement scope via finance records
  weight: 0.15
  check:
    type: tool_called
    tool_name: finance_get_transaction
    min_calls: 1
- name: Cross-referenced Notion decision logs
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_notion_get_page
    min_calls: 2
- name: Documented resolution in Notion
  weight: 0.2
  check:
    type: tool_called
    tool_name: claw_notion_append_blocks
    min_calls: 1
- name: Sent Workmail clarification with CFO copied
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - CFO
      - cfo@vasaholm.se
      - Chief Financial Officer
    - - April 10
      - correct deadline
      - authoritative deadline
    - - merger notification
      - Section 11
      - Lakitoimisto Virtanen
    - - audit trail
      - documentation
      - regulatory compliance
