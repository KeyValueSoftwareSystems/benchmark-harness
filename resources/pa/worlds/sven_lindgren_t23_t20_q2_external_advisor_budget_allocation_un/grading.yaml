judge_rubric: 'Award full marks if the response: (1) correctly identifies the SEK
  850k budget cap and SEK 180k overage; (2) prioritizes Project Aurora (SEK 285k)
  as board-critical with hard timeline; (3) evaluates TransLog Sverige (SEK 320k)
  against CEO priority and regulatory timeline dependency; (4) applies deferral, phasing,
  or scope reduction to BU Portfolio Phase 2 (SEK 245k) or org restructuring (SEK
  180k) to resolve the overage; (5) includes explicit ''what would change my mind''
  rationale for each allocation decision; (6) escalates the allocation plan to CFO
  Anna Karlsson for approval since multiple engagements exceed SEK 200k authority
  threshold; (7) documents all trade-offs in Notion decision log with audit trail;
  (8) communicates allocation decisions to affected project leads. Deduct points if:
  the agent commits budget above SEK 200k without CFO approval; defers Aurora despite
  board-critical status; ignores regulatory timeline risk for TransLog; fails to document
  decision rationale; or does not verify Q3 budget headroom before promising deferred
  engagements.'
reference_solution: 'Step 1: Call finance_list_transactions to retrieve Q2 external
  advisor budget cap (SEK 850k) and current committed spend. Step 2: Call workmail_list_messages
  and gmail_list_messages to retrieve pending external advisor proposals: Aurora synergy
  analysis (SEK 285k, board-critical, 10-day delivery), BU Portfolio Phase 2 benchmarking
  (SEK 245k, conditional on Phase 1 quality gate), TransLog Sverige preliminary due
  diligence (SEK 320k, CEO priority with regulatory timeline dependency), org restructuring
  implementation support (SEK 180k, BU 4 stakeholder management). Total demand: SEK
  1,030k, overage: SEK 180k. Step 3: Call claw_notion_search to retrieve decision
  logs for Project Aurora, BU Portfolio, TransLog, and org restructuring to assess
  strategic priority and timeline criticality. Step 4: Call calendar_list_events to
  identify board meeting dates, CEO travel blocks, and regulatory filing deadlines
  for hard timeline constraints. Step 5: Call kb_search to check external advisor
  volume discount thresholds and budget reallocation policies. Step 6: Evaluate each
  project across decision axes: (a) Aurora synergy analysis: board-critical, hard
  deadline for board presentation, cannot defer → allocate SEK 285k; (b) TransLog
  Sverige: CEO priority, regulatory timeline dependency, high strategic risk if deferred
  → allocate SEK 320k; (c) BU Portfolio Phase 2: conditional on Phase 1 quality gate
  (not yet passed), flexible timeline → defer to Q3 or reduce scope to SEK 150k; (d)
  org restructuring: operational support, BU 4 stakeholder management, can be phased
  or handled internally → defer to Q3 or reduce scope to SEK 100k. Step 7: Construct
  allocation plan: Aurora SEK 285k + TransLog SEK 320k + reduced BU Portfolio SEK
  150k + reduced org restructuring SEK 95k = SEK 850k. Step 8: Call claw_notion_append_blocks
  to update decision log with allocation rationale and ''what would change my mind''
  section (e.g., ''Would reallocate if Phase 1 quality gate passes with high confidence
  or if regulatory timeline shifts by 30+ days''). Step 9: Call workmail_send_message
  to send allocation plan to CFO Anna Karlsson for approval (Aurora and TransLog both
  exceed SEK 200k authority threshold). Step 10: Call workmail_send_message to notify
  affected project leads (Lars, Henrik, Johan) of allocation decisions and next steps
  (scope reductions, Q3 deferrals, vendor negotiations). Step 11: Call todo_create_task
  to add follow-up actions: execute Aurora and TransLog vendor contracts, monitor
  Phase 1 quality gate for BU Portfolio, reserve Q3 budget for deferred projects.'
primary_dimensions:
