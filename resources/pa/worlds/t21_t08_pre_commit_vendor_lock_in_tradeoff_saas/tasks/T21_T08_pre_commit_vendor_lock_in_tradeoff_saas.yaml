scoring_components:
- name: Consulted Notion evaluation scorecards for pilot tools
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_notion_search
    min_calls: 1
- name: Reviewed Workmail for alternative vendor pricing and engineering feedback
  weight: 0.15
  check:
    type: tool_called
    tool_name: workmail_list_messages
    min_calls: 1
- name: Identified sunk cost vs opportunity cost tradeoff for each tool
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - sunk cost
      - non-refundable
      - already paid
      - cannot recover
    - - opportunity cost
      - ROI delta
      - net benefit
      - financial outcome
    - - observability
      - analytics pipeline
      - CDP
      - customer data platform
- name: Generated per-tool recommendation with proceed/abandon/negotiate decision
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - proceed
      - convert
      - commit
      - continue
    - - abandon
      - switch
      - alternative
      - discontinue
    - - negotiate
      - price match
      - pilot credit
      - renegotiate
- name: Flagged approval boundary escalation for high-value contracts
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - $50K
      - 50K
      - fifty thousand
      - approval threshold
      - authority limit
    - - VP
