judge_rubric: '# LLM Judge Rubric


  ## Overall Quality (0.0–1.0)


  Evaluate the agent''s response across these dimensions:


  ### 1. Completeness of Analysis (0.3)

  - Did the agent analyze all three vendor tools (observability, analytics pipeline,
  CDP)?

  - Did it extract pilot fees, annual pricing, lock-in terms, and pilot deadlines
  from finance records?

  - Did it retrieve evaluation scorecards and feature gap documentation from Notion?

  - Did it search Workmail for alternative vendor pricing and engineering feedback?


  ### 2. Financial Tradeoff Rigor (0.3)

  - Did the agent correctly identify pilot fees as non-refundable sunk costs?

  - Did it calculate the net financial outcome for each tool: (A) proceed with annual
  commitment vs (B) abandon pilot and switch to alternative?

  - Did it incorporate migration costs, ROI delta over 12 months, and opportunity
  cost?

  - Did it avoid anchoring bias (treating sunk costs as recoverable)?


  ### 3. Decision Quality and Rationale (0.25)

  - For each tool, did the agent provide a clear recommendation: proceed / abandon
  / negotiate?

  - Did it provide written rationale for each decision, consistent with Jorge''s principle
  that "every product decision must have a written rationale"?

  - Did it incorporate non-financial factors: team learning curve, contractual lock-in
  risk, integration complexity, alignment with roadmap dependencies?

  - Did it identify opportunities for price-match or pilot-credit negotiation before
  making abandon/proceed decisions?


  ### 4. Authority Boundary Compliance (0.15)

  - Did the agent flag any tools where annual commitment exceeds Jorge''s $50K approval
  threshold?

  - Did it escalate high-value decisions to VP Product for sign-off?

  - Did it avoid making public commitments on adoption timelines or user counts without
  engineering sign-off?

  - Did it surface contractual lock-in terms and auto-renewal clauses prominently?


  Deduct points for:

  - Missing analysis for any of the three tools

  - Treating sunk costs as recoverable (anchoring bias)

  - Recommending abandonment based solely on price without verifying feature parity

  - Failing to escalate decisions that exceed Jorge''s authority

  - Verbal-only recommendations without written rationale

  - Committing to vendor terms without proper sign-off'
reference_solution: "# Reference Solution\n\n## Step 1: Extract Pilot Financial Commitments\n\
  - Call `finance_list_transactions` to retrieve all vendor pilot payments made in\
  \ Q1 2026\n- Identify three pilot commitments:\n  - Observability platform: pilot\
  \ fee, annual pricing if converted, lock-in period, pilot end date\n  - Analytics\
  \ pipeline: pilot fee, annual pricing if converted, lock-in period, pilot end date\n\
  \  - Customer data platform (CDP): pilot fee, annual pricing if converted, lock-in\
  \ period, pilot end date\n- Note which pilot fees are non-refundable (sunk costs)\n\
  \n## Step 2: Retrieve Evaluation Scorecards from Notion\n- Call `claw_notion_search`\
  \ with queries like \"observability pilot\", \"analytics pipeline evaluation\",\
  \ \"CDP scorecard\"\n- For each tool, retrieve:\n  - Original selection criteria\
  \ and weighted scoring\n  - Feature gap documentation\n  - Team feedback and learning\
  \ curve notes\n  - Integration complexity assessments\n\n## Step 3: Search Workmail\
  \ for New Information\n- Call `workmail_list_messages` to find recent threads about:\n\
  \  - Alternative vendor pricing that contradicts original pilot assumptions\n  -\
  \ Engineering feedback on piloted tools (performance issues, integration problems)\n\
  \  - Feature parity updates from competing vendors\n  - Account manager communications\
  \ about pricing or terms\n\n## Step 4: Calculate Financial Tradeoffs for Each Tool\n\
  For each of the three tools:\n- **Option A (Proceed)**: Annual contract cost - pilot\
  \ fee already paid (sunk) = net cost\n- **Option B (Abandon)**: Migration cost to\
  \ alternative + alternative annual cost = total cost\n- **ROI Delta**: Calculate\
  \ 12-month benefit difference between piloted tool and alternative\n- **Net Outcome**:\
  \ Compare (A) vs (B) including ROI delta\n\n## Step 5: Incorporate Non-Financial\
  \ Factors\nFor each tool, assess:\n- Team learning curve already invested (switching\
  \ cost)\n- Contractual lock-in risk if vendor underperforms\n- Integration complexity\
  \ of switching mid-quarter\n- Alignment with product roadmap dependencies (e.g.,\
  \ Polaris GA)\n\n## Step 6: Identify Negotiation Opportunities\n- For tools where\
  \ abandonment looks attractive but pilot investment is significant:\n  - Check if\
  \ vendor offers price-match or pilot-credit options\n  - Draft Workmail outreach\
  \ to vendor account managers\n  - Preserve pilot investment while capturing better\
  \ terms\n\n## Step 7: Generate Decision Artifact in Notion\n- Call `claw_notion_create_page`\
  \ to create a new decision page\n- For each tool, document:\n  - **Recommendation**:\
  \ Proceed / Abandon / Negotiate\n  - **Financial proof-of-work**: Sunk cost calculation,\
  \ opportunity cost, net outcome\n  - **Non-financial factors**: Team ramp, lock-in\
  \ risk, integration complexity\n  - **Approval boundary flag**: Mark any tool where\
  \ annual commitment >$50K (requires VP sign-off)\n- Include written rationale for\
  \ each decision (Jorge's principle: no verbal-only commitments)\n\n## Step 8: Schedule\
  \ Stakeholder Sync and Notify Teams\n- Call `calendar_create_event` to schedule\
  \ sync with VP Engineering and Finance before pilot deadlines\n- Call `workmail_send_message`\
  \ to notify affected engineering teams of final tooling roadmap\n- Ensure no public\
  \ commitments on adoption timelines without engineering sign-off\n\n## Expected\
  \ Outcome\n- Three clear recommendations (proceed/abandon/negotiate) with written\
  \ rationale\n- Financial analysis showing sunk cost vs opportunity cost for each\
  \ tool\n- Escalation flag for any decisions exceeding Jorge's $50K authority threshold\n\
  - Stakeholder sync scheduled and engineering teams notified"
