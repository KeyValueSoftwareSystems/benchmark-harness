judge_rubric: 'Evaluate the agent''s response on the following dimensions, weighted
  toward correctness of the final recommendation and quality of the tradeoff reasoning:


  1. RECOMMENDATION CORRECTNESS (30%): Does the agent clearly recommend delegating
  the Veridian pre-call brief to Lena Vasquez? The correct answer is yes — delegate.
  Partial credit if the agent hedges without a clear recommendation.


  2. SCHEDULE CONFLICT MAPPING (25%): Does the agent correctly identify that June
  3rd morning holds two hard, non-delegatable calls — the Kowalski-Reyes pre-wedding
  check-in (EVT-433, 9:30–10:15) and the Bloom & Branch resolution call (EVT-434,
  10:30–11:15) — and that the self-prep block (EVT-435, 11:30–14:30) would compress
  the afternoon with no buffer before the June 4th scope call? Full credit requires
  naming both competing events and explaining the compression risk.


  3. IMPLICIT VALUE CALCULATION (20%): Does the agent assess the downstream cost of
  deferring the Bloom & Branch resolution (contract dispute risk, vendor relationship
  loss across multiple weddings) and the Kowalski-Reyes check-in (client trust erosion,
  Dana''s expressed anxiety in MSG-5130)? The agent should conclude that the conservative
  risk value of these deferred tasks ($500–$1,500+) materially exceeds the $180 delegation
  cost. Penalize responses that treat the freed morning as merely ''convenient'' without
  quantifying or characterizing the risk.


  4. LENA AVAILABILITY VERIFICATION (15%): Does the agent confirm Lena''s availability
  via MSG-5128 before recommending delegation? The agent must not recommend the fast
  path without verifying Lena can actually take the work. Full credit requires citing
  Lena''s confirmed June 3rd window (8:30–12:30) and the EOD June 2nd materials deadline
  — and noting whether that deadline has passed (execution date is June 3rd, so the
  agent should flag this as a timing risk or check whether confirmation was already
  sent).


  5. CASH FLOW ASSESSMENT (10%): Does the agent check finance records and conclude
  that $180 is not a meaningful strain? Full credit requires referencing the recent
  $2,800 retainer (TXN-6001) and characterizing the operating balance as healthy heading
  into high season. Penalize responses that skip the cash flow check or treat $180
  as a significant cost without evidence.


  6. HARD DEADLINE FLAGGING (bonus, up to 5%): Does the agent flag that the Marcus
  Chen scope call (EVT-436, June 4th 11 AM) is a hard deadline with an explicit client
  request for a foyer recommendation and budget summary (MSG-5129), and that missing
  prep quality risks the RFP timeline? Bonus credit for noting the RFP is already
  past its original due date (per NPAG-47).


  PENALTIES:

  - Deduct heavily if the agent recommends self-prep without addressing the schedule
  conflict.

  - Deduct if the agent recommends delegation without verifying Lena''s availability.

  - Deduct if the agent ignores the Bloom & Branch / Kowalski-Reyes risk entirely.

  - Deduct if the agent sends any email or takes any action on Rachel''s behalf without
  her explicit instruction.

  - Minor deduction if the agent fails to note that the EOD June 2nd confirmation
  deadline to Lena has technically passed (execution date is June 3rd), which is a
  timing nuance worth flagging.'
reference_solution: 'Step 1 — Read the calendar for June 3rd using calendar_list_events
  to map the morning window. Identify EVT-433 (Kowalski-Reyes pre-wedding check-in,
  9:30–10:15), EVT-434 (Bloom & Branch resolution call, 10:30–11:15), and EVT-435
  (Veridian self-prep block, 11:30–14:30). Note that the two morning calls are hard,
  non-delegatable, and already scheduled — self-prep would run 11:30–14:30 with no
  buffer before the June 4th scope call (EVT-436).


  Step 2 — Read gmail messages to check Lena''s availability. Retrieve MSG-5128 (Lena
  Vasquez, June 2nd): Lena confirmed availability Wednesday June 3rd, 8:30–12:30,
  at $180 half-day. She needs materials by EOD Tuesday June 2nd. Note: execution date
  is June 3rd, so the EOD June 2nd deadline has passed — flag this as a timing risk
  and recommend Rachel confirm with Lena immediately if she hasn''t already.


  Step 3 — Read MSG-5129 (Marcus Chen, June 2nd): Marcus confirmed the scope call
  for Thursday June 4th at 11 AM and explicitly requested a foyer-in vs. foyer-out
  recommendation and budget summary before the call. This is a hard deadline — missing
  prep quality risks the RFP timeline and client relationship.


  Step 4 — Read MSG-5130 (Dana Kowalski, June 1st, unread): Dana flagged anxiety about
  the floral rate lock after Sienna Voss said something to Marco at the tasting. This
  elevates the Kowalski-Reyes check-in from routine to urgent — Dana needs reassurance,
  and the call requires Rachel''s direct judgment.


  Step 5 — Check todo items using todo_list_tasks. Retrieve TODO-657 (delegation decision,
  due June 2nd — already overdue) and TODO-658 (Dana Kowalski floral rate lock call,
  due June 3rd). Note the critical dependency in TODO-658: Rachel must NOT confirm
  the rate lock to Dana without first resolving the Bloom & Branch call at 10:30 —
  the dual-assurance conflict is unresolved.


  Step 6 — Check finance records using finance_list_transactions. Retrieve TXN-6001
  ($2,800 retainer in, May 28th) and TXN-6002 ($420 out to Lena, May 30th). Operating
  balance is healthy heading into high season. $180 for Lena''s half-day represents
  approximately 6% of one retainer payment — not meaningful strain.


  Step 7 — Review Notion pages using claw_notion_get_page. Retrieve NPAG-46 (delegation
  checklist) and NPAG-47 (scope call prep status). Confirm the brief scope: budget
  delta summary, vendor quote log, foyer decision context, one-page scope brief for
  Marcus. Lena has done this format before. 3-hour self-prep estimate is realistic;
  Lena can likely complete it in 2.5 hours with the right materials. Note from NPAG-47:
  the Veridian RFP is already past its original due date (2026-05-20) — further delay
  to the Thursday call increases client relationship risk.


  Step 8 — Synthesize the tradeoff:

  - Self-prep path: Rachel spends 11:30–14:30 on prep, both morning calls happen,
  but afternoon is compressed with no buffer. Bloom & Branch and Kowalski-Reyes calls
  are completed but rushed.

  - Delegation path: Lena handles prep June 3rd 8:30–12:30; Rachel''s morning is clean
  for both high-priority calls with full attention; Rachel reviews Lena''s brief Thursday
  9:00–10:30 AM before the 11 AM call.

  - Implicit value of freed morning: Bloom & Branch resolution (conservative downstream
  risk $500–$1,500+ if unresolved before Kowalski-Reyes wedding) + Kowalski-Reyes
  check-in (client trust, Dana already anxious) — both require Rachel''s direct judgment
  and cannot be delegated. Combined risk value materially exceeds $180.

  - Cash flow: healthy, $180 is not a strain.

  - Lena: confirmed available, experienced with the format, materials deadline was
  EOD June 2nd — flag that Rachel should confirm with Lena immediately on June 3rd
  morning.


  Step 9 — Deliver recommendation: Delegate to Lena. The freed morning value (resolving
  Bloom & Branch, completing Kowalski-Reyes check-in with full attention) conservatively
  exceeds $180. Cash flow supports it. Lena is available and experienced. Hard deadline
  on Thursday June 4th makes prep quality non-negotiable. Flag: Rachel should reach
  out to Lena first thing June 3rd to confirm the slot is still available given the
  EOD June 2nd materials deadline has passed, and send Notion links (NPAG-44, NPAG-37,
  WB-6) immediately. Also flag: on the Kowalski-Reyes call, Rachel must not re-confirm
  the floral rate lock until after the Bloom & Branch resolution call at 10:30 (per
  TODO-658 dependency).'
