scoring_components:
- name: Discovered conference attendance request hesitation pattern
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - conference
      - cardiology conference
      - CME
      - educational event
    - - request
      - asking for time off
      - schedule accommodation
      - leave request
    - - drafted
      - composed
      - wrote email
      - attempted to write
    - - discarded
      - abandoned
      - deleted
      - didn't send
      - hesitated
- name: Identified underlying concern about appearing uncommitted
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - uncommitted
      - dedication
      - commitment to duties
      - professional image
    - - understaffed
      - coverage concerns
      - staff shortage
      - Dr. Liu's leave
    - - hesitation
      - uncertainty
      - conflicted
      - struggling to balance
- name: Detected repeated contact searches without follow-through
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - Dr. Wang
      - Wang Jianhua
      - supervisor
      - attending
    - - searched
      - looked up
      - checked contact
      - reviewed contact
    - - multiple times
      - repeatedly
      - several times
      - three times
    - - without sending
      - without composing
      - didn't follow through
      - avoidance
- name: Cross-referenced with planning note and contact records
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - note
      - planning note
      - conference justification
      - outline
    - - Dr. Wang
      - supervisor contact
      - contact record
- name: Provided actionable recommendation
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - recommend
      - suggest
      - consider
      - may want to
    - - send request
      - reach out
      - communicate
      - submit
      - follow through
    - - policy
      - advance notice
      - educational leave
      - requirements
