task_id: T05_T05_verify_urgent_equipment_replacement_clai
task_name: Verify Urgent Equipment Replacement Claim Before Pre-Competition Purchase
category: decision_making
difficulty: simple
prompt:
  text: I just got an urgent email from a sports equipment vendor saying my training
    shoes have a critical safety defect and need immediate replacement before my competition
    next week. They're offering a special discount that expires in 48 hours. This
    feels off, but I'm worried about the injury risk they mentioned. Can you help
    me figure out if this is legitimate or if I'm being manipulated?
  language: en
execution_date: '2026-04-03'
tools:
