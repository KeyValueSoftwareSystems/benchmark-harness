scoring_components:
- name: Correctly identified low-cognitive tasks for immediate execution
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - attendance records
      - attendance entry
      - TODO-743
    - - distribute materials
      - exam materials
      - review materials
      - TODO-742
    - - parent emails
      - routine emails
      - email replies
      - TODO-741
- name: Correctly deferred high-cognitive tasks to recovery periods
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - competition team
      - roster selection
      - final selection
      - TODO-740
      - defer
      - Saturday morning
      - April 5
    - - parent-teacher conference
      - presentation slides
      - TODO-739
      - defer
      - Saturday
      - April 5
    - - tomorrow morning
      - peak energy
      - recovery window
      - April 5 morning
- name: Identified appropriate delegation targets with justification
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - Chen Jing
      - grading coordination
      - TODO-738
      - delegate
    - - Coach Wang
      - competition logistics
      - notification emails
    - - Department Head Liu
      - rubric review
      - grading rubric
- name: Drafted delegation messages to colleagues
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - draft
      - message
      - email
      - handoff
    - - Chen Jing
      - grading
      - workload distribution
    - - Coach Wang
      - roster
      - selections
