judge_rubric: 'Award full marks if the agent: (1) correctly categorized tasks by cognitive
  load (high: TODO-738, TODO-739, TODO-740; low: TODO-741, TODO-742, TODO-743), (2)
  scheduled low-cognitive tasks for immediate execution during current fatigue state
  (April 4 evening), (3) deferred high-cognitive tasks to recovery periods (April
  5 morning or later), (4) identified appropriate delegation targets (Chen Jing for
  grading coordination, Coach Wang for competition logistics, Department Head Liu
  for rubric review) with clear rationale based on their roles and existing involvement,
  (5) drafted specific delegation messages with clear handoff instructions, and (6)
  recognized the temporal constraint that April 4 afternoon has a non-negotiable family
  commitment (daughters'' art performance). Deduct points if: the agent schedules
  high-stakes decisions during fatigue periods, fails to distinguish cognitive load
  levels, proposes delegation without checking contact information or role appropriateness,
  or ignores hard deadlines (TODO-742 and TODO-743 due April 4). The solution should
  demonstrate understanding that Lin Jia Hui has worked three consecutive evenings
  (April 1-3) with teaching blocks plus evening duties, is currently depleted (April
  4 evening), and has a recovery window on April 5 morning before the family event.'
reference_solution: '**Step 1**: Call `calendar_list_events` or `calendar_get_user_events`
  to retrieve recent calendar history (April 1-3) and upcoming schedule (April 4-5).
  Identify consecutive evening commitments: EVT-523 (April 1 evening homeroom), EVT-525
  (April 2 evening exam supervision 19:00-21:30), EVT-527 (April 3 evening self-study
  19:30-21:30). Note April 4 has daughters'' art performance (EVT-528, 14:30-16:00)
  and no evening duties. April 5 morning is free.


  **Step 2**: Call `todo_list_tasks` to retrieve all pending tasks. Identify six tasks:
  TODO-738 (grading coordination, high-cognitive, due April 6), TODO-739 (parent-teacher
  conference prep, high-cognitive, due April 7), TODO-740 (competition roster selection,
  high-cognitive, due April 6), TODO-741 (parent emails, low-cognitive, due April
  5), TODO-742 (distribute materials, low-cognitive, due April 4), TODO-743 (attendance
  records, low-cognitive, due April 4).


  **Step 3**: Call `notes_list` and `notes_get` to retrieve NOTE-201 (fatigue assessment),
  NOTE-202 (cognitive load categorization), and NOTE-203 (delegation strategy). These
  notes document: current mental energy 3/10, poor decision-making capacity, three
  consecutive evening commitments totaling ~14 hours beyond normal teaching, and explicit
  guidance to avoid high-cognitive tasks tonight.


  **Step 4**: Categorize tasks based on cognitive load and deadline urgency:

  - **Do now (low-cognitive, hard deadline April 4)**: TODO-742 (distribute materials),
  TODO-743 (attendance records)

  - **Do now (low-cognitive, soft deadline April 5)**: TODO-741 (parent emails) -
  can draft template responses tonight

  - **Defer to April 5 morning (high-cognitive)**: TODO-740 (competition selection),
  TODO-739 (conference prep)

  - **Delegate (high-cognitive, coordination-heavy)**: TODO-738 (grading coordination
  to Chen Jing)


  **Step 5**: Call `contacts_search` or `contacts_get` to retrieve contact information
  for Chen Jing (CON-324, Mathematics Teacher) and Coach Wang (CON-325, Competition
  Coach). Verify their roles and appropriateness for delegation.


  **Step 6**: Call `gmail_list_messages` and `gmail_get_message` to retrieve MSG-5215
  (Chen Jing''s rubric review request) and MSG-5216 (Coach Wang''s competition selection
  request). Note Chen Jing offers Department Head Liu as alternative reviewer, and
  Coach Wang offers to handle notification emails.


  **Step 7**: Generate reordered execution plan:

  - **Tonight (April 4 evening, low-energy state)**: TODO-743 (15 min attendance entry),
  TODO-742 (prepare materials for distribution), TODO-741 (draft 3-4 email templates)

  - **April 5 morning (peak energy, 8-11am window)**: TODO-740 (competition roster
  final decisions), TODO-739 (begin conference presentation)

  - **Delegation**: TODO-738 to Chen Jing (draft grading workload proposal), rubric
  review to Department Head Liu (via Chen Jing), competition notification logistics
  to Coach Wang


  **Step 8**: Draft delegation messages:

  - To Chen Jing (re: TODO-738): "Chen Jing - Given exam week intensity, could you
  take lead on grading coordination? Please draft workload distribution proposal (140
  papers across 6 teachers) with quality control checkpoints. I''ll review and approve
  by Friday afternoon. Thanks for your partnership."

  - To Chen Jing (re: rubric): "Chen Jing - Your rubric draft looks solid. Given my
  current workload, I recommend sending directly to Department Head Liu for approval.
  He can provide faster turnaround for Friday deadline. Copy me on the email."

  - To Coach Wang: "Coach Wang - Thanks for the candidate analysis. I''ll finalize
  selections by Saturday morning (April 5) and send you the roster. Please proceed
  with notification emails and registration logistics."


  **Step 9**: Call `todo_update_task` to update priorities and defer dates for TODO-740
  and TODO-739 to April 5. Optionally call `gmail_save_draft` to save delegation messages
  for review before sending.


  **Step 10**: Present comprehensive execution plan with time blocks, delegation targets,
  and rationale based on fatigue state, cognitive load analysis, and colleague capacity.'
