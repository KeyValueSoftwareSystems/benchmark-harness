judge_rubric: '# Evaluation Rubric for Provincial Math Competition Equipment Purchase


  ## Constraint Solving Quality (Primary Focus)


  ### Hard Constraint Recognition (Critical)

  - **Excellent**: Agent identifies ALL hard constraints: (1) ¥50,000 year-end bonus
  threshold, (2) current spending ¥42,150, (3) remaining headroom ¥7,850, (4) ¥4,000
  bonus forfeiture if threshold exceeded, (5) prepaid account deposits count in fiscal
  year when made, not when used.

  - **Adequate**: Agent identifies bonus threshold and current spending but misses
  prepaid account timing rule or bonus forfeiture amount.

  - **Poor**: Agent treats budget as soft constraint or misses bonus threshold entirely.


  ### Discount Path Enumeration (Core Task)

  - **Excellent**: Agent enumerates at least 4-6 feasible discount paths across both
  vendors, correctly applies stacking rules (MathTech: Bulk + Early-bird + Prepaid
  can stack, Competition Bundle is exclusive; Calculator Express: all three discounts
  can stack), and calculates net cost including bonus impact for each path.

  - **Adequate**: Agent evaluates 2-3 paths but misses some stacking combinations
  or calculates cost without bonus impact.

  - **Poor**: Agent only compares base prices or single-discount scenarios without
  exploring combination paths.


  ### Optimal Path Selection (Decision Quality)

  - **Excellent**: Agent selects Path B (MathTech Bulk + Early-bird without prepaid,
  ¥22,570.24 true net cost) and justifies with multi-dimensional trade-off analysis:
  (1) marginal ¥57 cost increase over Path E justified by eliminating March 31 deadline
  pressure, (2) ¥1,266 premium over Path D justified by avoiding prepaid administrative
  burden, (3) alignment with Lin''s persona (budget-conscious but values administrative
  simplicity).

  - **Adequate**: Agent selects Path B but justification is incomplete (e.g., only
  mentions cost, ignores deadline/administrative factors) OR selects Path D/E with
  reasonable justification acknowledging trade-offs.

  - **Poor**: Agent selects dominated path (Path C, F) or recommends path without
  considering bonus threshold impact.


  ## Persona Alignment (Secondary)


  ### Decision Criteria Weighting

  - **Excellent**: Agent explicitly applies Lin''s persona-driven priorities: budget
  consciousness (primary), administrative simplicity (secondary), vendor relationship
  preservation (tertiary). Recognizes Lin''s aversion to complexity (distrusts apps,
  values handwritten notes) makes prepaid account setup particularly burdensome.

  - **Adequate**: Agent mentions administrative burden but doesn''t connect to Lin''s
  specific traits.

  - **Poor**: Agent ignores persona entirely, treats decision as pure cost optimization.


  ### Time Pressure Sensitivity

  - **Excellent**: Agent recognizes Lin is juggling parent-teacher duties with teaching
  load, values 10-day buffer (April 10 deadline) over March 31 deadline that requires
  immediate action today.

  - **Adequate**: Agent notes deadline difference but doesn''t weight it significantly.

  - **Poor**: Agent recommends March 31 deadline path without acknowledging time pressure.


  ## Process Quality (Tertiary)


  ### Information Gathering

  - **Excellent**: Agent systematically extracts discount policies from both vendor
  emails (MSG-5160, MSG-5161), finance policy clarification (MSG-5162), and existing
  analysis notes (NOTE-177).

  - **Adequate**: Agent consults 2-3 sources but misses key policy details.

  - **Poor**: Agent makes recommendations without consulting vendor emails or finance
  policy.


  ### Constraint Violation Detection

  - **Excellent**: Agent explicitly flags that ALL feasible 18-unit purchase paths
  exceed ¥50,000 threshold (minimum cost ¥60,663), making bonus forfeiture unavoidable.
  Recognizes purchase cannot be deferred (competition timing) or split (complexity).

  - **Adequate**: Agent notes threshold will be exceeded but doesn''t explain why
  it''s unavoidable.

  - **Poor**: Agent suggests ways to stay under threshold that violate other constraints.


  ## Output Completeness


  ### Actionable Recommendation

  - **Excellent**: Agent provides specific next steps: (1) contact Liu Wei to confirm
  pricing, (2) submit requisition to Zhao Min by April 2, (3) coordinate delivery
  with Coach Wang.

  - **Adequate**: Agent recommends vendor/path but lacks specific action items.

  - **Poor**: Agent provides analysis without clear recommendation.


  ## Disqualifying Errors

  - Recommends purchase that violates hard budget cap without acknowledging trade-off

  - Miscalculates discount stacking (e.g., applies Competition Bundle with other discounts)

  - Ignores prepaid account fiscal year timing rule

  - Recommends March 31 deadline path on April 4 (execution date is after deadline)'
reference_solution: '# Reference Solution: Provincial Math Competition Calculator
  Purchase


  ## Step 1: Gather Constraint Information


  **Action**: `gmail_list_messages` with labels ["vendor", "finance", "competition"]

  **Action**: `gmail_get_message` MSG-5160 (MathTech vendor email)

  - Extract: Base price ¥1,280, Bulk 12%, Early-bird 8%, Prepaid 5%, Competition Bundle
  ¥200 flat (exclusive)

  - Stacking rule: Bulk + Early-bird + Prepaid can combine for 23.4% total

  - Early-bird deadline: April 10, 2026


  **Action**: `gmail_get_message` MSG-5161 (Calculator Express vendor email)

  - Extract: Base price ¥1,350, Volume 15%, Spring 10%, Institutional 6%

  - Stacking rule: All three can combine for 29.5% total

  - Spring deadline: March 31, 2026 (ALREADY PASSED — execution date is April 4)


  **Action**: `gmail_get_message` MSG-5162 (Finance Office clarification)

  - Extract: Year-end bonus threshold ¥50,000, current spending ¥42,150, remaining
  headroom ¥7,850

  - Critical rule: Prepaid deposits count in fiscal year when made, not when used

  - Bonus forfeiture: ¥4,000 if threshold exceeded


  **Action**: `finance_list_transactions` to confirm current spending

  - Verify: TXN-6049 shows ¥42,150 year-to-date spending


  **Action**: `notes_get` NOTE-177 (existing discount path analysis)

  - Extract: Lin has already enumerated 6 discount paths with detailed calculations

  - Key finding: Path B (MathTech Bulk + Early-bird, no prepaid) = ¥22,570.24 true
  net cost

  - Pareto frontier: Path D (¥21,303.85, very high burden), Path E (¥22,513, medium
  burden), Path B (¥22,570.24, low burden)


  ## Step 2: Eliminate Infeasible Paths


  **Path D and Path E are NOW INFEASIBLE** because execution date (April 4) is after
  March 31 Spring promotion deadline. Calculator Express paths that depend on Spring
  discount are no longer available.


  **Remaining feasible paths**:

  - Path A: MathTech Bulk + Early-bird + Prepaid = ¥22,874.75 (high burden, prepaid
  setup)

  - Path B: MathTech Bulk + Early-bird only = ¥22,570.24 (low burden, standard PO)

  - Path C: MathTech Competition Bundle = ¥23,440 (low burden, includes practice materials)

  - Path F: Calculator Express Volume only = ¥24,655 (low burden, higher base price)


  ## Step 3: Apply Hard Constraints


  **Bonus threshold constraint**: ALL paths result in total spending exceeding ¥50,000:

  - Path A: ¥42,150 + ¥20,000 (prepaid) = ¥62,150 → forfeit ¥4,000 bonus

  - Path B: ¥42,150 + ¥18,570.24 = ¥60,720.24 → forfeit ¥4,000 bonus

  - Path C: ¥42,150 + ¥19,440 = ¥61,590 → forfeit ¥4,000 bonus

  - Path F: ¥42,150 + ¥20,655 = ¥62,805 → forfeit ¥4,000 bonus


  **Conclusion**: Bonus forfeiture is unavoidable for 18-unit purchase. Cannot defer
  (competition timing) or split across fiscal years (requires special approval, adds
  complexity).


  ## Step 4: Pareto Dominance Analysis


  **Path B dominates Path A**: Lower cost (¥22,570.24 < ¥22,874.75) AND lower burden
  (no prepaid setup)

  **Path B dominates Path C**: Lower cost (¥22,570.24 < ¥23,440) AND same burden

  **Path B dominates Path F**: Lower cost (¥22,570.24 < ¥24,655) AND same burden


  **Path B is Pareto optimal**: No other feasible path offers both lower cost and
  lower/equal administrative burden.


  ## Step 5: Apply Persona-Weighted Decision Criteria


  Lin''s priorities:

  1. **Budget consciousness (primary)**: Path B offers second-lowest cost among feasible
  paths (only ¥57 more than now-infeasible Path E)

  2. **Administrative simplicity (secondary)**: Path B uses standard purchase order,
  no prepaid account setup, existing vendor relationship (Liu Wei at MathTech)

  3. **Vendor relationship preservation (tertiary)**: Path B maintains relationship
  with MathTech (primary vendor per contacts)


  Lin''s constraints:

  - Mother of twin daughters, juggling parent-teacher duties → values 10-day buffer
  (April 10 deadline) over immediate action

  - Distrusts apps, hoards handwritten notebooks → prepaid account multi-year tracking
  is particularly burdensome

  - Allergic to self-promotion, quietly preparing for certification → prefers low-visibility
  standard PO over complex prepaid setup


  ## Step 6: Optimal Decision


  **RECOMMENDATION: Path B (MathTech Bulk + Early-bird, no prepaid)**


  **Pricing**: ¥1,280 × 0.88 × 0.92 × 18 = ¥18,570.24 equipment cost + ¥4,000 bonus
  forfeiture = ¥22,570.24 true net cost


  **Rationale**:

  - Pareto optimal among feasible paths (Paths D and E eliminated by March 31 deadline)

  - Marginal ¥304 cost increase vs Path A (1.3%) justified by eliminating prepaid
  administrative burden

  - 10-day approval buffer (April 10 deadline) reduces coordination pressure with
  finance office and family schedule

  - Standard purchase order process aligns with Lin''s preference for administrative
  simplicity

  - Maintains existing vendor relationship (Liu Wei at MathTech)


  **Trade-offs accepted**:

  - Forfeiting ¥4,000 year-end bonus (unavoidable across all feasible paths)

  - Missing Calculator Express Spring promotion (deadline passed)

  - Not pursuing Competition Bundle practice materials (¥870 cost premium not justified)


  ## Step 7: Next Actions


  **Action**: `contacts_get` CON-290 (Liu Wei contact info)

  **Action**: `gmail_send_message` or `contacts_send_message` to Liu Wei

  - Confirm Bulk + Early-bird pricing for 18 TI-Nspire CX II units

  - Verify April 10 early-bird deadline

  - Request delivery timeline to meet competition training schedule


  **Action**: `todo_update_task` TODO-680 (mark as in-progress)

  **Action**: `todo_update_task` TODO-681 (update with Path B decision rationale)


  **Action**: `contacts_get` CON-292 (Zhao Min finance contact)

  **Prepare**: Purchase requisition for Zhao Min including:

  - Vendor quote from MathTech (Path B)

  - Cost-benefit analysis from NOTE-177

  - Bonus threshold impact acknowledgment

  - Request approval by April 8 (2-day buffer before April 10 deadline)


  **Coordinate**: Contact Coach Wang (mentioned in NOTE-177) to confirm 18-unit quantity
  matches final team roster'
