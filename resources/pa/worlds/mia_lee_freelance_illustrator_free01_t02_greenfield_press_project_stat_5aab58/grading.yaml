judge_rubric: 'Evaluate the agent''s briefing on the following dimensions:


  1. CROSS-SOURCE COVERAGE (25%): Did the agent consult and cite data from at least
  four distinct sources — Notion client log (NPAG-48), Gmail threads (MSG-5181, MSG-5183,
  MSG-5184), finance records (TXN-6095, TXN-6098), todo items (TODO-691 through TODO-693),
  and/or the sheet workbook (WB-23)? A briefing assembled from only one or two sources
  should score poorly here even if the content is accurate.


  2. DELIVERY ACCURACY (20%): Does the briefing correctly report all three cover variations
  (A/B/C), their delivery dates, and their approval status? Critically, it must reflect
  that Cover C was approved on 2026-06-03 (the day of the task), not still pending
  — this requires reading MSG-5184, the most recent email. Missing or stale delivery
  status is a significant error.


  3. PAYMENT ACCURACY (20%): Does the briefing correctly state the full contract value
  ($7,500), the deposit received ($3,750 via TXN-6095 on 2026-03-18), and the final
  balance ($3,750 submitted to AP on 2026-06-03 via TXN-6098, expected to clear 2026-06-10
  to 2026-06-12)? The outstanding balance must be characterized as ''in AP pipeline,
  not yet received'' — not as paid.


  4. REIMBURSEMENT ACCURACY (15%): Does the briefing correctly identify the Clause
  4b claim ($312.40 = FedEx $187.40 + Pressline Studio $125.00), the $400 cap, the
  $87.60 remaining headroom, the AP confirmation received 2026-06-03 (MSG-5183), and
  the expected processing window through approximately 2026-06-20?


  5. SCOPE / CONTRACT ISSUES (15%): Does the briefing clearly flag the 4th variation
  as informally floated (2026-05-14 WIP call), not contracted, not started, and requiring
  a formal change order before any work proceeds? The agent should not treat this
  as a minor footnote — it is a live open issue for the June 5 call.


  6. STRUCTURE AND USABILITY (5%): Is the briefing organized into clear sections (delivery,
  payment, reimbursement, open issues) so Mia can scan it quickly before her call?
  A wall of prose with no structure scores lower than a well-organized summary.


  Deduct points if the agent: (a) presents stale data without flagging it as potentially
  outdated, (b) silently resolves contradictions between sources instead of surfacing
  them, (c) omits the June 5 call context that makes this briefing time-sensitive,
  or (d) modifies any records rather than reading them. The briefing should be immediately
  usable as a pre-call reference — complete, accurate, and honest about what is still
  pending.'
reference_solution: "1. Search Notion for the Greenfield Press client record using\
  \ claw_notion_search('Greenfield Press'), then retrieve NPAG-48 with claw_notion_get_page('NPAG-48')\
  \ to get the canonical client log including delivery log, payment log, Clause 4b\
  \ reimbursement summary, and open issues.\n\n2. List recent Gmail messages using\
  \ gmail_list_messages(query='greenfield press', max_results=10) to identify relevant\
  \ threads. Retrieve MSG-5181 (Dana's June 2 status update), MSG-5183 (AP reimbursement\
  \ confirmation, received June 3 — unread), and MSG-5184 (Cover C sign-off + Thursday\
  \ call confirmation, received June 3 — unread). Note that MSG-5184 is the most recent\
  \ and critical: it confirms Cover C was formally approved on 2026-06-03 and that\
  \ the final $3,750 payment has been submitted to AP.\n\n3. Pull finance transactions\
  \ using finance_list_transactions(tags='greenfield-press') or similar, then retrieve\
  \ TXN-6095 (50% deposit $3,750, cleared 2026-03-18) and TXN-6098 (final balance\
  \ $3,750, logged as pending 2026-06-03, expected to clear 2026-06-10 to 2026-06-12).\n\
  \n4. List active todos using todo_list_tasks(tags='greenfield-press') to surface\
  \ TODO-691 (confirm final payment clears by 2026-06-12), TODO-692 (track Clause\
  \ 4b reimbursement, follow up by 2026-06-20), and TODO-693 (4th variation change\
  \ order decision at Thursday call).\n\n5. Open the sheet workbook WB-23 using sheet_open('WB-23'),\
  \ then read the 'Clause 4b Claims' sheet with sheet_get_range to confirm the two\
  \ line items (FedEx $187.40, Pressline Studio $125.00), submission date 2026-05-29,\
  \ $400 cap, $87.60 remaining headroom, and 'Under Review' status. Also read the\
  \ 'Invoice Tracker' sheet to confirm INV-2026-GP-01 (PAID) and INV-2026-GP-02 (PENDING\
  \ — in AP pipeline).\n\n6. Optionally retrieve NOTE-199 using notes_get('NOTE-199')\
  \ for the pre-call briefing note Mia drafted earlier on 2026-06-03.\n\n7. Synthesize\
  \ all sources into a structured briefing with four sections:\n\n   DELIVERY STATUS:\
  \ All 3 covers delivered and formally accepted. Cover A (forest-dusk) delivered\
  \ 2026-05-09 — APPROVED. Cover B (city-at-dawn) delivered 2026-05-11 — APPROVED.\
  \ Cover C (abstract botanical) delivered 2026-05-12 at 11:58 PM — APPROVED as of\
  \ 2026-06-03 (art team sign-off confirmed by Dana in MSG-5184). Deadline was 2026-05-12;\
  \ all met.\n\n   PAYMENT STATUS: Contract value $7,500. Deposit $3,750 received\
  \ 2026-03-18 (TXN-6095, INV-2026-GP-01 — PAID). Final balance $3,750 submitted to\
  \ AP by Dana on 2026-06-03 (TXN-6098, INV-2026-GP-02 — PENDING). Expected to clear\
  \ 2026-06-10 to 2026-06-12. Outstanding balance as of today: $3,750 in AP pipeline,\
  \ not yet received.\n\n   REIMBURSEMENT — CLAUSE 4B: Claim $312.40 (FedEx $187.40\
  \ + Pressline Studio $125.00). Submitted to ap@greenfieldpress.example on 2026-05-29.\
  \ AP confirmation received 2026-06-03 (MSG-5183). Cap $400; claim is within limit\
  \ ($87.60 headroom remaining). Processing window 10–15 business days from 2026-06-03;\
  \ expect payment by approximately 2026-06-20. Status: UNDER REVIEW.\n\n   OPEN ISSUES:\
  \ (1) 4th cover variation — floated informally by editorial director on 2026-05-14\
  \ WIP call. NOT contracted, NOT started. Dana confirmed in MSG-5181 that a formal\
  \ change order is required if editorial proceeds. No work to be done without signed\
  \ change order; WIP thumbnail sketches are exploratory only and not billable. Decision\
  \ expected at Thursday June 5 call. (2) Thursday June 5 at 3:00 PM PT — check-in\
  \ call with Dana Whitfield confirmed (MSG-5184). Agenda: delivery close-out, reimbursement\
  \ timeline, 4th variation formal decision."
