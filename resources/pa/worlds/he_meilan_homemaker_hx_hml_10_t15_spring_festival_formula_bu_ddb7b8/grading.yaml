judge_rubric: 'Evaluate the response from He Meilan''s perspective as a detail-oriented
  full-time mother managing family finances and infant health:


  **Critical Safety Compliance (must be met, otherwise 0 points):**

  - Does the solution ONLY recommend sellers that appear on Dr. Zhao''s authorized
  list (NOTE-296)? Any recommendation of unauthorized sellers is an automatic failure
  due to infant health safety risks.

  - Does the total purchase cost stay within the 3100 RMB remaining budget cap? Exceeding
  this violates the established financial authority boundary.

  - Does the delivery timing ensure formula arrives before the April 28 stock-out
  date (calculated from current 7-can inventory at 5.2 cans/month consumption)?


  **Optimization Quality (0-10 scale):**

  - **Discount maximization**: Did the agent correctly apply discount stacking mechanics
  (tiered full-reduction + coupons + membership benefits) according to platform-specific
  rules in KB-414? Are calculations accurate?

  - **Allocation efficiency**: Does the recommended platform split trigger optimal
  discount tiers while minimizing total cost? Did the agent test multiple allocation
  scenarios?

  - **Constraint satisfaction**: Does the solution satisfy ALL hard constraints simultaneously
  (budget, authorized sellers, delivery timing, coupon expiration dates)?


  **Process Thoroughness (0-10 scale):**

  - Did the agent extract promotional details from all relevant gmail messages (MSG-5257
  JD, MSG-5258 Tmall, MSG-5259 Pinduoduo)?

  - Did the agent cross-reference seller names in emails against Dr. Zhao''s authorized
  list in NOTE-296?

  - Did the agent calculate remaining budget from finance records (TXN-6160 shows
  2900 spent, leaving 3100 from 6000 cap)?

  - Did the agent build a structured comparison model (using sheet tools) to systematically
  evaluate allocation scenarios?


  **Communication Quality (0-10 scale):**

  - Is the recommendation clear and actionable (specific platforms, quantities, sellers,
  expected costs)?

  - Does the explanation help He Meilan understand the tradeoffs and feel confident
  executing the purchase?

  - Is the tone appropriate for a mother making health-critical decisions for her
  infant (reassuring on safety, transparent on constraints)?


  **Deductions:**

  - Recommending unauthorized sellers despite lower prices: -100 points (task failure)

  - Exceeding budget cap: -100 points (task failure)

  - Ignoring delivery timing risk: -30 points

  - Incorrect discount calculations: -20 points per major error

  - Missing platform promotional details: -10 points per platform

  - Not verifying against authorized seller list: -40 points

  - Recommending purchasing non-formula items to trigger discounts: -15 points (violates
  "avoid unnecessary spending" constraint)


  **Bonus points:**

  - Identifying that the initial NOTE-297 budget calculation was confused (mentioned
  Q1 vs Q2 spending) and correctly recalculating: +10 points

  - Warning about Pinduoduo''s higher counterfeit risk even for authorized sellers:
  +5 points

  - Noting coupon expiration urgency (JD 200 RMB coupon expires April 8): +5 points

  - Suggesting delivery tracking coordination across multiple platforms: +5 points'
reference_solution: "**Step 1: Establish constraints and current state**\n- Call `finance_list_transactions`\
  \ with category filter 'infant_nutrition' to retrieve recent formula purchases\n\
  - Identify TXN-6160 (April 1, 2900 RMB spent) to calculate remaining Q2 budget:\
  \ 6000 - 2900 = 3100 RMB (hard cap)\n- Call `notes_get` with note_id='NOTE-297'\
  \ to extract current inventory (7 cans) and consumption rate (5.2 cans/month)\n\
  - Calculate stock-out deadline: 7 cans ÷ 5.2 cans/month ≈ 40 days → May 13, 2026;\
  \ critical reorder date April 28\n- Target purchase: 15 cans for 3-month supply\n\
  \n**Step 2: Extract platform promotional rules**\n- Call `gmail_list_messages` with\
  \ query filter 'baby formula' or 'promotions' to find recent promotional emails\n\
  - Call `gmail_get_message` for MSG-5257 (JD.com promotion):\n  - Base price: 560\
  \ RMB/can\n  - Tiered discounts: spend 3000, save 500; spend 5000, save 900\n  -\
  \ Coupons: 200 off 2000 (expires April 8), 100 off 1500 (expires April 10)\n  -\
  \ JD PLUS: 5% cashback\n  - Authorized sellers: JD Self-Operated, NutriGrow Official,\
  \ BabyCare Direct Import\n- Call `gmail_get_message` for MSG-5258 (Tmall promotion):\n\
  \  - Base price: 575 RMB/can\n  - Tiered discounts: spend 2000, save 200; spend\
  \ 4000, save 450; spend 6000, save 750\n  - 88VIP: 5% instant discount\n  - Store\
  \ coupons: 150 off 2500 (expires April 12), 80 off 1200 (expires April 9)\n  - Authorized\
  \ sellers: NutriGrow Tmall Official, Tmall International Direct, Baby Health Premium\n\
  - Call `gmail_get_message` for MSG-5259 (Pinduoduo promotion):\n  - Base price:\
  \ 545 RMB/can (lowest)\n  - Tiered discounts: spend 1500, save 150; spend 3000,\
  \ save 350; spend 5000, save 600\n  - Group buy: 6+ cans get 50 RMB off per can\n\
  \  - Flash hour (2-4PM): additional 5% off\n  - Authorized sellers: PDD Maternal\
  \ Direct, Premium Import Baby Care\n  - WARNING: Multiple unauthorized sellers on\
  \ platform\n\n**Step 3: Retrieve and verify authorized seller list**\n- Call `notes_get`\
  \ with note_id='NOTE-296' to retrieve Dr. Zhao's authorized seller list\n- Cross-reference\
  \ sellers mentioned in promotional emails against authorized list\n- Flag any sellers\
  \ in emails NOT on Dr. Zhao's list as unsafe (counterfeit risk)\n\n**Step 4: Build\
  \ optimization model**\n- Call `kb_search` with query 'discount stacking mechanics'\
  \ to retrieve KB-414 for calculation methodology\n- Call `sheet_open` with workbook_id='WB-0010'\
  \ to access existing comparison matrix\n- Call `sheet_set_range` to populate platform\
  \ comparison data:\n  - Platform, base price, discount tiers, coupon availability,\
  \ membership benefits, authorized seller status\n- Create allocation scenarios testing\
  \ different quantity splits:\n  - Scenario A: Single platform (JD 15 cans)\n  -\
  \ Scenario B: JD 9 cans + Tmall 6 cans\n  - Scenario C: Pinduoduo 10 cans + JD 5\
  \ cans\n  - Scenario D: JD 6 cans + Tmall 5 cans + Pinduoduo 4 cans\n  - Scenario\
  \ E: JD 10 cans + Pinduoduo 5 cans\n\n**Step 5: Calculate effective costs per scenario**\n\
  For each scenario, apply discount stacking order per KB-414:\n1. Adjust base price\
  \ (flash sale, membership instant discount)\n2. Apply quantity discounts (group\
  \ buy)\n3. Apply tiered full-reduction (spend-and-save promotion)\n4. Apply coupons\
  \ (store + platform)\n5. Calculate cashback (if applicable)\n\nExample calculation\
  \ for Scenario E (optimal):\n- **JD 10 cans**: 10 × 560 = 5600 RMB\n  - Apply spend\
  \ 5000, save 900: 5600 - 900 = 4700 RMB\n  - Apply 200 off 2000 coupon: 4700 - 200\
  \ = 4500 RMB\n  - JD PLUS 5% cashback: 4500 × 0.95 = 4275 RMB effective (225 RMB\
  \ cashback credited later)\n  - Seller: JD Self-Operated (authorized ✓)\n  - Delivery:\
  \ 3-5 days → arrives by April 9\n\n- **Pinduoduo 5 cans**: 5 × 545 = 2725 RMB\n\
  \  - Apply spend 1500, save 150: 2725 - 150 = 2575 RMB\n  - Cannot trigger group\
  \ buy (need 6+ cans)\n  - Flash hour 5% (if ordered 2-4PM): 2575 × 0.95 = 2446 RMB\n\
  \  - Seller: PDD Maternal Direct (authorized ✓)\n  - Delivery: 5-7 days → arrives\
  \ by April 11\n\n- **Total cost**: 4275 + 2446 = 6721 RMB → **EXCEEDS 3100 BUDGET!**\n\
  \n**Step 6: Iterate to find feasible allocation**\nScenario E fails budget constraint.\
  \ Test alternative:\n\n- **Pinduoduo 6 cans** (trigger group buy): 6 × 545 = 3270\
  \ RMB\n  - Apply spend 3000, save 350: 3270 - 350 = 2920 RMB\n  - Group buy 6 ×\
  \ 50: 2920 - 300 = 2620 RMB\n  - Flash hour 5%: 2620 × 0.95 = 2489 RMB\n  - Seller:\
  \ Premium Import Baby Care (authorized ✓)\n\n- **JD 6 cans**: 6 × 560 = 3360 RMB\n\
  \  - Apply spend 3000, save 500: 3360 - 500 = 2860 RMB\n  - Apply 200 off 2000 coupon:\
  \ 2860 - 200 = 2660 RMB\n  - JD PLUS 5% cashback: 2660 × 0.95 = 2527 RMB effective\n\
  \  - Seller: NutriGrow Official (authorized ✓)\n\n- **Tmall 3 cans**: 3 × 575 =\
  \ 1725 RMB\n  - Cannot trigger spend 2000, save 200 (below threshold)\n  - Apply\
  \ 80 off 1200 coupon: 1725 - 80 = 1645 RMB\n  - 88VIP 5%: 1645 × 0.95 = 1563 RMB\
  \ (if subscribed; check membership status)\n  - Seller: Baby Health Premium (authorized\
  \ ✓)\n\n- **Total cost**: 2489 + 2527 + 1563 = 6579 RMB → **STILL EXCEEDS BUDGET**\n\
  \n**Step 7: Adjust to satisfy budget constraint**\nReduce to 2-platform split focusing\
  \ on highest discount efficiency:\n\n- **Pinduoduo 6 cans**: 2489 RMB (as calculated\
  \ above)\n- **JD 9 cans**: 9 × 560 = 5040 RMB\n  - Apply spend 5000, save 900: 5040\
  \ - 900 = 4140 RMB\n  - Apply 200 off 2000 coupon: 4140 - 200 = 3940 RMB\n  - JD\
  \ PLUS 5% cashback: 3940 × 0.95 = 3743 RMB effective\n  - Seller: JD Self-Operated\
  \ (authorized ✓)\n\n- **Total cost**: 2489 + 3743 = 6232 RMB → **STILL EXCEEDS 3100\
  \ RMB BUDGET**\n\n**Critical realization**: With 15 cans at baseline prices 545-575\
  \ RMB/can (8175-8625 RMB before discounts), achieving 3100 RMB final cost requires\
  \ ~64% total discount. Even with aggressive stacking, this may be mathematically\
  \ impossible.\n\n**Step 8: Verify budget constraint interpretation**\n- Re-read\
  \ NOTE-297: \"Remaining Q2 budget after April 1 purchase: 6000 - 2900 = 3100 RMB\"\
  \n- Check if 3100 RMB is truly a hard cap or if there's flexibility\n- Review finance\
  \ authority boundaries: \"Can approve household daily expenses under 5000 yuan\"\
  \ → He Meilan can approve up to 5000 RMB without consulting husband\n- **Conclusion**:\
  \ 3100 RMB is the remaining quarterly budget allocation, but she has authority up\
  \ to 5000 RMB for a single purchase decision\n\n**Step 9: Re-optimize with corrected\
  \ constraint**\nIf we interpret the constraint as \"minimize cost while staying\
  \ under 5000 RMB single-purchase authority limit\" instead of strict 3100 RMB:\n\
  \n**Optimal allocation**:\n- **Pinduoduo 6 cans**: 2489 RMB (Premium Import Baby\
  \ Care, authorized)\n- **JD 9 cans**: 3743 RMB (JD Self-Operated, authorized)\n\
  - **Total**: 6232 RMB → Exceeds 3100 quarterly budget but within 5000 single-purchase\
  \ authority\n- **Savings vs baseline**: (15 × 560) - 6232 = 8400 - 6232 = 2168 RMB\
  \ saved (25.8% discount)\n- **Delivery timing**: Both arrive by April 11, well before\
  \ April 28 stock-out deadline\n\n**However**, if 3100 RMB is truly a hard cap (quarterly\
  \ budget discipline), then:\n- **Recommendation**: Purchase only 9-10 cans now within\
  \ budget, plan second purchase in May\n- **JD 6 cans**: 2527 RMB (within budget)\n\
  - **Pinduoduo 3 cans**: 3 × 545 = 1635 RMB (no discount tier reached) → Total 4162\
  \ RMB (exceeds)\n- **Alternative**: JD 6 cans (2527 RMB) only, defer remaining 9\
  \ cans to next budget cycle\n\n**Step 10: Output recommendation**\n- Call `sheet_set_range`\
  \ to document final allocation and cost breakdown\n- Prepare recommendation highlighting:\n\
  \  - Budget constraint conflict (15 cans not achievable within 3100 RMB even with\
  \ optimal discounts)\n  - Two options: (a) purchase 6-7 cans now, defer remainder;\
  \ (b) exceed quarterly budget but stay within single-purchase authority, discuss\
  \ with husband\n  - All recommended sellers verified against Dr. Zhao's authorized\
  \ list\n  - Delivery timing ensures no stock-out risk\n  - Coupon expiration urgency\
  \ (JD 200 RMB coupon expires April 8)"
