judge_rubric: '# LLM Judge Rubric


  ## Overall Quality (0-10 scale)


  Evaluate the agent''s Q2 external advisor budget allocation digest against Sven''s
  quality standards:


  ### Cross-source aggregation completeness (0-3 points)

  - **3 pts**: Agent retrieved and synthesized data from all five sources: Gmail (vendor
  proposals), Workmail (CFO budget guidance), finance (Q1 actuals + Q2 headroom),
  Notion (project decision logs for Aurora, Portfolio, Njord, org restructuring),
  and KB (authority policy KB-401).

  - **2 pts**: Agent covered 4 of 5 sources; missing one key input (e.g., forgot to
  check Notion decision logs for dependencies).

  - **1 pt**: Agent covered 2-3 sources; significant gaps in data collection.

  - **0 pts**: Agent consulted only one source or made recommendations without gathering
  cross-source data.


  ### Budget constraint and authority threshold analysis (0-3 points)

  - **3 pts**: Agent correctly identified the Q2 cap (SEK 850k), calculated total
  proposals (SEK 1,120k), quantified the SEK 270k shortfall, and flagged all proposals
  above SEK 200k for CFO escalation with explicit justification.

  - **2 pts**: Agent identified the budget shortfall and flagged some CFO-escalation
  items, but missed one or two proposals above the SEK 200k threshold or did not quantify
  the shortfall precisely.

  - **1 pt**: Agent acknowledged a budget constraint but did not calculate the shortfall
  or systematically identify CFO-escalation requirements.

  - **0 pts**: Agent ignored the budget cap or authority thresholds entirely.


  ### Dependency mapping and timeline risk (0-2 points)

  - **2 pts**: Agent identified circular dependencies (e.g., Portfolio Phase 2 conditional
  on Phase 1 quality gate, Aurora synergy analysis conditional on regulatory filing)
  and mapped them to calendar milestones; flagged proposals that cannot be committed
  until dependencies resolve.

  - **1 pt**: Agent mentioned dependencies but did not map them to timeline constraints
  or explain the impact on allocation decisions.

  - **0 pts**: Agent ignored dependencies or recommended committing to Phase 2 work
  before Phase 1 quality gates.


  ### Prioritization and trade-off rationale (0-2 points)

  - **2 pts**: Agent presented a clear prioritized allocation plan (approve now /
  defer to mid-Q2 / decline) with explicit trade-off rationale for each decision (timeline
  risk vs cost savings vs quality impact), consistent with Sven''s "what would change
  my mind" standard.

  - **1 pt**: Agent provided a prioritization but the trade-off rationale was vague
  or missing for some proposals.

  - **0 pts**: Agent listed proposals without prioritization or rationale.


  ### Discount expiration urgency and decision flags (0-1 point)

  - **1 pt**: Agent flagged proposals with imminent discount expirations (<7 days)
  and highlighted the decision urgency for the CFO.

  - **0 pts**: Agent did not identify or flag time-sensitive discount windows.


  ### Format and executive readability (0-1 point)

  - **1 pt**: Digest is structured, concise, and suitable for CFO consumption (e.g.,
  summary table of proposals, clear allocation plan, flagged escalations).

  - **0 pts**: Output is verbose, unstructured, or buries key decisions in narrative.


  **Deductions**:

  - **-2 pts**: Agent recommended approving any invoice above SEK 200k without CFR
  escalation (violates Sven''s authority boundary).

  - **-1 pt**: Agent recommended reallocating budget from restricted categories (e.g.,
  legal_compliance) in violation of KB-403.

  - **-1 pt**: Agent committed to Phase 2 proposals before Phase 1 dependencies were
  resolved.


  **Total score**: Sum of section scores (0-10), clamped to [0, 10].'
reference_solution: "# Reference Solution\n\n**Step 1: Query Gmail for external advisor\
  \ proposals**\n- Use `gmail_list_messages` with labels `vendor-proposal`, `external-advisor`,\
  \ `discount-window` to retrieve vendor quotes.\n- Expected records: Proposals from\
  \ consulting firms (e.g., Bain, Roland Berger, EY) for Aurora synergy analysis,\
  \ Portfolio Phase 2 due diligence, Njord Phase 2 market study, and org restructuring\
  \ facilitation.\n- Extract: vendor name, project, amount (SEK), delivery window,\
  \ discount expiration date.\n\n**Step 2: Query Workmail for CFO budget guidance**\n\
  - Use `workmail_list_messages` filtering sender `anna.karlsson@vasaholm.se` and\
  \ labels `budget`, `cfo-approval`.\n- Expected record: CFO memo stating Q2 external\
  \ advisor budget cap is SEK 850k and reminding Sven that invoices above SEK 200k\
  \ require CFO approval.\n\n**Step 3: Query finance for Q1 actuals and Q2 headroom**\n\
  - Use `finance_list_transactions` filtering category `external_advisor` or `external_advisory`\
  \ for Q1 2026.\n- Expected output: Q1 spend actuals (e.g., SEK 680k) and confirmation\
  \ of Q2 budget allocation (SEK 850k).\n\n**Step 4: Query Notion for project decision\
  \ logs**\n- Use `claw_notion_search` or `claw_notion_query_database` to retrieve\
  \ decision logs for:\n  - NPAG-1 (Aurora M&A)\n  - NPAG-6 (Portfolio review)\n \
  \ - NPAG-36 (Njord expansion)\n  - NPAG-7 (Org restructuring)\n- Extract: vendor\
  \ dependencies (e.g., \"Portfolio Phase 2 conditional on Phase 1 quality gate passing\
  \ by April 15\"), timeline constraints, and board deadline criticality.\n\n**Step\
  \ 5: Query KB for authority policy**\n- Use `kb_search` with query \"external advisor\
  \ invoice approval\" or retrieve KB-401 directly.\n- Confirm: Sven can approve up\
  \ to SEK 200k; above requires CFO escalation.\n- Retrieve KB-403 if needed to confirm\
  \ restricted budget categories (e.g., legal_compliance cannot be reallocated).\n\
  \n**Step 6: Aggregate proposals into structured table**\n- Columns: Project | Vendor\
  \ | Amount (SEK) | Delivery Window | Discount Expiration | Authority (Sven / CFO)\
  \ | Dependencies\n- Example rows:\n  - Aurora synergy analysis | Bain | SEK 320k\
  \ | April 15 - May 31 | April 10 | CFO | Regulatory filing completion\n  - Portfolio\
  \ Phase 2 DD | Roland Berger | SEK 280k | April 20 - June 15 | April 12 | CFO |\
  \ Phase 1 quality gate (April 15)\n  - Njord Phase 2 market study | EY | SEK 240k\
  \ | May 1 - June 30 | April 9 | CFO | None (deferrable)\n  - Org restructuring facilitation\
  \ | McKinsey | SEK 280k | April 10 - May 15 | April 14 | CFO | None (deferrable)\n\
  - Total: SEK 1,120k\n\n**Step 7: Calculate budget shortfall**\n- Q2 cap: SEK 850k\n\
  - Total proposals: SEK 1,120k\n- Shortfall: SEK 270k\n\n**Step 8: Identify CFO escalation\
  \ requirements**\n- All four proposals exceed SEK 200k → all require CFO approval.\n\
  - Flag each with justification: \"Exceeds Sven's SEK 200k authority ceiling per\
  \ KB-401.\"\n\n**Step 9: Map dependencies to calendar**\n- Portfolio Phase 2 (SEK\
  \ 280k): Cannot commit until Phase 1 quality gate passes on April 15.\n- Aurora\
  \ synergy analysis (SEK 320k): Cannot start until regulatory filing completes (expected\
  \ April 12 per Notion log).\n- Njord Phase 2 and org restructuring have no dependencies.\n\
  \n**Step 10: Rank by criticality**\n- **Board-critical-path**: Aurora (M&A board\
  \ decision May 10), Portfolio (board presentation June 5)\n- **Deferrable**: Njord\
  \ Phase 2 (exploratory), org restructuring (no hard deadline)\n\n**Step 11: Identify\
  \ discount expiration urgency**\n- Njord Phase 2 (EY): Discount expires April 9\
  \ (2 days from execution date April 7) → immediate decision required if pursuing.\n\
  - Aurora (Bain): Discount expires April 10 (3 days) → urgent.\n- Portfolio (Roland\
  \ Berger): Discount expires April 12 (5 days) → urgent.\n- Org restructuring (McKinsey):\
  \ Discount expires April 14 (7 days) → borderline urgent.\n\n**Step 12: Synthesize\
  \ prioritized allocation plan**\n- **Approve now (pending CFO sign-off)**:\n  -\
  \ Aurora synergy analysis (SEK 320k): Board-critical, discount expires April 10,\
  \ dependency (regulatory filing) expected to clear April 12 → recommend CFO fast-track\
  \ approval to lock discount.\n  - Portfolio Phase 2 DD (SEK 280k): Board-critical,\
  \ discount expires April 12, dependency (Phase 1 quality gate April 15) → recommend\
  \ CFO conditional approval (commit only if quality gate passes).\n- **Defer to mid-Q2**:\n\
  \  - Org restructuring facilitation (SEK 280k): No hard deadline, discount expires\
  \ April 14 → recommend deferring to May budget review to preserve Q2 headroom for\
  \ Aurora + Portfolio.\n- **Decline**:\n  - Njord Phase 2 market study (SEK 240k):\
  \ Exploratory project, not board-critical, discount expires April 9 → recommend\
  \ declining to stay under Q2 cap; revisit in Q3 if budget permits.\n- **Trade-off\
  \ rationale**:\n  - Aurora + Portfolio = SEK 600k (under SEK 850k cap, leaves SEK\
  \ 250k buffer).\n  - Deferring org restructuring preserves flexibility for mid-Q2\
  \ adjustments.\n  - Declining Njord avoids overcommitting to non-critical work;\
  \ timeline risk is low (no board dependency).\n\n**Step 13: Draft executive digest\
  \ for CFO**\n- **Summary**: Q2 external advisor proposals total SEK 1,120k against\
  \ SEK 850k cap (SEK 270k shortfall). All four proposals exceed SEK 200k and require\
  \ CFO approval.\n- **Prioritized allocation plan**:\n  - Approve: Aurora (SEK 320k),\
  \ Portfolio Phase 2 (SEK 280k) — board-critical, time-sensitive discounts.\n  -\
  \ Defer: Org restructuring (SEK 280k) — no hard deadline, revisit mid-Q2.\n  - Decline:\
  \ Njord Phase 2 (SEK 240k) — exploratory, not board-critical.\n- **Decision urgency\
  \ flags**:\n  - Aurora discount expires April 10 (3 days).\n  - Njord discount expires\
  \ April 9 (2 days) — recommend declining to preserve budget for board-critical work.\n\
  \  - Portfolio Phase 2 conditional on Phase 1 quality gate (April 15) — recommend\
  \ conditional approval.\n- **Trade-off rationale**: Prioritizes board-critical-path\
  \ projects (Aurora M&A, Portfolio review) over deferrable initiatives (org restructuring,\
  \ Njord exploration). Declining Njord and deferring org restructuring keeps Q2 spend\
  \ at SEK 600k (under cap) while preserving SEK 250k buffer for mid-Q2 adjustments.\
  \ Timeline risk: low (Aurora and Portfolio dependencies expected to clear by mid-April).\
  \ Cost savings: locking Aurora and Portfolio discounts saves ~SEK 50k vs. standard\
  \ rates. Quality impact: none (all approved vendors are tier-1 firms).\n\n**Step\
  \ 14: Document decision log**\n- Update Notion decision logs for Aurora, Portfolio,\
  \ Njord, and org restructuring with allocation decisions and trade-off rationale\
  \ for audit trail.\n\n**Expected output**: A structured executive digest (email\
  \ or Notion page) for CFO Anna Karlsson with:\n1. Budget shortfall analysis (SEK\
  \ 1,120k proposals vs. SEK 850k cap).\n2. Prioritized allocation plan (approve Aurora\
  \ + Portfolio, defer org restructuring, decline Njord).\n3. CFO escalation flags\
  \ (all four proposals exceed SEK 200k).\n4. Discount expiration urgency (Aurora\
  \ April 10, Njord April 9).\n5. Dependency and timeline mapping (Portfolio Phase\
  \ 2 conditional on Phase 1 quality gate).\n6. Trade-off rationale (timeline risk\
  \ vs. cost savings vs. quality impact)."
