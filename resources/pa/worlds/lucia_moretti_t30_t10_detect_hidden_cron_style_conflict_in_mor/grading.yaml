judge_rubric: >-
  # Evaluation Rubric for Conflict Detection Task


  ## Excellent (0.9-1.0)

  - Clearly identifies the March 25 same-day collision between 7:15am morning
  brief and 6:45am Frankfurt flight departure

  - Explains the temporal impossibility with specific time windows (brief
  delivery at 7:15, required airport arrival ~5:45, travel time constraints)

  - Recognizes that the conflict was already detected and resolved via swap with
  Stefano (March 25 ↔ April 2)

  - References Marco's approval and the resolution timeline

  - Demonstrates understanding of the cron-style conflict pattern: recurring
  commitment (rotation) + one-off event (travel) = hidden collision when planned
  independently

  - Optionally: mentions the secondary evening-prep conflict on March 23-24 or
  references the systematic detection framework Lucia documented in notes


  ## Good (0.7-0.89)

  - Correctly identifies the March 25 conflict and the swap resolution

  - Explains why the timing was impossible (overlapping time windows)

  - References key stakeholders (Stefano, Marco) and the resolution mechanism

  - May miss some nuance about pre-departure buffer calculations or the
  evening-prep secondary conflict


  ## Adequate (0.5-0.69)

  - Identifies that there was a conflict on March 25 involving morning brief and
  travel

  - Recognizes that a swap occurred but may be vague on details (dates, people
  involved)

  - Provides basic explanation of the timing problem

  - May not fully explain the resolution process or stakeholder approval chain


  ## Poor (0.3-0.49)

  - Detects that calendar events exist on March 25 but fails to articulate the
  conflict clearly

  - Mentions travel or brief in isolation without connecting them as a collision

  - Vague or incorrect about the resolution (e.g., suggests the conflict is
  unresolved when it was already fixed)


  ## Failing (0.0-0.29)

  - Does not identify the March 25 conflict

  - Provides irrelevant information or focuses on wrong dates

  - Fails to access key data sources (calendar, workmail, sheet)

  - Misunderstands the task as future planning rather than retrospective
  analysis of a resolved conflict
reference_solution: >-
  # Reference Solution


  ## Step 1: Query calendar for morning brief rotation events

  **Action**: `calendar_list_events` with date range 2026-03-20 to 2026-03-31,
  filter for "Morning Brief" or "Regulatory Digest"

  **Findings**:

  - EVT-493: March 24, 7:15-7:45am, Lucia assigned

  - EVT-494: March 25, 7:15-7:45am, Lucia assigned (original)

  - EVT-496: March 26, 7:15-7:45am, Lucia assigned


  ## Step 2: Query calendar for travel events in same window

  **Action**: `calendar_list_events` with same date range, filter for "Travel"
  or "Flight"

  **Findings**:

  - EVT-495: March 25, 6:45-8:30am, Flight to Frankfurt from Milan Linate


  ## Step 3: Detect temporal collision

  **Analysis**:

  - Morning brief delivery window: March 25, 7:15-7:45am (Milan office)

  - Flight departure: March 25, 6:45am (Linate airport)

  - Required airport arrival: ~5:45am (1-hour buffer for international flight)

  - Travel time Milan office → Linate: ~35 minutes

  - Latest possible office departure: ~5:10am

  - **Collision type**: Same-day impossible — cannot deliver 7:15am brief and
  depart on 6:45am flight


  ## Step 4: Check workmail for resolution communication

  **Action**: `workmail_list_messages` with date range around March 22-23,
  search for "morning brief" + "conflict" or "swap"

  **Findings**:

  - WMSG-5176 (March 22, 16:45): Lucia's urgent email to Marco identifying the
  conflict and proposing swap with Stefano (March 25 ↔ April 2)

  - WMSG-5177 (March 22, 17:20): Marco's approval of Option 1 (swap with
  Stefano)

  - WMSG-5178 (March 22, 17:35): Lucia's coordination email to Stefano
  confirming the swap


  ## Step 5: Verify resolution in rotation tracking sheet

  **Action**: `sheet_open` for workbook WB-40 "Q1 Morning Brief Rotation - March
  2026 Swap Log"

  **Findings**:

  - Rotation Schedule sheet shows March 25 reassigned to Stefano with note
  "Swapped with Lucia (orig. assigned)"

  - April 2 shows Lucia assigned with note "Swapped with Stefano (orig.
  assigned)"

  - Conflict Log sheet documents the collision detection on March 22 and
  resolution status "Resolved"


  ## Step 6: Optionally review notes for conflict detection framework

  **Action**: `notes_get` for NOTE-180 "Cron-Style Conflict Detection Framework"

  **Context**: Lucia documented the systematic detection approach and lessons
  learned from this incident


  ## Summary Output

  "I found the scheduling conflict you mentioned. On March 25, you were
  originally assigned to deliver the 7:15am Desk Morning Brief, but you also had
  a 6:45am flight departure to Frankfurt for the European Banking Conference.
  This created an impossible time window — you would need to be at Linate
  airport by 5:45am (1-hour pre-departure buffer) but also deliver the brief
  from the Milan office at 7:15am.


  You detected this conflict on March 22 and immediately escalated to Marco. He
  approved your proposed swap with Stefano within 35 minutes: Stefano took your
  March 25 slot, and you took his April 2 slot in exchange. You coordinated
  directly with Stefano and updated the Q1 Morning Brief Rotation sheet (WB-40)
  to reflect the change.


  The conflict arose because the conference travel was booked in January
  (early-bird deadline) while the rotation assignments were finalized on March
  15, and there was no systematic cross-check between recurring rotation
  commitments and one-off travel events. You've since documented a 'Cron-Style
  Conflict Detection Framework' in your notes (NOTE-180) to prevent similar
  issues in the future."
