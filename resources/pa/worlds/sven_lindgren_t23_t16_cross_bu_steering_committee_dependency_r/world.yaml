scoring_components:
- name: Identified critical dependency chain
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Aurora
      - regulatory
      - approval
      - clearance
    - - portfolio
      - financial data
      - Q1 close
      - BU financials
    - - org restructuring
      - depends on portfolio
      - reporting structure
      - portfolio decisions
- name: Detected resource and compliance constraints
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - CEO
      - CFO
      - shared participants
      - cannot run parallel
      - scheduling bottleneck
    - - KB-404
      - Zoom recording
      - one recorded meeting
      - recording compliance
    - - KB-408
      - 24-hour
      - action-item extraction
      - 24h gap
- name: Proposed phased execution plan
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Phase 1
      - parallel
      - no prerequisites
      - April 7-11
      - April 8
      - April 10
    - - Phase 2
      - sequential
      - April 14-18
      - April 15
      - April 16
    - - Phase 3
      - April 21-25
      - org restructuring
- name: Flagged critical path risk and buffer constraint
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - critical path
      - buffer
      - 5 days
      - 5-day threshold
      - below 5 days
    - - risk
      - escalate
      - CFO
      - resource constraint
      - deadline extension
      - April 11
- name: Retrieved CEO workmail request
  weight: 0.15
  check:
    type: tool_called
    tool_name: workmail_get_message
    min_calls: 1
- name: Consulted Notion dependency analysis
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_notion_get_page
    min_calls: 1
- name: Checked calendar availability for CEO/CFO
  weight: 0.1
  check:
    type: tool_called
    tool_name: calendar_get_user_events
    min_calls: 1
