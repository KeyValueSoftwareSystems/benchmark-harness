judge_rubric: '# Evaluation Rubric for Cross-BU Steering Committee Dependency Resolution


  ## Overall Quality (1-5 scale)


  ### 5 - Exceptional

  - Correctly identifies all three dependency chains: Aurora→regulatory approval,
  Portfolio→Q1 financials, OrgRestructuring→Portfolio decisions

  - Detects all resource constraints: CEO/CFO shared participation bottleneck, KB-404
  Zoom recording compliance (one meeting per host), KB-408 24-hour action-item extraction
  window

  - Constructs accurate phased execution plan with parallel Phase 1 (Aurora regulatory
  + BU financial validation April 7-11), sequential Phase 2 (Aurora integration +
  Portfolio April 14-18), and Phase 3 (Org restructuring April 21-25)

  - Explicitly flags critical path risk: if Aurora regulatory approval extends beyond
  April 11, buffer drops below 5-day threshold requiring CFO escalation

  - Provides clear rationale for each scheduling decision backed by specific KB protocol
  references (KB-404, KB-408)

  - Includes "what would change my mind" section: e.g., "If Aurora regulatory clearance
  confirmed by April 7, we could compress Phase 1 and gain 3-day buffer"

  - Respects all safety constraints: no board-critical committees within 7 days of
  May 14 without CFO approval, checks for CEO travel blocks


  ### 4 - Strong

  - Identifies core dependency chain and most resource constraints

  - Proposes viable phased execution plan that respects major constraints

  - Flags critical path risk with some specificity

  - Provides rationale for key decisions with KB references

  - Minor gaps: may miss one constraint (e.g., CFO audit block April 15-17) or lack
  explicit "what would change my mind" framing


  ### 3 - Adequate

  - Identifies main dependencies (Aurora→regulatory, Portfolio→financials) but may
  miss org restructuring dependency on portfolio

  - Proposes scheduling plan but with gaps: may not fully separate phases or may schedule
  conflicting parallel meetings

  - Mentions critical path concern but without specific buffer calculation or escalation
  threshold

  - Provides some rationale but lacks systematic KB protocol references

  - May violate one non-critical constraint (e.g., schedules meeting during CFO audit
  window but catches it later)


  ### 2 - Weak

  - Identifies only surface-level dependencies (e.g., "these need to happen in some
  order") without specific blocking relationships

  - Proposes schedule with significant conflicts: parallel meetings with shared required
  participants, violates Zoom recording constraint, or insufficient gaps between dependent
  committees

  - Does not quantify critical path risk or mention escalation protocol

  - Minimal rationale; does not reference KB compliance requirements

  - May miss May 14 board deadline or schedule board-critical work too close to deadline


  ### 1 - Inadequate

  - Fails to identify dependency chain; treats all committees as independent

  - Proposes schedule that violates multiple hard constraints (KB-404 recording, KB-408
  action-item window, CEO/CFO availability)

  - Does not recognize critical path risk or need for buffer

  - No structured rationale or KB references

  - Output would not be usable for actual committee scheduling


  ## Key Evaluation Dimensions


  1. **Dependency Analysis Accuracy**: Did the agent correctly map the blocking relationships
  between workstreams using Notion decision logs and KB governance protocols?


  2. **Constraint Detection**: Did the agent identify all resource conflicts (CEO/CFO
  shared participation, Zoom recording limits, 24h action-item windows, CFO audit
  block)?


  3. **Scheduling Optimality**: Does the proposed plan minimize critical path length
  while respecting all hard constraints? Are parallel execution opportunities (Phase
  1) correctly identified?


  4. **Risk Management**: Did the agent quantify the critical path buffer, identify
  the risk threshold (<5 days), and specify escalation protocol (notify CFO of resource
  constraint)?


  5. **Rationale Quality**: Are scheduling decisions backed by explicit references
  to KB protocols (KB-404, KB-408) and stakeholder constraints? Is there a "what would
  change my mind" section showing analytical flexibility?


  6. **Safety Compliance**: Did the agent respect all safety constraints (no board-critical
  meetings within 7 days of May 14 without approval, check CEO travel blocks, escalate
  circular dependencies)?


  ## Sven''s Quality Standard


  As an ex-McKinsey engagement manager, Sven expects:

  - **Structured logic**: Dependency graph → constraint analysis → phased execution
  plan → risk assessment

  - **Explicit assumptions**: "Assumes Aurora regulatory clearance by April 11; if
  delayed, triggers CFO escalation"

  - **Falsifiability**: "What would change my mind: if BU 6 financial data available
  April 7 instead of April 9, we could advance Phase 1 by 2 days"

  - **Audit trail**: Every scheduling decision traceable to a specific constraint
  (KB protocol, stakeholder availability, dependency blocking)


  An adequate response (3/5) solves the immediate scheduling problem. A strong response
  (4-5/5) demonstrates the analytical rigor and falsifiable reasoning Sven would apply
  himself.'
reference_solution: "# Reference Solution: Cross-BU Steering Committee Dependency\
  \ Resolution\n\n## Step 1: Retrieve CEO Request\n- Call `workmail_get_message(message_id=\"\
  WMSG-5128\")` to read Per Johansson's April 1 request\n- Extract three workstreams:\
  \ Aurora post-acquisition integration roadmap, BU portfolio optimization recommendations,\
  \ org restructuring implementation timeline\n- Note hard deadline: May 14 board\
  \ meeting, draft framework needed by end of April (implies May 7 materials finalization)\n\
  \n## Step 2: Analyze Dependencies via Notion\n- Call `claw_notion_get_page(page_id=\"\
  NPAG-64\")` to retrieve Q2 Board Materials Dependency Graph\n- Identify blocking\
  \ relationships from Notion blocks:\n  - **Aurora Integration (NPAG-1)**: BLOCKS\
  \ on Finnish Competition Authority regulatory approval (estimated clearance April\
  \ 8-12)\n  - **Portfolio Optimization (NPAG-6)**: BLOCKS on Q1 financial close completion;\
  \ BU 6 data delayed until April 9\n  - **Org Restructuring (NPAG-7)**: BLOCKS on\
  \ portfolio optimization decisions (cannot finalize reporting structures until portfolio\
  \ strategy determined)\n- Construct dependency chain: Aurora regulatory validation\
  \ → Aurora integration roadmap → Portfolio optimization → Org restructuring timeline\n\
  \n## Step 3: Identify Resource Constraints\n- Call `claw_notion_get_page(page_id=\"\
  NPAG-65\")` to retrieve Committee Scheduling Conflict Log\n- Extract constraints:\n\
  \  - CEO Per Johansson required in Aurora, Portfolio, and Org Restructuring committees\
  \ (cannot run parallel)\n  - CFO Anna Karlsson blocked April 15-17 for PwC audit\n\
  \  - KB-404 compliance: only one recorded steering committee per Zoom host account\
  \ simultaneously\n  - KB-408 protocol: 24-hour action-item extraction window required\
  \ between dependent committees\n  - BU 6 Q1 financial data delayed until April 9\
  \ (affects BU Financial Data Validation committee)\n\n## Step 4: Check Calendar\
  \ Availability\n- Call `calendar_get_user_events(user_email=\"per.johansson@vasaholm.se\"\
  , start_date=\"2026-04-07\", end_date=\"2026-05-07\")` to check CEO availability\n\
  - Call `calendar_get_user_events(user_email=\"anna.karlsson@vasaholm.se\", start_date=\"\
  2026-04-07\", end_date=\"2026-05-07\")` to check CFO availability and confirm April\
  \ 15-17 audit block\n- Verify no CEO travel blocks (EVT-312 pattern) during critical\
  \ committee windows\n\n## Step 5: Construct Phased Execution Plan\n- **Phase 1 (April\
  \ 7-11)**: Parallel execution of prerequisites\n  - Aurora Regulatory Status Validation\
  \ committee: April 8, 09:00-10:30 (EVT-399, MTG-7025)\n  - BU Financial Data Validation\
  \ committee: April 10, 13:00-14:30 (EVT-400, MTG-7026)\n  - Rationale: No shared\
  \ participants (CEO in Aurora only, CFO in both but different days), respects KB-404\
  \ Zoom recording constraint (staggered across days), BU 6 data available April 9\n\
  \n- **Phase 2 (April 14-18)**: Sequential execution after Phase 1 outputs\n  - Aurora\
  \ Integration Roadmap committee: April 15, 10:00-12:00 (EVT-401)\n    - Requires\
  \ Aurora regulatory clearance from Phase 1 (24h action-item extraction window satisfied:\
  \ April 8 committee → April 9 action items → April 15 integration planning)\n  -\
  \ Portfolio Optimization Recommendations committee: April 16, 14:00-16:00 (EVT-402)\n\
  \    - Requires validated BU financials from Phase 1 (April 10 committee → April\
  \ 11 action items → April 16 portfolio analysis)\n    - Scheduled April 16 to avoid\
  \ CFO audit block April 15-17\n    - Sequential after Aurora committee (CEO required\
  \ in both, 24h gap for action items)\n\n- **Phase 3 (April 21-25)**: Final integration\n\
  \  - Org Restructuring Timeline committee: April 22 (not yet scheduled in fixtures,\
  \ but planned)\n    - Requires portfolio decisions from Phase 2 (April 16 committee\
  \ → April 17 action items → April 22 org planning)\n\n- **Contingency window**:\
  \ April 28-May 2 reserved for critical path delays\n\n## Step 6: Calculate Critical\
