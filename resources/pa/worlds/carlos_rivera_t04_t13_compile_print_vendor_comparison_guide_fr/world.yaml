task_id: T04_T13_compile_print_vendor_comparison_guide_fr
task_name: Compile print vendor comparison guide from KB articles and recent email
  quotes
category: operations
difficulty: simple
prompt:
  text: I need to put together a print vendor comparison guide for Q2 budget planning.
    I've got some KB articles on vendor evaluation and recent quotes from ColorWave,
    Swift Print, and Verdant Press floating around in my emails. Can you help me compile
    everything into a structured reference doc that'll help me pick vendors faster
    when I'm juggling multiple projects?
  language: en
execution_date: '2026-04-08'
tools:
- name: gmail_list_messages
  description: 'List inbox messages. Returns subject/from/date (no body). Default:
    last 7 days, max 20 results. Response includes ''total'' (all matching) and ''returned''
    (this page) counts. Use query to search (matches if ALL words appear in subject
    or sender). Use offset for pagination. If query returns 0, retry without query
    to browse all messages.'
- name: gmail_get_message
  description: Get full message details including body by message_id
- name: gmail_send_message
  description: Send an email to the specified recipient
- name: gmail_save_draft
  description: Save an email as draft (not sent). Use reply_to_message_id to mark
    it as a reply.
- name: calendar_list_events
  description: List calendar events starting from a given date. Returns full event
    details. Use days parameter to extend the search window.
- name: calendar_get_event
  description: Get a single event by event_id
- name: calendar_get_user_events
  description: Get events for a specific user on a specific date (single day only)
- name: calendar_create_event
  description: Create a new calendar event
- name: calendar_delete_event
  description: Delete a calendar event by event_id
- name: todo_list_tasks
  description: List TODO tasks. Returns full task details. Default returns all tasks.
    Use status filter to narrow results.
- name: todo_create_task
  description: Create a new TODO task
- name: todo_update_task
  description: Update an existing TODO task. Only provided fields will be changed.
- name: todo_delete_task
  description: Delete a TODO task by task_id
- name: contacts_search
  description: Search contacts by name. Optionally filter by department.
- name: contacts_get
  description: Get full contact details by contact_id
- name: contacts_send_message
  description: Send a direct message to a contact
- name: finance_list_transactions
  description: List financial transactions. Returns all transactions by default. Use
    start_date and end_date to filter by date range.
- name: finance_get_transaction
  description: Get full transaction details by transaction_id
- name: finance_report_submit
  description: Submit a finance report with transaction references
- name: notes_list
  description: List notes (title/id only, no content). Default max 10 results. Response
    includes 'total' (all matching) and 'returned' (this page) counts. Use query to
    search (matches if ALL words appear in title or participants). Use offset for
    pagination. If query returns 0, retry without query to browse all notes.
- name: notes_get
  description: Get full note content by note_id
- name: kb_search
  description: Search KB articles by keyword. Returns title/snippet (first 150 chars)
    only. Default max 5 results. Response includes 'total' (all matching) and 'returned'
    (this page) counts. Use offset for pagination. Use kb_get_article for full content.
- name: kb_get_article
  description: Get full KB article content by article_id
- name: kb_update_article
  description: Update a KB article's content
- name: helpdesk_list_tickets
  description: List helpdesk tickets. Default shows only 'open' tickets. Use status='all'
    to see all tickets.
- name: helpdesk_get_ticket
  description: Get full ticket details by ticket_id
- name: helpdesk_update_ticket
  description: Update a helpdesk ticket. Only provided fields will be changed.
- name: helpdesk_close_ticket
  description: Close a helpdesk ticket with a resolution note
- name: inventory_list_products
  description: List inventory products. Returns full product details. Optionally filter
    by category.
- name: inventory_get_product
  description: Get full product details by product_id
- name: inventory_create_order
  description: Create a purchase order for a product
- name: rss_list_feeds
  description: List available RSS feed sources and their categories. Optionally filter
    by category.
- name: rss_list_articles
  description: List RSS articles (summary only, no full content). Default max 20 results.
    Filter by source or category.
- name: rss_get_article
  description: Get full RSS article content by article_id
- name: rss_publish
  description: Publish a newsletter
- name: crm_list_customers
  description: List CRM customers (summary only, no detailed notes/contracts). Filter
    by status, tier, or industry.
- name: crm_get_customer
  description: Get full customer details including notes and contracts by customer_id
- name: config_list_integrations
  description: List integrations (summary only, no secrets/credentials). Optionally
    filter by status.
- name: config_get_integration
  description: Get full integration details by integration_id
- name: scheduler_list_jobs
  description: List scheduled jobs (summary, no action/history). Filter by status,
    enabled state, or tag.
- name: scheduler_get_job
  description: Get full job details including action and execution history by job_id
- name: scheduler_create_job
  description: Create a new scheduled job
- name: scheduler_update_job
  description: Update a scheduled job. Only provided fields will be changed.
- name: scheduler_delete_job
  description: Delete a scheduled job by job_id
- name: scheduler_job_history
  description: Get execution history for a job. Default returns last 10 entries.
