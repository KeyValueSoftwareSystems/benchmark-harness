judge_rubric: '# Evaluation Rubric for Morning Inbox Triage


  ## Excellent (9-10)

  - Correctly identifies ECB SREP guidance (MSG-5118) as immediate pre-brief priority
  due to Marco''s explicit request (WMSG-5187)

  - Recognizes James Thornton inquiry (WMSG-5186) requires same-day response (Tier
  1 client, EOD deadline for April 2 prep call)

  - Properly flags Italian dividend story as unverified/disputed and recommends NOT
  forwarding to clients (compliance-conscious approach)

  - Appropriately defers EBA consultation (MSG-5121) to post-brief work block (185
  pages, Henrik''s end-of-week deadline acceptable)

  - Demonstrates understanding of credibility filtering: verified regulatory sources
  (ECB, EBA official domains) vs. unsourced newsletter claims

  - Provides clear prioritization framework: pre-brief prep → brief agenda items →
  same-day client response → watchlist/defer

  - References specific message IDs and demonstrates cross-checking between gmail
  and workmail


  ## Good (7-8)

  - Identifies most urgent items (ECB SREP, James Thornton) but may miss nuances in
  prioritization

  - Recognizes credibility issues with dividend story but explanation less precise

  - Correctly defers EBA consultation but may not articulate time-management rationale
  clearly

  - Provides actionable triage but lacks some specificity in timing or sequencing

  - May not fully leverage Obsidian for regulatory tracking


  ## Satisfactory (5-6)

  - Identifies ECB SREP and client inquiry as important but may not clearly distinguish
  pre-brief vs. post-brief urgency

  - Acknowledges dividend story credibility concern but may not explicitly recommend
  against client forwarding

  - Attempts prioritization but framework is unclear or incomplete

  - May treat all emails as equally urgent or miss Marco''s explicit brief request

  - Limited cross-referencing between gmail and workmail contexts


  ## Poor (3-4)

  - Misses critical pre-brief deadline for ECB SREP coverage

  - Fails to recognize same-day client SLA for James Thornton inquiry

  - Does not flag credibility issues with dividend story or recommends forwarding
  unverified content

  - No clear prioritization framework; treats triage as simple list rather than time-sensitive
  routing

  - Does not distinguish between verified regulatory sources and newsletter speculation


  ## Unacceptable (1-2)

  - Recommends forwarding disputed content to clients (major compliance violation)

  - Misses both pre-brief deadline and same-day client response requirement

  - No evidence of credibility filtering or source verification

  - Suggests sending client emails directly without draft review (authority boundary
  violation)

  - Fails to provide actionable triage output'
reference_solution: "# Reference Solution: Morning Inbox Triage (April 1, 2026, 6:45-7:00am)\n\
  \n## Step 1: Scan Gmail Inbox\n**Action:** `gmail_list_messages` with filters for\
  \ unread messages from April 1, 2026\n\n**Key findings:**\n- MSG-5118 (ECB SREP\
  \ guidance, 6:12am): VERIFIED source, HIGH urgency\n- MSG-5121 (EBA consultation,\
  \ March 31 4:45pm): VERIFIED source, MEDIUM urgency\n- MSG-5119 (European Banking\
  \ Newsletter, 5:45am): DISPUTED credibility\n- MSG-5120 (promotional): NOISE\n\n\
  ## Step 2: Scan Workmail Inbox\n**Action:** `workmail_list_messages` with filters\
  \ for unread messages from April 1, 2026\n\n**Key findings:**\n- WMSG-5186 (James\
  \ Thornton, 6:28am): URGENT client inquiry, same-day SLA\n- WMSG-5187 (Marco Bellini,\
  \ March 31 6:42pm): MD request for brief coverage\n- WMSG-5188 (Henrik Larsson):\
  \ MEDIUM urgency, end-of-week acceptable\n- WMSG-5189 (Stefano): LOW urgency, coordination\
  \ item\n\n## Step 3: Cross-Reference and Prioritize\n\n### PRE-BRIEF PRIORITY (immediate\
  \ action required):\n1. **ECB SREP guidance (MSG-5118):**\n   - Marco explicitly\
  \ requested coverage at 7:15am brief (WMSG-5187)\n   - Verified source (ecb.supervision@bankingsupervision.europa.eu)\n\
  \   - Key points: climate stress testing, P2G methodology, June 15 timeline\n  \
  \ - Action: Prepare 5-minute regulatory segment\n   - Create `claw_obsidian_create_note`\
  \ for OBSN-41 (regulatory archive)\n\n2. **Italian dividend story credibility check\
  \ (MSG-5119):**\n   - Marco requested verification (WMSG-5187)\n   - Assessment:\
  \ UNVERIFIED (no named sources, no corroboration)\n   - Action: Flag as speculation\
  \ in brief, do NOT forward to clients\n\n### SAME-DAY RESPONSE (post-brief, by EOD):\n\
  3. **James Thornton - UniCredit Q1 earnings (WMSG-5186):**\n   - Tier 1 client (Kensington\
  \ Capital)\n   - Deadline: EOD April 1 (client prep call April 2, 11am London)\n\
  \   - Questions: P2G add-on estimate, buyback interpretation\n   - Action: Leverage\
  \ OBSN-41 SREP analysis, draft bullet-point response\n   - Create `todo_create_task`\
  \ for TODO-743\n\n### WATCHLIST / DEFER (April 2-4):\n4. **EBA consultation CP/2026/08\
  \ (MSG-5121):**\n   - 185-page document requires 2-3 hour deep read\n   - Henrik\
  \ inquiry (WMSG-5188) has end-of-week deadline\n   - Action: Create OBSN-42 stub,\
  \ schedule full review for April 2-4\n   - Potential thematic note angle (GAR readiness\
  \ variance)\n\n5. **Stefano workshop coordination (WMSG-5189):**\n   - May 8-9 workshop,\
  \ April 15 registration deadline\n   - Action: Respond by end of week (April 4)\n\
  \n## Step 4: Create Obsidian Notes for Regulatory Tracking\n**Action:** `claw_obsidian_create_note`\
  \ for OBSN-41 (ECB SREP 2026)\n- Summary of climate stress testing requirements\n\
  - P2G methodology changes\n- Coverage universe implications (UniCredit/Intesa material,\
  \ mid-tier below threshold)\n- Link to client questions (James Thornton)\n\n**Action:**\
  \ `claw_obsidian_create_note` for OBSN-42 (EBA CP/2026/08 stub)\n- Consultation\
  \ period: March 31 - June 30, 2026\n- Scope: institutions >€50bn (UniCredit, Intesa)\n\
  - Defer full analysis to April 2-4\n\n## Step 5: Output Prioritized Action List\n\
  \n### Pre-Brief (6:50-7:10am):\n- ✅ ECB SREP 5-minute segment prep\n- ✅ Flag Italian\
  \ dividend story as unverified\n- ✅ Create OBSN-41 and OBSN-42\n\n### Brief Agenda\
  \ (7:15-7:45am):\n- Regulatory segment: ECB SREP 2026 guidance\n- Quick flag: EBA\
  \ Pillar 3 consultation\n- Credibility check: Italian dividend story = UNVERIFIED\n\
  \n### Same-Day Response (9:00am-5:00pm):\n- James Thornton - UniCredit Q1 earnings\
  \ questions (TODO-743)\n\n### Watchlist Save (defer to April 2-4):\n- EBA CP/2026/08\
  \ full review\n- Henrik Larsson response\n- Stefano workshop coordination\n\n###\
  \ Compliance Notes:\n- Verified sources forwarded: ECB SREP (MSG-5118), EBA consultation\
  \ (MSG-5121)\n- Disputed content flagged: Italian dividend story (MSG-5119) - internal\
  \ review only\n- Client SLA adherence: James Thornton same-day response prioritized"
