judge_rubric: 'Evaluate the response on these dimensions:


  1. **Conflict Detection Accuracy (30%)**: Did the agent correctly identify the hidden
  scheduling conflict on Thursday April 3rd where He Meilan cannot physically pick
  up Xiaobao from vaccination at ~4:30pm AND pick up Dabao from robotics at 5:30pm?
  The conflict is not just overlapping calendar events but the physical impossibility
  of being in two locations 25 minutes apart.


  2. **Constraint Recognition (25%)**: Did the agent recognize and articulate the
  critical constraints: (a) vaccination cannot be postponed beyond this week per clinic
  policy due to vaccine batch expiration (hard medical deadline), (b) robotics trial
  has confirmation deadline April 4th 6pm (enrollment decision point), (c) husband
  traveling April 1-5 means no primary backup available, (d) solo parenting creates
  physical constraint?


  3. **Solution Prioritization (25%)**: Did the agent recommend securing backup helper
  assistance as the primary solution, recognizing that vaccination''s hard medical
  deadline takes priority over robotics enrollment flexibility? Did it identify appropriate
  backup helpers (sister He Meifang as first choice, neighbors Liu Fang or Chen Xiao
  as alternatives) and acknowledge relationship boundaries?


  4. **Decision Timeline (10%)**: Did the agent recognize the urgency created by the
  April 4th robotics confirmation deadline and recommend acting quickly (ideally by
  Wednesday evening) to secure backup help?


  5. **Family-Centered Perspective (10%)**: Did the response acknowledge He Meilan''s
  solo parenting stress during husband''s business trip and avoid suggesting she simply
  cancel either activity without proper consideration? Did it respect both children''s
  developmental needs (Dabao''s educational opportunity, Xiaobao''s health requirement)?


  Strong responses will present a clear conflict analysis, explicitly state that vaccination
  has priority due to medical constraints, recommend contacting He Meifang first for
  backup assistance, and acknowledge the time pressure of the April 4th decision deadline.
  Weak responses will miss the physical impossibility of the Thursday schedule, suggest
  casually canceling activities, or fail to recognize the constraint hierarchy.'
reference_solution: 'Step 1: Query calendar_list_events for the week of April 1-5,
  2026 to map all commitments during husband''s business trip.


  Step 2: Identify EVT-496 (Dabao Robotics Workshop Trial Session 2, Thursday April
  3, 4:00-5:30pm) and EVT-497 (Xiaobao Vaccination Appointment, Thursday April 3,
  3:30-4:30pm) as overlapping events.


  Step 3: Retrieve gmail message MSG-5230 (Robotics Academy confirmation email) to
  understand trial schedule, pickup policy (strict 5:30pm pickup required), and confirmation
  deadline (April 4th 6pm).


  Step 4: Retrieve gmail message MSG-5231 (Vaccination appointment confirmation) to
  understand appointment time (3:30pm), estimated pickup time (4:15-4:30pm after 30-min
  observation), and critical constraint: "cannot be rescheduled beyond this week due
  to vaccine batch expiration."


  Step 5: Recognize the hidden conflict: He Meilan cannot pick up Xiaobao at Children''s
  Hospital at ~4:30pm AND pick up Dabao at Robotics Academy at 5:30pm on the same
  day - locations are 25 minutes apart and she would need to be in two places.


  Step 6: Access TODO-769 to see He Meilan has already recorded this conflict as an
  urgent task.


  Step 7: Query contacts_search or contacts_get for backup helper candidates: CON-362
  (He Meifang - sister, lives 15 min away, flexible schedule, has helped before).


  Step 8: Analyze constraint hierarchy: Vaccination has hard medical deadline (cannot
  postpone beyond this week) while robotics trial has enrollment flexibility (can
  defer to next semester if needed). Vaccination takes priority.


  Step 9: Recommend primary solution: Contact sister He Meifang immediately to secure
  backup pickup assistance for either Xiaobao (vaccination, ~4:30pm) or Dabao (robotics,
  5:30pm). He Meifang is the most reliable option per contact notes.


  Step 10: Provide backup options: (a) Contact neighbors Liu Fang or Chen Xiao if
  He Meifang unavailable, (b) Email Robotics Academy (info@robotics-academy.edu.example)
  to ask if Thursday trial session can be skipped while still confirming enrollment,
  (c) Call vaccination center to verify absolutely no flexibility despite policy statement.


  Step 11: Emphasize decision timeline: Must secure backup by Wednesday evening April
  3rd to allow helper preparation time, and must decide on robotics enrollment by
  April 4th 6pm deadline.


  Step 12: Acknowledge solo parenting constraint and recommend prioritizing Xiaobao''s
  medical appointment as non-negotiable while treating robotics as an enrollment decision
  that can be deferred if backup cannot be secured.'
