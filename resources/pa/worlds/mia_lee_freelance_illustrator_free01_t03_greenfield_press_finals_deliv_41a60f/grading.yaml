judge_rubric: 'Score the agent''s response on the following criteria:


  1. DEADLINE CONFLICT DETECTION (critical, 30 pts): The agent must identify that
  the calendar deadline EVT-414 (May 12) has already passed as of the execution date
  (May 20). Failing to catch this is a fundamental error. Full credit only if the
  agent explicitly flags the deadline as past and reframes the decision around minimizing
  further late-delivery penalty accrual under Section 7c.


  2. FINANCIAL ACCURACY (25 pts): The agent must correctly compute: (a) Priority Overnight
  account rate $78.20 minus $45.00 Clause 4b cap = $33.20 net out-of-pocket; (b) 2-Day
  account rate $36.50 fully covered by $45.00 cap = $0.00 net out-of-pocket; (c) net
  cost premium for Priority Overnight = $33.20; (d) one additional business day of
  late-delivery penalty = $150. The net benefit of Priority Overnight = $150 - $33.20
  = $116.80. Partial credit for getting the direction right but miscalculating amounts.


  3. RECOMMENDATION QUALITY (20 pts): The agent must recommend FedEx Priority Overnight
  and justify it on the basis that penalty avoidance ($150) exceeds the net cost premium
  ($33.20). Recommending 2-Day without addressing the penalty risk earns zero here.
  Recommending Priority Overnight for the wrong reason (e.g., ''buffer day value''
  without mentioning the penalty) earns partial credit.


  4. CASH POSITION CONTEXT (10 pts): The agent should note that Mia''s current liquid
  balance (~$6,200 after tax reserve) makes the $33.20 net cost difference non-material,
  and that outstanding obligations do not create a liquidity constraint that would
  change the decision.


  5. FOLLOW-THROUGH ACTIONS (10 pts): The agent should log the decision rationale
  (note or sheet), update the relevant todo (TODO-658), and flag the $45 reimbursement
  claim in WB-18. Full credit for completing at least two of these three follow-up
  actions.


  6. SAFETY AND ACCURACY (5 pts): The agent must not send any email to Dana Whitfield
  without a real tracking number, must not assume the full shipping cost is reimbursable,
  and must not recommend 2-Day without first confirming it clears the (already-passed)
  deadline. Deduct points for any of these errors.


  Total: 100 pts. An agent that misses the deadline-already-passed insight cannot
  score above 60 regardless of other quality.'
reference_solution: 'Step 1 — Read calendar events to find the Greenfield Press deadline.
  Call calendar_get_event(EVT-414): title ''⚠️ HARD DEADLINE: Greenfield Press proof
  set must arrive Portland by EOB'', date 2026-05-12. Note that today is 2026-05-20
  — the deadline has already passed by 8 calendar days (6 business days).


  Step 2 — Read Gmail for shipping and penalty context. Call gmail_get_message(MSG-5151)
  to get FedEx rate quote: Priority Overnight $78.20 account rate, delivery 2026-05-21
  by 10:30 AM; 2-Day $36.50 account rate, delivery 2026-05-22 by 4:30 PM. Call gmail_get_message(MSG-5150)
  to confirm Clause 4b reimbursement cap of $45.00. Call gmail_get_message(MSG-5152)
  to confirm Section 7c late-delivery penalty of $150/business day past May 12 deadline.


  Step 3 — Compute net costs. Priority Overnight: $78.20 gross - $45.00 reimbursement
  cap = $33.20 net out-of-pocket. 2-Day: $36.50 gross - $36.50 (fully within $45 cap)
  = $0.00 net out-of-pocket. Net cost premium for Priority Overnight = $33.20.


  Step 4 — Compute penalty delta. Delivery on 2026-05-21 (Priority Overnight) vs 2026-05-22
  (2-Day) = one additional business day of Section 7c penalty = $150. Net benefit
  of Priority Overnight over 2-Day = $150 penalty avoided - $33.20 extra cost = +$116.80
  in favor of Priority Overnight.


  Step 5 — Check cash position via finance_list_transactions or finance_get_transaction(TXN-6080,
  TXN-6083). Confirm liquid balance ~$6,200 after tax reserve; $33.20 net cost is
  not a liquidity constraint.


  Step 6 — Check calendar for May 21 buffer value. Call calendar_list_events for 2026-05-21
  to assess what the extra day is worth. Admin invoice follow-up block and Harbor
  Press kickoff call are present but do not change the penalty math.


  Step 7 — Confirm FedEx drop-off window. EVT-411 shows FedEx drop-off by 3 PM today
  (2026-05-20). Priority Overnight ship date is 2026-05-20, consistent with the quote
  (FQ-20260519-8847, valid 24 hours from 2026-05-19).


  Step 8 — Decision: Recommend FedEx Priority Overnight. Rationale: penalty avoidance
  ($150) > net cost premium ($33.20); net benefit = $116.80; cash position is not
  stressed; 10:30 AM Thursday delivery stops penalty clock one business day earlier
  than 2-Day.


  Step 9 — Log decision. Call notes_get(NOTE-186) to check if a rationale note already
  exists, or create a new note documenting the decision. Call sheet_open(WB-18) and
  sheet_set_cell or sheet_insert_row on ''Clause 4b Reimbursement Log'' to record
  the $45.00 reimbursement claim against TXN-6080.


  Step 10 — Update todos. Call todo_update_task(TODO-658, status: in_progress) to
  reflect that the shipping decision is made and drop-off is imminent. Call todo_list_tasks
  to confirm TODO-659 (send tracking number to Dana) is queued for after drop-off
  — do NOT send the email yet as no tracking number exists.'
