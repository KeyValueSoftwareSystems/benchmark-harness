      - 85 percent utilization
      - utilization threshold
      - utilization ceiling
    - - capacity cap
      - capacity limit
      - pool capacity
      - hard capacity constraint
    - - SLA
      - latency requirement
      - contractual requirement
      - geographic constraint
- name: Volume discount optimization
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - volume discount
      - discount tier
      - discount threshold
      - pricing tier
    - - US-West
      - US-East
      - EU-Central
    - - total cost
      - infrastructure cost
      - minimize cost
      - cost optimization
- name: Allocation decision documented with rationale
