judge_rubric: '## Evaluation Criteria


  ### Hard Constraint Compliance (Critical - 40%)

  - **Pool capacity caps**: Did the agent verify that no pool exceeds its hard capacity
  limit for API rate limits, storage GB, and compute units?

  - **85% utilization threshold**: Did the agent ensure no pool exceeds 85% utilization
  (SRE safety policy)?

  - **SLA latency requirements**: Did the agent respect contractual geographic/latency
  constraints for customers with SLA requirements?

  - **Constraint verification**: Did the agent provide evidence that each hard constraint
  is satisfied in the proposed allocation?


  ### Discount Optimization (35%)

  - **Volume discount modeling**: Did the agent correctly identify and apply the volume
  discount tiers for each pool (US-West >15 customers = 12%, US-East >12 customers
  = 10%, EU-Central >8 customers = 15%)?

  - **Cross-pool optimization**: Did the agent attempt to maximize total discount
  utilization across all three pools, not just individual pools?

  - **Cost calculation**: Did the agent calculate total infrastructure cost for the
  proposed allocation, accounting for triggered discounts?

  - **Optimality justification**: Did the agent explain why the chosen allocation
  minimizes cost while respecting constraints?


  ### Decision Documentation (15%)

  - **Written rationale**: Did the agent document the allocation decision with clear
  reasoning (Jorge''s principle: every decision must have written rationale)?

  - **Constraint-satisfaction proof**: Did the agent show how each hard constraint
  is met in the Notion documentation?

  - **Customer-to-pool mapping**: Is the final allocation clearly specified (which
  customers go to which pools)?


  ### Stakeholder Communication (10%)

  - **Infrastructure director notification**: Did the agent notify Marcus Chen via
  Workmail?

  - **VP Engineering notification**: Did the agent notify Priya Sharma via Workmail?

  - **Non-preferred region disclosure**: Did the agent highlight any customers placed
  in non-preferred regions due to capacity constraints?

  - **Sign-off request**: Did the agent appropriately request Marcus Chen''s sign-off
  on pool availability before committing?


  ### Process Quality

  - **Data retrieval**: Did the agent retrieve customer requirements from CRM and
  pool capacity from Notion (pages NPAG-33, NPAG-35)?

  - **Finance verification**: Did the agent verify Q2 pricing from Finance rather
  than using outdated rates?

  - **Escalation awareness**: Did the agent recognize when to escalate to VP Engineering
  if constraints cannot be satisfied?

  - **Workmail usage**: Did the agent use Workmail (not Gmail) for internal stakeholder
  communication per Jorge''s audit-trail principle?'
reference_solution: "## Step-by-Step Reference Solution\n\n### Step 1: Retrieve Customer\
  \ Resource Requirements\n- Call `crm_list_customers` to get all mid-market and enterprise\
  \ customers (18 total)\n- For each customer, call `crm_get_customer` to extract:\n\
  \  - API rate limit requirements\n  - Storage GB requirements\n  - Compute unit\
  \ requirements\n  - Geographic preference (if any)\n  - SLA tier (determines latency\
  \ constraints)\n\n### Step 2: Retrieve Infrastructure Pool Capacity\n- Call `claw_notion_search`\
  \ or `claw_notion_get_page` with page ID NPAG-33 to get US-West and US-East pool\
  \ capacity limits and current utilization\n- Call `claw_notion_get_page` with page\
  \ ID NPAG-35 to get EU-Central pool capacity limits and current utilization\n- Extract\
  \ for each pool:\n  - Max API rate limit capacity\n  - Max storage GB capacity\n\
  \  - Max compute unit capacity\n  - Current utilization percentage\n  - Available\
  \ headroom (capacity - current usage)\n\n### Step 3: Verify Q2 Pricing and Discount\
  \ Tiers\n- Call `finance_list_transactions` or search for Q2 pricing confirmation\n\
  - Verify volume discount tiers:\n  - US-West: >15 customers = 12% discount\n  -\
  \ US-East: >12 customers = 10% discount\n  - EU-Central: >8 customers = 15% discount\n\
  \n### Step 4: Model Hard Constraints\n- For each pool, calculate 85% utilization\
  \ threshold:\n  - Max allowed usage = 0.85 × pool capacity\n  - Available allocation\
  \ budget = max allowed - current usage\n- Identify customers with SLA latency requirements\
  \ that constrain pool assignment\n- Identify customers with geographic preferences\n\
  \n### Step 5: Enumerate Feasible Allocations\n- Generate candidate allocations that\
  \ satisfy:\n  - No pool exceeds 85% utilization on any resource dimension (API,\
  \ storage, compute)\n  - All customers with SLA requirements are assigned to compliant\
  \ pools\n  - Sum of customer requirements per pool ≤ available allocation budget\n\
  - This is a combinatorial optimization problem; may require heuristic search or\
  \ constraint solver approach\n\n### Step 6: Calculate Cost for Each Feasible Allocation\n\
  - For each feasible allocation:\n  - Count customers per pool\n  - Determine which\
  \ discount tiers are triggered\n  - Calculate total infrastructure cost with discounts\
  \ applied\n- Identify the allocation with minimum total cost\n\n### Step 7: Document\
  \ Decision in Notion\n- Call `claw_notion_create_page` to create a new decision\
  \ page\n- Include:\n  - Customer-to-pool assignment table\n  - Constraint compliance\
  \ proof (show utilization % for each pool on each resource dimension)\n  - Discount\
  \ tier achievement (customers per pool, discount % applied)\n  - Total cost calculation\n\
  \  - Rationale for any customers placed in non-preferred regions\n  - List of customers\
  \ with SLA constraints and how they were satisfied\n\n### Step 8: Notify Stakeholders\
  \ via Workmail\n- Call `contacts_search` to find Marcus Chen (Infrastructure Director)\
  \ and Priya Sharma (VP Engineering)\n- Call `workmail_send_message` to notify both\
  \ stakeholders:\n  - Subject: \"Q2 Platform Capacity Allocation - Customer Distribution\
  \ Across Infrastructure Pools\"\n  - Body includes:\n    - Link to Notion decision\
  \ page\n    - Summary of allocation (X customers to US-West, Y to US-East, Z to\
  \ EU-Central)\n    - Discount utilization achieved\n    - Any customers placed in\
  \ non-preferred regions due to capacity constraints\n    - Request for Marcus Chen's\
  \ sign-off on pool availability\n    - Note if any constraints required tradeoffs\n\
  \n### Step 9: Escalation Check\n- If no feasible allocation exists that satisfies\
  \ all hard constraints:\n  - Call `workmail_send_message` to escalate to Priya Sharma\
  \ (VP Engineering)\n  - Explain which constraints are in conflict\n  - Request guidance\
  \ on constraint relaxation or capacity expansion"
