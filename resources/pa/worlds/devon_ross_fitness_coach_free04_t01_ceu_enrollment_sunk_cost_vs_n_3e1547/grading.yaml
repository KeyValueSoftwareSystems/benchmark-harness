judge_rubric: 'Evaluate the agent''s response on the following dimensions:


  1. SUNK COST TRANSPARENCY (critical): Before recommending any course abandonment,
  the agent must explicitly state the non-refundable dollar amount already paid for
  that course. Devon should never be surprised by what he loses after acting. Deduct
  heavily if any abandonment recommendation omits the sunk cost figure.


  2. ALTERNATIVE PROVIDER VERIFICATION: The agent must not recommend switching to
  a competing provider unless it has verified (or explicitly flagged as unverified)
  that provider''s NSCA CEU recognition status. Recommending an unrecognized course
  wastes both money and time. Flag if the agent recommends a switch without this check.


  3. CEU CAP COMPLIANCE: The agent must identify Devon''s current confirmed CEU hours,
  calculate remaining headroom to the NSCA recertification cap, and flag any scenario
  where completing all enrolled courses would overshoot the cap. Excess hours have
  zero value. A response that ignores the cap constraint scores poorly on this dimension.


  4. PENDING DECISION FLAG HANDLING: Any finance record marked ''PENDING DECISION''
  must not be counted as committed sunk cost. The agent should treat these as uncommitted
  and flag them separately.


  5. HARD DEADLINE RISK CALLOUT: The recertification deadline of June 1, 2026 (EVT-317)
  is a hard external constraint. Any recommendation that could risk missing this deadline
  must include an explicit risk callout. Responses that treat this deadline casually
  or omit it score poorly.


  6. DECISION TABLE COMPLETENESS: The per-course table should include: course name,
  sunk cost, pending payment, total effective cost, CEU hours, net cost per CEU hour,
  alternative option with its cost and CEU rate (if any), recommended action (pay
  / abandon / defer / request adjustment), and rationale. Partial tables lose proportional
  credit.


  7. PRIORITIZED ACTION LIST: The final output must include a prioritized action list
  with deadline timestamps drawn from calendar events (EVT-317, EVT-330, EVT-351)
  and reflect updates to relevant todo items (TODO-565, TODO-589, TODO-566).


  8. OBSIDIAN + NOTION UPDATES: The agent should log the final decision rationale
  in a new Obsidian decision note and update the Notion CEU tracker to reflect committed
  vs. declined courses. Omitting these updates is a workflow incompleteness penalty.


  9. TONE AND FRAMING: Consistent with Devon''s coaching philosophy — recommendations
  should be direct, specific, and non-shaming. The agent should frame sunk costs as
  past decisions, not failures, and focus on the best forward path.


  Overall: An excellent response completes the full workflow end-to-end, surfaces
  all constraints proactively, and produces a clean artifact Devon can act on immediately
  without needing to re-investigate anything.'
reference_solution: "Step-by-step reference solution:\n\n1. PULL FINANCE RECORDS\n\
  \   - Call finance_list_transactions to retrieve all CEU-related transactions.\n\
  \   - Call finance_get_transaction for each relevant record to extract: amount paid\
  \ (sunk), pending balance or add-on due, total CEU hours awarded, payment deadline,\
  \ and status (especially any 'PENDING DECISION' flags).\n   - Separate confirmed\
  \ sunk costs from PENDING DECISION records — do not count PENDING DECISION amounts\
  \ as committed spend.\n\n2. READ NOTION CEU TRACKER\n   - Call claw_notion_get_page\
  \ for NPAG-24 and NPAG-31 to retrieve: current confirmed CEU hours, NSCA recertification\
  \ cap, remaining headroom, and recertification deadline.\n   - Note the hard deadline:\
  \ June 1, 2026 (cross-referenced with EVT-317).\n\n3. READ OBSIDIAN DECISION LOGS\n\
  \   - Call claw_obsidian_get_note for OBSN-10, OBSN-16, OBSN-17, OBSN-23, OBSN-24\
  \ to gather prior decision context, any notes on provider quality, scheduling conflicts,\
  \ and client-relevance flags (e.g., renal/special-populations context).\n\n4. PULL\
  \ CALENDAR EVENTS\n   - Call calendar_get_event for EVT-317 (recertification deadline,\
  \ 2026-06-01), EVT-330, and EVT-351 to extract payment deadline timestamps and any\
  \ scheduling conflicts with Mon–Thu in-person blocks.\n\n5. CALCULATE PER-COURSE\
  \ METRICS\n   For each enrolled or pending course:\n   a. Net cost per CEU hour\
  \ = total effective cost (sunk + pending) / CEU hours awarded.\n   b. Net loss of\
  \ abandoning = sunk fee already paid (non-refundable).\n   c. Net savings of switching\
  \ = (total effective cost of current course) − (total cost of alternative provider\
  \ for equivalent CEUs), minus the sunk cost already forfeited.\n   d. Verify NSCA\
  \ recognition status of any alternative provider before including it as a viable\
  \ switch option.\n   e. Check whether completing the course would push total confirmed\
  \ + pending CEU hours above the recertification cap — if so, flag as wasteful regardless\
  \ of price.\n   f. Apply non-price criteria: NSCA CEU category (A vs. B), scheduling\
  \ conflict with Mon–Thu blocks, course access window vs. June 1 deadline, client-caseload\
  \ relevance.\n   g. Check for price-protection or deferral options before recommending\
  \ abandonment.\n\n6. BUILD PER-COURSE DECISION TABLE\n   Columns: Course Name |\
  \ Sunk Cost | Pending Payment | Total Effective Cost | CEU Hours | Net Cost/CEU\
  \ Hour | Alternative Option (Provider, Cost, CEU Rate) | Recommended Action | Rationale.\n\
  \   Recommended actions: Pay / Abandon / Defer / Request Adjustment.\n   For any\
  \ Abandon recommendation: explicitly state the non-refundable dollar amount lost\
  \ upfront in the rationale.\n\n7. PRODUCE PRIORITIZED ACTION LIST\n   - Order actions\
  \ by deadline urgency using timestamps from EVT-317 (2026-06-01), EVT-330, and EVT-351.\n\
  \   - Call todo_update_task for TODO-565, TODO-589, and TODO-566 to reflect the\
  \ decisions made (pay, abandon, defer).\n\n8. LOG DECISION IN OBSIDIAN\n   - Call\
  \ claw_obsidian_create_note to create a new decision note summarizing the final\
  \ per-course decisions, rationale, sunk costs accepted, and alternatives chosen\
  \ or declined.\n\n9. UPDATE NOTION CEU TRACKER\n   - Call claw_notion_update_page_properties\
  \ or claw_notion_append_blocks on NPAG-24 or NPAG-31 to update committed vs. declined\
  \ courses and revised confirmed CEU hour totals.\n\n10. RISK CALLOUT\n    - If any\
  \ recommended action (e.g., deferring a payment) risks missing the June 1, 2026\
  \ recertification deadline (EVT-317), include an explicit risk callout in the action\
  \ list."
