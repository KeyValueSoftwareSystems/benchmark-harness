judge_rubric: '# Evaluation Rubric for Email Triage Task


  ## Excellent (0.9-1.0)

  - Correctly identifies BOTH critical deadlines: equipment delivery (April 4, 11
  AM) and medical clearance (April 5, 5 PM)

  - Recognizes medical clearance as the highest priority due to camp participation
  denial consequence

  - Accurately lists missing medical items: physical exam, updated cardiovascular
  test, signed release form

  - Provides clear urgency classification: critical (equipment + medical), important
  (coach acknowledgment), routine (family), promotional (ignore)

  - Drafts appropriate responses for equipment (with camp facility address) and coach
  (brief acknowledgment)

  - Notes the existing cardiovascular test appointment on April 4 (EVT-426) and its
  relevance to medical deadline

  - Preserves family relationship quality by suggesting warm deferral language rather
  than ignoring

  - Demonstrates understanding that medical clearance gates all other priorities


  ## Good (0.7-0.89)

  - Identifies both critical deadlines with correct dates

  - Recognizes medical clearance severity but may miss one specific missing item

  - Provides reasonable urgency classification with minor gaps

  - Drafts responses for equipment and coach with appropriate tone

  - May not fully connect the April 4 medical appointment to the clearance deadline

  - Addresses family communication appropriately


  ## Adequate (0.5-0.69)

  - Identifies at least one critical deadline (equipment OR medical)

  - Attempts urgency classification but with significant gaps or errors

  - Drafts at least one response (equipment or coach)

  - May miss the connection between medical clearance failure and camp denial

  - May not fully address all communication categories


  ## Poor (0.3-0.49)

  - Identifies emails but fails to correctly prioritize by deadline urgency

  - Does not recognize medical clearance as participation-blocking

  - Provides vague or generic triage without specific action items

  - May draft responses but without addressing key requirements (delivery address,
  acknowledgment)


  ## Failing (0.0-0.29)

  - Fails to identify critical deadlines or their consequences

  - Does not distinguish between urgent and routine communications

  - Does not draft any responses or provides inappropriate responses

  - Misses the core task of information triage and prioritization'
reference_solution: "# Reference Solution\n\n## Step 1: Retrieve Unread Emails\n**Action**:\
  \ `gmail_list_messages` with filter for unread messages\n**Expected**: Returns at\
  \ least MSG-5099 (equipment delivery), MSG-5100 (medical clearance), MSG-5101 (coach\
  \ briefing)\n\n## Step 2: Read Critical Email Details\n**Action**: `gmail_get_message`\
  \ for MSG-5099, MSG-5100, MSG-5101\n**Key findings**:\n- MSG-5099: Custom racing\
  \ shoes ready, need delivery address by April 4, 11 AM\n- MSG-5100: MANDATORY medical\
  \ clearance due April 5, 5 PM; missing physical exam, expired cardiovascular test\
  \ (Feb 28), unsigned release form; failure = camp denial\n- MSG-5101: Coach tactical\
  \ briefing, requests brief acknowledgment\n\n## Step 3: Cross-Reference Calendar\n\
  **Action**: `calendar_list_events` or `calendar_get_user_events` for April 4-7\n\
  **Key findings**:\n- EVT-426: Cardiovascular stress test scheduled April 4, 10:00-11:30\
  \ AM (addresses one medical requirement)\n- EVT-427: Pre-Olympic Assessment Camp\
  \ April 7-14 at National Training Center - Facility B\n\n## Step 4: Review Existing\
  \ Notes (Optional)\n**Action**: `notes_list` and `notes_get` for NOTE-160, NOTE-161\n\
  **Key findings**: User has already created triage strategy and medical action plan,\
  \ confirming urgency assessment\n\n## Step 5: Urgency Classification\n**CRITICAL\
  \ (Immediate Action Required)**:\n1. Medical clearance (MSG-5100) - Deadline April\
  \ 5, 5 PM; consequence: camp participation denial\n   - Missing: physical exam,\
  \ updated cardiovascular test, signed release form\n   - Action: Leverage existing\
  \ April 4 appointment (EVT-426), schedule physical exam same day, sign release form\n\
  2. Equipment delivery (MSG-5099) - Deadline April 4, 11 AM; consequence: no proper\
  \ footwear for assessments\n   - Action: Draft response with camp facility address\
  \ (National Training Center - Facility B)\n\n**IMPORTANT (Response within 48 hours)**:\n\
  3. Coach briefing (MSG-5101) - Brief acknowledgment requested\n   - Action: Draft\
  \ 2-3 sentence response confirming receipt and readiness\n\n**ROUTINE/PROMOTIONAL**:\
  \ Any family messages or promotional offers can be deferred until after camp (April\
  \ 14+)\n\n## Step 6: Draft Responses\n**Equipment Response** (MSG-5099 to Li Ming):\n\
  - Confirm receipt of delivery notification\n- Provide camp facility address: National\
  \ Training Center - Facility B, [complete address]\n- Request delivery directly\
  \ to camp facility before April 7\n- Confirm custom orthotic specifications\n\n\
  **Coach Acknowledgment** (MSG-5101 to Coach Liu):\n- Brief confirmation of receipt\
  \ (2-3 sentences)\n- Acknowledge tactical priorities reviewed\n- Confirm readiness\
  \ for camp assessments\n- Professional but energy-preserving tone\n\n**Action**:\
  \ `gmail_save_draft` for both responses (do NOT send without user review)\n\n##\
  \ Step 7: Summary Output\n**Deliver to user**:\n1. Urgency classification with clear\
  \ priority ranking\n2. Critical deadlines: April 4 (equipment), April 5 (medical)\n\
  3. Medical clearance action plan leveraging existing April 4 appointment\n4. Draft\
  \ responses for equipment and coach (saved as drafts, not sent)\n5. Recommendation\
  \ to defer non-essential communications until after April 14\n6. Note that medical\
  \ clearance is the gatekeeper to camp participation"
