      - Liu Wei
    - - April 4
      - Apr 4
      - 4th
    - - April 8
      - Apr 8
      - 8th
    - - email
      - WeChat
      - asymmetry
      - discrepancy
      - different deadline
      - informal
      - private message
    - - European buyer
      - competing client
      - 50% deposit
      - higher deposit
- name: Correctly prioritized Yongxin as highest urgency with hard April 5 constraint
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Yongxin
      - Chen Xiaoming
    - - April 5
      - Apr 5
      - 5th
    - - hard deadline
      - no flexibility
      - backup client
      - slot already allocated
      - zero flexibility
