task_id: T21_T03_polaris_v1_ga_launch_window_selection_mu
task_name: Polaris v1 GA Launch Window Selection - Multi-Constraint Optimization
category: scheduling
difficulty: simple
prompt:
  text: We need to lock down the Polaris v1 GA launch window by end of day. Engineering
    sent over three options with different tradeoff profiles. Can you run the constraint
    analysis and tell me which window we should commit to?
  language: en
execution_date: '2026-04-07'
tools:
- name: calendar_list_events
  description: List calendar events starting from a given date. Returns full event
    details. Use days parameter to extend the search window.
- name: calendar_get_event
  description: Get a single event by event_id
- name: calendar_get_user_events
  description: Get events for a specific user on a specific date (single day only)
- name: calendar_create_event
  description: Create a new calendar event
- name: calendar_delete_event
  description: Delete a calendar event by event_id
- name: todo_list_tasks
  description: List TODO tasks. Returns full task details. Default returns all tasks.
    Use status filter to narrow results.
- name: todo_create_task
  description: Create a new TODO task
- name: todo_update_task
  description: Update an existing TODO task. Only provided fields will be changed.
- name: todo_delete_task
  description: Delete a TODO task by task_id
- name: contacts_search
  description: Search contacts by name. Optionally filter by department.
- name: contacts_get
  description: Get full contact details by contact_id
- name: contacts_send_message
  description: Send a direct message to a contact
- name: finance_list_transactions
  description: List financial transactions. Returns all transactions by default. Use
    start_date and end_date to filter by date range.
- name: finance_get_transaction
  description: Get full transaction details by transaction_id
- name: finance_report_submit
  description: Submit a finance report with transaction references
- name: notes_list
  description: List notes (title/id only, no content). Default max 10 results. Response
    includes 'total' (all matching) and 'returned' (this page) counts. Use query to
    search (matches if ALL words appear in title or participants). Use offset for
    pagination. If query returns 0, retry without query to browse all notes.
- name: notes_get
  description: Get full note content by note_id
- name: crm_list_customers
  description: List CRM customers (summary only, no detailed notes/contracts). Filter
    by status, tier, or industry.
- name: crm_get_customer
  description: Get full customer details including notes and contracts by customer_id
- name: workmail_list_messages
  description: 'List company-internal mail inbox. Returns subject/from/date (no body).
    Default: last 7 days, max 20 results. Response includes ''total'' (all matching)
    and ''returned'' (this page) counts. Use query to search (matches if ALL words
    appear in subject or sender). Use offset for pagination. If query returns 0, retry
    without query to browse all messages.'
- name: workmail_get_message
  description: Get full company-internal message details including body by message_id
- name: workmail_send_message
  description: Send a company-internal email to the specified recipient (use only
    for colleague-facing communication)
- name: workmail_save_draft
  description: Save a company-internal email as draft (not sent). Use reply_to_message_id
    to mark it as a reply.
- name: claw_notion_list_pages
  description: List claw_notion pages (summary only, no blocks). Optionally filter
    by parent_page_id or database_id. By default archived pages are excluded.
- name: claw_notion_get_page
  description: Get full page details (title + properties + blocks) by page_id
- name: claw_notion_create_page
  description: Create a new claw_notion page. Optionally nest under a parent page,
    attach to a database, set initial properties and blocks.
- name: claw_notion_update_page_properties
  description: Update a page's structured properties (merge into existing). Does not
    touch blocks.
- name: claw_notion_append_blocks
  description: Append blocks to the end of a page's block list. Each block is {type,
    text}.
- name: claw_notion_archive_page
  description: Archive a page (soft delete; page remains retrievable by id but excluded
    from default list/search).
- name: claw_notion_search
  description: Full-text search pages by query (matches if ALL words appear in title/properties/blocks).
    Archived pages are excluded.
- name: claw_notion_query_database
  description: Query pages in a database by equality filter on properties. Archived
    pages are excluded.
- name: meeting_list
  description: List meetings. Filter by status (scheduled/started/ended/cancelled/all),
    host, or date range. Returns summary (no participants/recordings).
- name: meeting_get
  description: Get full meeting details (participants + recordings) by meeting_id
- name: meeting_create
  description: Schedule a new meeting. status starts as 'scheduled'. passcode/join_url
    are auto-generated if omitted.
- name: meeting_update
  description: Update topic/start_time/duration of a scheduled or started meeting.
    Only provided fields change. Terminal states (ended/cancelled) reject updates.
- name: meeting_cancel
  description: Cancel a scheduled/started meeting (status=cancelled, irreversible).
    Rejects meetings already in a terminal state.
- name: meeting_start
  description: Start a scheduled meeting (status scheduled -> started). Only valid
    from 'scheduled'.
- name: meeting_end
  description: End a meeting. If it was started, status -> ended and a recording is
    auto-appended. If it was still scheduled (never started), this is treated as a
    soft-cancel (status -> cancelled, NO recording).
- name: meeting_add_participant
  description: 'Register a participant on a meeting with an initial RSVP status of
    ''invited''. role defaults to ''attendee'' (other values: ''host'', ''panelist'').'
- name: meeting_remove_participant
  description: Remove a participant from a meeting by email.
- name: meeting_list_recordings
  description: List recordings across meetings. Filter by meeting_id, host, or recording
    date range. Each entry also carries topic/host of its parent meeting.
