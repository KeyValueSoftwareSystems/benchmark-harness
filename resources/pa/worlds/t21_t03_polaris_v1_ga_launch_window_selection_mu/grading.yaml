judge_rubric: 'The response must demonstrate constraint-based decision making aligned
  with Jorge''s principle that ''every product decision must have a written rationale.''
  Award full marks if the agent: (1) retrieves and applies hard floor constraints
  from the platform launch policy (NPAG-40) — minimum 16-hour rollback buffer, 14-day
  customer notice, 18-hour SRE coverage, and 48-hour CDN activation; (2) systematically
  evaluates all three windows against these constraints and correctly identifies that
  Window A fails on rollback buffer (10 < 16) and customer notice (12 < 14), Window
  B fails on CDN availability (weekend blackout causes 60+ hour delay > 48-hour policy),
  and only Window C satisfies all constraints; (3) documents the tradeoff rationale
  using the platform team priority weights (reliability > customer experience > engineering
  convenience) and explains why the 7-day delay is acceptable given constraint compliance;
  (4) communicates the final Window C decision to engineering and customer success
  stakeholders with explicit constraint-satisfaction proof. Deduct heavily if the
  agent selects a non-compliant window, fails to reference the written policy constraints,
  or makes the decision without documented rationale. Deduct moderately if the agent
  performs correct constraint filtering but does not explain the priority-weight ranking
  or communicate the decision to stakeholders. Award bonus credit if the agent proactively
  documents the decision in Notion with a structured constraint analysis matrix.'
reference_solution: 'Step 1: Read Priya''s email (WMSG-5066) containing the three
  proposed launch windows with quantitative constraint data across dimensions: SRE
  coverage, CDN availability, customer notice lead time, rollback buffer, and weekend
  engineering availability.


  Step 2: Read Marcus''s follow-up email (WMSG-5067) clarifying that Window B''s CDN
  issue means a 60+ hour delay (Friday EOD through Monday morning) before CDN activation,
  causing 36 hours of elevated customer latency.


  Step 3: Read Sarah''s email (WMSG-5068) from Customer Success noting that Window
  A''s 12-day notice falls short of the 14-day internal policy requirement.


  Step 4: Retrieve the platform launch policy (NPAG-40) from Notion to extract hard
  floor constraints: minimum 16-hour rollback buffer, minimum 14-day customer notice,
  minimum 18-hour SRE coverage, and CDN must be active within 48 hours of GA launch.


  Step 5: Build constraint violation matrix:

  - Window A (Apr 16, 22:00 PT): FAILS rollback buffer (10 < 16 hours), FAILS customer
  notice (12 < 14 days) → ELIMINATED

  - Window B (Apr 19, 14:00 PT): FAILS CDN requirement (60+ hour delay > 48-hour policy)
  → ELIMINATED

  - Window C (Apr 23, 06:00 PT): PASSES all constraints (18-hour rollback buffer ≥
  16, 19-day notice ≥ 14, 20-hour SRE coverage ≥ 18, CDN available immediately) →
  COMPLIANT


  Step 6: Since only Window C satisfies hard floor constraints, it is the only viable
  option without VP exception approval. No Pareto analysis needed when only one candidate
  remains after constraint filtering.


  Step 7: Document tradeoff rationale: Window C delays GA by 7 days vs Window A, but
  Window A was non-compliant. Window C is a weekday launch (higher production traffic
  risk) vs Window B''s weekend slot, but Window B violated CDN policy. Window C optimizes
  for reliability (priority 1) with adequate 18-hour rollback buffer and 20-hour SRE
  coverage, and customer experience (priority 2) with 19-day notice period.


  Step 8: Update the Polaris launch decision page (NPAG-41) in Notion with the final
  Window C selection and constraint-satisfaction proof.


  Step 9: Send Workmail to Priya Sharma (VP Engineering), Marcus Chen (SRE Lead),
  and Sarah Kim (VP Customer Success) notifying them of the Window C decision (Wednesday
  April 23, 06:00 PT), including the constraint analysis showing why Windows A and
  B were eliminated, and requesting confirmation of infrastructure reservation and
  customer communication plan by Monday EOD.'
