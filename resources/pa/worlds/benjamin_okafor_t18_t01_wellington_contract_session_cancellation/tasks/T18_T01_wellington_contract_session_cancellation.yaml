task_name: Wellington Contract Session Cancellation After NHS Emergency Activation
category: decision_making
difficulty: simple
prompt:
  text: I just got an NHS trauma activation for tomorrow afternoon (April 3rd) but
    I already have a Wellington session booked. Help me figure out what to do.
  language: en
