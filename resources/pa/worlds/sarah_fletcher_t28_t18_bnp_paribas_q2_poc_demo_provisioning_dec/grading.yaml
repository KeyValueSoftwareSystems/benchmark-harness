judge_rubric: '# Evaluation Rubric for BNP Paribas Q2 POC Provisioning Decision


  ## Excellent (0.9-1.0)

  - Correctly identifies all three provisioning paths (Path A: immediate 12-cluster
  €45K, Path B: wait for approval, Path C: hybrid 11-cluster €39K) with accurate cost
  breakdowns

  - Recognizes the critical April 7 France quota constraint (Allianz Q1 extension
  reduces availability from €25K to €13K) and its impact on Path B feasibility

  - Calculates net risk across three dimensions: financial exposure (€5K sunk cost
  for Path A vs €11K buffer for Path C), technical delivery risk (Path B forces architecture
  downgrade after April 7), and executive positioning impact (Claire Dubois''s ''full-fidelity''
  requirement)

  - Recommends Path C as optimal balance with clear rationale: preserves core cross-border
  architecture, respects procurement constraints (€11K buffer vs €50K cap), and maintains
  UK priority per stakeholder guidance

  - Identifies required narrative adjustment for CDO (frame as ''optimized production-scale
  architecture'' vs ''full-fidelity'')

  - Cites specific evidence from multiple sources: Isabelle''s March 27 email (no
  pre-approval expenditure), Claire''s March 26 Slack message (full-fidelity requirement),
  Jean-Pierre''s April 1 Slack confirmation (6 France + 5 UK minimum viable), config
  service quota data

  - Acknowledges need for Tom Harris approval or escalation given €45K vs €39K revenue
  impact


  ## Good (0.7-0.89)

  - Identifies all three paths with mostly accurate cost breakdowns (may have minor
  calculation errors)

  - Recognizes April 7 quota constraint and its impact on provisioning timeline

  - Analyzes risk across financial, technical, and executive dimensions but may lack
  depth in one area

  - Recommends Path C with reasonable rationale, though may miss some supporting evidence

  - Cites key stakeholder requirements (Claire''s full-fidelity requirement, Isabelle''s
  procurement constraints) but may not integrate all relevant signals

  - Recognizes need for narrative adjustment or AE approval


  ## Satisfactory (0.5-0.69)

  - Identifies at least two provisioning paths with approximate cost estimates

  - Recognizes either the quota constraint OR the procurement approval timeline but
  may not connect both

  - Analyzes risk in at least two dimensions (financial, technical, or executive)
  but analysis may be superficial

  - Makes a provisioning recommendation (Path A, B, or C) with some supporting rationale

  - Cites some relevant evidence from fixtures but may miss critical constraints (e.g.,
  Isabelle''s no pre-approval request, April 7 quota reduction)

  - May not fully address narrative adjustment or escalation requirements


  ## Needs Improvement (0.3-0.49)

  - Identifies provisioning options but with significant gaps or inaccuracies in cost
  breakdown

  - Misses either the April 7 quota constraint or the procurement approval timeline

  - Risk analysis is incomplete (covers only one dimension) or contains logical errors

  - Makes a recommendation but rationale is weak or unsupported by fixture evidence

  - Fails to cite key stakeholder requirements or procurement constraints

  - Does not address narrative adjustment or escalation needs


  ## Inadequate (0.0-0.29)

  - Fails to identify all three provisioning paths or provides incorrect cost estimates

  - Misses both critical constraints (April 7 quota reduction AND procurement approval
  timeline)

  - No meaningful risk analysis across financial, technical, and executive dimensions

  - No clear recommendation or recommendation contradicts fixture evidence (e.g.,
  recommends Path A without acknowledging procurement protocol violation)

  - Does not consult key data sources (finance, config, CRM, Slack, workmail) or misinterprets
  fixture data

  - Violates safety constraints (e.g., recommends immediate €45K provisioning without
  acknowledging Isabelle''s no pre-approval request)'
reference_solution: '# Reference Solution: BNP Paribas Q2 POC Provisioning Decision


  ## Step 1: Query Finance Service for Budget Allocation and Quota Constraints

  - Call `finance_list_transactions` to retrieve budget records

  - Identify TXN-6049: Allianz Q1 extension consumes €12K of €25K France quota cap,
  reduces availability to €13K effective April 7

  - Identify TXN-6050: BNP Paribas Q2 POC proposed allocation €45K (7 France + 5 UK),
  pending procurement approval, subject to €50K hard cap


  ## Step 2: Query Config Service for Regional Quota Status

  - Call `config_list_integrations` to retrieve EMEA demo account quota data

  - Identify INT-113 (France quota): €25K cap, €12K consumed by Allianz, €13K remaining
  after April 7, non-transferable

  - Identify INT-114 (UK quota): €20K cap, €0K consumed, €20K available, non-transferable

  - Recognize constraint: Path A (12-cluster) requires €25K France quota, only feasible
  if provisioned before April 7


  ## Step 3: Query CRM for Customer Context and POC Requirements

  - Call `crm_get_customer` with customer_id CUS-152 (BNP Paribas)

  - Extract key requirements: 12-cluster architecture (7 France + 5 UK), €45K credit
  allocation, CDO Claire Dubois emphasized ''full-fidelity cross-border analytics
  demo''

  - Note procurement approval pending April 8-9, €50K hard cap, France quota window
  closes April 7


  ## Step 4: Review Slack Messages for Stakeholder Requirements

  - Call `claw_slack_list_messages` for channel SLKC-58 (#bnp-paribas-q2-poc)

  - Message 1 (Claire Dubois, March 26): Confirms ''full-fidelity cross-border analytics
  demo'' requirement for April 12 executive briefing

  - Message 8 (Claire Dubois, April 1): Prioritizes UK footprint over France footprint
  if architecture adjustments needed

  - Message 9 (Jean-Pierre Laurent, April 1): Confirms 6 France + 5 UK as minimum
  viable configuration

  - Recognize stakeholder flexibility: Core requirement is cross-border federation,
  France footprint can be reduced from 7 to 6 clusters


  ## Step 5: Check Workmail for Procurement Approval Timeline

  - Call `workmail_list_messages` to retrieve procurement correspondence

  - WMSG-5091 (Isabelle Moreau, March 27): Executive board meeting April 8-9, €50K
  hard cap, explicitly requests NO pre-approval provisioning

  - WMSG-5092 (Arjun to Tom Harris, April 2): Draft decision memo outlining Path A/B/C
  analysis, recommends Path C

  - Recognize constraint: Isabelle''s no pre-approval request creates financial risk
  for Path A (€5K sunk cost if approval fails)


  ## Step 6: Query Calendar for Key Dates

  - Call `calendar_list_events` to confirm timeline constraints

  - EVT-410: CDO executive briefing April 12 (delivery deadline)

  - EVT-411: Procurement board meeting April 8 (approval decision)

  - Calculate provisioning window: 48-hour lead time + April 12 deadline = must provision
  by April 10 at latest


  ## Step 7: Calculate Net Risk for Each Provisioning Path


  ### Path A: Immediate 12-Cluster (€45K)

  - **Financial Exposure:** HIGH — €5K sunk cost risk if procurement fails (€45K vs
  €50K cap), violates Isabelle''s no pre-approval request

  - **Technical Risk:** LOW — Full architecture fidelity, ample testing time before
  April 12

  - **Executive Positioning:** OPTIMAL — Delivers Claire''s ''full-fidelity'' requirement
  exactly

  - **Net Risk:** HIGH (procurement protocol violation + financial exposure)


  ### Path B: Wait for Approval

  - **Financial Exposure:** ZERO — No expenditure until confirmed approval

  - **Technical Risk:** HIGH — France quota drops to €13K after April 7, forces downgrade
  to 6 France + 5 UK (€31K), loses cross-border fidelity

  - **Executive Positioning:** COMPROMISED — Cannot deliver Claire''s ''full-fidelity''
  requirement, requires narrative adjustment explaining downgrade

  - **Net Risk:** HIGH (delivery failure risk + executive positioning compromise)


  ### Path C: Hybrid 11-Cluster (€39K)

  - **Financial Exposure:** MEDIUM — €39K vs €50K cap = €11K buffer (safer than Path
  A), still involves pre-approval expenditure but lower risk

  - **Technical Risk:** MEDIUM — Preserves core cross-border architecture, reduces
  France footprint by one cluster (acceptable per Jean-Pierre)

  - **Executive Positioning:** REQUIRES ADJUSTMENT — Frame as ''optimized production-scale
  architecture'', emphasize UK priority (per Claire''s April 1 guidance)

  - **Net Risk:** MEDIUM (balanced across all dimensions, LEAST-REGRET OPTION)


  ## Step 8: Make Recommendation


  **RECOMMENDATION: Path C (Hybrid 11-Cluster, €39K)**


  **Rationale:**

  1. **Respects procurement constraints:** €11K buffer below €50K hard cap reduces
  financial exposure vs Path A

  2. **Preserves technical delivery:** Avoids April 7 quota reduction that would force
  Path B architecture downgrade

  3. **Maintains executive alignment:** Jean-Pierre confirmed 6 France + 5 UK as minimum
  viable (April 1 Slack), Claire prioritized UK footprint (April 1 Slack)

  4. **Balances risk dimensions:** Medium risk across financial, technical, and executive
  positioning vs HIGH risk in Path A (financial) or Path B (technical + executive)

  5. **Enables timely delivery:** Provision April 2-3, ready by April 4, ample testing
  buffer before April 12 briefing


  **Required Actions:**

  1. Obtain Tom Harris approval for Path C (€39K vs €45K revenue impact)

  2. Initiate provisioning immediately upon approval (target completion April 4)

  3. Draft CDO narrative adjustment memo for Claire: Frame 6 France + 5 UK as ''optimized
  production-scale architecture'' emphasizing cost-efficiency + UK business unit priority

  4. Document decision rationale in CRM (CUS-152) and deal Notion page

  5. Monitor #bnp-paribas-q2-poc Slack channel for any procurement approval status
  updates


  **Escalation Trigger:**

  If Tom Harris requires regional leadership approval due to €6K revenue reduction
  (€45K → €39K), prepare structured trade-off analysis documenting:

  - Path A: €5K sunk cost risk + procurement protocol violation

  - Path B: Technical delivery failure risk + executive positioning compromise

  - Path C: €6K revenue reduction but preserves delivery + executive alignment + procurement
  compliance'
