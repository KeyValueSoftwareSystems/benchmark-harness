    type: keywords_present
    keywords:
    - - Gmail
      - email threads
      - email communications
    - - WeChat
      - WeChat messages
      - WeChat conversations
    - - finance
      - payment
      - transaction
      - ledger
    - - notes
      - meeting notes
      - synthesis notes
- name: Relationship health scores and metrics
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - relationship score
      - relationship capital
      - health score
      - composite score
    - - Meihao
      - Liu Wei
    - - Yongxin
      - Chen Xiaoming
    - - response time
      - responsiveness
      - communication pattern
    - - payment punctuality
      - on-time payment
      - 100%
