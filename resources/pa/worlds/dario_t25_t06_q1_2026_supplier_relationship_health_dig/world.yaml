  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - information asymmetry
      - email vs WeChat
      - dual-channel
      - discrepancy
      - hidden urgency
    - - April 5
      - April 3
      - deadline compression
      - earlier deadline
    - - cash flow
      - cash crisis
      - management override
      - European clients
