judge_rubric: 'Award full marks if the agent: (1) correctly calculates the bundle
  cost as $1,099 after 25% discount; (2) identifies available balances across all
  three payment channels (PayPal $200, checking $3,250, credit card with 5% cashback);
  (3) proposes allocating $749 to credit card to maximize cashback ($37.45), $200
  to PayPal, and $150 to checking; (4) confirms total reimbursement potential of $750
  ($400 UrbanNest + $350 BloomBox); (5) maps reimbursement timing showing UrbanNest
  payment arrives ~May 15 (net-45 from early April invoice) and BloomBox ~June 1-15
  (60 days from early April invoice); (6) explicitly verifies no cash flow gap before
  April 15 Adobe renewal since checking account has sufficient balance ($3,250 - $150
  = $3,100 remaining, well above $54.99 renewal); (7) notes invoices must be submitted
  within 30 days of purchase (before early May). Deduct points for: incorrect discount
  calculation, missing cashback optimization, failing to account for reimbursement
  timing delays, not verifying cash flow safety before Adobe renewal, or exceeding
  available balances in any channel. Partial credit for identifying most components
  but missing optimization details or timing analysis.'
reference_solution: '1. Call finance_list_transactions to retrieve account balances:
  PayPal business $200 (TXN-6085), checking $3,250 (TXN-6086), and identify Adobe
  CC renewal $54.99 due April 15 (TXN-6087)

  2. Call gmail_list_messages and gmail_get_message (MSG-5148) to confirm DesignSoftwareHub
  bundle pricing: $1,099 after 25% discount (regular $1,465), meets $800 threshold,
  accepts multiple payment methods

  3. Call crm_get_customer for UrbanNest (CUS-163) and BloomBox (CUS-164) to retrieve
  reimbursement policies: UrbanNest $400 max/quarter with net-45 payment (15th of
  month), BloomBox $350 max/phase with 60-day payment (1st/15th of month)

  4. Call gmail_get_message (MSG-5149, MSG-5150) to confirm 30-day invoice submission
  windows for both clients

  5. Calculate optimal allocation: maximize credit card usage for 5% cashback while
  respecting reimbursement limits. Allocate $749 to credit card (5% = $37.45 cashback),
  $200 to PayPal (full balance), $150 to checking. Total: $1,099

  6. Verify reimbursement timing: If purchased early April and invoiced immediately,
  UrbanNest pays ~May 15 (net-45), BloomBox pays ~June 1-15 (60 days). Both arrive
  after April 15 Adobe renewal

  7. Confirm cash flow safety: Checking account retains $3,100 after $150 allocation,
  sufficient for $54.99 Adobe renewal on April 15. No gap exists

  8. Document plan: $749 credit card (maximize $37.45 cashback, invoice UrbanNest
  $400 + BloomBox $349), $200 PayPal, $150 checking. Submit invoices by early May.
  Total savings: $366 discount + $37.45 cashback = $403.45. Out-of-pocket after reimbursements:
  $349'
primary_dimensions:
