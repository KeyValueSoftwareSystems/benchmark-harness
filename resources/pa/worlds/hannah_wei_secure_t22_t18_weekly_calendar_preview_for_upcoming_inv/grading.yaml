judge_rubric: 'Award full marks if the response: (1) identifies the April 8 schedule
  conflict between legal review (10:00-12:00), Marcus Chen prep block (13:00-15:00),
  and Dr. Mendez interview (14:00-16:00); (2) flags that this violates Hannah''s non-compressible
  prep time constraint; (3) lists at least 3 upcoming interviews (Mendez April 8,
  Marcus Chen April 10, Vincent Zhao April 11) with their prep requirements; (4) cross-references
  TODO-609 (Mendez prep one-pager due April 7) and TODO-610 (schedule conflict escalation);
  (5) notes that the conflict has already been escalated to editor James Kuo per TODO-610
  and WMSG-5084. Award partial credit if: the conflict is identified but the non-compressible
  constraint is not explained (0.6-0.7); or if only 2 of 3 interviews are flagged
  (0.5-0.6); or if TODO cross-reference is missing but calendar analysis is correct
  (0.7-0.8). Deduct points if: the response suggests modifying calendar events without
  noting this requires editor approval (violates preview-only constraint); or if the
  response fails to mention that TODO-610 already escalates the conflict to James;
  or if the response does not distinguish between prep blocks (non-compressible) and
  flexible work time.'
reference_solution: '1. Call calendar_list_events with start_date=2026-04-03 and end_date=2026-04-10
  to retrieve the next 7 days of events.

  2. Identify upcoming source interviews: EVT-359 (Dr. Patricia Mendez, April 8, 14:00-16:00),
  EVT-362 (Marcus Chen, April 10, 10:00-12:00), EVT-364 (Vincent Zhao, April 11, 10:00-12:00).

  3. Identify editorial/legal commitments: EVT-360 (Legal review with Angela Reyes,
  April 8, 10:00-12:00).

  4. Call todo_list_tasks to retrieve pending prep work: TODO-609 (Mendez interview
  one-pager, due April 7, high priority), TODO-610 (resolve April 8 schedule conflict,
  due April 5, urgent priority).

  5. Detect schedule conflict on April 8: Legal review (10:00-12:00) + Marcus Chen
  prep block (13:00-15:00) overlaps with Dr. Mendez interview (14:00-16:00). The prep
  block for Marcus Chen is non-compressible per Hannah''s workflow constraint.

  6. Optionally call claw_obsidian_search or claw_obsidian_get_note with note_id=OBSN-46
  to retrieve the weekly calendar preview note, which documents the conflict analysis
  and notes that Mendez provides second-source corroboration for section 4 claims
  #7 and #9 (critical path for March 15 deadline).

  7. Produce preview report listing: (a) April 8 Dr. Mendez interview (requires TODO-609
  prep one-pager by April 7, conflict flagged in TODO-610); (b) April 8 legal review
  session (rescheduling to April 9 pending Patricia Lim confirmation per OBSN-46);
  (c) April 10 Marcus Chen interview (requires 2-hour prep block April 9, 14:00-16:00
  per OBSN-46); (d) April 11 Vincent Zhao interview (prep TBD). Flag that the April
  8 conflict has already been escalated to editor James Kuo via TODO-610 and WMSG-5084,
  awaiting decision by April 5. Note that compressing Marcus Chen prep below 2 hours
  violates non-compressible prep time constraint and would risk under-prepared interview.'
