judge_rubric: >-
  # Evaluation Rubric for Mid-April 2026 Exam Week Coordination Plan


  ## Excellent (0.9-1.0)

  - **Conflict detection**: Clearly identifies the critical April 16, 2:00-4:00
  PM conflict between English exam proctoring (mandatory, cannot delegate) and
  daughters' Spring Arts Festival (mandatory family attendance)

  - **Dependency analysis**: Recognizes hard constraints (proctoring duties,
  family obligations) vs soft constraints (grading sessions that can be
  delegated/time-shifted)

  - **Resolution strategy**: Proposes duty swap with Zhang Hui as primary
  solution (fully available, prefers mornings), with Chen Jing as backup option
  (requires reciprocal coverage April 22)

  - **Phased coordination**: Presents clear stages with deadlines (Stage 1:
  request swap by April 5; Stage 2: finalize coverage by April 8; Stage 3:
  schedule grading; Stage 4: communicate to all parties)

  - **Contingency planning**: Includes fallback options if duty swap denied
  (family backup: husband or grandparents attend daughters' event)

  - **Colleague constraints**: Accurately reflects Zhou Ming unavailable April
  16-18, Chen Jing requires reciprocal coverage, Zhang Hui fully available

  - **Respects safety constraints**: Does not delegate mandatory homeroom
  proctoring duties, does not skip daughters' event without backup confirmation


  ## Good (0.7-0.89)

  - Identifies the April 16 conflict and proposes duty swap solution

  - Recognizes Zhang Hui as best swap candidate

  - Includes basic phased approach with key deadlines

  - May miss some contingency details or colleague constraint nuances

  - Generally respects hard constraints but may not fully articulate dependency
  structure


  ## Adequate (0.5-0.69)

  - Detects the April 16 conflict

  - Proposes some form of duty swap but may not identify optimal colleague

  - Provides coordination steps but lacks clear phasing or deadlines

  - Missing contingency planning or backup options

  - May overlook some colleague availability constraints


  ## Poor (0.3-0.49)

  - Recognizes there is a scheduling problem but does not clearly identify the
  specific April 16 conflict

  - Proposes vague solutions without specific colleague names or swap logistics

  - No clear coordination timeline or phasing

  - Does not address hard vs soft constraints


  ## Failing (0.0-0.29)

  - Fails to identify the critical April 16 conflict

  - Proposes solutions that violate hard constraints (e.g., suggests delegating
  mandatory proctoring, skipping daughters' event)

  - No actionable coordination plan

  - Misunderstands the dependency structure or colleague availability
reference_solution: >-
  # Reference Solution: Mid-April 2026 Exam Week Coordination Plan


  ## Step 1: Retrieve and analyze exam coordination details

  - Call `gmail_list_messages` to find exam-related emails

  - Call `gmail_get_message` with message_id="MSG-5084" to retrieve Academic
  Affairs email dated 2026-03-28

  - Extract proctoring duties: April 14 (9-11 AM Math), April 16 (2-4 PM
  English), April 18 (9-11 AM Physics)

  - Extract grading schedule: April 15 (3-5 PM), April 17 (1-3 PM), April 19 (9
  AM-12 PM)

  - Extract colleague availability: Zhou Ming (April 14-15 only), Chen Jing
  (April 16-17, requires reciprocal April 22), Zhang Hui (fully available April
  14-18, prefers mornings)


  ## Step 2: Retrieve daughters' school event details

  - Call `gmail_get_message` with message_id="MSG-5085" to retrieve primary
  school notification dated 2026-03-30

  - Extract mandatory event: April 16, 2:00-4:30 PM Spring Arts Festival

  - Note: Both daughters performing in choir at 2:45 PM, parent attendance
  mandatory, confirmation required by April 8

  - Note: Alternative family member designation allowed if parent cannot attend


  ## Step 3: Check calendar for conflicts

  - Call `calendar_list_events` for April 14-18 date range

  - Identify event_id="EVT-384": English proctoring April 16, 2:00-4:00 PM

  - Identify event_id="EVT-385": Daughters' Arts Festival April 16, 2:00-4:30 PM

  - **CRITICAL CONFLICT DETECTED**: Direct overlap on April 16 afternoon


  ## Step 4: Review existing coordination notes

  - Call `notes_list` to find coordination planning notes

  - Call `notes_get` with note_id="NOTE-144" to retrieve dependency analysis
  dated 2026-04-02

  - Review dependency structure, colleague availability matrix, phased
  coordination plan already drafted


  ## Step 5: Review todo tasks for action items

  - Call `todo_list_tasks` to check pending coordination tasks

  - Identify task_id="TODO-593": Build dependency graph (due April 3)

  - Identify task_id="TODO-594": Request duty swap for April 16 English exam
  (urgent, due April 5)


  ## Step 6: Formulate coordination plan


  ### Critical Conflict Resolution

  - **Problem**: April 16, 2:00-4:00 PM English exam proctoring (mandatory,
  cannot delegate per policy) overlaps with daughters' Spring Arts Festival
  (mandatory family attendance)

  - **Primary solution**: Request duty swap with Zhang Hui (fully available
  April 14-18, prefers mornings but can cover afternoon)

  - **Backup solution**: If Zhang Hui unavailable, request swap with Chen Jing
  (available April 16-17, but requires reciprocal coverage April 22 afternoon)

  - **Contingency**: If all duty swaps denied, designate husband or grandparents
  to attend daughters' event (not ideal but acceptable per primary school
  policy)


  ### Phased Coordination Plan


  **Stage 1 (April 3-5): Confirm immovable commitments and request duty swaps**

  - Action 1.1: Email Zhang Hui requesting April 16, 2:00-4:00 PM proctoring
  duty swap

  - Action 1.2: Submit formal duty swap request to Academic Affairs by April 5
  deadline

  - Action 1.3: Check April 22 calendar for Chen Jing reciprocal coverage
  feasibility (backup option)

  - Action 1.4: Confirm competition coaching attendance April 15 and 17
  (4:00-6:00 PM)


  **Stage 2 (April 6-8): Finalize colleague coverage and family backup**

  - Action 2.1: IF Zhang Hui swap approved → Confirm primary school attendance
  by April 8

  - Action 2.2: IF Zhang Hui swap denied → Contact Chen Jing for backup swap
  option

  - Action 2.3: IF all swaps denied → Contact husband for April 16 availability

  - Action 2.4: IF husband unavailable → Contact parents for Shenzhen travel
  arrangement

  - Action 2.5: Decide on Chen Jing's offer to cover April 15 grading 3:00-4:00
  PM (allows full competition coaching attendance)


  **Stage 3 (April 9-11): Schedule parallel grading sessions**

  - Action 3.1: Finalize April 15 grading attendance (full session vs Chen Jing
  partial coverage)

  - Action 3.2: Evaluate April 17 grading delegation to Chen Jing vs personal
  attendance (1-hour buffer before coaching)

  - Action 3.3: Confirm April 19 final grading review attendance (9 AM-12 PM, no
  conflicts)

  - Action 3.4: Communicate grading coordination plan to Zhou Ming and Chen Jing


  **Stage 4 (April 12-13): Communicate final plan to all parties**

  - Action 4.1: Send final schedule confirmation to Academic Affairs

  - Action 4.2: Confirm attendance/alternative with primary school

  - Action 4.3: Brief family members on April 16 arrangement

  - Action 4.4: Prepare Class 10A students for exam week procedures


  ### Dependency Structure

  1. Exam completion → Grading sessions (temporal dependency)
     - April 14 Math exam → April 15 Math grading
     - April 16 English exam → April 17 English grading
     - April 18 Physics exam → April 19 final review

  2. Duty swap request → Colleague confirmation → Academic Affairs approval
  (approval chain)
     - Must submit by April 5 (3 business days before exam week)
     - Zhang Hui confirmation → Academic Affairs approval → Primary school attendance confirmation

  3. Family backup planning → Primary school notification (contingency chain)
     - IF duty swap denied → Contact husband/parents → Submit alternative attendee by April 8

  ### Hard Constraints (Cannot be violated)

  - Proctoring duties April 14, 16, 18 cannot be delegated per Academic Affairs
  policy (homeroom teacher responsibility)

  - Daughters' Arts Festival April 16 requires parent or designated family
  member attendance

  - Competition coaching April 15, 17 cannot be rescheduled (facility booking
  constraints)

  - Grade submission deadline April 19, 12:00 PM (final review must be
  completed)


  ### Soft Constraints (Can be optimized)

  - Grading sessions can be partially delegated or time-shifted with colleague
  coordination

  - April 15 grading 3:00-5:00 PM overlaps with coaching 4:00-6:00 PM by 1 hour
  (Chen Jing offered to cover first hour)

  - April 17 grading 1:00-3:00 PM has 1-hour buffer before coaching 4:00-6:00 PM
  (tight but manageable)


  ### Colleague Availability Matrix

  - **Zhang Hui**: Fully available April 14-18, prefers morning slots → BEST
  CANDIDATE for April 16 afternoon swap

  - **Chen Jing**: Available April 16-17, requires reciprocal coverage April 22
  afternoon → BACKUP OPTION (adds future obligation)

  - **Zhou Ming**: Available April 14-15 ONLY, unavailable April 16-18 (family
  medical appointment) → NOT AVAILABLE for April 16 conflict


  ### Next Immediate Actions (Priority Order)

  1. [URGENT] Draft duty swap request email to Zhang Hui (target: April 3
  morning)

  2. [URGENT] Check April 22 calendar for Chen Jing reciprocal coverage
  conflicts

  3. [HIGH] Contact husband to pre-confirm April 16 backup availability

  4. [MEDIUM] Submit formal duty swap request to Academic Affairs by April 5

  5. [MEDIUM] Prepare exam week materials to reduce daily preparation burden


  ## Step 7: Document coordination plan

  - Update NOTE-144 with final coordination decisions

  - Update TODO-594 status to reflect duty swap request sent

  - Create calendar reminders for Stage 1-4 deadlines
