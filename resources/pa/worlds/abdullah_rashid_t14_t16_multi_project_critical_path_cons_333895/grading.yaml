judge_rubric: 'Award full marks if the response: (1) Clearly identifies the three-way
  scheduling conflict between Zone 3A marine foundation approval (March 28, non-delegable
  per KB-461), equipment inspection timing, and father''s cardiology appointment (March
  27, Amman); (2) Correctly interprets KB-461 Section 4.2 to determine that pile driver
  equipment acceptance IS non-delegable because it is foundation-critical equipment
  with >500 kN capacity and critical path implications, contradicting Dr. Ibrahim''s
  suggestion that it could be delegated; (3) Quantifies the liquidated damages exposure
  ($141K/day, 0.3% of $47M package) and explains why March 28 is a hard deadline;
  (4) Presents viable resolution options such as schedule compression (March 27 early
  site walk + March 29 equipment inspection with Bosphorus Marine flexibility) or
  family schedule adjustment, while acknowledging the cognitive load and relationship
  trade-offs; (5) Demonstrates understanding of Abdullah''s personal verification
  protocol and why both the Zone 3A approval AND the pile driver inspection require
  his physical presence. Deduct points if: the response incorrectly concludes the
  equipment inspection is delegable without referencing the foundation-critical criteria
  in KB-461; fails to identify the liquidated damages exposure; proposes solutions
  that violate the non-delegable verification protocol; or misses the temporal constraint
  that both work commitments fall within the same 48-hour window as the family medical
  appointment. The response should reflect the analytical rigor and risk assessment
  approach evident in Abdullah''s NOTE-193, including consideration of consequence
  irreversibility, substitutability, and temporal flexibility.'
reference_solution: 'Step 1: Retrieve TODO-679 and TODO-680 to understand the user''s
  current conflict framing and information gaps. The user has already identified this
  as a critical scheduling conflict requiring KB-461 review and delegation boundary
  verification.


  Step 2: Get NOTE-193 to review the detailed conflict analysis already performed.
  This note contains the user''s preliminary assessment of four options (prioritize
  work, prioritize family, schedule compression, family schedule adjustment) and identifies
  critical information gaps, including whether equipment acceptance inspection is
  delegable per KB-461 Section 4.2.


  Step 3: Retrieve KB-461 (Technical Veto Authority Protocol) to resolve the delegation
  boundary question. Section 4.2 specifies that ''Major Equipment Acceptance - Foundation-Critical
  Systems'' including ''Pile driving equipment (capacity >500 kN)'' and ''Equipment
  with critical path implications'' are NON-DELEGABLE and require senior project engineer
  personal verification. This means the Bosphorus Marine pile driver inspection CANNOT
  be delegated to Dr. Ibrahim, contrary to his suggestion in MSG-5167.


  Step 4: Retrieve MSG-5168 from Fatima to confirm the Zone 3A marine foundation approval
  deadline (March 28 EOD, hard deadline, liquidated damages exposure $141K/day based
  on 0.3% of $47M package, April 1 mobilization window).


  Step 5: Retrieve MSG-5167 from Dr. Ibrahim to understand his delegation offer and
  the equipment inspection timing (March 28 pile driver acceptance, with suggestion
  to shift to March 29 if needed for family appointment flexibility).


  Step 6: Retrieve calendar events EVT-421 (Zone 3A site verification walk, March
  28, 08:00-12:00) and EVT-423 (father''s cardiology appointment, March 27, 10:00-11:30,
  Amman) to confirm the temporal conflict.


  Step 7: Synthesize findings: (a) Both Zone 3A approval AND pile driver inspection
  are non-delegable per KB-461, creating two hard work constraints on March 28; (b)
  Father''s appointment is March 27 in Amman, requiring travel; (c) Liquidated damages
  exposure is $141K/day; (d) Dr. Ibrahim''s delegation offer for equipment inspection
  is not viable under KB-461 governance rules; (e) Bosphorus Marine has indicated
  flexibility to shift equipment inspection to March 29 per MSG-5167.


  Step 8: Present consolidated conflict analysis with resolution options: Option A
  (schedule compression): conduct Zone 3A site walk March 27 early morning (06:00
  start), fly to Amman March 27 afternoon for cardiology appointment, return March
  28 evening, conduct pile driver inspection March 29 morning (coordinate with Bosphorus
  Marine for one-day shift per their indicated flexibility). Option B (family schedule
  adjustment): request Dr. Qasim''s office reschedule cardiology appointment to March
  29 or early April, maintain work schedule as planned. Highlight that Option A preserves
  both work deadlines and family commitment but involves extreme cognitive load and
  48-hour compressed schedule. Note that Dr. Ibrahim''s delegation suggestion is not
  viable under KB-461 foundation-critical equipment criteria, so both work commitments
  require Abdullah''s personal presence.'
