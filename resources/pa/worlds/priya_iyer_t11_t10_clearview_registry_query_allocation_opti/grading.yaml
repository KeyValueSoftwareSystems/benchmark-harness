judge_rubric: >-
  # Constraint Solving Evaluation Rubric


  ## Excellent (0.9–1.0)

  - Correctly identifies all four hard constraints: €265 budget cap, April 11
  legal deadline with buffer, April 30 ECI expiration, Panama/Cayman priority

  - Accurately extracts vendor parameters: ECI 73 unused queries with 5-7 day
  turnaround, GRD €12-25 per query with 24-72hr turnaround and 10-query discount
  threshold

  - Proposes allocation that satisfies ALL hard constraints: stays within
  budget, delivers critical queries by April 9, maximizes ECI sunk-cost recovery
  where timeline permits

  - Clearly phases execution: Phase 1 uses GRD for Panama/Cayman
  (speed-critical), Phase 2 uses ECI for Cyprus/Jersey (cost-optimal)

  - Provides cost breakdown showing total spend ≤ €265 and expected delivery
  dates for each jurisdiction

  - Acknowledges tradeoff between sunk-cost recovery (using ECI) and deadline
  risk (GRD faster but costs real money)

  - Flags concentration risk or backup plan if single vendor handles all
  critical-path queries


  ## Good (0.7–0.89)

  - Identifies 3 of 4 hard constraints and correctly prioritizes legal deadline
  and budget cap

  - Extracts vendor pricing and turnaround but may miss volume discount detail

  - Proposes allocation that meets budget and deadline but suboptimal on
  sunk-cost recovery (e.g., underutilizes ECI for secondary queries)

  - Phases critical vs secondary queries but justification for vendor assignment
  is thin

  - Provides cost estimate and timeline but lacks full breakdown by jurisdiction

  - Recognizes speed vs cost tradeoff but does not quantify impact


  ## Adequate (0.5–0.69)

  - Identifies budget cap and deadline but misses ECI expiration or priority
  distinction between jurisdictions

  - Extracts basic vendor pricing but incomplete on turnaround guarantees or
  discount structure

  - Proposes allocation that meets 2 of 3 primary constraints (budget, deadline,
  priority) but violates one or suboptimal

  - Suggests vendor split but does not clearly phase execution or justify
  assignments

  - Provides rough cost estimate but timeline is vague or missing delivery dates

  - Mentions tradeoff but does not analyze implications


  ## Poor (0.3–0.49)

  - Identifies only 1 hard constraint or misunderstands constraint (e.g., treats
  budget as soft target)

  - Incomplete vendor data extraction (missing pricing or turnaround for one
  vendor)

  - Proposes allocation that violates budget cap OR misses legal deadline OR
  ignores jurisdiction priority

  - No clear phasing or vendor assignment rationale

  - Cost estimate significantly wrong or timeline unrealistic

  - Does not address tradeoffs


  ## Failing (0.0–0.29)

  - Does not identify hard constraints or confuses them with soft preferences

  - Fails to extract vendor pricing or turnaround data

  - Proposes allocation violating multiple hard constraints or no allocation at
  all

  - No execution plan or cost breakdown

  - Does not retrieve necessary data from finance, gmail, or todo systems
reference_solution: >-
  # Reference Solution: CLEARVIEW Registry Query Allocation


  ## Step 1: Extract Constraint Data


  **Finance records** (`finance_list_transactions`, `finance_get_transaction`):

  - Q1 investigation budget: €1,200 allocated

  - Spent to date: €935 (ECI bulk package €450, GRD previous queries €485)

  - Remaining: €265

  - ECI package: 200 queries purchased, 127 used, 73 unused, expires April 30,
  2026


  **Gmail threads** (`gmail_list_messages`, `gmail_get_message`):

  - Thread with Thomas Patel (ECI): 5-7 business day turnaround, bulk package
  already paid (marginal cost €0)

  - Thread with Maria Santos (GRD): €12-25 per query depending on jurisdiction
  complexity, 24-72hr turnaround, 10% discount on orders of 10+ queries

  - Pricing breakdown: Panama €25, Cayman €22, Cyprus €15, Jersey €12


  **Todo tasks** (`todo_list_tasks`):

  - 27 pending registry queries tagged #CLEARVIEW-final

  - Breakdown: Panama (8 queries), Cayman (7 queries), Cyprus (6 queries),
  Jersey (6 queries)

  - Tags indicate Panama/Cayman are "Source-A-prep" (critical path),
  Cyprus/Jersey are "secondary-verification"


  **Notes** (`notes_list`, `notes_get`):

  - Legal review scheduled April 11, 2026

  - Partner newsroom (The Wire) expects preliminary findings by April 11

  - Source A interview window: April 12-15, requires Panama/Cayman entity
  confirmation before interview


  ## Step 2: Identify Hard Constraints


  1. **Budget cap**: €265 remaining (hard ceiling, no Q2 funds available early)

  2. **Legal deadline**: April 11, recommend 2-day buffer → all critical queries
  delivered by April 9

  3. **ECI expiration**: April 30, unused queries become unrecoverable sunk cost
  (€285 value)

  4. **Priority**: Panama (8) + Cayman (7) = 15 critical-path queries MUST
  complete by April 9; Cyprus (6) + Jersey (6) = 12 secondary queries can use
  slower/cheaper vendor


  ## Step 3: Calculate Vendor Scenarios


  **Scenario A: Maximize ECI usage (sunk-cost recovery)**

  - All 27 queries via ECI

  - Cost: €0 (already paid)

  - Timeline: Submit April 4 → deliver April 11-13 (5-7 days)

  - **FAILS**: Critical queries miss April 9 buffer, risk to legal deadline


  **Scenario B: Maximize speed (all GRD)**

  - All 27 queries via GRD

  - Cost: (8 × €25) + (7 × €22) + (6 × €15) + (6 × €12) = €200 + €154 + €90 +
  €72 = €516

  - Apply 10% discount (27 queries): €464.40

  - **FAILS**: Exceeds €265 budget by €199


  **Scenario C: Hybrid allocation (OPTIMAL)**


  **Phase 1 (critical path via GRD for speed):**

  - Panama: 8 queries × €25 = €200

  - Cayman: 7 queries × €22 = €154

  - Subtotal: €354 → with 10% discount (15 queries): €318.60

  - **FAILS budget**: Exceeds €265


  **Revised Phase 1 (partial GRD):**

  - Panama: 8 queries × €25 = €200 (non-negotiable, Source A critical)

  - Cayman: 4 highest-priority queries × €22 = €88

  - Phase 1 subtotal: €288 → need to reduce


  **Optimized allocation:**

  - **Phase 1 (GRD, submit April 4, deliver April 6-7):**
    - Panama: 8 queries × €25 = €200
    - Cayman: 2 most critical × €22 = €44
    - Subtotal: €244 (within budget, 10 queries = discount threshold)
    - With 10% discount: €219.60

  - **Phase 2 (ECI, submit April 4, deliver April 11-13):**
    - Cayman: 5 remaining × €0 = €0
    - Cyprus: 6 queries × €0 = €0
    - Jersey: 6 queries × €0 = €0
    - Subtotal: €0, uses 17 of 73 unused ECI queries

  **Total cost: €219.60** (€45.40 under budget)

  **Sunk-cost recovery: 17 queries** (€102 value recovered from €285 at risk)

  **Timeline compliance:**

  - Critical Panama queries: delivered April 6-7 ✓

  - Partial Cayman via GRD: April 6-7 ✓

  - Remaining Cayman + secondary queries via ECI: April 11-13 (acceptable for
  secondary verification)


  ## Step 4: Risk Assessment


  - **Concentration risk**: 10 critical queries on GRD (single vendor).
  Mitigation: GRD has 95% on-time record per gmail history.

  - **Partial Cayman coverage**: 2 via GRD (fast), 5 via ECI (slower). If Source
  A interview requires all 7, ECI batch may arrive too late (April 11-13 vs
  interview April 12-15). Recommend flagging to legal team.

  - **Budget headroom**: €45.40 buffer allows emergency GRD query if ECI fails.


  ## Step 5: Output Allocation Plan


  **Vendor Assignment:**

  - GRD: Panama (8), Cayman (2) = 10 queries, €219.60

  - ECI: Cayman (5), Cyprus (6), Jersey (6) = 17 queries, €0


  **Submission Timeline:**

  - April 4: Submit Phase 1 (GRD) + Phase 2 (ECI) simultaneously

  - April 6-7: GRD delivery expected (critical path)

  - April 11-13: ECI delivery expected (secondary)


  **Deliverables by Deadline:**

  - April 9 buffer: Panama (8) + Cayman (2) = 10 entities confirmed ✓

  - April 11 legal review: All 10 critical entities + possibly 17 secondary (if
  ECI early) ✓


  **Cost Breakdown:**

  - GRD base: €244

  - 10% volume discount: -€24.40

  - ECI marginal: €0

  - **Total: €219.60 / €265 budget (82.5% utilization)**


  **Recommendation:** Proceed with hybrid allocation. Flag to legal team that 5
  Cayman entities will arrive April 11-13, potentially after Source A interview
  window opens. If all 7 Cayman entities required before April 12, escalate for
  emergency budget approval to move remaining 5 to GRD (+€99 cost).
