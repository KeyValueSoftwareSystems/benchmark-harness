judge_rubric: 'Award full marks if the agent: (1) correctly assesses He Meilan''s
  low energy state at 9:30 PM on March 31 based on today''s demanding calendar density;
  (2) categorizes pending tasks by cognitive load (high: formula medical decision
  requiring prescription analysis and budget optimization, coach communication requiring
  relationship management strategy; low: grocery list, routine message replies); (3)
  defers all high-cognitive tasks to April 1 morning peak energy window (7:00-9:00
  AM) with clear rationale about mental clarity requirements; (4) recommends completing
  only low-cognitive tasks tonight to protect sleep quality; (5) creates concrete
  execution plan with calendar time blocks for deferred tasks and updated todo priorities;
  (6) acknowledges hard deadline for formula decision (April 1 before stockout) versus
  flexible deadline for coach communication. Deduct points if: the agent recommends
  making the formula decision tonight (risks health and budget consequences under
  fatigue); suggests drafting coach communication tonight (risks relationship damage
  from poor wording); fails to distinguish cognitive load levels; doesn''t verify
  April 1 calendar capacity for deferred tasks; ignores ISFJ personality tendency
  toward rumination when handling emotionally charged tasks while tired. The solution
  must prioritize the child''s health and growth (child health through correct formula
  decision timing) and relationship harmony (relationship harmony through careful
  communication timing) while maintaining family budget balance (budget discipline
  through clear-headed financial decisions).'
reference_solution: '**Step 1: Assess current energy state and today''s demands**

  - Call calendar_get_user_events for March 31, 2026 to retrieve today''s event density

  - Call notes_get for NOTE-230 (Energy Management Assessment) to understand current
  capacity (9:30 PM, ~20% energy remaining after demanding day)

  - Conclusion: Low energy state unsuitable for high-cognitive decisions


  **Step 2: Categorize pending tasks by cognitive load**

  - Call todo_list_tasks to retrieve all pending items

  - Call notes_get for NOTE-231 (Task Cognitive Load Categorization) to understand
  task analysis

  - Identify HIGH-COGNITIVE tasks: Formula brand decision (TODO-696 - medical prescription
  compliance, budget optimization), Coach Liu communication (TODO-697 - emotionally
  complex relationship management), April budget planning

  - Identify LOW-COGNITIVE tasks: Grocery list preparation, routine WeChat replies,
  receipt filing


  **Step 3: Verify tomorrow''s capacity for deferred tasks**

  - Call calendar_get_user_events for April 1, 2026 to check morning availability

  - Confirm EVT-447 shows 7:00-9:00 AM block already reserved for high-cognitive work

  - Verify no conflicting appointments during peak energy window


  **Step 4: Evaluate deadline urgency**

  - Formula decision: HARD deadline April 1 morning (before inventory stockout per
  TODO-696)

  - Coach communication: FLEXIBLE deadline within 2-3 days (per TODO-697)

  - Call gmail_get_message for MSG-5163 to verify formula pricing and Spring Festival
  supply timing (warehouse closes April 8-15)


  **Step 5: Create execution plan**

  - DEFER to April 1 morning (7:00-9:00 AM): Formula decision (7:00-7:45 AM) and coach
  communication draft (7:45-8:30 AM)

  - COMPLETE TONIGHT (low-cognitive only): Grocery list (15 min), simple WeChat acknowledgments
  (10 min)

  - Call notes_get for NOTE-232 to review detailed morning execution plan


  **Step 6: Update task management systems**

  - Call todo_update_task for TODO-696: Add note about deferral rationale and April
  1 morning execution window

  - Call todo_update_task for TODO-697: Add note about deferral to protect relationship
  management quality

  - Call calendar_create_event (if not already exists): Create/verify April 1 morning
  high-cognitive block (7:00-9:00 AM) with specific task allocations


  **Step 7: Communicate plan to user**

  - Explain energy-based task categorization (high vs low cognitive load)

  - Recommend completing only grocery list and simple message replies tonight

  - Emphasize protecting sleep quality by avoiding emotionally charged tasks (coach
  situation) and complex medical decisions (formula choice) while fatigued

  - Highlight April 1 morning as optimal window for focused decision-making

  - Note formula decision cannot be deferred past April 1 noon due to inventory stockout
  risk'
