judge_rubric: "Award full marks if the agent: (1) correctly identifies Panama
  vessel registry documents as the critical-path priority due to March 15
  deadline and irreversible access window, (2) accounts for the $80 Thomas Lin
  reimbursement as a committed expense that must be paid, (3) recognizes that
  only ~$350 is available after the reimbursement ($430 - $80), (4) allocates
  budget to Panama documents ($200 max estimate) and Thomas Lin ($80) first,
  totaling $280, (5) defers Delaware corporate filings and/or Singapore
  insurance records based on their lower priority (flexible timeline, secondary
  evidence, or Q2 budget availability), (6) maintains contingency buffer from
  remaining funds, (7) documents the decision with explicit constraint analysis
  and trade-off rationale, and (8) communicates the allocation decision to
  editor James Kuo via Workmail. Award partial credit if the agent correctly
  prioritizes Panama and Thomas Lin but fails to provide clear rationale for
  deferring secondary acquisitions, or if it allocates funds correctly but does
  not document the decision or communicate with the editor. Deduct points if the
  agent: deploys budget to non-critical acquisitions (Delaware/Singapore) before
  securing Panama documents, ignores the Thomas Lin reimbursement obligation,
  fails to recognize the irreversible nature of the Panama access window, or
  does not assess consequence severity for each deferral option. The agent
  should demonstrate understanding that hard constraints (deadline, access
  window, committed expenses) take precedence over soft optimization (marginal
  corroboration value, timeline advancement)."
reference_solution: >-
  1. Call claw_obsidian_search or claw_obsidian_list_notes to find the Q1 budget
  tracker (OBSN-53) in the Investigations/Shipping-Sanctions/Budget folder.

  2. Call claw_obsidian_get_note with note_id=OBSN-53 to retrieve the budget
  tracker content, which shows: remaining Q1 budget $430, committed unpaid
  expense (Thomas Lin $80), and three pending document acquisition opportunities
  (Panama $150-200, Delaware $120, Singapore $85).

  3. Analyze constraint hierarchy: Thomas Lin reimbursement is a committed
  obligation ($80); Panama documents are critical-path blockers for March 15
  deadline with irreversible access window (office processing ends March 12);
  Delaware filings support secondary investigation with flexible Q2 timeline;
  Singapore records provide secondary corroboration only (primary sources
  already secured).

  4. Calculate net available budget: $430 - $80 (Thomas Lin) = $350.

  5. Determine deployment sequence based on deadline urgency and consequence
  severity: (a) Thomas Lin reimbursement $80 (committed), (b) Panama documents
  $200 max estimate (critical-path, irreversible deadline), (c) reserve
  remaining $150 for contingency or defer Delaware/Singapore to Q2 budget.

  6. Recognize that Panama cost estimate range ($150-200) plus Thomas Lin ($80)
  totals $230-280, leaving $150-200 remaining. Delaware ($120) or Singapore
  ($85) could be funded, but maintaining contingency buffer is prudent given
  Panama estimate uncertainty.

  7. Call claw_obsidian_create_note or claw_obsidian_update_note to document the
  budget allocation decision in the investigation vault, including constraint
  analysis, consequence severity assessment for each deferral option, and
  explicit trade-off rationale (hard constraints prioritized over soft
  optimization).

  8. Call workmail_send_message to send a message to
  james.kuo@theoutlinepacific.com explaining the budget allocation decision:
  Panama documents + Thomas Lin funded immediately ($280), Delaware and
  Singapore deferred to Q2 budget or contingency reassessment after March 15,
  rationale based on deadline criticality and irreversible access window.

  9. Optionally call todo_create_task to track Panama document acquisition
  initiation and Thomas Lin payment processing.

  10. Optionally call finance_list_transactions to verify that Thomas Lin
  reimbursement (TXN-6016) and Panama document payment (TXN-6017) have been
  processed, confirming budget deployment.
primary_dimensions:
  - completion
  - robustness
  - communication
  - safety
