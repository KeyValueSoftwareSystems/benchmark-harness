judge_rubric: >-
  # Evaluation Rubric for Multi-Property Acquisition Decision Chain


  ## Excellent Response (Score: 0.9-1.0)

  - **Correctly identifies Bank of China loan approval (March 17) as the
  critical bottleneck** affecting all downstream property decisions, with
  explicit acknowledgment of 15-20% rejection risk

  - **Recommends optimal conditional parallel strategy**: (1) Xujiahui
  commitment by March 20 with improved 70% refund terms (¥90K acceptable risk
  for ¥150K discount protection), (2) Pudong extension negotiation to March 21
  or serial wait (¥640K non-refundable risk too high), (3) Jing'an flexible
  backup with no immediate commitments

  - **Provides clear risk-adjusted expected value calculations**: Xujiahui
  expected value ~+¥108K (82.5% × ¥150K - 17.5% × ¥90K), Pudong expected loss
  ~-¥112K if committed before loan decision (17.5% × ¥640K)

  - **Maps explicit decision checkpoints**: March 17 loan decision triggers
  downstream actions (if approved → execute deposits, if rejected → accept
  Xujiahui loss + activate Jing'an backup)

  - **Addresses relationship capital and negotiation tactics**: Extension
  request for Pudong with ¥50K good-faith deposit, verification of Xujiahui
  refund clause language

  - **Demonstrates understanding of capital constraints**: ¥1.85M liquid vs
  ¥2.1M needed, shortfall covered by loan approval

  - Clear, structured presentation with explicit reasoning for each property
  decision


  ## Good Response (Score: 0.7-0.89)

  - Identifies loan approval as key dependency and recognizes timing
  misalignment with property deadlines

  - Recommends Xujiahui conditional commitment with improved terms and Pudong
  caution, but may lack precise expected value calculations

  - Recognizes Jing'an as backup option

  - Addresses most key risk factors (non-refundable deposits, discount
  expiration, competing offers)

  - May miss some nuances in negotiation tactics or relationship capital
  considerations

  - Generally sound reasoning but less comprehensive analysis


  ## Adequate Response (Score: 0.5-0.69)

  - Recognizes the three-property acquisition chain and loan approval dependency

  - Makes reasonable recommendations for at least two properties (e.g., caution
  on Pudong, proceed on Xujiahui)

  - Identifies some key risks (non-refundable deposits, deadlines) but may miss
  others

  - May lack explicit expected value calculations or checkpoint protocol

  - May not fully address capital constraints or relationship considerations

  - Basic reasoning present but incomplete analysis


  ## Weak Response (Score: 0.3-0.49)

  - Acknowledges multiple properties and some timing constraints

  - Makes generic risk-averse recommendations without property-specific analysis

  - Misses critical dependencies (e.g., doesn't recognize loan approval as
  bottleneck)

  - Fails to differentiate risk profiles across properties (treats ¥640K and
  ¥90K exposures equivalently)

  - Minimal quantitative analysis or expected value reasoning

  - Vague or incomplete recommendations


  ## Poor Response (Score: 0.0-0.29)

  - Fails to identify the sequential decision structure or loan approval
  bottleneck

  - Makes dangerous recommendations (e.g., commit to Pudong ¥640K before loan
  decision)

  - Misses most key deadlines, risks, or dependencies

  - No quantitative analysis or risk-adjusted reasoning

  - Recommendations would likely result in significant capital loss or missed
  opportunities

  - Demonstrates fundamental misunderstanding of the decision problem


  ## Key Evaluation Dimensions

  1. **Problem Structure Recognition** (25%): Does the agent identify this as a
  sequential decision problem with loan approval as the uncertainty node?

  2. **Risk-Adjusted Strategy** (30%): Does the agent recommend appropriate
  advancement strategies based on risk exposure (conditional parallel for
  Xujiahui, serial wait for Pudong)?

  3. **Quantitative Reasoning** (20%): Does the agent calculate expected values,
  probability-weighted outcomes, or opportunity costs?

  4. **Checkpoint Protocol** (15%): Does the agent define explicit decision
  triggers at the March 17 loan decision point?

  5. **Practical Execution** (10%): Does the agent address negotiation tactics,
  relationship capital, and capital constraints?


  ## Critical Errors (Automatic Score Cap)

  - Recommending Pudong ¥640K commitment before loan approval → cap at 0.3

  - Failing to identify loan approval as critical bottleneck → cap at 0.5

  - Recommending serial wait for all properties without considering opportunity
  costs → cap at 0.6
reference_solution: >-
  # Reference Solution: Multi-Property Acquisition Decision Chain


  ## Step 1: Identify the Decision Problem Structure

  - **Tool**: `gmail_list_messages` to scan recent property-related emails

  - **Tool**: `notes_list` to find analysis documents

  - **Discovery**: This is a sequential decision problem with three properties
  (Pudong, Xujiahui, Jing'an) and cascading dependencies, with Bank of China
  loan approval (Application #INV-2026-0142, expected March 17) as the critical
  bottleneck


  ## Step 2: Retrieve Critical Communications

  - **Tool**: `gmail_get_message` on MSG-5088 (Liu Meiling - Pudong competing
  offer)
    - **Key data**: ¥640K non-refundable deposit, March 19 deadline, competing offer at ¥8.45M
  - **Tool**: `gmail_get_message` on MSG-5089 (Lin Xiaofeng - Xujiahui
  early-bird)
    - **Key data**: ¥300K deposit, improved 70% refund terms by March 20, ¥150K discount expires March 22
  - **Tool**: `gmail_get_message` on MSG-5091 (Zhang Hua - loan status)
    - **Key data**: March 17 decision date, 15-20% rejection rate, 80-85% approval probability

  ## Step 3: Access Risk Analysis Documentation

  - **Tool**: `notes_get` on NOTE-156 (Multi-Property Acquisition Chain
  analysis)
    - **Key insights**: 
      - Conditional parallel strategy recommended for Xujiahui (¥90K risk for ¥150K discount)
      - Serial wait or extension negotiation for Pudong (¥640K risk too high)
      - Expected value calculations: Xujiahui +¥108K, Pudong -¥112K if committed early
  - **Tool**: `notes_get` on NOTE-157 (Loan approval probability assessment)
    - **Key insights**: 80-85% approval probability based on application strength vs policy environment

  ## Step 4: Verify Capital Constraints

  - **Tool**: `finance_list_transactions` to check available liquidity

  - **Tool**: `finance_get_transaction` on TXN-6036 (liquid capital
  verification)
    - **Key data**: ¥1.85M available vs ¥2.1M needed, ¥250K shortfall covered by loan

  ## Step 5: Review Calendar Dependencies

  - **Tool**: `calendar_list_events` to map timeline

  - **Discovery**: March 17 loan decision → March 19 Pudong deadline → March 20
  Xujiahui improved terms → March 22 Xujiahui final deadline


  ## Step 6: Synthesize Optimal Strategy


  ### Property A - Pudong Century Park Unit 2803:

  **Recommendation**: Serial wait or negotiate extension

  - **Risk exposure**: ¥640K non-refundable (100% loss if loan rejected)

  - **Expected loss if committed early**: 17.5% × ¥640K = ¥112K

  - **Competing offer risk**: Property likely lost to competing buyer if
  extension fails

  - **Action**: Contact Liu Meiling to request 48-hour extension to March 21
  with ¥50K good-faith deposit

  - **Rationale**: ¥640K risk exposure is unacceptable given 15-20% rejection
  probability; extension aligns decision with loan approval timing


  ### Property B - Xujiahui Unit 1502:

  **Recommendation**: Conditional parallel - commit by March 20 with improved
  refund terms

  - **Risk exposure**: ¥90K (30% of ¥300K deposit non-refundable with improved
  terms)

  - **Expected value**: 82.5% × ¥150K discount - 17.5% × ¥90K loss = +¥108K

  - **Discount protection**: ¥150K early-bird savings

  - **Action**: Accept Lin Xiaofeng's improved 70% refund offer by March 20

  - **Rationale**: Positive expected value, acceptable risk exposure, protects
  significant discount


  ### Property C - Jing'an District Backups:

  **Recommendation**: Flexible backup with no immediate commitments

  - **Risk exposure**: Minimal (viewing time only)

  - **Timing**: Activate only if Properties A or B fail

  - **Action**: Schedule viewings post-March 17 loan decision if needed

  - **Rationale**: Maintains optionality without capital commitment


  ## Step 7: Define Checkpoint Protocol


  ### March 17 Checkpoint (Loan Decision Day):

  - **IF APPROVED**: 
    - Execute Pudong ¥640K deposit (if extension granted)
    - Confirm Xujiahui ¥300K deposit by March 18-20
    - Cancel Jing'an backup viewings
  - **IF REJECTED**: 
    - Accept Xujiahui ¥90K loss (already committed)
    - Abandon Pudong opportunity
    - Activate Jing'an backup viewings
    - Explore alternative financing (Shanghai Commercial Trust, private lending)
  - **IF PENDING**: 
    - Proceed with Xujiahui by March 20 (acceptable risk)
    - Defer Pudong decision until loan clarity

  ## Step 8: Broker Negotiation Priorities

  1. **Liu Meiling (Pudong)**: Request 48-hour extension with ¥50K good-faith
  deposit - CRITICAL

  2. **Lin Xiaofeng (Xujiahui)**: Accept improved 70% refund terms by March 20 -
  RECOMMENDED

  3. **Wang Jianhua (Jing'an)**: Maintain flexibility without commitments - LOW
  PRIORITY


  ## Key Decision Framework

  This is a classic sequential decision problem with uncertainty at the loan
  approval node. The optimal strategy is **conditional parallel advancement**
  for acceptable-risk opportunities (Xujiahui ¥90K exposure) while setting
  **hard checkpoints** for high-risk opportunities (Pudong ¥640K exposure). The
  improved refund negotiation (50%→70%) reduced Xujiahui risk by ¥60K, making
  conditional parallel viable.


  ## Capital Constraint Management

  - Liquid capital: ¥1.85M

  - Optimal portfolio requirement: ¥2.1M

  - Shortfall: ¥250K (resolved by loan approval)

  - Strategy: Loan approval unlocks ¥5.2M financing capacity for full portfolio
  execution


  ## Expected Outcomes

  - **Best case** (loan approved, Pudong extension granted): Secure both Pudong
  and Xujiahui at optimal pricing

  - **Good case** (loan approved, Pudong lost): Secure Xujiahui with ¥150K
  discount, explore Jing'an alternatives

  - **Acceptable case** (loan rejected): Accept ¥90K Xujiahui loss, pivot to
  Jing'an backup with alternative financing

  - **Worst case** (loan rejected, no extension): Lose Pudong + ¥90K Xujiahui
  loss, but Jing'an backup provides recovery path
