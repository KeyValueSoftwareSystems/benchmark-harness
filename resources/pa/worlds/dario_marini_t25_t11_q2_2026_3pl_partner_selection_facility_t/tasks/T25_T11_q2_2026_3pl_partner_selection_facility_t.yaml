task_id: T25_T11_q2_2026_3pl_partner_selection_facility_t
task_name: Q2 2026 3PL Partner Selection - Facility Tour vs Virtual Inspection Tradeoff
category: scheduling
difficulty: hard
prompt:
  text: I need to finalize the 3PL partner decision by April 7 — should I do facility
    tours or go with virtual inspections? Walk me through the best approach given
    everything on my plate.
  language: en
execution_date: '2026-04-04'
