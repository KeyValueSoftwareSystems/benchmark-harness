judge_rubric: "Award full marks if the response: (1) Identifies the critical
  March 28-29 collision between Tierra Verde pitch deck deadline (EOD March 28),
  EcoVols volunteer event (March 29 7AM-2PM), and overlapping client work; (2)
  Flags buffer violations, specifically the missing prep block before the March
  28 GreenRoot client call and insufficient recovery time between deadline
  crunch and volunteer commitment; (3) Documents delegation opportunities
  (Jordan Reeves for Tierra Verde production work, Liam Torres backup for
  EcoVols coordination) and identifies which conflicts require client
  communication (La Paloma extension acceptance, potential Tierra Verde team
  support discussion); (4) Notes the Swift Print vendor payment constraint
  (March 28 due date, promotional rate expires March 29) and its relationship to
  GreenRoot payment timing (March 30); (5) Presents findings in a prioritized
  format with conflict severity ratings and actionable next steps. Deduct points
  for: missing the volunteer commitment conflict entirely (major error); failing
  to identify buffer violations; not surfacing delegation options; ignoring the
  cash flow/vendor payment sequencing issue; presenting findings without clear
  prioritization or action recommendations. The response should demonstrate
  understanding that Carlos needs both immediate tactical guidance (what to
  handle urgently) and strategic conflict resolution (delegation, client
  communication, buffer implementation)."
reference_solution: >-
  **Step 1**: Call `calendar_list_events` with date range covering final week of
  March 2026 (March 24-31) to retrieve all scheduled events. Identify EVT-543
  (GreenRoot client call March 28 2-3PM) and EVT-544 (EcoVols volunteer event
  March 29 7AM-2PM).


  **Step 2**: Call `gmail_list_messages` to retrieve recent client
  communications. Identify MSG-5311 (James Okafor urgent email about Tierra
  Verde deadline moved from April 2 to March 29, needs deck by EOD March 28) and
  MSG-5313 (Marcus Kim reminder about March 29 volunteer setup coordination at
  7AM).


  **Step 3**: Call `todo_list_tasks` to retrieve active task deadlines. Identify
  TODO-848 (Tierra Verde pitch deck due March 28 EOD, marked urgent with
  conflict tag) and TODO-851 (delegation assessment task for March 28-29
  conflicts, mentions Jordan Reeves as candidate).


  **Step 4**: Call `notes_list` to retrieve planning documentation. Identify
  NOTE-287 (Q1 Final Week Deadline Consolidation with critical path analysis)
  and NOTE-288 (Delegation Decision Log with conflict resolution rationale).


  **Step 5**: Call `finance_list_transactions` to check for vendor payment
  constraints. Identify TXN-6173 (Swift Print payment $450 due March 28,
  promotional rate expires March 29, notes cash flow constraint if GreenRoot
  payment delayed past March 30).


  **Step 6**: Synthesize findings to identify critical conflicts:

  - **CRITICAL collision**: March 29 EcoVols volunteer event (7AM-2PM)
  physically overlaps with client work blocks, creating 5-hour direct conflict

  - **HIGH priority**: March 28 triple-deadline day (Tierra Verde EOD, Swift
  Print payment, GreenRoot call) with insufficient buffer

  - **Buffer violations**: Missing prep block before March 28 GreenRoot call; no
  recovery time between Friday crunch and Saturday volunteer commitment


  **Step 7**: Document delegation opportunities from NOTE-288 and TODO-851:

  - Jordan Reeves available for Tierra Verde pitch deck production work ($75/hr,
  2-3 hours estimated)

  - Liam Torres confirmed as backup volunteer for EcoVols setup coordination
  (per Marcus Kim)

  - La Paloma extension to April 1 already offered by Rosa Mendez (zero-cost
  buffer creation)


  **Step 8**: Identify required client communications:

  - Accept La Paloma extension to April 1 (immediate action, eliminates one
  conflict)

  - Contact Marcus Kim to delegate EcoVols coordination to Liam Torres (by March
  26)

  - Consult Jordan Reeves on Tierra Verde delegation scope and budget (by March
  26)


  **Step 9**: Flag cash flow constraint: Swift Print payment ($450) due March 28
  before GreenRoot payment ($3,200) arrives March 30, but sufficient account
  balance exists to cover temporary gap.


  **Step 10**: Generate prioritized action timeline with conflict severity
  ratings and immediate next steps, preserving volunteer commitment review as
  manual decision point per safety constraints.
