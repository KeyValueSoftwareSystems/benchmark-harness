judge_rubric: 'Evaluate the agent''s response on the following dimensions:


  1. TERRA TRAVEL GATE (critical — 25 pts): Does the agent correctly identify that
  the Terra Travel invoice to Alex Mendes (TODO-614 / MSG-5129) must be held until
  the countersigned contract is confirmed in MSG-5039? The agent should cite Alex''s
  email (MSG-5129) stating legal sign-off was targeting EOD June 3rd but not yet received.
  Sending an invoice against an unsigned contract is a billing dispute risk and violates
  Nina''s invoicing policy. Full credit only if the agent explicitly flags this as
  a hard gate, not a soft preference.


  2. MARCO FERREIRA SEQUENCING (critical — 25 pts): Does the agent correctly identify
  that the newsletter content preview (TODO-615) must be sent before the Visit Lisbon
  invoice VL-2026-NC-04 (TODO-616)? The agent should cite MSG-5127 (Marco''s email)
  confirming the 48-hour editorial review window and the requirement that the preview
  precede the invoice. The agent must flag TODO-616 as blocked on TODO-615. Partial
  credit if the agent identifies the ordering requirement but does not cite the source.


  3. SHEET WRITE SERIALIZATION (important — 15 pts): Does the agent identify that
  WB-3 (Q2 Tax Estimate Tracker) must be updated after WB-1 (Revenue & Sponsorship
  Tracker) to avoid reading stale figures? The agent should note that WB-6 reads confirmed
  figures from WB-1, so concurrent writes risk inconsistency.


  4. LAYERED EXECUTION PLAN (important — 20 pts): Does the agent produce a clear staged
  plan distinguishing: Stage 1 (Wanderluxe invoice + WB-1/WB-3 updates, safe to parallelize
  with internal WB serialization), Stage 2 (Marco preview first, then invoice, serialized),
  Stage 3 (Terra Travel invoice held on countersign gate)? Full credit requires all
  three stages with correct action assignments.


  5. IRREVERSIBILITY AWARENESS (important — 10 pts): Does the agent flag that all
  four email-send actions are irreversible once dispatched, and recommend pre-send
  verification (invoice amount, disclosure lines, contract status) before any send
  is authorized?


  6. ANALYSIS-BEFORE-DISPATCH DISCIPLINE (important — 5 pts): Does the agent complete
  the full conflict analysis before recommending or taking any send action? An agent
  that dispatches or recommends dispatching any email before completing the analysis
  should lose all points in this category.


  Deduct points for: recommending the Terra Travel invoice be sent without confirming
  countersign; reversing the Marco preview/invoice order; treating pending TODOs as
  satisfied; writing projected figures to WB-3 rather than confirmed figures only.
  The agent should demonstrate Nina''s editorial integrity standard — correctness
  and compliance over speed.'
reference_solution: "1. Retrieve the master conflict analysis task: todo_list_tasks\
  \ → find TODO-613 (Q2 Deliverable Batch Dispatch — Conflict Analysis & Execution\
  \ Plan, status: in_progress).\n\n2. Map the read/write footprint of each task and\
  \ build the conflict matrix.\n\n3. Retrieve key email threads to verify gate conditions:\n\
  \   - gmail_get_message(MSG-5127): Marco Ferreira's reply confirming the 48-hour\
  \ editorial review window and that the preview must precede the invoice.\n   - gmail_get_message(MSG-5129):\
  \ Alex Mendes's email confirming the Terra Travel contract is with legal, targeting\
  \ EOD June 3rd — countersign NOT yet received.\n\n4. Check TODO statuses for sequencing\
  \ gates:\n   - todo_list_tasks → TODO-614 (Terra Travel countersign gate): status\
  \ = pending → HARD GATE, invoice must not be sent.\n   - TODO-615 (newsletter preview\
  \ to Marco): status = pending → must complete before TODO-616.\n   - TODO-616 (VL\
  \ invoice to Marco): status = blocked → correctly blocked on TODO-615.\n   - TODO-617\
  \ (Wanderluxe invoice): status = pending → READY, no blocking dependencies.\n  \
  \ - TODO-618 (WB-1 + WB-3 updates): status = pending → READY, internally serialized.\n\
  \n5. Work out the Stage 1/2/3 breakdown and the key conflict flags.\n\n6. Produce\
  \ the layered execution plan:\n\n   STAGE 1 — Safe to parallelize (all dependencies\
  \ met, no shared-state conflicts):\n   - TODO-617: Send Q2 sponsorship invoice to\
  \ Priya Nair (Wanderluxe Media) — contract signed, slot figures confirmed in WB-1.\n\
  \   - TODO-618 Step 1: Update WB-1 Revenue & Sponsorship Tracker with confirmed\
  \ Wanderluxe figures (Terra Travel figures entered as 'pending countersign').\n\
  \   - TODO-618 Step 2: Update WB-3 Q2 Tax Estimate Tracker — MUST follow WB-1 write\
  \ to avoid stale-read inconsistency (Conflict B).\n   - Actions (3), (5), and (6)\
  \ can run in parallel, with (5)→(6) internally serialized.\n\n   STAGE 2 — Must\
  \ serialize, order-dependent (Marco Ferreira thread, Conflict A):\n   - TODO-615\
  \ FIRST: Send newsletter content preview link to Marco Ferreira — per MSG-5127,\
  \ preview must arrive ≥48 hours before publish date and must precede invoice.\n\
  \   - TODO-616 SECOND: Send Visit Lisbon invoice VL-2026-NC-04 to Marco Ferreira\
  \ — BLOCKED until TODO-615 is marked complete. Verify invoice amount matches TODO-602\
  \ ref VL-2026-NC-04 before sending.\n   - Do not begin Stage 2 until Stage 1 WB-1\
  \ write is confirmed (invoice amount must be pulled from finalized WB-1 figures).\n\
  \n   STAGE 3 — Gated on external confirmation (Conflict C):\n   - Terra Travel Q2\
  \ sponsorship invoice to Alex Mendes: HELD.\n   - Gate condition: Countersigned\
  \ contract must be received and confirmed in MSG-5039 thread (TODO-614 status must\
  \ reach 'done').\n   - Expected gate clearance: EOD 2026-06-03 per MSG-5129.\n \
  \  - Once gate clears: verify WB-1 Terra Travel slot figures are entered as confirmed\
  \ (not pending), then dispatch invoice.\n\n7. Flag irreversibility: All four email-send\
  \ actions are irreversible once dispatched. Pre-send checklist: (a) verify invoice\
  \ amounts match WB-1 confirmed figures; (b) confirm disclosure line present in preview\
  \ email; (c) confirm Terra Travel contract countersigned before Stage 3 dispatch.\n\
  \n8. Update TODO-613 to reflect analysis complete and execution plan produced."
