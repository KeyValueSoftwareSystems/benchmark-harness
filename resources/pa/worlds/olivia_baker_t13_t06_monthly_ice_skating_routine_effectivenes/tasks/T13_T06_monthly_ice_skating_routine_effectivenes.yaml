scoring_components:
- name: Ice session completion rate calculated
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - 11 sessions
      - eleven sessions
    - - 16 sessions
      - sixteen sessions
      - 16 scheduled
    - - 68.75%
      - 68.75 percent
      - 69%
      - approximately 69%
      - roughly 69 percent
- name: Correlation between skipped sessions and kitchen incidents identified
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - 3/12
      - March 12
      - blast chiller service
    - - 3/13
      - March 13
      - chocolate tempering
      - $185
      - '185'
    - - 3/8
      - March 8
      - pistachio
      - $340
      - '340'
    - - voluntary skips
      - skipped sessions
      - missed ice
      - session gaps
    - - material waste
      - decision-making
      - decision quality
      - testing failures
- name: Recommendations for protecting ice time during high-pressure periods
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - protect
      - prioritize
      - maintain
      - preserve
      - non-negotiable
    - - ice sessions
      - ice time
      - morning sessions
      - skating routine
    - - spring menu
      - April
      - high-stress
      - high-pressure
      - equipment maintenance
      - menu launch
- name: Retrieved voice memo notes from ice sessions
  weight: 0.15
  check:
    type: tool_called
    tool_name: notes_list
    min_calls: 1
- name: Retrieved specific ice session note details
  weight: 0.15
  check:
    type: tool_called
    tool_name: notes_get
    min_calls: 2
- name: Cross-referenced finance records for material waste incidents
  weight: 0.15
  check:
    type: tool_called
    tool_name: finance_list_transactions
    min_calls: 1
- name: Checked calendar for ice session scheduling data
  weight: 0.1
  check:
    type: tool_called
    tool_name: calendar_list_events
    min_calls: 1
