judge_rubric: >-
  # LLM Judge Rubric: Q1 Print Vendor Payment Optimization


  ## Evaluation Perspective

  You are evaluating whether the agent correctly solved a multi-vendor
  promotional arbitrage problem under cash flow constraints for a freelance
  designer.


  ## Scoring Dimensions (0-10 scale each)


  ### 1. Financial Accuracy (0-10)

  - **9-10**: Correctly calculates net expenditure for all vendor paths,
  accounting for discount percentages, account credits, and minimum order
  thresholds. Identifies optimal allocation within $10 of reference solution
  ($587-$592 range).

  - **6-8**: Calculates most vendor paths correctly but makes minor arithmetic
  errors or misses one credit/discount interaction. Final recommendation within
  $50 of optimal.

  - **3-5**: Significant calculation errors (e.g., applies discounts
  incorrectly, forgets to subtract credits, miscalculates combined order
  totals). Final recommendation $50-$100 off optimal.

  - **0-2**: Fundamental misunderstanding of discount stacking, ignores account
  credits entirely, or recommends allocation that exceeds cash constraint.


  ### 2. Risk Prioritization (0-10)

  - **9-10**: Explicitly identifies ColorWave $85 credit as highest-priority
  irreversible asset and structures payment sequencing to preserve it.
  Recognizes Verdant Press WELCOME18 is also non-extendable but lower dollar
  value.

  - **6-8**: Recognizes importance of expiring credits but doesn't clearly
  articulate irreversibility hierarchy. May treat all promos as equally urgent.

  - **3-5**: Acknowledges promotional deadlines but doesn't distinguish between
  extendable relationships (ColorWave, Swift Print) and non-negotiable terms
  (Verdant new customer offer).

  - **0-2**: Ignores expiration dates, recommends waiting for GreenRoot payment
  without addressing promotional forfeit risk, or suggests requesting extensions
  from vendors with explicit no-extension policies.


  ### 3. Cash Flow Constraint Validation (0-10)

  - **9-10**: Explicitly verifies payment sequencing against $4,250 available
  balance and March 28-31 promotional window. Confirms all payments can be made
  before GreenRoot receivable arrives April 3.

  - **6-8**: Acknowledges cash constraint but doesn't show detailed day-by-day
  payment sequencing. May assume sufficient funds without explicit verification.

  - **3-5**: Mentions cash flow concern but recommends allocation that requires
  more than $4,250 before April 3, or doesn't account for timing of individual
  vendor payments.

  - **0-2**: Ignores cash constraint entirely, recommends allocation assuming
  GreenRoot payment is already available, or suggests overdraft/credit options
  not mentioned in task context.


  ### 4. Delivery Timeline Feasibility (0-10)

  - **9-10**: Cross-references vendor production lead times (Swift 5-7 days,
  ColorWave 4-6 days, Verdant 3-5 days) against client delivery deadlines (Café
  Verdant March 30, Terraloop April 2, GreenFutures April 4). Confirms
  recommended allocation meets all hard deadlines.

  - **6-8**: Acknowledges delivery deadlines but doesn't show detailed lead-time
  calculation for each vendor-client pairing.

  - **3-5**: Mentions delivery concern but recommends vendor allocation that
  creates timeline conflicts (e.g., ordering from Swift on March 28 for March 30
  delivery when lead time is 5-7 days).

  - **0-2**: Ignores delivery deadlines entirely or recommends allocation that
  clearly violates hard constraints.


  ### 5. Decision Clarity and Actionability (0-10)

  - **9-10**: Provides clear recommendation with specific vendor allocation
  (which projects to which vendor), payment amounts, and execution dates.
  Includes contingency plan if primary path fails (e.g., extension request
  denied).

  - **6-8**: Recommends vendor allocation but lacks specific payment sequencing
  dates or doesn't provide fallback options.

  - **3-5**: Presents multiple options without clear recommendation, or
  recommendation is vague (e.g., "try to use ColorWave" without specifying which
  projects).

  - **0-2**: No clear recommendation, only describes the problem, or suggests
  the user make the decision without analytical support.


  ## Overall Quality Assessment

  Provide a holistic 0-10 score considering:

  - Did the agent discover and synthesize information from multiple services
  (gmail, finance, calendar, contacts, notes)?

  - Does the solution demonstrate understanding of promotional arbitrage
  mechanics (stacking discounts, prioritizing irreversible benefits)?

  - Is the recommendation financially optimal given the constraints?

  - Would Carlos be able to execute the plan immediately based on the agent's
  output?


  **Critical success criteria**: The agent must (1) identify ColorWave $85
  credit as highest-priority asset, (2) calculate net costs within $20 of
  optimal, and (3) validate payment sequencing against $4,250 cash constraint.
  Missing any of these should cap the overall score at 6/10.
reference_solution: >-
  # Reference Solution: Q1 Print Vendor Payment Optimization


  ## Step 1: Query Finance Records

  - Call `finance_list_transactions` to retrieve current balance and pending
  receivables

  - Identify TXN-6185: Current balance $4,250 (as of March 24)

  - Identify TXN-6186: GreenRoot invoice CR-GR-031 ($2,850) delayed to April 3

  - **Constraint established**: Must allocate print orders within $4,250
  available through March 31


  ## Step 2: Retrieve Vendor Promotional Emails

  - Call `gmail_list_messages` with filters for vendor/promotional labels

  - Call `gmail_get_message` for MSG-5326 (Swift Print BULK25):
    - 25% off orders $500+, expires March 28, no account credit, 5-7 day lead time
  - Call `gmail_get_message` for MSG-5327 (ColorWave LOYAL20Q1):
    - 20% off orders $300+, $85 account credit, both expire March 29, 4-6 day lead time
    - **Key insight**: $85 credit is irreversible if expires unused
  - Call `gmail_get_message` for MSG-5328 (Verdant Press WELCOME18):
    - 18% off first order $200+, expires March 31, 3-5 day lead time
    - **Key insight**: One-time offer, cannot be extended per policy

  ## Step 3: Cross-Reference Client Delivery Deadlines

  - Call `calendar_list_events` to retrieve delivery deadlines

  - Identify EVT-573: Café Verdant delivery March 30 (requires order by March
  24-25 for Swift, March 25-26 for ColorWave)

  - Identify EVT-574: Terraloop Studio delivery April 2 (more flexible timing)

  - Identify EVT-575: GreenFutures Foundation delivery April 4 (hard deadline,
  allows order through March 29-30)


  ## Step 4: Access Existing Arbitrage Analysis

  - Call `notes_list` to find planning notes

  - Call `notes_get` for NOTE-301 (Q1 Print Vendor Payment Arbitrage)

  - Extract base costs: Café Verdant $320, Terraloop $280, GreenFutures $240
  (total $840)

  - Extract calculated paths:
    - Path A (ColorWave all three): $587 net
    - Path B (Swift split + Verdant): $646.80 net
    - Path C (ColorWave priority + Verdant): $591.80 net
  - Extract decision framework: Prioritize ColorWave $85 credit (irreversible),
  consider extension request to Samantha Liu


  ## Step 5: Verify Vendor Relationship Context

  - Call `contacts_search` or `contacts_get` for vendor contacts

  - Review CON-357 (Samantha Liu, ColorWave): Strong relationship, 2 prior
  extensions granted, medium-high extension likelihood

  - Review CON-358 (Marco Delgado, Verdant Press): New vendor, zero extension
  likelihood per policy

  - Review CON-356 (Jennifer Park, Swift Print): Moderate relationship, low
  extension likelihood


  ## Step 6: Calculate Optimal Allocation

  - **Primary recommendation**: Path A (ColorWave consolidation) if 48-hour
  extension granted
    - All three projects to ColorWave: $840 base → $672 after 20% → $587 after $85 credit
    - Preserves irreversible $85 credit, achieves lowest net cost
    - Requires order by March 27 to meet March 30 Café Verdant deadline (4-6 day lead time)
    - Payment due March 29 (or March 31 if extension granted): $587 < $4,250 ✓

  - **Fallback recommendation**: Path C if extension denied
    - ColorWave (Café + Terraloop): $600 base → $480 after 20% → $395 after $85 credit
    - Verdant Press (GreenFutures): $240 base → $196.80 after 18%
    - Total: $591.80 net cost
    - Payment sequencing: $395 by March 29, $196.80 by March 31 (both < $4,250) ✓
    - Preserves $85 credit, captures Verdant one-time offer

  ## Step 7: Validate Against Constraints

  - Cash flow: Both paths require <$600 before April 3 GreenRoot payment ✓

  - Delivery timelines: 
    - Path A: Order March 27 → delivery April 1-3 (meets all deadlines) ✓
    - Path C: ColorWave order March 27 → April 1-3, Verdant order March 29 → April 2-4 ✓
  - Promotional terms: All discounts and credits applied correctly ✓

  - Irreversible asset protection: $85 ColorWave credit preserved in both paths
  ✓


  ## Step 8: Document Recommendation

  - Create `todo_create_task` for extension request to Samantha Liu (due March
  26)

  - Update TODO-874, TODO-875, TODO-876 with final cost calculations

  - Recommend Path A ($587 net) as primary, Path C ($591.80 net) as fallback

  - Total savings vs. base cost: $248-$253 (29-30% effective discount)


  ## Key Decision Rationale

  The $85 ColorWave credit represents 10% of total order value and is the
  highest-risk asset due to irreversible expiration March 29. Prioritizing its
  capture is financially optimal even if it means accepting a lower percentage
  discount (20% vs. 25% Swift) on the overall order. The strong relationship
  with Samantha Liu (2 prior extensions) justifies attempting a 48-hour
  extension request to enable full consolidation at ColorWave for maximum
  savings.
