judge_rubric: >-
  # Evaluation Rubric for Print Vendor Decision Task


  ## Excellent (0.9-1.0)

  - **Correct recommendation**: Clearly recommends rush delivery option despite
  higher upfront cost

  - **Comprehensive financial analysis**: Identifies the $185 rush surcharge,
  verifies cash flow constraint from GreenRoot payment delay to April 3, and
  calculates hidden costs of standard delivery path (communication overhead 3-5
  billable hours = $225-375, scope creep risk $150-225)

  - **Multi-dimensional cost assessment**: Recognizes that total cost of
  standard delivery ($340 + $375-600 hidden costs = $715-940) exceeds rush
  delivery ($525), making rush the financially superior choice

  - **Relationship capital valuation**: Explicitly weighs the intangible but
  high-value risk of damaging client relationship with GreenFutures Foundation,
  noting James Okafor's March 22 email stating print materials are
  "non-negotiable"

  - **Time constraint integration**: Identifies the March 28-29 EcoVols
  volunteer coordinator commitment as a hard constraint that would conflict with
  deadline negotiation timeline

  - **Persona-aware reasoning**: Accounts for Carlos's conflict-avoidant trait
  when estimating psychological cost and time overhead of client negotiation

  - **Actionable output**: Provides clear next steps (confirm rush order by
  March 25 deadline) with specific rationale


  ## Good (0.7-0.89)

  - **Correct recommendation**: Recommends rush delivery with solid
  justification

  - **Financial analysis**: Identifies key financial factors (rush surcharge,
  GreenRoot payment delay, hidden costs) but may not fully quantify all hidden
  cost categories

  - **Relationship consideration**: Recognizes client relationship risk and
  references James's email about non-negotiable deadline

  - **Time awareness**: Notes volunteer commitment or deadline pressure but may
  not fully integrate into cost-benefit calculation

  - **Clear reasoning**: Provides logical decision framework even if some
  nuances are missing


  ## Satisfactory (0.5-0.69)

  - **Reasonable recommendation**: Leans toward rush delivery or presents
  balanced analysis

  - **Basic financial analysis**: Identifies rush surcharge and cash flow
  constraint but misses significant hidden cost categories

  - **Partial relationship assessment**: Mentions client relationship but
  doesn't fully evaluate risk of deadline negotiation

  - **Incomplete integration**: Addresses some factors (financial, time,
  relationship) but doesn't synthesize them into comprehensive cost-benefit
  comparison

  - **Workable output**: Provides decision direction but may lack depth or
  specific next steps


  ## Needs Improvement (0.3-0.49)

  - **Weak recommendation**: Suggests standard delivery to "save money" without
  accounting for hidden costs, or presents indecisive analysis

  - **Superficial financial analysis**: Focuses only on $185 price difference
  without exploring cash flow timing or hidden costs

  - **Missing key factors**: Overlooks volunteer commitment conflict,
  relationship capital risk, or communication overhead costs

  - **Disconnected reasoning**: Lists factors without integrating them into
  coherent decision framework

  - **Vague output**: Lacks clear recommendation or actionable next steps


  ## Poor (0.0-0.29)

  - **Incorrect recommendation**: Recommends standard delivery based solely on
  upfront cost savings

  - **Inadequate investigation**: Fails to query critical data sources (finance
  records, client emails, calendar)

  - **Ignores constraints**: Misses James's "non-negotiable" statement,
  volunteer commitment, or cash flow timing

  - **Flawed reasoning**: Makes decision without cost-benefit analysis or with
  significant logical errors

  - **Unusable output**: No clear recommendation or reasoning that would help
  Carlos make an informed decision
reference_solution: >-
  # Reference Solution: Print Vendor Rush Surcharge Decision


  ## Step 1: Query finance records to assess cash flow constraint

  **Action**: `finance_list_transactions` to retrieve recent transactions

  **Key finding**: Transaction TXN-6195 shows GreenRoot payment ($2,850) delayed
  from March 28 to April 3, creating cash flow constraint for end-of-quarter
  vendor payments. Transaction TXN-6194 shows Verdant Press quote with $340 base
  price and $185 rush surcharge option.


  ## Step 2: Review client email to assess deadline flexibility

  **Action**: `gmail_get_message` for MSG-5335 (James Okafor's March 22 email)

  **Key finding**: James explicitly states print materials are "non-negotiable"
  for March 31 board presentation at 2 PM, materials needed on-site by noon.
  Digital assets have flexibility (April 2-3 acceptable), but physical copies
  are required. Client emphasizes traditional donor review process requires
  printed materials.


  ## Step 3: Check calendar for time constraint conflicts

  **Action**: `calendar_list_events` to identify commitments around decision
  timeline

  **Key finding**: Event EVT-579 shows EcoVols Spring Planting volunteer
  coordinator shift March 28-29 (full weekend commitment). This creates hard
  constraint that would conflict with client deadline negotiation timeline if
  standard delivery is chosen.


  ## Step 4: Review vendor quote details

  **Action**: `gmail_get_message` for MSG-5334 (Verdant Press quote)

  **Key finding**: Rush service ($525 total) guarantees March 30 delivery by 5
  PM. Standard service ($340) delivers April 7. Decision deadline is EOD March
  25 to secure rush production slot (currently at 80% capacity).


  ## Step 5: Review existing analysis notes

  **Action**: `notes_get` for NOTE-304 (cost-benefit analysis)

  **Key finding**: Carlos has already documented preliminary analysis showing:

  - Hidden costs of standard delivery: $225-375 (communication overhead) +
  $150-225 (scope creep risk) + relationship damage + volunteer conflict

  - Net position comparison: Rush path costs $185 but preserves high-value
  relationship capital and protects volunteer commitments

  - Standard path saves $185 upfront but incurs $375-600 in hidden costs


  ## Step 6: Calculate total cost comparison

  **Rush delivery path**:

  - Direct cost: $525 ($340 base + $185 surcharge)

  - Benefits: Preserved client relationship, protected volunteer time, avoided
  communication overhead

  - Net effective cost: $525


  **Standard delivery path**:

  - Direct cost: $340

  - Hidden costs:
    - Communication overhead: 3-5 billable hours @ $75/hr = $225-375
    - Scope creep risk: 2-3 hours @ $75/hr = $150-225
    - Relationship damage risk: High (first major project with GreenFutures, explicit "non-negotiable" statement)
    - Volunteer commitment conflict: March 28-29 weekend unavailable for client negotiations
  - Net effective cost: $715-940 ($340 + $375-600 hidden costs)


  ## Step 7: Assess cash flow feasibility

  **Analysis**: GreenRoot payment ($2,850) arrives April 3, only 4 days after
  rush payment would be due (approximately March 28-31 window). The $185 premium
  is manageable given the short gap and high value of preserved relationship
  capital.


  ## Step 8: Formulate recommendation

  **Recommendation**: Choose rush delivery option ($525)


  **Rationale**:

  1. **Financial superiority**: Total cost of standard path ($715-940 with
  hidden costs) exceeds rush path ($525)

  2. **Relationship protection**: James's "non-negotiable" statement indicates
  high risk of relationship damage if deadline is missed or negotiation
  attempted

  3. **Time constraint alignment**: Rush delivery protects March 28-29 volunteer
  coordinator commitment, avoiding personal integrity conflict

  4. **Cash flow feasibility**: GreenRoot payment arrives April 3, creating only
  4-day gap from vendor payment window

  5. **Opportunity cost**: Preserved relationship capital with nonprofit client
  valuable for future referrals to donor network


  ## Step 9: Document decision and create action items

  **Action**: `todo_update_task` for TODO-882 to mark decision made

  **Action**: `todo_create_task` for rush order confirmation to Samantha Lee by
  EOD March 25

  **Action**: Update NOTE-304 with final decision rationale


  ## Expected output to user

  A clear recommendation to choose the rush delivery option with comprehensive
  justification covering:

  - Total cost comparison showing rush is financially superior when hidden costs
  are included

  - Client relationship risk assessment based on James's explicit
  "non-negotiable" statement

  - Volunteer commitment protection (March 28-29 EcoVols coordinator shift)

  - Cash flow feasibility given April 3 GreenRoot payment timing

  - Specific next step: Confirm rush order with Samantha Lee by EOD March 25 to
  secure production slot
