task_id: T04_T20_print_vendor_rush_surcharge_vs_client_de
task_name: Print Vendor Rush Surcharge vs. Client Deadline Renegotiation — Time-Money
  Tradeoff for GreenFutures Pitch Deck Delivery
category: decision_making
difficulty: simple
prompt:
  text: I need to decide on the print vendor option for the GreenFutures pitch deck
    by March 25. Should I pay the rush surcharge or go with standard delivery? Help
    me figure out what makes the most financial and practical sense.
  language: en
execution_date: '2026-04-05'
