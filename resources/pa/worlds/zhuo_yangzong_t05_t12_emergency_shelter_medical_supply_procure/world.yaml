task_id: T05_T12_emergency_shelter_medical_supply_procure
task_name: Emergency Shelter Medical Supply Procurement - Allergen Compliance Threshold
  Recovery
category: decision_making
difficulty: simple
prompt:
  text: I just saw Dr. Santos's urgent email about latex allergies at the emergency
    shelter. We have a medical supply order about to go through — can you make sure
    we're not putting anyone at risk while keeping our procurement budget on track?
  language: en
execution_date: '2026-04-05'
