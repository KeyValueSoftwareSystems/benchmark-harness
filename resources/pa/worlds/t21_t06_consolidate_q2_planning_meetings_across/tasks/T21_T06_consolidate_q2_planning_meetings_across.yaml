scoring_components:
- name: Identified critical back-to-back conflict on April 9
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - April 9
      - 4/9
      - ninth
    - - '15:30'
      - 3:30 PM
      - 3:30pm
      - immediately after
      - back-to-back
      - no buffer
    - - Data Pipeline
      - EVT-355
      - data team
      - capacity sync
    - - Leadership Review
      - VP review
      - EVT-354
- name: Identified high-priority conflict on April 8
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - April 8
      - 4/8
      - eighth
    - - '11:30'
      - 11:30 AM
      - 11:30am
    - - Customer Success
      - EVT-353
      - CS coordination
      - churn prevention
    - - back-to-back
      - zero buffer
      - no prep time
      - context switch
- name: Recognized VP-level stakeholder constraints
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Jennifer Wong
      - VP Engineering
      - VP Eng
    - - Thomas Rivera
      - VP Product
    - - cannot reschedule
      - cannot be rescheduled
      - locked
      - immovable
      - 48hr notice
      - 48 hour notice
