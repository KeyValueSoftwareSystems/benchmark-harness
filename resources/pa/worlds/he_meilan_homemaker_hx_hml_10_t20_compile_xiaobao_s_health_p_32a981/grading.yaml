judge_rubric: 'Evaluate from He Meilan''s perspective as a detail-oriented mother
  managing her child''s health and growth. Award full marks if the response: (1) provides
  a comprehensive, chronologically structured health summary covering all three fever
  episodes with specific dates and temperatures; (2) clearly identifies the correlation
  between the February 25 formula switch and subsequent fever pattern, raising formula
  intolerance as a key concern for Dr. Zhao; (3) explicitly flags the April 1 return
  deadline conflict and its financial impact (2,320 RMB at risk), acknowledging the
  urgency of deciding before the consultation; (4) cross-references vaccination dates
  to rule out vaccine reactions; (5) includes kindergarten illness reports and the
  March 26 rash observation; (6) identifies data gaps (previous formula brand, January
  fever history) that need clarification; (7) maintains factual, non-diagnostic tone
  appropriate for physician review; (8) organizes information in a consultation-ready
  format with timeline visualization. Deduct heavily if: the response makes medical
  diagnoses or treatment recommendations rather than aggregating data; fails to connect
  the formula switch timing with fever onset; misses the urgent April 1 deadline creating
  decision pressure; omits any of the three fever episodes; or provides disorganized
  information unsuitable for a pediatrician consultation. Moderate deductions for:
  missing the rash correlation, incomplete vaccination cross-reference, or failure
  to flag data gaps. The response should demonstrate the thoroughness and attention
  to detail expected of an ISFJ parent preparing for a specialist consultation about
  recurring pediatric illness.'
reference_solution: '**Step 1**: Call `notes_list` to find health-related notes about
  Xiaobao. Identify NOTE-256 (comprehensive health summary) and NOTE-257 (March 28-30
  fever log).


  **Step 2**: Call `notes_get` with note_id=''NOTE-256'' to retrieve the detailed
  health pattern analysis. This note contains: (a) all three fever episodes with dates
  (Feb 28, March 6, March 28), temperatures (38.7°C, 39.1°C, 38.5°C), and durations;
  (b) formula switch timeline showing NutriGrow HA Pro started Feb 25; (c) correlation
  analysis showing all fevers occurred AFTER formula switch (3 days, 11 days, 31 days
  post-switch); (d) vaccination cross-reference ruling out vaccine reaction (last
  vaccination Jan 15); (e) kindergarten absence pattern (7 days total); (f) urgent
  April 1 return deadline for 4 unopened cans worth 2,320 RMB; (g) budget impact analysis;
  (h) identified data gaps.


  **Step 3**: Call `notes_get` with note_id=''NOTE-257'' to retrieve the detailed
  March 28-30 fever log with hourly temperature readings, medication doses, and the
  March 29 observation about the rash (same area kindergarten nurse mentioned March
  26).


  **Step 4**: Call `finance_list_transactions` with filters for formula purchases.
  Identify TXN-6089 (Feb 24, 6 cans NutriGrow HA Pro, 580 RMB each) and TXN-6112 (March
  20, 3 cans). Calculate total spend: 5,220 RMB over two months, 45% over the 2,000
  RMB monthly budget. Note the 4 unopened cans represent 2,320 RMB at risk if return
  deadline passes.


  **Step 5**: Call `calendar_list_events` or `calendar_get_user_events` to retrieve
  vaccination and appointment dates. Identify EVT-315 (Jan 15 vaccination), EVT-462
  (April 8 next scheduled vaccination), EVT-475 (April 2 Dr. Zhao consultation), and
  EVT-476 (April 1 formula return deadline). Confirm no fever episodes coincide with
  vaccination dates.


  **Step 6**: Call `gmail_list_messages` with filters for kindergarten or medical-related
  messages. Retrieve MSG-5067 (Feb 28 kindergarten sent Xiaobao home with fever),
  MSG-5205 (April 2 appointment confirmation with 48-hour fever-free requirement),
  and MSG-5208 (He Meilan''s pre-consultation email to Dr. Zhao asking about fever
  status and formula return decision).


  **Step 7**: Synthesize findings into a structured consultation summary document
  that includes:

  - **Fever Episode Timeline**: Three episodes (Feb 28, March 6, March 28) with specific
  dates, peak temperatures, durations, and treatment

  - **Formula Correlation Analysis**: All three episodes occurred after Feb 25 switch
  to NutriGrow HA Pro; timing pattern (3, 11, 31 days post-switch); March 26 rash
  observation adds supporting evidence

  - **Vaccination Cross-Reference**: Last vaccination Jan 15, no temporal correlation
  with fever episodes, rules out vaccine reaction

  - **Kindergarten Impact**: 7 days absent in Feb-March, above normal per teacher
  feedback

  - **Urgent Decision Point**: April 1 return deadline for 4 unopened cans (2,320
  RMB) creates time pressure—decision needed before consultation but without medical
  guidance

  - **Budget Impact**: Monthly formula spend 2,900 RMB vs 2,000 RMB budget (45% over);
  potential loss if return denied

  - **Data Gaps**: Previous formula brand name, January fever history, detailed ingredient
  comparison needed

  - **Questions for Dr. Zhao**: Formula intolerance possibility, frequency concern
  (3 episodes in 5 weeks), diagnostic tests needed, formula recommendation


  **Step 8**: Present the summary in a consultation-ready format, maintaining factual
  tone without making medical diagnoses. Flag the April 1 deadline conflict prominently
  as it requires immediate decision-making. Include specific record references (temperatures,
  dates, amounts) to support pattern analysis.'
