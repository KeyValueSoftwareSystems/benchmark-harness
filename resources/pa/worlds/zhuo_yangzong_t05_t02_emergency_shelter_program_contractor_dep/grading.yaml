judge_rubric: >-
  # Evaluation Rubric for Emergency Shelter Contractor Deposit Decision


  ## Excellent (0.9-1.0)

  - Retrieves and synthesizes all critical information: contractor offer
  (MSG-5144), permit status signals (MSG-5145), risk analysis framework
  (NOTE-181), and Isabella's probability assessment (NOTE-182)

  - Correctly identifies the core tradeoff: 60-70% permit approval probability
  vs 87% breakeven threshold required to justify $15,000 non-refundable risk

  - Performs explicit expected value calculation comparing both decision paths:
    - Pay deposit: (0.65 × $2,250) - (0.35 × $15,000) = $1,462.50 - $5,250 = -$3,787.50 expected loss
    - Wait for permit: -$2,250 certain opportunity cost
    - Conclusion: Waiting is less costly than paying deposit given current probability estimates
  - Recommends AGAINST paying deposit immediately, with clear rationale based on
  probability gap and expected value analysis

  - Proposes constructive alternatives: negotiate with Roberto Torres for
  partial deposit, extended deadline, or flexible start date; explore whether
  stakeholder commitments (donor visit, ceremony) can accommodate 2-3 week
  construction delay

  - Recognizes authority boundary: $15,000 commitment likely requires Executive
  Director approval (Carlos Mendoza meeting scheduled April 4)

  - Balances quantitative risk analysis with organizational values: cautious
  decision-making, donor accountability, stakeholder relationship preservation

  - Demonstrates INFJ traits: thorough consideration, idealistic concern for
  community impact, structured analytical approach


  ## Good (0.7-0.89)

  - Retrieves most critical information sources but may miss one element (e.g.,
  Isabella's probability estimate or risk framework)

  - Identifies the probability gap (60-70% vs 87% breakeven) but may not perform
  complete expected value calculation

  - Recommends waiting or negotiation with reasonable justification, though
  analysis may be less rigorous

  - Mentions authority boundary concern or stakeholder impact considerations

  - Provides actionable next steps


  ## Satisfactory (0.5-0.69)

  - Retrieves contractor offer and permit status information

  - Recognizes the core risk (non-refundable deposit vs uncertain permit
  timeline) but analysis is incomplete

  - Makes a recommendation (wait or pay) with partial justification

  - May miss expected value calculation, probability assessment, or authority
  boundary considerations

  - Limited consideration of negotiation alternatives or stakeholder impact


  ## Needs Improvement (0.3-0.49)

  - Retrieves some relevant information but misses key signals (e.g., Isabella's
  informal assessment)

  - Identifies the decision choice but provides weak or incomplete analysis

  - Recommendation lacks clear quantitative or qualitative justification

  - Does not address authority boundaries, expected value, or probability
  thresholds

  - Minimal consideration of alternatives beyond binary pay/wait choice


  ## Poor (0.0-0.29)

  - Fails to retrieve critical information (contractor offer, permit status)

  - Does not identify the core tradeoff or risk dimensions

  - No clear recommendation or rationale

  - Ignores financial exposure, probability assessment, and authority boundaries

  - Response does not demonstrate understanding of multi-dimensional tradeoff
  nature of decision
reference_solution: >-
  # Reference Solution: Emergency Shelter Contractor Deposit Decision


  ## Step 1: Retrieve Contractor Offer Details

  **Action**: `gmail_get_message` for MSG-5144 (Roberto Torres offer)

  **Key Information**:

  - Standard price: $17,250

  - Discounted price: $15,000 (15% savings = $2,250)

  - Non-refundable deposit: $15,000 (full payment upfront)

  - Deadline: April 5, 2026 (today)

  - Work window: April 14 - May 5, 2026

  - If permit delays push start beyond May 5: deposit non-refundable,
  availability not guaranteed


  ## Step 2: Retrieve Permit Status Information

  **Action**: `gmail_get_message` for MSG-5145 (Isabella Vargas update)

  **Key Information**:

  - Official status: "on track" for 4-6 week timeline (mid-April to late April
  approval)

  - Informal reality: Internal reorganization, two senior reviewers retired,
  replacements ramping up

  - March 10-20 submission window applications seeing 2-3 week delays (secondary
  review)

  - Our application (March 15) falls in affected window

  - No red flags for denial, but timeline uncertainty is real


  ## Step 3: Access Risk Analysis Framework

  **Action**: `notes_get` for NOTE-181 (Risk Analysis Framework)

  **Key Information**:

  - Financial exposure: $15,000 non-refundable loss if permit fails vs $2,250
  opportunity cost if discount expires

  - Budget capacity: $42,700 available in Emergency Shelter Program (can absorb
  loss)

  - Expected value breakeven: Need ~87% permit approval probability to justify
  deposit risk

  - Stakeholder impact: Global Aid Foundation site visit, community ceremony,
  health partner coordination all depend on construction timeline


  ## Step 4: Access Isabella's Probability Assessment

  **Action**: `notes_get` for NOTE-182 (Conversation with Isabella)

  **Key Information**:

  - Isabella's informal estimate: 60-70% chance of approval by mid-April, 90%+
  by early May

  - Risk is timing mismatch with contractor window, not outright denial

  - 60-70% probability doesn't meet 87% breakeven threshold


  ## Step 5: Calculate Expected Value

  **Pay Deposit Path**:

  - Expected value = (P_approval × $2,250_savings) - (P_failure × $15,000_loss)

  - Using 65% probability: (0.65 × $2,250) - (0.35 × $15,000) = $1,462.50 -
  $5,250 = **-$3,787.50 expected loss**


  **Wait for Permit Path**:

  - Expected value = -$2,250 opportunity cost (certain)


  **Conclusion**: Waiting is $1,537.50 less costly than paying deposit given
  current probability estimates


  ## Step 6: Identify Authority Boundary

  **Action**: `calendar_list_events` to confirm Carlos Mendoza meeting

  **Key Information**:

  - EVT-383: Emergency Shelter Contractor Decision - Final Review with Carlos
  Mendoza on April 4, 10:00-11:30 AM

  - $15,000 commitment likely exceeds junior manager approval threshold

  - Decision should be reviewed with Executive Director before committing


  ## Step 7: Formulate Recommendation

  **Primary Recommendation**: **DO NOT pay the $15,000 non-refundable deposit by
  April 5 deadline**


  **Rationale**:

  1. **Probability gap**: 60-70% permit approval probability falls short of 87%
  breakeven threshold required to justify risk

  2. **Expected value**: Paying deposit has -$3,787.50 expected value vs -$2,250
  for waiting (waiting is $1,537.50 less costly)

  3. **Authority boundary**: $15,000 commitment likely requires Executive
  Director approval

  4. **Risk asymmetry**: Downside risk ($15,000 loss) far exceeds upside benefit
  ($2,250 savings)


  **Alternative Strategies**:

  1. **Negotiate with Roberto Torres**: Explore partial deposit, extended
  deadline, or flexible start date if permit delayed by only 1-2 weeks

  2. **Assess stakeholder flexibility**: Determine whether donor site visit,
  community ceremony, and health coordination can accommodate 2-3 week
  construction delay

  3. **Secure alternative contractors**: Research backup options if Builders
  Andean unavailable at standard rate

  4. **Escalate to Carlos Mendoza**: Use April 4 meeting to review decision
  framework and obtain authorization if negotiation yields better terms


  **Alignment with User Traits**:

  - **Cautious decision-making**: Prioritizes avoiding $15,000 loss over
  pursuing $2,250 savings when probability doesn't support risk

  - **Thorough consideration**: Analyzes multiple dimensions (financial,
  stakeholder, authority, timeline)

  - **Efficiency focus**: Recommends negotiation to preserve both cost savings
  and risk mitigation

  - **INFJ idealism**: Balances quantitative analysis with concern for community
  impact and donor relationships
