judge_rubric: >-
  # Evaluation Rubric for Scheduling Conflict Detection Task


  ## Core Competencies (scheduling axis focus)


  ### 1. Proactive Information Retrieval (30 points)

  - **Excellent (25-30)**: Agent independently checks workmail AND gmail before
  confirming meeting; discovers WMSG-5009 travel notification and cross-verifies
  with conference/travel confirmations

  - **Good (18-24)**: Agent checks workmail and finds travel conflict, but
  misses gmail cross-verification or doesn't fully assess credibility

  - **Adequate (10-17)**: Agent checks one channel (workmail OR gmail) and finds
  partial conflict information

  - **Poor (0-9)**: Agent relies solely on calendar availability without
  checking email channels


  ### 2. Conflict Detection & Calendar-Reality Gap Analysis (35 points)

  - **Excellent (30-35)**: Clearly identifies that April 9 falls within April
  8-12 travel window; explicitly notes calendar shows "available" but Dr. Wang
  is actually traveling; explains why this is a real conflict (international
  conference, limited availability)

  - **Good (22-29)**: Identifies the date conflict and travel overlap, but
  doesn't explicitly articulate the calendar-reality gap or why calendar status
  is misleading

  - **Adequate (12-21)**: Notices Dr. Wang mentioned travel but unclear whether
  April 9 specifically conflicts; vague about calendar vs. reality

  - **Poor (0-11)**: Misses the conflict entirely or incorrectly concludes April
  9 is still viable


  ### 3. Credibility Assessment of Informal Channel (15 points)

  - **Excellent (13-15)**: Assesses sender identity (Dr. Wang himself),
  timestamp recency (April 2), context (team notification), and cross-verifies
  with official gmail records (conference registration MSG-5094, HR travel
  itinerary MSG-5095)

  - **Good (9-12)**: Notes the workmail is from Dr. Wang and recent, but doesn't
  fully cross-verify or assess credibility systematically

  - **Adequate (5-8)**: Mentions workmail information but treats it as equal
  weight to calendar without credibility analysis

  - **Poor (0-4)**: Ignores workmail information or dismisses it as unreliable


  ### 4. Alternative Time Slot Proposal (15 points)

  - **Excellent (13-15)**: Proposes specific alternative(s) outside April 8-12
  window (e.g., April 7 before departure OR April 14 after return); explains
  reasoning based on Dr. Wang's "before April 7 or after April 13" guidance

  - **Good (9-12)**: Proposes alternative time(s) that avoid travel dates but
  doesn't explain rationale or reference Dr. Wang's availability guidance

  - **Adequate (5-8)**: Suggests rescheduling but without specific dates or only
  vague "after he returns"

  - **Poor (0-4)**: No alternative proposed, or suggests time still within
  travel window


  ### 5. Social Dynamics & Communication Approach (5 points)

  - **Excellent (5)**: Acknowledges the workmail discovery explicitly ("I
  noticed from your email..."), shows respect for mentor's time, offers
  flexibility (primary + backup option)

  - **Good (3-4)**: Proposes reschedule politely but doesn't explicitly
  reference the workmail source or show awareness of junior-mentor dynamic

  - **Adequate (1-2)**: Mechanical reschedule without social awareness

  - **Poor (0)**: Inappropriate tone or ignores mentor's explicit availability
  guidance


  ## Deductions

  - **-10 points**: Schedules meeting based solely on calendar without checking
  email

  - **-5 points**: Proposes time that still conflicts with travel window (April
  8-12)

  - **-5 points**: Fails to cross-check multiple information sources when
  credible conflict signals exist


  ## Bonus

  - **+5 points**: Documents the scheduling pattern in notes for future
  reference (calendar surface status ≠ true availability)

  - **+3 points**: Explicitly mentions checking both workmail AND gmail in the
  investigation process


  **Total: 100 points** (clamped to 100 if bonus pushes above)
reference_solution: >-
  # Reference Solution: Mentor Meeting Scheduling Conflict Detection


  ## Step 1: Understand the Initial Request Context

  - User (Li Ming) sent meeting request to Dr. Wang on April 4 (yesterday)

  - Proposed time: April 9 (Wednesday) at 2:00 PM

  - Topic: Urgent Q2 GPU resource planning

  - Basis: Dr. Wang's calendar showed that slot as available

  - User is now asking for confirmation whether this is actually a good time


  ## Step 2: Proactively Check Workmail for Hidden Information

  **Action**: `workmail_list_messages` (filter recent messages, especially from
  Dr. Wang or to team)

  **Discovery**: Message WMSG-5009 from wang.wei@bytedance.com dated 2026-04-02


  **Action**: `workmail_get_message(message_id="WMSG-5009")`

  **Key Content**:

  - Subject: "FYI: Traveling to ICML 2026 conference April 8-12"

  - Dr. Wang will be in Vienna for ICML conference April 8-12

  - Presenting paper on April 10

  - Explicitly states: "limited availability during the conference"

  - Guidance: "For urgent matters, please reach out before April 7 or after
  April 13"

  - Sent to algorithm-team@bytedance.com (official team notification)


  ## Step 3: Assess Credibility of Workmail Information

  - **Sender**: Dr. Wang himself (wang.wei@bytedance.com) — primary source,
  highly credible

  - **Timestamp**: April 2, 2026 — recent (3 days ago), still relevant

  - **Context**: Sent to entire algorithm team as FYI — official notification

  - **Specificity**: Concrete dates, conference name, presentation details


  ## Step 4: Cross-Verify with Gmail

  **Action**: `gmail_list_messages` (search for conference, ICML, travel, Dr.
  Wang)

  **Action**: `gmail_get_message(message_id="MSG-5094")` — ICML 2026 Conference
  Registration Confirmation

  - Confirms: April 8-12, 2026, Vienna

  - Dr. Wang's presentation: April 10, 10:30 AM - 12:00 PM CEST


  **Action**: `gmail_get_message(message_id="MSG-5095")` — HR Travel Itinerary

  - Outbound flight: April 7, CA841, 13:30 departure from Beijing

  - Return flight: April 13, CA842, from Vienna

  - Hotel: April 7-13 (6 nights)


  **Credibility Assessment**: Workmail information is CONFIRMED by official
  conference registration and HR travel booking


  ## Step 5: Identify the Conflict

  - **Proposed meeting time**: April 9, 2:00 PM Beijing time

  - **Dr. Wang's actual status**: Traveling in Vienna for ICML conference (April
  8-12)

  - **Flight departure**: April 7 at 13:30 — he won't even be in Beijing on
  April 9

  - **Calendar status**: Shows "available" but this is MISLEADING

  - **Gap**: Calendar surface status ≠ true availability


  ## Step 6: Determine Alternative Time Slots

  Based on Dr. Wang's guidance: "before April 7 or after April 13"


  **Option A: Before Departure**

  - **Action**: `calendar_get_user_events(user_email="wang.wei@bytedance.com",
  start_date="2026-04-05", end_date="2026-04-07")`

  - Check availability on April 7 (Monday) morning slots

  - **Constraint**: Must be morning (departure flight 13:30)

  - **Suggested slot**: April 7, 10:00-11:00 AM


  **Option B: After Return**

  - **Action**: `calendar_get_user_events(user_email="wang.wei@bytedance.com",
  start_date="2026-04-14", end_date="2026-04-18")`

  - Check availability on April 14 (Monday) or later

  - **Suggested slot**: April 14, 2:00-3:00 PM

  - **Trade-off**: Delayed by 10 days, but Dr. Wang will have full attention


  ## Step 7: Formulate Response

  **Key elements**:

  1. **Acknowledge the conflict**: "I checked your recent workmail and noticed
  you're traveling to ICML in Vienna from April 8-12, so the April 9 meeting I
  proposed won't work."

  2. **Show credibility assessment**: "I cross-checked with the conference
  registration and HR travel itinerary to confirm."

  3. **Explain the gap**: "Your calendar showed April 9 as available, but you'll
  actually be at the conference."

  4. **Propose alternatives with reasoning**:
     - Primary: "Would April 7 (Monday) at 10:00 AM work? That's before your 13:30 departure."
     - Backup: "If that's too tight with travel prep, I can wait until April 14 (Monday) at 2:00 PM after you return."
  5. **Show respect for mentor's time**: "I apologize for not checking email
  before proposing the original time. Let me know which option works better for
  you."


  ## Step 8: Optional - Document Pattern for Future Reference

  **Action**: `notes_list()` and check if NOTE-140 exists

  **Action**: Review NOTE-140 content if it exists, or create similar
  documentation

  **Pattern to remember**: Always cross-check workmail/gmail for travel
  notifications before scheduling with senior staff, especially for "urgent"
  meetings. Calendar availability is not sufficient — need to verify true
  availability through informal channels.


  ## Expected Output to User

  "I found a conflict with the April 9 meeting time you proposed. Dr. Wang sent
  a workmail on April 2 notifying the team that he'll be traveling to ICML 2026
  conference in Vienna from April 8-12, and he specifically mentioned having
  limited availability during that period. I cross-verified this with his
  conference registration and HR travel itinerary — his outbound flight departs
  Beijing on April 7 at 13:30.


  Even though his calendar shows April 9 as available, he won't actually be in
  the office. He suggested reaching out 'before April 7 or after April 13' for
  urgent matters.


  I'd recommend rescheduling to either:

  1. **April 7 (Monday) at 10:00 AM** — before his departure (primary option if
  you need the decision soon)

  2. **April 14 (Monday) at 2:00 PM** — after he returns (backup if April 7 is
  too rushed)


  Both slots appear free on his calendar. Which would you prefer? I can send him
  a corrected meeting request once you decide."
