judge_rubric: 'Award full marks if the agent: (1) correctly recommends the rental
  option as the optimal decision, (2) identifies the hard constraint that Olivia cannot
  serve untested recipes at the VIP preview event due to her perfectionist quality
  standards and high reputational stakes (SBA loan officer and Food & Wine editor
  attending), (3) calculates that both options lose the April 5th testing session
  but rental guarantees equipment availability for April 12th and 19th sessions, (4)
  compares total costs (repair $1,850 vs rental ~$1,615 for 19 days through April
  23rd) and notes rental is slightly cheaper, (5) recognizes rental provides flexibility
  to extend if needed and mitigates risk of parts delays that could jeopardize remaining
  testing sessions, (6) frames the decision in terms of Olivia''s business context:
  tight cash flow ($2,847 monthly loan payment), three-star training background (will
  not compromise quality), and critical importance of preview success for SBA relationship
  and Food & Wine feature opportunity. Deduct points if the agent: recommends repair
  without adequately weighing timeline risk and testing constraints, ignores the hard
  quality constraint (suggests serving untested recipes or compressing testing), fails
  to identify that both options lose April 5th session, miscalculates rental cost
  or timeline, or does not connect the decision to stakeholder relationship stakes
  (Patricia Nguyen from SBA, David Choi from Food & Wine). The analysis should reflect
  Olivia''s decision-making style: systematic constraint evaluation, prioritization
  of quality and reputation over short-term cost savings, and recognition that equipment
  reliability during testing is non-negotiable given the high-stakes preview event.'
reference_solution: 'Step 1: Query calendar (calendar_list_events) to identify all
  spring menu testing sessions between now (April 2nd) and preview event (April 23rd).
  Find three critical sessions: EVT-393 (April 5th entremet testing), EVT-394 (April
  12th frozen components), EVT-395 (April 19th full dress rehearsal). All require
  blast chiller. Step 2: Query gmail (gmail_list_messages) to retrieve equipment quotes
  and stakeholder context. Find MSG-5111 (Robert Kim quote: repair $1,850 with 7-10
  day parts lead time + 1 day install = 8-11 days total, vs rental $85/day available
  April 4th), MSG-5112 (Patricia Nguyen SBA loan officer confirming attendance with
  colleague, views event as demonstration of operational momentum), MSG-5113 (David
  Choi Food & Wine editor evaluating for feature story, expects polished final dishes).
  Step 3: Query contacts (contacts_search for Patricia Nguyen, David Choi) to understand
  relationship stakes. Find CON-244 (Patricia is primary SBA contact for $180K loan,
  relationship critical for refinancing discussions), CON-245 (David is senior editor
  evaluating for Portland dessert scene feature, high-stakes press opportunity). Step
  4: Query notes (notes_list, notes_get NOTE-172) to find Olivia''s own decision analysis.
  She has already worked through the logic: both options lose April 5th session, rental
  guarantees equipment for April 12th and 19th, repair timeline is 8-11 days (operational
  April 7-10 at earliest), rental cost is $1,615 for 19 days vs repair $1,850, rental
  provides flexibility and mitigates parts delay risk. Step 5: Query finance (finance_list_transactions)
  to confirm cash flow context. Find TXN-6043 (monthly SBA loan payment $2,847 paid
  March 28th), TXN-6044 (blast chiller maintenance $385 on March 15th, technician
  noted temperature control issues). Step 6: Calculate net benefit of each option.
  Repair: $1,850 upfront, 8-11 day timeline means operational April 7-10 (miss April
  5th session, catch April 12th and 19th), 90-day warranty, but parts delay risk could
  push timeline further. Rental: $85/day starting April 4th, miss April 5th session,
  guaranteed available for April 12th and 19th, total cost ~$1,615 (19 days through
  April 23rd), flexibility to extend if needed, no parts delay risk. Step 7: Evaluate
  against hard constraint: Olivia will not serve untested recipes at preview event
  per quality standards (three-star training, will discard batch over 2-degree deviation).
  Preview has VIP attendees (SBA loan officer evaluating operational competence, Food
  & Wine editor evaluating for feature story, industry supporters). Serving suboptimal
  desserts risks SBA relationship, press coverage, and professional reputation. Step
  8: Recommend rental option. Reasoning: (a) Both options lose April 5th session,
  so no testing time advantage for repair. (b) Rental is $235 cheaper ($1,615 vs $1,850)
  and easier on cash flow at $85/day vs $1,850 upfront. (c) Rental guarantees equipment
  availability for critical April 12th and 19th sessions; repair has parts delay risk
  that could jeopardize testing timeline. (d) Rental provides flexibility to extend
  if preview date shifts or additional testing needed. (e) Given reputational stakes
  (SBA, Food & Wine, industry peers), risk mitigation is worth more than $235 cost
  difference. (f) Aligns with Olivia''s perfectionist standards and business priorities:
  preview success is non-negotiable, equipment reliability during testing is critical,
  cash flow management matters given $180K debt load.'
