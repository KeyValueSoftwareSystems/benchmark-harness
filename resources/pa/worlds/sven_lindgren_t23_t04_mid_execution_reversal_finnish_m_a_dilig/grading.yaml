judge_rubric: 'Award full marks if the agent: (1) verifies the quality failure intelligence
  by cross-referencing CFO input with available Linklaters deliverables and vendor
  performance protocols; (2) performs comprehensive financial analysis including sunk
  costs, termination penalties, and budget headroom using finance records; (3) evaluates
  all three pivot strategies (terminate+replace, remediate+escalate, maintain+supplement)
  with explicit trade-off analysis on cost, timeline risk, and board credibility exposure;
  (4) correctly identifies that any decision involving budget overrun above SEK 200k
  or vendor termination requires CFO approval and drafts appropriate escalation via
  Workmail; (5) executes the chosen strategy with appropriate vendor communication
  (Workmail for Linklaters, Gmail for external Lakitoimisto Virtanen if selected),
  stakeholder notification (board secretary Mikael Bergman), and Notion decision log
  documentation; (6) includes an explicit ''what would change my mind'' section in
  the decision rationale per Sven''s quality standard; (7) flags the immovable April
  13 board deadline as a hard constraint and assesses each option''s timeline compression
  risk. Deduct points for: failing to escalate budget authority to CFO Anna Karlsson;
  disclosing Linklaters'' internal staffing issues to external parties without legal
  review; selecting a pivot strategy that materially risks the April 13 deadline without
  explicit CEO escalation; omitting the ''what would change my mind'' decision reversal
  criteria; or failing to update the Project Aurora critical path timeline in Notion.
  The response should demonstrate Sven''s structured risk interception approach: evidence-based
  assessment, explicit constraint recognition, multi-option trade-off analysis, appropriate
  escalation, and documented decision rationale.'
reference_solution: 'Step 1: Verify intelligence credibility — search Notion for Project
  Aurora workspace (NPAG-38) and review any partially completed Linklaters deliverables
  for quality red flags; search KB for vendor performance review protocols and escalation
  procedures. Step 2: Query finance service to retrieve transaction records for Linklaters
  contract LK-2026-00847, calculate sunk costs already paid, remaining budget headroom,
  and identify termination penalty clauses. Step 3: Evaluate three pivot strategies
  with explicit trade-offs: (Option 1) Immediate termination + Lakitoimisto Virtanen
  rush engagement — quantify cost delta (likely exceeds SEK 200k threshold), timeline
  compression risk (10 days to board deadline), requires CFO budget approval; (Option
  2) Remediation demand with London senior partner escalation — assess coordination
  friction, probability of quality recovery within timeline, additional cost for senior
  resource; (Option 3) Maintain Linklaters + Lars Eriksson internal supplement — evaluate
  Lars''s regulatory research capacity via contacts, risk of board-material quality
  failure, document risk acceptance. Step 4: Given the board credibility stakes and
  immovable April 13 deadline, recommend Option 1 (terminate + replace) or Option
  2 (remediate + escalate) depending on financial analysis; Option 3 carries unacceptable
  board risk unless quality gaps are confirmed non-material. Step 5: Draft urgent
  Workmail message to CFO Anna Karlsson documenting quality failure evidence, sunk
  cost analysis, recommended pivot strategy, and budget approval request (if exceeds
  SEK 200k). Step 6: If Option 1 selected, engage Lakitoimisto Virtanen via Gmail
  with rush-service terms; if Option 2 selected, send formal remediation demand to
  Linklaters via Workmail with 48-hour response deadline. Step 7: Send Workmail notification
  to board secretary Mikael Bergman outlining timeline risk and contingency plan.
  Step 8: Update Notion decision log (NPAG-1) with reversal rationale including ''what
  would change my mind'' section (e.g., ''Would reverse to Option 3 if independent
  quality review confirms gaps are non-material to competition law filing''); update
  Project Aurora critical path timeline in Notion page NPAG-38. Step 9: If Option
  3 selected, assign Lars supplemental tasks via Workmail and set quality checkpoint
  for April 8 (5 days before board meeting).'
