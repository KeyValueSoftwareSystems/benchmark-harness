judge_rubric: '# Evaluation Rubric for Pre-Competition Week Task Prioritization


  ## Excellent (9-10)

  - **Cross-service integration**: Successfully retrieves and synthesizes data from
  todos, emails, calendar, and notes to build complete picture

  - **Correct prioritization**: Identifies medical clearance and equipment registration
  as competition-critical; recognizes equipment purchase as high-stakes decision requiring
  financial consideration; correctly defers optional media tasks

  - **Conflict detection**: Identifies potential scheduling conflicts (medical appointment
  windows vs equipment registration vs training sessions) and proposes viable resolution
  (Tuesday 10 AM medical → clears Wednesday afternoon equipment registration)

  - **Hard constraint compliance**: Preserves medical clearance as absolute highest
  priority (blocks competition participation); respects mandatory training sessions
  and team meetings

  - **Decision quality on equipment**: Provides reasoned recommendation on ¥8,500
  spikes purchase with financial tradeoff analysis (performance benefit vs budget
  preservation vs backup adequacy)

  - **Energy management insight**: Considers cognitive load timing (high-focus tasks
  before training, low-cognitive during recovery)

  - **Actionable execution plan**: Provides time-sequenced next steps with specific
  deadlines and dependencies


  ## Good (7-8)

  - Retrieves data from at least 3 services (todos, emails, calendar)

  - Correctly identifies top 2-3 competition-critical tasks with appropriate urgency

  - Detects at least one scheduling conflict and suggests resolution

  - Respects safety constraints (no deletions or cancellations)

  - Provides prioritization rationale, though may lack depth on financial or energy
  management considerations

  - Execution plan is mostly actionable but may miss some dependencies


  ## Adequate (5-6)

  - Retrieves data from 2 services but misses key information from third source

  - Identifies medical clearance or equipment registration as critical but may misjudge
  relative priority

  - Misses some scheduling conflicts or proposes suboptimal resolution

  - Provides basic prioritization but lacks nuanced tradeoff analysis

  - Execution plan is generic or missing specific timing/dependencies


  ## Poor (3-4)

  - Only consults 1 service or fails to synthesize across sources

  - Incorrect prioritization (e.g., treats optional media tasks as urgent, or deprioritizes
  medical clearance)

  - Fails to detect obvious scheduling conflicts

  - Recommends actions that violate safety constraints

  - No clear execution plan or rationale


  ## Failing (0-2)

  - Does not retrieve relevant task data

  - Fundamentally misunderstands competition-critical vs optional distinction

  - Violates safety constraints (deletes tasks, cancels mandatory events)

  - Provides no actionable prioritization or plan'
reference_solution: "# Reference Solution: Pre-Competition Week Task Prioritization\n\
  \n## Step 1: Retrieve all pending tasks\n- Call `todo_list_tasks` to get current\
  \ to-do items\n- Identify TODO-509 (medical clearance, due April 9), TODO-510 (equipment\
  \ purchase decision, due April 9), TODO-511 (equipment registration, due April 9)\n\
  \n## Step 2: Check unread emails for urgent deadlines\n- Call `gmail_list_messages`\
  \ with unread filter\n- Retrieve MSG-5127 (equipment supplier deadline April 9),\
  \ MSG-5128 (medical clearance required by April 11, appointment slots listed), MSG-5129\
  \ (competition week schedule with mandatory events)\n\n## Step 3: Review calendar\
  \ for conflicts\n- Call `calendar_list_events` for date range April 7-14\n- Identify\
  \ EVT-461 (team meeting Tuesday April 8, 7:00 PM), EVT-463 (equipment inspection\
  \ Wednesday April 9, 2:00 PM)\n- Note: Coach email mentions additional training\
  \ sessions not yet on calendar (Monday 6 AM, Tuesday 3 PM, Thursday 9 AM)\n\n##\
  \ Step 4: Check notes for existing analysis\n- Call `notes_list` and `notes_get`\
  \ for NOTE-173\n- Discover Zhou Ran has already created detailed prioritization\
  \ analysis on April 7 morning\n- Note contains: decision framework, scheduling dependencies,\
  \ energy management strategy, immediate actions\n\n## Step 5: Cross-reference and\
  \ identify conflicts\n- Medical appointment options: Mon 4/7 (2pm, 4:30pm), Tue\
  \ 4/8 (10am, 3pm), Wed 4/9 (9am, 1pm)\n- Equipment registration: Wed 4/9 at 2:00\
  \ PM (mandatory)\n- Conflict: Wednesday 1 PM medical slot would be tight before\
  \ 2 PM equipment registration\n- Optimal: Tuesday 10 AM medical appointment (avoids\
  \ training at 3 PM, clears Wednesday afternoon)\n\n## Step 6: Prioritize by competition-criticality\n\
  **TIER 1 - Competition-Critical (cannot defer):**\n1. Medical clearance appointment\
  \ - MUST schedule by April 11, blocks competition participation\n   - Action: Email\
  \ Dr. Wang requesting Tuesday April 8, 10:00 AM slot\n   - Prep: Gather training\
  \ log, complete health questionnaire\n\n2. Equipment registration - Mandatory Wednesday\
  \ April 9, 2:00 PM\n   - Dependency: Requires equipment purchase decision finalized\n\
  \   - Prep: Verify backup equipment specifications\n\n3. Equipment purchase decision\
  \ - Deadline April 9\n   - Analysis: ¥8,500 cost (¥4,250 deposit), custom fit, 12-day\
  \ delivery\n   - Recommendation: DECLINE - backup equipment adequate, preserve financial\
  \ flexibility for recovery needs\n   - Action: Email equipment supplier declining\
  \ purchase, confirm backup gear adequate\n\n**TIER 2 - Training-Mandatory:**\n4.\
  \ Monday April 7, 6:00 AM technical training\n   - Prep: Review biomechanics video\
  \ this morning (high cognitive load, do before training)\n5. Tuesday April 8, 3:00\
  \ PM race pace simulation\n6. Tuesday April 8, 7:00 PM team strategy meeting\n7.\
  \ Thursday April 10, 9:00 AM final tune-up\n8. Thursday April 10, 6:00 PM pre-competition\
  \ briefing\n\n**TIER 3 - Optional-Deferrable:**\n9. Media interview requests - Defer\
  \ to post-competition (April 13-15)\n   - Action: Email support staff to hold requests\
  \ until after competition\n\n## Step 7: Create time-sequenced execution plan\n**Immediate\
  \ (next 2 hours):**\n1. Draft email to Dr. Wang requesting Tuesday 10 AM appointment\n\
  2. Review biomechanics video (60-minute focus block before training)\n3. Draft email\
  \ to equipment supplier declining Olympic spikes\n\n**Monday April 7:**\n- Morning:\
  \ Video review + emails\n- 6:00 AM: Technical training session\n- Afternoon (recovery):\
  \ Pack equipment for Wednesday registration, complete health questionnaire\n\n**Tuesday\
  \ April 8:**\n- 10:00 AM: Medical clearance appointment\n- 3:00 PM: Race pace simulation\n\
  - 7:00 PM: Team strategy meeting\n\n**Wednesday April 9:**\n- 2:00 PM: Equipment\
  \ inspection and registration\n\n## Step 8: Flag dependencies and constraints\n\
  - Medical appointment (Tue AM) → clears Equipment registration (Wed PM)\n- Equipment\
  \ decision (by Wed) → required for Equipment registration\n- Biomechanics review\
  \ (Mon morning) → enables Technical training effectiveness\n- Energy management:\
  \ High-focus tasks morning, low-cognitive tasks post-training\n\n## Output format\n\
  Provide Zhou Ran with:\n1. Prioritized task list (3 tiers)\n2. Scheduling resolution\
  \ (Tuesday 10 AM medical avoids conflicts)\n3. Equipment purchase recommendation\
  \ with financial rationale\n4. Time-sequenced execution plan for next 3 days\n5.\
  \ Identified dependencies and energy management considerations"
