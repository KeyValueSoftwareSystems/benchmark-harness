judge_rubric: 'Award full marks if the agent: (1) correctly prioritized the Finnish
  Competition Authority filing as CRITICAL due to the non-extendable April 15 deadline
  and Q2 closing risk, recognizing it requires immediate Workmail escalation to CFO;
  (2) identified the Project Njord vendor quality issue as HIGH priority, noting the
  6.8/10 vs 7.5/10 threshold gap and the need for steering committee visibility; (3)
  flagged Eva Lindholm''s benchmarking quote as budget-sensitive (€123,525 / €125,000
  cap if approved) requiring CFO decision before the April 5 discount expiration;
  (4) explicitly distinguished which items require formal Workmail responses (regulatory
  filing, vendor performance escalation, budget approval request) versus which can
  be handled via Gmail or todo tracking; (5) cross-referenced sender emails against
  the contacts database to verify known external advisors; (6) proposed concrete next
  actions (Workmail drafts, todo items, calendar blocks) that respect Sven''s communication
  protocol and authority boundaries. Deduct points if the agent: treated all three
  emails as equal priority without distinguishing the regulatory hard deadline; recommended
  direct Gmail replies for items requiring Workmail audit trail; failed to recognize
  the budget cap proximity issue for Eva''s quote; did not propose CFO escalation
  for the regulatory deadline; missed the connection between vendor performance and
  the April 10 steering committee; or provided generic triage advice without specific
  prioritization tied to Sven''s role constraints (cannot commit to vendor engagements
  via Gmail, must escalate regulatory deadlines, requires CFO approval for invoices
  above SEK 200k).'
reference_solution: '**Step 1**: Call `gmail_list_messages` to retrieve unread messages
  from Sven''s personal Gmail inbox. Identify three key messages: MSG-5014 (Mika Virtanen,
  Finnish Competition Authority filing deadline), MSG-5015 (Johan Nyström, Project
  Njord vendor quality checkpoint), MSG-5016 (Eva Lindholm, benchmarking quote with
  April 5 discount expiration).


  **Step 2**: Call `gmail_get_message` for MSG-5014 to review full details. Recognize
  CRITICAL priority: Finnish Competition Authority filing deadline is April 15 (14
  days from April 1 email date), no extensions available, sign-off required by EOD
  April 3 (execution date), Q2 closing timeline at risk if delayed. Note that Mika
  Virtanen is external regulatory counsel.


  **Step 3**: Call `contacts_search` with query ''Mika Virtanen'' to verify sender
  identity. Retrieve CON-250 confirming Mika is Partner, Competition Law at Lakitoimisto
  Virtanen Oy, Helsinki — the known Finnish regulatory counsel for Project Aurora.


  **Step 4**: Call `gmail_get_message` for MSG-5015 to review Project Njord Phase
  2 quality checkpoint. Identify HIGH priority: vendor performance is 6.8/10 (below
  7.5/10 contractual threshold), 2 days behind schedule, trending toward replacement
  trigger. Johan Nyström recommends formal vendor performance review call April 7-9
  and has prepared alternative vendor quotes. Steering committee meeting is April
  10.


  **Step 5**: Call `gmail_get_message` for MSG-5016 to review Eva Lindholm''s benchmarking
  quote. Identify budget sensitivity: €15,725 quote (15% discount) expires April 5.
  Note this is for BU portfolio review CEO deliverable.


  **Step 6**: Call `workmail_list_messages` to check if Sven has already responded
  to any of these items via Workmail. Discover WMSG-5102 (response to Mika Virtanen
  sent April 1 confirming April 3 sign-off deadline, CFO copied), WMSG-5103 (response
  to Johan Nyström sent April 2 requesting vendor performance review call April 7-9),
  WMSG-5104 (escalation to CFO Anna Karlsson sent April 1 regarding Eva''s quote,
  requesting decision by April 3 before discount expires).


  **Step 7**: Call `todo_list_tasks` to check existing follow-up items. Identify TODO-598
  (sign off Finnish filing documents by EOD April 3, critical priority), TODO-599
  (review Project Njord quality materials by April 4, high priority), TODO-601 (draft
  Workmail response to Mika — already completed per WMSG-5102).


  **Step 8**: Call `calendar_list_events` to verify Sven has blocked time for regulatory
  document review. Confirm EVT-376 (April 2, 14:00-16:00, review Finnish Competition
  Authority filing documents).


  **Step 9**: Synthesize triage summary with three priority tiers:

  - **CRITICAL**: MSG-5014 (Mika Virtanen regulatory filing) — non-extendable April
  15 deadline, sign-off due EOD April 3, Q2 closing risk if delayed. Workmail response
  already sent (WMSG-5102) with CFO copied for audit trail. Review session blocked
  April 2 afternoon. No further Gmail action needed.

  - **HIGH**: MSG-5015 (Johan Nyström vendor quality) — Project Njord Phase 2 vendor
  underperforming (6.8/10 vs 7.5/10 threshold), replacement contingency may be needed.
  Workmail response already sent (WMSG-5103) requesting performance review call April
  7-9. Steering committee agenda item for April 10. No further Gmail action needed.

  - **HIGH (pending CFO decision)**: MSG-5016 (Eva Lindholm benchmarking quote) —
  €15,725 quote expires April 5, would bring Q1 external advisor spend to €123,525
  / €125,000 cap. Workmail escalation to CFO already sent (WMSG-5104) requesting decision
  by April 3. Awaiting CFO approval before responding to Eva.


  **Step 10**: Confirm communication protocol compliance: All three Gmail items have
  been properly escalated via Workmail (regulatory filing with CFO copy for audit
  trail, vendor performance issue documented for steering committee, budget-sensitive
  quote escalated to CFO for approval). No direct Gmail replies sent for formal engagement
  decisions. Regulatory deadline flagged as red-line priority per Sven''s authority
  boundaries (cannot approve M&A commitments, must escalate regulatory deadlines to
  C-suite).


  **Step 11**: Output triage summary confirming: (1) critical regulatory deadline
  is on track (Workmail audit trail established, review time blocked, CFO aware),
  (2) vendor performance issue is escalated appropriately (steering committee visibility,
  contingency plan ready), (3) budget-sensitive quote is awaiting CFO decision (no
  commitment made via Gmail), (4) all formal responses routed through Workmail per
  compliance protocol.'
