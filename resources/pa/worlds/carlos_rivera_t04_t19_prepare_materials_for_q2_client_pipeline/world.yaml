    keywords:
    - - April 9
      - April 9th
      - '2026-04-09'
    - - Sofia Park
      - Sofia
    - - 10:00 AM
      - '10:00'
      - 10 AM
    - - Blue Bottle
      - Hayes Valley
- name: Identified Q2 pipeline planning framework and goals
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - 3-5 qualified prospects
      - 3-5 prospects
      - add 3-5
      - pipeline target
    - - sustainable food
      - eco-wellness
      - sustainable food and eco-wellness
    - - Harvest & Hearth
      - Rooted Plate
      - Bay Leaf Organics
      - prospect research
    - - GreenRoot case study
      - portfolio case study
      - case study development
