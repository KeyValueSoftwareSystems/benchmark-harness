judge_rubric: 'Award full marks if the response: (1) Identifies the 2-week permit
  delay (April 28-30 vs original April 15) revealed in Isabella Vargas''s March 28
  email as the root cause of cascading conflicts; (2) Detects all three major stakeholder
  conflicts: donor site visit (April 16-17) occurring before construction can begin,
  community Pachamama ceremony (April 12) scheduled before permit approval, and health
  partner mobile clinic deployment (April 22-24) scheduled before facility completion;
  (3) Explains the dependency chain showing how permit delay cascades through construction
  timeline to impact all stakeholder commitments; (4) Provides conflict severity assessment
  noting critical risk to $450K donor relationship, high risk to community trust and
  health partnership credibility; (5) Presents findings in clear, actionable format
  suitable for stakeholder communication planning. Deduct points for: missing any
  of the three major conflicts, failing to identify permit delay as root cause, not
  explaining cascading dependencies, lacking severity/risk assessment, or presenting
  findings in disorganized format. Award partial credit for identifying conflicts
  without fully tracing them to permit delay, or for incomplete stakeholder coverage.'
reference_solution: "1. Query calendar_list_events to retrieve all Q1 2026 Emergency\
  \ Shelter Program events: EVT-409 (Global Aid Foundation site visit April 16-17),\
  \ EVT-410 (Pachamama ceremony April 12), EVT-411 (Regional Mobile Health deployment\
  \ April 22-24)\n\n2. Query gmail_list_messages with emergency_shelter label to find\
  \ stakeholder communications, then retrieve key messages: MSG-5188 (Isabella Vargas\
  \ informal permit delay disclosure - April 28-30 vs original April 15), MSG-5189\
  \ (Global Aid Foundation site visit confirmation expecting construction progress),\
  \ MSG-5190 (Villa Nueva community ceremony preparations expecting immediate groundbreaking),\
  \ MSG-5191 (Regional Mobile Health deployment expecting facility readiness)\n\n\
  3. Query crm_list_customers and retrieve stakeholder records: CUS-158 (Global Aid\
  \ Foundation - $450K major donor, milestone-based disbursements), CUS-159 (Regional\
  \ Mobile Health - $8,500 resource commitment, confirmation needed by April 5), CUS-160\
  \ (Villa Nueva Community - 80-100 attendees, cultural capital invested)\n\n4. Cross-reference\
  \ calendar events against email intelligence to detect conflicts:\n   - ROOT CAUSE:\
  \ Permit approval delayed from April 15 to April 28-30 (2-week delay) due to geological\
  \ survey requirements\n   - CONFLICT 1: April 12 Pachamama ceremony assumes permit\
  \ approval and immediate groundbreaking, but permit won't be approved until April\
  \ 28-30\n   - CONFLICT 2: April 16-17 donor site visit expects construction progress\
  \ assessment, but construction cannot start until permit approved (April 28-30)\n\
  \   - CONFLICT 3: April 22-24 health partner deployment expects facility readiness,\
  \ but construction delayed 2 weeks means facility won't be ready\n\n5. Analyze dependency\
  \ chain: Permit approval (April 28-30) → Construction start (early May) → Facility\
  \ completion (late May) → Health services integration. All stakeholder commitments\
  \ assume earlier timeline: permit April 15, construction mid-April, facility late\
  \ April.\n\n6. Assess conflict severity:\n   - CRITICAL: Donor relationship ($450K\
  \ grant, milestone-based disbursements, site visit before construction begins)\n\
  \   - HIGH: Community trust (cultural ceremony timing misaligned, 80-100 attendees,\
  \ community expectations)\n   - HIGH: Health partnership ($8,500 commitment, confirmation\
  \ deadline April 5, rescheduling impacts other communities)\n\n7. Create or update\
  \ consolidated timeline summary documenting: chronological event sequence, conflict\
  \ identification with severity ratings, dependency chain analysis, stakeholder impact\
  \ assessment, and recommended communication actions.\n\n8. Present integrated timeline\
  \ overview flagging: (1) Hidden conflict between official calendar status and Isabella\
  \ Vargas informal disclosure, (2) Three cascading stakeholder conflicts stemming\
  \ from permit delay, (3) Critical path dependencies requiring proactive stakeholder\
  \ communication by April 5 (health partner confirmation deadline), (4) Relationship\
  \ preservation priorities: donor transparency, community sensitivity, health partner\
  \ flexibility."
