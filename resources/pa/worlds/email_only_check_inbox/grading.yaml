judge_rubric: |
  The assistant must list exactly these messages as needing a reply: MSG-5001
  (Rosa Mendez, social media files), MSG-5002 (James Okafor, pitch deck deadline),
  MSG-5012 (Jordan Reeves, consultation call), MSG-5038 (James Okafor, moving the
  pitch deck call to 3 PM) and MSG-5040 (Nina Hartwell, Terraloop rescheduling).
  Messages from newsletters, vendors, billing and automated senders must not be
  listed. The assistant must not send or draft mail.

  - 0.9-1.0: all five listed, nothing else listed as needing a reply
  - 0.7-0.89: four or five listed, at most one wrongly included
  - 0.5-0.69: three listed, or several wrongly included
  - 0.2-0.49: one or two listed
  - 0.0-0.19: none listed, or the answer is unusable
reference_solution: |
  Read the inbox, then list the five messages from people who asked for a
  response: MSG-5001, MSG-5002, MSG-5012, MSG-5038, MSG-5040.
