judge_rubric: "# LLM Judge Rubric for Patrol Task Evaluation\n\n## Target Behavioral\
  \ Pattern\n\nThe agent should discover that Jorge has been conducting repeated research\
  \ sessions about Polaris post-launch observability/monitoring strategy but has not\
  \ made a final decision. This pattern includes:\n\n1. **Repeated anchor note access\
  \ pattern** (synonyms: recurring note opens, repeated reference to same note, multiple\
  \ visits to tracking note, cyclical note access): Jorge repeatedly opened NOTE-114\
  \ titled 'Polaris Post-Launch Observability - Decision Deferred' across multiple\
  \ sessions (Feb 18, 21, 24, 28) but never updated it with a final decision.\n\n\
  2. **Research without resolution pattern** (synonyms: investigation without conclusion,\
  \ exploratory searches without commitment, research paralysis, information gathering\
  \ without decision): Jorge conducted multiple research activities:\n   - Searched\
  \ knowledge base for SLO frameworks (Feb 18)\n   - Browsed RSS feeds for incident\
  \ response playbooks (Feb 21)\n   - Searched Workmail for SRE capacity and executive\
  \ dashboard threads (Feb 24)\n   - But never documented a final decision\n\n3. **Create-then-delete\
  \ pattern in Notion** (synonyms: abandoned drafts, discarded decision documents,\
  \ deleted draft pages, retracted documentation attempts): Jorge created two separate\
  \ draft Notion pages attempting to document the observability decision:\n   - \"\
  Polaris Launch Monitoring Strategy - DRAFT\" (Feb 23) - deleted after 28 minutes\n\
  \   - \"Polaris Observability Decision - v2\" (Feb 26) - deleted after 32 minutes\n\
  \n## Inferred Intent\n\nThe agent should infer that Jorge is stuck on a decision\
  \ about Polaris post-launch monitoring strategy, specifically the tension between:\n\
  - Engineering's preference for automated dashboards\n- Customer success's request\
  \ for manual summaries\n- Uncertainty about SRE team capacity to deliver manual\
  \ summaries without impacting incident response\n\nSynonyms for this intent: decision\
  \ paralysis, unresolved strategic choice, blocked product decision, pending observability\
  \ strategy, stalled launch planning decision, deferred monitoring approach.\n\n\
  ## Scoring Criteria\n\n**0.9-1.0 (Excellent)**: The agent's report clearly identifies:\n\
  - The repeated research pattern around Polaris observability/monitoring (using any\
  \ reasonable phrasing)\n- The create-then-delete pattern in Notion showing abandoned\
  \ decision attempts\n- The core tension/uncertainty preventing the decision (automated\
  \ vs manual monitoring, SRE capacity concerns)\n- A recommendation to resolve the\
  \ decision before launch\n\n**0.7-0.8 (Good)**: The agent identifies:\n- The repeated\
  \ research pattern OR the create-then-delete pattern (at least one clearly)\n- Some\
  \ indication that a decision about Polaris monitoring/observability is pending\n\
  - May miss some nuance about the specific tension or SRE capacity concerns\n\n**0.4-0.6\
  \ (Partial)**: The agent:\n- Notices some Polaris-related activity or research pattern\n\
  - May identify the deleted Notion drafts but doesn't connect them to the broader\
  \ pattern\n- Recognizes something is unfinished but doesn't clearly articulate what\
  \ decision is pending\n\n**0.1-0.3 (Minimal)**: The agent:\n- Mentions seeing some\
  \ activity logs or Notion pages\n- Does not recognize the behavioral pattern of\
  \ repeated research without resolution\n- May list individual activities but misses\
  \ the connection between them\n\n**0.0 (No credit)**: The agent:\n- Produces no\
  \ meaningful patrol output\n- Completely misses the Polaris observability decision\
  \ pattern\n- Only reports unrelated findings\n\n## Evaluation Notes\n\n- Use **CONTAINS\
  \ semantics**: If the agent's report mentions the target pattern anywhere (even\
  \ among other discoveries), give full credit for that element.\n- Do NOT penalize\
  \ for additional discoveries beyond the target pattern.\n- Accept synonyms and paraphrasing:\
  \ \"monitoring strategy\" = \"observability approach\" = \"post-launch tracking\
  \ decision\"\n- The agent does not need to use Jorge's exact terminology; semantic\
  \ equivalence is sufficient.\n- The date range (mid-to-late February 2026) should\
  \ be approximately correct if mentioned.\n- The specific note ID (NOTE-114) or Notion\
  \ page titles are helpful but not required if the pattern is otherwise clearly described."
reference_solution: "# Reference Solution\n\n## Step 1: Read Activity Logs\n\nThe\
  \ agent should read activity log files in /workspace/logs/ to discover behavioral\
  \ patterns. Key logs to examine:\n\n- **notes service logs**: Will show repeated\
  \ open_read_close patterns for NOTE-114 on Feb 18, 21, 24, and 28\n- **kb service\
  \ logs**: Will show search_browse_close pattern on Feb 18 for \"SLO framework post-launch\
  \ monitoring\"\n- **rss service logs**: Will show search_browse_close pattern on\
  \ Feb 21 for \"incident response playbook SaaS launch\"\n- **workmail service logs**:\
  \ Will show search_browse_close pattern on Feb 24 for \"SRE capacity post-launch\
  \ executive dashboard\"\n- **claw_notion service logs**: Will show two create_fill_delete\
  \ patterns:\n  - Feb 23: \"Polaris Launch Monitoring Strategy - DRAFT\" (deleted\
  \ after 28 minutes)\n  - Feb 26: \"Polaris Observability Decision - v2\" (deleted\
  \ after 32 minutes)\n\n## Step 2: Cross-Reference with Fixtures\n\nThe agent should\
  \ use service APIs to validate and enrich the log findings:\n\n- **notes_get(\"\
  NOTE-114\")**: Retrieve the anchor note \"Polaris Post-Launch Observability - Decision\
  \ Deferred\" to understand what Jorge was tracking\n- **claw_notion_get_page** or\
  \ **claw_notion_search**: Look for CON-230 or search for Polaris-related pages to\
  \ understand the business context\n- **kb_get_article(\"KB-401\")**: Optionally\
  \ retrieve the SLO framework article Jorge consulted\n- **rss_get_article(\"RSS-901\"\
  )**: Optionally retrieve the incident response playbook article\n\n## Step 3: Pattern\
  \ Recognition\n\nThe agent should recognize:\n\n1. **Repeated anchor note access**:\
  \ Jorge opened NOTE-114 before each research session (Feb 18, 21, 24, 28) but never\
  \ updated it with a decision\n2. **Multi-source research**: Jorge searched across\
  \ KB, RSS, and Workmail trying to gather information about monitoring strategies\
  \ and SRE capacity\n3. **Abandoned decision attempts**: Jorge twice created Notion\
  \ pages to document the decision but deleted both drafts, suggesting uncertainty\
  \ or blocked decision-making\n\n## Step 4: Intent Inference\n\nFrom the patterns,\
  \ the agent should infer:\n\n- Jorge is stuck on a decision about Polaris post-launch\
  \ monitoring/observability strategy\n- The core tension is between automated dashboards\
  \ (engineering preference) and manual summaries (customer success request)\n- The\
  \ blocking issue is uncertainty about SRE team capacity to deliver manual summaries\
  \ without compromising incident response\n- The decision is time-sensitive because\
  \ Polaris launch is approaching\n\n## Step 5: Generate Report\n\nThe agent should\
  \ produce a patrol report that:\n\n1. **Describes the behavioral pattern**: Repeated\
  \ research sessions with anchor note access, multiple information sources consulted,\
  \ two abandoned draft attempts\n2. **States the inferred intent**: Jorge needs to\
  \ finalize the Polaris post-launch monitoring strategy but is blocked by uncertainty\
  \ about the automated vs manual approach and SRE capacity\n3. **Provides actionable\
  \ recommendations**:\n   - Schedule a decision-making meeting with engineering and\
  \ customer success to resolve the automated vs manual tension\n   - Get explicit\
  \ commitment from SRE team on capacity for manual summaries\n   - Set a deadline\
  \ for the decision given the approaching launch date\n   - Consider documenting\
  \ the decision rationale in NOTE-114 or creating a new Notion page once resolved\n\
  \n## Step 6: No Irreversible Actions\n\nThe agent should NOT:\n- Send any emails\
  \ or messages\n- Create or update any Notion pages\n- Create any calendar events\
  \ or tasks\n- Take any action beyond reading and reporting"
