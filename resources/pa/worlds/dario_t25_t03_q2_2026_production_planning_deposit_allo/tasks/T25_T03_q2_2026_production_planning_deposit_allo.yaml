- name: inventory_get_product
  description: Get full product details by product_id
- name: inventory_create_order
  description: Create a purchase order for a product
- name: scheduler_list_jobs
  description: List scheduled jobs (summary, no action/history). Filter by status,
    enabled state, or tag.
- name: scheduler_get_job
  description: Get full job details including action and execution history by job_id
- name: scheduler_create_job
  description: Create a new scheduled job
- name: scheduler_update_job
  description: Update a scheduled job. Only provided fields will be changed.
- name: scheduler_delete_job
  description: Delete a scheduled job by job_id
- name: scheduler_job_history
  description: Get execution history for a job. Default returns last 10 entries.
- name: claw_slack_list_channels
  description: List Slack channels. Filter by member, is_private, or include_archived.
    Returns channel summaries with message/pin counts.
- name: claw_slack_get_channel
  description: Get details of a Slack channel by channel_id, including topic, purpose,
    members, and pinned_message_ids.
- name: claw_slack_list_messages
  description: List top-level messages in a Slack channel (thread replies excluded).
    Returns message_id, sender, text, reactions, reply_count.
- name: claw_slack_get_thread
  description: Get the root message and all thread replies for a parent_message_id.
- name: claw_slack_post_message
  description: Post a message to a Slack channel. Set parent_message_id to post a
    thread reply (one level deep only).
- name: claw_slack_search_messages
  description: Search Slack messages by keyword across active channels. Filter by
    by_user, after/before timestamps.
- name: claw_slack_add_reaction
  description: Add an emoji reaction to a Slack message on behalf of a user.
- name: claw_slack_remove_reaction
  description: Remove an emoji reaction from a Slack message.
- name: claw_slack_pin_message
  description: Pin a message in a Slack channel.
- name: claw_slack_unpin_message
  description: Unpin a message from a Slack channel.
- name: claw_wechat_list_chats
  description: 'List WeChat chats. type: ''all'' | ''dm'' | ''group''.'
- name: claw_wechat_get_chat
  description: Get a WeChat chat with recent messages by chat_id.
- name: claw_wechat_search_messages
  description: Search WeChat messages by query, optionally limited to one chat.
- name: claw_wechat_send_message
  description: Send a WeChat message in a chat (recorded in audit).
- name: claw_wechat_recall_message
  description: Recall (撤回) a previously sent WeChat message. Irreversible.
- name: claw_wechat_mute_chat
  description: Mute or unmute a WeChat chat. mute=true means do-not-disturb.
- name: claw_wechat_browse_moments
  description: Browse WeChat Moments (朋友圈). Optional author filter.
- name: claw_wechat_search_moments
  description: Search WeChat Moments by keyword.
- name: claw_wechat_like_moment
  description: Like or unlike a Moments post.
- name: claw_wechat_comment_moment
  description: Comment on a Moments post.
- name: claw_wechat_post_moment
  description: 'Post a new Moments entry. visibility: ''friends'' (default) or other
    allowed values.'
- name: sheet_list_workbooks
  description: List all workbooks, optionally filtered by owner.
- name: sheet_open
  description: Open a workbook by workbook_id and return its sheet metadata.
- name: sheet_get_range
  description: Read a cell range (e.g. 'A1:C10') from a sheet.
- name: sheet_set_cell
  description: Set the value of a single cell.
- name: sheet_set_range
  description: Set a 2D range of values starting at start_cell.
- name: sheet_insert_row
  description: Insert a new row after the given row index, with optional cell values.
- name: sheet_create_workbook
  description: Create a new empty workbook with optional initial sheets.
- name: sheet_add_sheet
  description: Add a new sheet to an existing workbook.
- name: sheet_rename_sheet
  description: Rename a sheet inside a workbook.
- name: sheet_compute
  description: 'Run an aggregate over a range. op: SUM | AVG | COUNT | MAX | MIN.'
- name: sheet_delete_workbook
  description: Permanently delete a workbook by workbook_id. Irreversible.
- name: sheet_delete_sheet
  description: Delete a single sheet from a workbook (the workbook itself is preserved).
