scoring_components:
- name: Identified critical deadline discrepancy between formal emails and WeChat
    urgency signals
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Meihao
      - Liu Wei
      - 美好
    - - April 3
      - April 3rd
      - 4月3号
      - real deadline
    - - WeChat
      - private message
      - informal channel
      - 微信
    - - slot
      - capacity
      - forfeiture
      - lose position
      - 档期
- name: Recognized Yongxin price lock deadline and calculated cost impact
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Yongxin
      - Chen Xiaoming
      - 永信
    - - April 5
      - April 5th
      - 4月5号
      - price lock
    - - 15%
      - USD 2,700
      - $2,700
      - '2700'
      - price increase
    - - USD 3.00
      - USD 3.45
      - $3.00
      - $3.45
- name: Verified cash flow policy compliance and sequencing strategy
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - USD 10K
      - USD 10,000
      - $10K
      - $10,000
      - single decision cap
    - - USD 25K
      - USD 25,000
      - $25K
      - $25,000
      - reserve floor
    - - separate
      - staged
      - different days
      - sequential
      - two decisions
    - - compliant
      - within policy
      - does not violate
      - stays above
- name: Created prioritized TODO items with supplier-specific negotiation talking
    points
  weight: 0.2
  check:
    type: tool_called
    tool_name: todo_create_task
    min_calls: 2
- name: Scheduled calendar holds for wire execution windows
  weight: 0.15
  check:
    type: tool_called
    tool_name: calendar_create_event
    min_calls: 2
- name: Accessed WeChat messages to discover hidden urgency signals
  weight: 0.2
  check:
    type: tool_called
    tool_name: claw_wechat_get_chat
    min_calls: 1
- name: Consulted Sheet workbook for deposit allocation scenario analysis
  weight: 0.15
  check:
    type: tool_called
    tool_name: sheet_open
    min_calls: 1
