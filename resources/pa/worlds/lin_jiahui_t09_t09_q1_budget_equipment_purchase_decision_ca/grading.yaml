judge_rubric: 'Award full marks if the response: (1) correctly identifies the ¥6,000
  budget constraint and three decision paths (standard delivery within budget, express
  delivery requiring exception, standard delivery with coach rescheduling attempt),
  (2) quantifies implicit costs of 1-day training delay including Coach Wang''s April
  10-12 provincial workshop conflict making rescheduling nearly impossible, 12 students
  and parents already coordinated around April 9, and student retention/motivation
  risk, (3) assesses budget exception approval risk using the 60% success rate and
  3-day timeline from finance records, (4) recommends express delivery with budget
  exception request based on explicit tradeoff analysis showing implicit delay costs
  (coach unavailability + coordination disruption + competition readiness impact)
  exceed the ¥864 premium, and (5) provides actionable next steps including Form F-203
  submission with strong justification to Director Zhang. Deduct points for: failing
  to recognize Coach Wang''s hard constraint, ignoring the 60% approval probability,
  recommending standard delivery without quantifying implicit costs, or suggesting
  coach rescheduling as viable when email explicitly states provincial workshop is
  mandatory. The response should demonstrate constraint-solving thinking: hard budget
  cap compliance takes priority, but implicit costs must be monetized to justify exception
  request.'
reference_solution: 'Step 1: Query finance_list_transactions to verify Q1 discretionary
  budget balance (TXN-6059 shows ¥6,000 remaining from ¥8,800 allocation). Step 2:
  Review gmail_get_message for MSG-5176 (vendor quote: standard ¥5,472 / 5 days vs
  express ¥6,336 / 24 hours) and MSG-5177 (Q1 deadline April 4, budget exception 3-day
  approval, 60% success rate for Math Dept). Step 3: Query calendar_list_events to
  check EVT-490 (April 9 training session with Coach Wang and 12 students) and review
  gmail_get_message MSG-5178 (Coach Wang''s April 10-12 provincial workshop conflict
  makes rescheduling impossible). Step 4: Review notes_get NOTE-183 for existing analysis
  framework. Step 5: Calculate tradeoff: Standard delivery (¥5,472) arrives April
  7, forces 1-day training delay to April 10 when Coach Wang is unavailable at provincial
  workshop - coach replacement on 1-day notice is nearly impossible, 12 students and
  parents already coordinated schedules, delay risks student dropout and momentum
  loss. Express delivery (¥6,336) requires ¥336 budget exception with 60% approval
  probability over 3 days. Step 6: Quantify implicit costs: Coach Wang replacement
  difficulty (very high given mandatory provincial commitment), coordination disruption
  for 12 families (significant goodwill cost), competition readiness impact from losing
  first session momentum (substantial). Implicit costs likely exceed ¥864 premium
  (¥6,336 - ¥5,472). Step 7: Recommend express delivery with budget exception request
  to Director Zhang (ext. 2045) using Form F-203, justified by: (a) coach availability
  is hard constraint, (b) student retention risk from perceived disorganization, (c)
  competition timeline compression. Contingency: If exception denied by April 2, pivot
  to standard delivery and negotiate coach flexibility (low probability) or accept
  training delay consequences. Step 8: Document decision rationale emphasizing that
  implicit costs (coach rebooking impossibility + 12-family coordination disruption
  + competition readiness impact) exceed ¥864, making express delivery the optimal
  path despite budget exception risk.'
primary_dimensions:
