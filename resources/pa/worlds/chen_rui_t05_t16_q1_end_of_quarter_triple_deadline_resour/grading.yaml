judge_rubric: '# Evaluation Rubric: Q1 Triple Deadline Resource Allocation


  ## Excellent (0.9-1.0)

  - Correctly identifies all three competing deadlines with accurate timestamps (CME
  23:59, reimbursement 17:00, voucher 23:59)

  - Ranks priorities correctly using ''deadline urgency × consequence severity'' framework:
  (1) CME completion (irreversible compliance loss), (2) reimbursement claim (CNY
  933 recovery), (3) voucher expiry (acceptable loss, no personal penalty)

  - Allocates March 30 time windows appropriately: afternoon administrative block
  (14:00-16:30) for reimbursement documentation, evening study block (19:00-23:00)
  for NMEC module completion

  - Recognizes voucher expiry as negotiable loss given Zhao Lei''s confirmation that
  unused balance returns to departmental pool without personal penalty

  - Provides clear execution sequence with time estimates and dependency awareness
  (study block must be defended against shift extension)

  - Demonstrates understanding that CME deadline miss is irreversible and affects
  annual residency standing


  ## Good (0.7-0.89)

  - Identifies all three deadlines and ranks CME as highest priority

  - Correctly allocates March 30 study block to CME completion

  - Recognizes reimbursement claim as time-sensitive (17:00 deadline earlier than
  others)

  - May not fully articulate why voucher is lowest priority, but does not recommend
  sacrificing CME or reimbursement time for it

  - Provides reasonable time allocation but may lack precise execution sequence details


  ## Satisfactory (0.5-0.69)

  - Identifies the three competing deadlines but may not rank them correctly

  - Recognizes time scarcity and need for prioritization

  - Allocates some protected time to CME completion but may not optimize the full
  sequence

  - May overweight voucher urgency relative to its actual consequence severity

  - Missing some key details (e.g., reimbursement documentation requirements, NMEC
  completion time estimate)


  ## Poor (0.3-0.49)

  - Identifies deadlines but provides incorrect priority ranking (e.g., prioritizes
  voucher over CME)

  - Fails to recognize irreversible nature of CME compliance deadline

  - Does not provide clear time allocation strategy for March 30 protected windows

  - May recommend splitting time equally across all three tasks without consequence-based
  reasoning


  ## Unacceptable (0.0-0.29)

  - Fails to identify all three deadlines or their correct timestamps

  - Provides no clear prioritization framework

  - Recommends sacrificing mandatory shift coverage or other non-negotiable institutional
  obligations

  - Does not consult key information sources (emails, calendar, finance records, todo
  list)

  - Suggests procedurally invalid shortcuts (e.g., requesting deadline extensions
  without institutional precedent)'
reference_solution: "# Reference Solution: Q1 Triple Deadline Resource Allocation\n\
  \n## Step 1: Gather deadline information from all sources\n\n**Query gmail** for\
  \ deadline notifications:\n- MSG-5240 (CME Office): Q1 CME credit submission window\
  \ closes March 31, 23:59. Current status: 8.5/12 credits. NMEC completion certificate\
  \ required.\n- MSG-5241 (Finance Dept): Q1 reimbursement claim deadline March 31,\
  \ 17:00. MedEd360 fee CNY 933 eligible for recovery. Requires documentation: receipt,\
  \ withdrawal statement, Form F-CME-2026.\n- MSG-5242 (Finance Dept): Voucher VCH-2026-0031\
  \ (CNY 2,180 balance) expires March 31, 23:59. Unused balance returns to departmental\
  \ pool, no personal penalty.\n\n**Query calendar** for available time windows:\n\
  - EVT-492: Protected study block March 30, 19:00-23:00 (4 hours)\n- EVT-493: Administrative\
  \ window March 30, 14:00-16:30 (2.5 hours)\n- EVT-494: Deadline marker March 31\
  \ (all day)\n\n**Query todo list** for task details:\n- TODO-715: NMEC module 78%\
  \ complete, requires 2.5-3.0 hours (Section 8, Section 9, final assessment). Deadline\
  \ March 31, 23:59. Critical priority.\n- TODO-716: Reimbursement claim submission\
  \ requires documentation finalization. Deadline March 31, 17:00. High priority.\n\
  - TODO-717: Voucher alternative use evaluation. Deadline March 31, 23:59. Low priority\
  \ (accept forfeiture if no eligible option).\n\n**Query finance** for amounts and\
  \ status:\n- TXN-6099: Voucher VCH-2026-0031 balance CNY 2,180 (returns to departmental\
  \ pool if unused)\n- TXN-6100: Reimbursement claim CNY 933 (pending submission,\
  \ quota available)\n\n**Query notes** for analysis:\n- NOTE-229: Priority ranking\
  \ framework already established: (1) CME critical (irreversible compliance loss),\
  \ (2) reimbursement high (CNY 933 recovery), (3) voucher low (no personal penalty)\n\
  - NOTE-230: NMEC completion probability 80% if March 30 study block defended, <30%\
  \ if shift extends\n\n## Step 2: Apply consequence severity analysis\n\n**Deadline\
  \ urgency × consequence severity ranking:**\n\n1. **CME completion (CRITICAL)**\n\
  \   - Deadline: March 31, 23:59 (hard deadline)\n   - Consequence: Q1 compliance\
  \ failure (8.5/12 credits), irreversible, affects annual residency standing\n  \
  \ - Time required: 2.5-3.0 hours\n   - Available window: March 30 evening study\
  \ block (4 hours)\n   - Risk: Study block must be defended against shift extension\
  \ (TODO-718)\n\n2. **Reimbursement claim (HIGH)**\n   - Deadline: March 31, 17:00\
  \ (hard deadline, earlier than others)\n   - Consequence: CNY 933 forfeiture, Q2\
  \ rollover uncertain\n   - Time required: 2.5 hours (documentation finalization)\n\
  \   - Available window: March 30 afternoon administrative block (2.5 hours)\n  \
  \ - Risk: Requires physical documentation submission to Finance Office\n\n3. **Voucher\
  \ expiry (LOW)**\n   - Deadline: March 31, 23:59 (soft deadline)\n   - Consequence:\
  \ CNY 2,180 returns to departmental pool (no personal penalty per MSG-5242)\n  \
  \ - Time required: Unknown (alternative use evaluation)\n   - Upstream block: TODO-504\
  \ CSCM clearance unresolved, CardioCloud vendor flagged\n   - Decision: Accept forfeiture\
  \ as lowest-priority outcome\n\n## Step 3: Allocate time windows to priorities\n\
  \n**Execution sequence for March 30:**\n\n- **14:00-16:30** (Administrative window\
  \ EVT-493): Finalize reimbursement claim documentation\n  - Prepare Form F-CME-2026\n\
  \  - Compile payment receipt (TXN-6012)\n  - Draft formal MedEd360 withdrawal statement\n\
  \  - Plan March 31 submission logistics (in-person vs. email to Zhao Lei)\n\n- **19:00-23:00**\
  \ (Study block EVT-492): Complete NMEC module\n  - 19:00-19:45: Section 8 (45 min)\n\
  \  - 19:45-20:20: Section 9 (35 min)\n  - 20:20-23:00: Final assessment (90 min\
  \ + buffer for fatigue/retake)\n  - Defend block against shift extension (communicate\
  \ unavailability to scheduling)\n\n**March 31 execution:**\n- Morning/early afternoon:\
  \ Submit reimbursement claim to Finance Office (before 17:00 deadline)\n- Before\
  \ 23:59: Upload NMEC completion certificate to PUMCH CME portal\n\n**Voucher decision:**\n\
  - Defer alternative use evaluation to post-CME completion\n- Accept forfeiture if\
  \ no zero-friction eligible vendor surfaces\n- No action required (balance automatically\
  \ returns to departmental pool)\n\n## Step 4: Communicate prioritization rationale\n\
  \n**Key points for Chen Rui:**\n\n1. **CME completion is non-negotiable** — Q1 compliance\
  \ failure is irreversible and affects annual residency standing. The March 30 evening\
  \ study block is the last viable window.\n\n2. **Reimbursement claim is high-value\
  \ recovery** — CNY 933 is significant and the March 30 administrative window provides\
  \ sufficient time for documentation finalization.\n\n3. **Voucher expiry is acceptable\
  \ loss** — Zhao Lei confirmed no personal penalty (balance returns to departmental\
  \ pool). Given competing priorities and unresolved CSCM clearance block (TODO-504),\
  \ deferring evaluation or accepting forfeiture is rational.\n\n4. **Critical dependency**:\
  \ Study block EVT-492 must be defended. If ICU shift extends past 08:00 on March\
  \ 30, NMEC completion probability drops to <30% (per NOTE-230).\n\n5. **Execution\
  \ confidence**: 80% probability of completing both CME and reimbursement if time\
  \ windows are protected. Voucher forfeiture has no negative consequence beyond opportunity\
  \ cost.\n\n## Expected outcome\n\nChen Rui should:\n- Allocate March 30 afternoon\
  \ to reimbursement documentation (TODO-716)\n- Allocate March 30 evening to NMEC\
  \ completion (TODO-715)\n- Accept voucher VCH-2026-0031 expiry as lowest-priority\
  \ outcome (TODO-717)\n- Proactively defend study block against shift extension (TODO-718)\n\
  - Submit reimbursement claim by March 31, 17:00\n- Submit NMEC certificate by March\
  \ 31, 23:59\n- Allow voucher balance to return to departmental pool (no action required)"
