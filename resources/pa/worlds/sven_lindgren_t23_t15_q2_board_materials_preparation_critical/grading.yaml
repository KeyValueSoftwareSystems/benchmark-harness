judge_rubric: 'Award full marks if the response: (1) correctly identifies Aurora synergy
  analysis (April 15-20 delivery window) as the critical path bottleneck affecting
  both Aurora and org restructuring workstreams; (2) quantifies the rework vs delay
  cost tradeoff (SEK 425k total rework exposure from parallel advancement vs SEK 1.2M
  EBITDA impact from Q3 deferral); (3) recommends a conditional parallel strategy
  for portfolio workstream (pre-approve Phase 2 contract, hold execution until April
  22 quality gate) while deferring org restructuring to avoid Henrik alignment risk;
  (4) sets explicit go/no-go checkpoint at April 22 with quality threshold criteria;
  (5) defines escalation protocol if Aurora delivery slips past April 20; (6) presents
  the decision rationale with explicit ''what would change my mind'' logic (e.g.,
  if Aurora cost allocation shows lower BU 4 impact, Henrik alignment accelerates
  and org restructuring returns to May board scope). Deduct points if: the response
  fails to recognize Aurora as a shared dependency for multiple workstreams; recommends
  pure parallel or pure serial strategies without conditional checkpoints; omits cost
  quantification; fails to surface the April 22 decision gate; or does not specify
  escalation triggers. The response should reflect Sven''s analytical rigor: structured
  dependency mapping, explicit cost-benefit analysis, and decision criteria that the
  CFO and CEO can audit.'
reference_solution: '1. Query calendar_list_events to retrieve Q2 board meeting date
  (EVT-395: May 14, 2026, 09:00-15:00) and board materials finalization deadline (EVT-396:
  May 7, 2026, 17:00 — 5 business days prior per board secretary protocol).


  2. Retrieve workmail_list_messages with labels ''external-advisor'', ''Aurora'',
  ''portfolio-review'', ''timeline-risk'' to extract delivery commitments: WMSG-5124
  (Maria Svensson, CIP AB Phase 1 delivery April 22, data quality issues with BU 6);
  WMSG-5125 (Erik Lundqvist, Aurora synergy analysis April 15-20, 5-day uncertainty
  window due to Finnish target Q1 actuals and IT systems complexity); WMSG-5126 (Sven''s
  own draft to CFO/CEO outlining critical path analysis).


  3. Query claw_notion_get_page for NPAG-63 (Q2 Board Materials Critical Path Analysis
  decision log) to retrieve documented dependency chain: Aurora synergy (April 15-20)
  → CFO review (3d) → CEO approval (2d) → formatting (2d) = 12-17 days total; Portfolio
  Phase 1 quality gate (April 22) → Phase 2 decision (1d) → Phase 2 delivery (12d)
  → CFO review (2d) = 15 days; Org restructuring Henrik alignment (uncertain, blocked
  on Aurora) → drafting (5d) → legal review (3d) = 8+ days.


  4. Query todo_list_tasks with tags ''board-materials'', ''critical-path'', ''checkpoint''
  to confirm task status: TODO-624 (dependency mapping, completed), TODO-625 (rework
  vs delay cost calculation, completed), TODO-626 (April 22 checkpoint setup, pending),
  TODO-627 (Notion documentation, pending), TODO-628 (Aurora delivery monitoring with
  escalation protocol, pending).


  5. Query finance_list_transactions to verify Q2 external advisor budget status:
  TXN-6048 (Nordic Synergy Analytics, SEK 285k for Aurora synergy analysis), TXN-6049
  (Q2 budget reserve, SEK 180k remaining headroom after committed invoices).


  6. Identify critical path bottleneck: Aurora synergy analysis (April 15-20, 5-day
  uncertainty) is on the critical path for BOTH Aurora integration roadmap AND org
  restructuring implementation plan (Henrik''s concerns depend on integration cost
  allocation). The delivery uncertainty propagates to all downstream tasks.


  7. Calculate rework vs delay costs: (a) Parallel advancement rework exposure: Portfolio
  Phase 2 before Phase 1 quality gate = SEK 245k risk (if Phase 1 fails threshold);
  org restructuring consultant before Henrik alignment = SEK 180k risk (if integration
  costs force scope reduction); total = SEK 425k. (b) Serial waiting delay costs:
  Waiting for Aurora clarity before Portfolio Phase 2 = 8-day delay, pushes finalization
  to May 18 (2 days past May 7 deadline); waiting for Henrik alignment before org
  restructuring = 5-day delay, forces Q3 deferral with SEK 1.2M quarterly EBITDA impact
  from delayed cost synergies.


  8. Determine advancement strategy: (a) Aurora workstream: strict serial mode (synergy
  → CFO → CEO) due to high downstream dependency; (b) Portfolio workstream: conditional
  parallel — set checkpoint at April 22 (CIP AB Phase 1 delivery), pre-approve Phase
  2 contract but HOLD execution until quality confirmation; if quality meets threshold,
  authorize immediately to preserve May board slot; if fails, pivot to Lars Eriksson
  internal analysis and defer to Q3; (c) Org restructuring: DEFER consultant engagement
  until Aurora cost clarity (expected April 25), accept Q3 board deferral risk to
  avoid SEK 180k rework.


  9. Set go/no-go checkpoint at April 22: CIP AB Phase 1 deliverable quality gate.
  GO criteria: competitive positioning robust, ROIC benchmarking validated, portfolio
  scenarios actionable → authorize Phase 2 immediately. NO-GO criteria: quality fails
  threshold → internal analysis (Lars) + Q3 deferral.


  10. Define escalation protocol: If Aurora synergy delivery slips past April 20,
  immediately notify CFO Anna Karlsson and CEO Per Johansson, assess partial board
  materials delivery options (regulatory compliance summary + valuation range only),
  recommend May board agenda adjustment (defer full integration roadmap to Q3).


  11. Document decision rationale: This strategy minimizes rework cost (SEK 425k →
  SEK 0-245k) while preserving 2 of 3 workstreams for May board. Org restructuring
  deferral is least-bad option given Henrik''s resistance, Aurora dependency, and
  budget constraint. The SEK 1.2M quarterly EBITDA impact from deferral is outweighed
  by avoiding SEK 425k rework exposure and maintaining board credibility.


  12. ''What would change my mind'' section: If Aurora synergy analysis shows integration
  costs concentrated in BU 7 (not BU 4), Henrik''s alignment accelerates and org restructuring
  returns to May board scope. If CIP AB Phase 1 delivers early (April 18-20) with
  high quality, Portfolio Phase 2 timeline compresses and creates budget headroom
  for parallel org restructuring consultant engagement.


  13. Send workmail_send_message to CFO Anna Karlsson and CEO Per Johansson summarizing
  critical path analysis, checkpoint strategy, and escalation protocol (or confirm
  WMSG-5126 already sent).


  14. Update claw_notion_append_blocks to NPAG-63 decision log with final checkpoint
  criteria and approval status once CFO/CEO sign-off received.'
