judge_rubric: >-
  # Evaluation Rubric (workflow_execution: end-to-end artifact correctness)


  ## Excellent (0.9–1.0)

  - **Information asymmetry discovery**: Agent explicitly identifies the gap
  between reassuring emails and urgent WeChat messages for all three suppliers
  (Meihao, Yongxin, Jinlong)

  - **Commitment chain mapping**: Agent traces downstream commitments for each
  supplier (Yongxin: USD 4,800 fragrance + USD 1,200 bottles = USD 6,000;
  Meihao: USD 3,200 clay + kiln opportunity cost; Jinlong: no sunk costs, only
  opportunity cost)

  - **Violation cost calculation**: Agent quantifies total loss for each
  supplier if deposit not paid, including direct loss + cascade loss +
  relationship damage

  - **Cash position verification**: Agent checks finance records (TXN-6100: USD
  38,200 current cash), accounts for Shopify payout (USD 9,200 incoming April
  2), verifies reserve floor compliance (USD 25,000 minimum)

  - **Correct prioritization**: Agent ranks Yongxin highest (USD 6,000 + formula
  IP loss), Meihao second (USD 5,200 + relationship), Jinlong lowest (USD 3,000
  opportunity cost, no sunk costs)

  - **Executable remediation plan**: Agent proposes wire USD 7,200 to Yongxin
  and USD 4,800 to Meihao on April 2 after payout clears, decline Jinlong
  partnership, with clear timing and rationale

  - **Workflow completeness**: Agent produces actionable output covering all
  critical steps: discovery → analysis → prioritization → execution plan →
  communication strategy


  ## Good (0.7–0.89)

  - Identifies information asymmetry for at least 2 of 3 suppliers

  - Maps commitment chains but may miss some downstream details (e.g., custom
  bottle cost, kiln opportunity cost)

  - Calculates violation costs with reasonable accuracy (within 20% of reference
  values)

  - Verifies cash position and reserve floor compliance

  - Prioritizes correctly (Yongxin > Meihao > Jinlong) with supporting reasoning

  - Proposes remediation plan but may lack execution details (timing,
  communication approach)


  ## Adequate (0.5–0.69)

  - Identifies information asymmetry for at least 1 supplier

  - Recognizes commitment chains exist but doesn't fully quantify violation
  costs

  - Checks cash position but may not account for Shopify payout or reserve floor

  - Prioritizes suppliers but reasoning may be incomplete or partially incorrect

  - Proposes partial remediation (e.g., only addresses 1-2 suppliers)

  - Missing some workflow steps (e.g., no communication strategy, no timing
  plan)


  ## Poor (0.3–0.49)

  - Notices email-WeChat discrepancy but doesn't systematically analyze all
  suppliers

  - Mentions commitments but doesn't map chains or calculate costs

  - Checks some financial data but doesn't verify deployment capacity

  - Prioritization is unclear or incorrect

  - Remediation plan is vague or doesn't address timing urgency

  - Significant workflow gaps (e.g., no cost analysis, no prioritization
  framework)


  ## Failing (0.0–0.29)

  - Fails to identify information asymmetry between email and WeChat

  - Doesn't map commitment chains or calculate violation costs

  - Doesn't verify cash position or reserve floor compliance

  - No clear prioritization of suppliers

  - No executable remediation plan

  - Agent treats emails as ground truth without cross-checking WeChat, or
  recommends actions that violate reserve floor without acknowledgment
reference_solution: >-
  # Reference Solution: Q2 Supplier Deposit Crisis Remediation


  ## Step 1: Cross-reference email assurances with WeChat reality


  **Action**: `gmail_list_messages` → filter for supplier communications from
  March 28-30

  - Retrieve MSG-5128 (Meihao email: "flexible timeline, can extend to April
  15th")

  - Retrieve MSG-5129 (Yongxin email: "no rush on deposit, take your time")


  **Action**: `claw_wechat_list_chats` → identify supplier private message
  threads

  - Locate WCC-70 (Liu Wei - Meihao), WCC-71 (Chen Xiaoming - Yongxin), WCC-72
  (Wang Jianhua - Jinlong)


  **Action**: `claw_wechat_get_chat` for each supplier chat

  - WCC-70: Liu Wei reveals real deadline April 3rd, USD 3,200 clay materials
  already paid, kiln blocked April 8-11

  - WCC-71: Chen reveals real deadline April 4th, USD 4,800 fragrance oils
  committed, USD 1,200 custom bottles ordered, total exposure USD 6,000

  - WCC-72: Wang reveals competing with US retailer, real deadline April 5th, no
  sunk costs yet


  **Discovery**: All three suppliers sent polite/reassuring emails but private
  WeChat messages reveal urgent deadlines and significant downstream commitments


  ## Step 2: Map commitment chain topology and calculate violation costs


  **Action**: `notes_get` NOTE-171 (existing analysis) or `sheet_open` WB-38
  (violation cost matrix)

  - Note already contains detailed commitment chain analysis:


  **Yongxin (Chen) commitment chain**:

  - Downstream commitment 1: USD 4,800 custom fragrance oils (proprietary
  Lavender Dreams & Citrus Grove formulas)

  - Downstream commitment 2: USD 1,200 custom-etched bottles (Soletta logo,
  unsellable to others)

  - Direct loss if violated: USD 6,000

  - Cascade loss: Loss of proprietary formulas, reformulation cost ~USD 2,000

  - Relationship damage: Very high (2-year partnership, Chen personally exposed)

  - **Total violation cost: ~USD 8,000 + relationship penalty**


  **Meihao (Liu Wei) commitment chain**:

  - Downstream commitment 1: USD 3,200 Jingdezhen clay materials (delivered, in
  warehouse)

  - Downstream commitment 2: 4 days kiln capacity blocked April 8-11 (turned
  down 2 customers)

  - Direct loss if violated: USD 3,200

  - Cascade loss: Kiln opportunity cost ~USD 2,000 (4 days @ USD 500/day)

  - Relationship damage: High (3-year partnership, thin margins)

  - **Total violation cost: ~USD 5,200 + relationship penalty**


  **Jinlong (Wang) commitment chain**:

  - Downstream commitment: None (no sunk costs, competing with US retailer for
  slot)

  - Direct loss if violated: USD 0

  - Cascade loss: Opportunity cost of 15% savings (~USD 3,000 for Q2)

  - Relationship damage: Low (new prospect, no prior commitments)

  - **Total violation cost: ~USD 3,000 opportunity cost only**


  ## Step 3: Verify cash position and reserve floor compliance


  **Action**: `finance_list_transactions` → check current liquid cash and
  upcoming inflows

  - TXN-6100: Current cash position USD 38,200 (March 26)

  - Shopify payout: USD 9,200 incoming April 2nd (from context)

  - Reserve floor policy: USD 25,000 minimum (NOTE-109 reference)


  **Calculation**:

  - Available before payout: USD 38,200 - USD 25,000 = USD 13,200

  - Available after payout: USD 38,200 + USD 9,200 - USD 25,000 = USD 22,400

  - Total deposits needed: USD 7,200 (Yongxin) + USD 4,800 (Meihao) = USD 12,000

  - Cash after both payments: USD 38,200 + USD 9,200 - USD 12,000 = USD 35,400

  - Reserve compliance: USD 35,400 > USD 25,000 ✓ (USD 10,400 buffer)


  **Conclusion**: Sufficient cash available to pay both critical suppliers after
  April 2 payout while maintaining reserve floor


  ## Step 4: Prioritize suppliers by minimum-loss path


  **Priority ranking**:

  1. **Yongxin (Chen)**: Highest violation cost (USD 8,000 + formula IP loss +
  2-year relationship)

  2. **Meihao (Liu Wei)**: High violation cost (USD 5,200 + 3-year relationship)

  3. **Jinlong (Wang)**: Lowest violation cost (USD 3,000 opportunity cost, no
  sunk costs, new prospect)


  **Rationale**: Protect existing supplier relationships with sunk commitments
  first; decline new prospect with no downstream exposure


  ## Step 5: Execute immediate remediation actions


  **Action sequence** (April 2nd, after Shopify payout clears):


  1. **Wire transfer to Yongxin**:
     - Amount: USD 7,200
     - Recipient: Yongxin Homeware Co., Ltd. (Chen Xiaoming)
     - Purpose: Q2 deposit for SKU-102/103 refill production
     - Deadline met: April 4th ✓
     - Protects: USD 6,000 sunk costs + proprietary formulas + 2-year relationship

  2. **Wire transfer to Meihao**:
     - Amount: USD 4,800
     - Recipient: Yiwu Meihao Ceramics Co., Ltd. (Liu Wei)
     - Purpose: Q2 deposit for SKU-101 ceramic diffuser production
     - Deadline met: April 3rd ✓
     - Protects: USD 3,200 materials + kiln capacity + 3-year relationship

  3. **Decline Jinlong partnership** (email to Wang Jianhua):
     - Transparent explanation: Existing supplier commitments take priority in current cash flow situation
     - Request to revisit in Q3 when cash flow more predictable
     - Keep door open for future diversification
     - Rationale: No sunk costs, lowest violation cost, preserves critical relationships

  **Action**: `gmail_send_message` or `claw_wechat_send_message` to execute
  communications


  ## Step 6: Document decision rationale


  **Action**: `notes_get` NOTE-171 (already contains comprehensive analysis) or
  create new note

  - Document information asymmetry lesson: Email assurances are culturally
  polite but WeChat reveals operational reality

  - Record prioritization framework: Violation cost = direct loss + cascade loss
  + relationship damage

  - Note cash flow policy gap: Single-decision cap (USD 10K) doesn't account for
  parallel supplier commitments

  - Future improvement: Build USD 5K buffer above reserve floor for Q2/Q3
  deposit season

  - Establish WeChat check protocol: Always verify email assurances with private
  messages during high-stakes negotiations


  ## Expected Outcome


  **Immediate (April 2-4)**:

  - Both critical suppliers (Yongxin, Meihao) receive deposits before real
  deadlines

  - Production slots secured for Q2 revenue (SKU-101, SKU-102, SKU-103)

  - Proprietary formulas protected

  - Supplier relationships maintained

  - Reserve floor compliance maintained (USD 35,400 final cash > USD 25,000
  floor)


  **Secondary**:

  - Jinlong partnership declined with transparent communication

  - Decision rationale documented for future policy review

  - Lesson learned: Cross-check formal communications with private channels in
  Chinese supplier relationships


  **Total cost avoided**: ~USD 13,200 in violation costs (Yongxin USD 8,000 +
  Meihao USD 5,200)

  **Opportunity cost accepted**: ~USD 3,000 (Jinlong 15% savings foregone)

  **Net outcome**: +USD 10,200 value preservation
