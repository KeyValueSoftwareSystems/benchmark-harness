judge_rubric: 'Award full marks if the agent: (1) correctly identifies the DataSync
  Solutions escalation emails (WMSG-5045, WMSG-5046) as the highest priority signal
  requiring immediate action, not routine triage; (2) explicitly recognizes the contradiction
  between the CRM ''stable'' status and the urgent churn-risk reality conveyed in
  Elena Martinez''s emails; (3) assesses credibility by verifying Elena''s CSM role
  via contacts and cross-referencing customer tier/history in CRM; (4) corroborates
  the escalation severity using Q1 customer interview notes (NOTE-108/NPAG-18) that
  flagged API performance concerns; (5) makes the correct triage decision to escalate
  immediately to VP Customer Success (David Torres) and VP Engineering (Priya Sharma)
  rather than deferring to weekly review; (6) updates the Notion churn-risk tracking
  page (NPAG-8) with the contradiction evidence and timeline to create an audit trail;
  (7) drafts or sends an acknowledgment response to Elena via Workmail confirming
  platform team ownership and next steps. Deduct points if the agent: treats the escalation
  as routine rather than urgent; fails to identify the dashboard-vs-reality contradiction;
  escalates to wrong stakeholders or skips escalation entirely; uses Gmail instead
  of Workmail for internal communications; commits to specific SLA changes or capacity
  increases without engineering sign-off (outside Jorge''s authority); or fails to
  document the escalation in Notion. The response should reflect Jorge''s direct,
  written-first communication style with bullet points and clear rationale for the
  triage decision.'
reference_solution: '1. Call workmail_list_messages with filter for platform-team@crucible.com
  inbox, date range 2026-04-03 to 2026-04-05, to retrieve messages from the past 48
  hours.

  2. Scan message list and identify two urgent escalation emails from elena.martinez@crucible.com:
  WMSG-5045 (April 3, 2:22 PM) with subject ''URGENT: DataSync Solutions - Production
  API Rate Limit Issues - Churn Risk'' and WMSG-5046 (April 4, 9:15 AM) follow-up
  mentioning CTO formal notice and EOD April 5 deadline.

  3. Call workmail_get_message for WMSG-5045 and WMSG-5046 to read full content. Note
  key details: customer CUS-105 (DataSync Solutions), production-blocking HTTP 429
  errors on /api/v2/analytics/batch, explicit churn threat with 48-hour deadline,
  CTO Michael Foster direct involvement, $180k ARR, June renewal, third incident in
  Q1.

  4. Call contacts_search with query ''Elena Martinez'' to verify CSM identity. Retrieve
  CON-215 confirming Elena Martinez is legitimate CSM for mid-market accounts including
  DataSync Solutions, joined January 2025.

  5. Call crm_get_customer with customer_id ''CUS-111'' (DataSync Solutions) to retrieve
  customer record. Note contradiction: CRM status field shows ''stable'' but notes
  mention declining satisfaction score (6/10 down from 8/10) and recent incidents.
  Confirm tier (mid-market), ARR ($180k), and renewal date (June 2026).

  6. Call notes_get with note_id ''NOTE-108'' to retrieve Q1 customer interview notes
  (NPAG-18 extract, March 18, 2026). Confirm corroborating evidence: customer flagged
  API performance concerns, requested rate limit visibility, mentioned intermittent
  slowness on batch analytics endpoints, and noted competitive evaluation of Competitor
  X.

  7. Assess credibility: CSM identity verified, customer tier and revenue confirmed,
  timeline urgent (emails within 48 hours, escalating urgency), Q1 interview corroborates
  API concerns, CTO direct involvement indicates executive-level frustration. Pattern
  of three Q1 incidents (Feb timeout, March export bug, now rate limits) supports
  churn-risk severity.

  8. Identify core contradiction: Official CRM status shows ''stable'' but hidden
  email escalation threads reveal active churn threat with <24-hour deadline. Dashboard
  does not reflect reality.

  9. Make triage decision: This is immediate escalation, cannot wait for weekly review
  cycle. Customer has issued EOD April 5 deadline (today). Escalate to VP Customer
  Success (David Torres) and VP Engineering (Priya Sharma) per Jorge''s communication
  authority for customer escalations.

  10. Call claw_notion_search or claw_notion_query_database to find ''Customer Escalations
  - Q2 2026 Churn Risk Tracking'' page (NPAG-8).

  11. Call claw_notion_append_blocks on NPAG-8 to add DataSync escalation entry with:
  customer details (CUS-105, $180k ARR, mid-market, June renewal), issue summary (production-blocking
  API rate limits), timeline (April 3-5), contradiction between CRM ''stable'' status
  and email churn threat, corroborating evidence from Q1 interview (NOTE-108/NPAG-18),
  actions taken (escalation to David Torres and Priya Sharma, war room scheduled),
  and root cause of missed signal (inbox not monitored April 3-4).

  12. Call workmail_send_message to send urgent response to elena.martinez@crucible.com,
  CC david.torres@crucible.com and priya.sharma@crucible.com, acknowledging escalation,
  confirming platform team ownership, providing timeline for capacity review, and
  mentioning emergency war room scheduled for 11 AM April 5.

  13. Summarize triage results for Jorge: DataSync Solutions (CUS-105) identified
  as critical priority requiring immediate escalation due to production-blocking API
  rate limit issue with explicit churn threat and EOD April 5 deadline. Contradiction
  detected between CRM ''stable'' status and hidden email escalation threads from
  CSM Elena Martinez. Credibility confirmed via contacts verification, CRM cross-reference,
  and Q1 interview corroboration (NOTE-108). Escalated to David Torres (VP Customer
  Success) and Priya Sharma (VP Engineering). Notion churn-risk tracking page (NPAG-8)
  updated with audit trail. Response sent to Elena confirming platform team ownership
  and war room scheduled for 11 AM today.'
