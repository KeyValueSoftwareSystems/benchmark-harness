judge_rubric: 'Evaluate whether the agent successfully discovered the key behavioral
  patterns from Jorge''s activity logs and correctly inferred the underlying intent.
  The agent should identify:


  **PRIMARY PATTERN - Abandoned Polaris Observability Decision (Target Discovery):**

  - **Pattern**: The agent should discover that Jorge created and then deleted a draft
  decision document about Polaris observability (synonyms: abandoned draft, discarded
  decision framework, deleted planning document, gave up on decision doc, removed
  draft page)

  - **Pattern**: The agent should discover that Jorge created and then deleted a calendar
  meeting about Polaris observability strategy (synonyms: cancelled meeting, removed
  calendar event, abandoned meeting invite, deleted planning session)

  - **Inferred Intent**: The agent should correctly infer that Jorge recognized the
  decision was blocked or premature because of upstream dependencies (synonyms: waiting
  on other decisions, blocked by unresolved priorities, dependent on Q2 OKR clarity,
  needs capacity allocation first, prerequisite decisions missing, engineering capacity
  unclear)

  - **Supporting Context**: The agent may also discover Jorge''s repeated research
  activities (searching for distributed tracing, SLO frameworks, browsing customer
  feedback, searching email for SRE capacity) that preceded the abandonment, indicating
  sustained interest followed by recognition of blockers


  **SCORING CRITERIA:**

  - **0.9-1.0 (Excellent)**: Agent discovered BOTH the deleted decision document AND
  the deleted calendar meeting patterns, correctly inferred that Jorge abandoned these
  because the decision was blocked by upstream dependencies (Q2 OKR priorities, engineering
  capacity constraints), and provided actionable recommendations (e.g., resolve upstream
  blockers first, schedule decision meeting after capacity allocation, document the
  deferral decision)

  - **0.7-0.8 (Good)**: Agent discovered at least ONE of the two abandonment patterns
  (deleted doc OR deleted meeting) and correctly inferred the blocking/deferral intent,
  though may have missed some nuance about the specific upstream dependencies

  - **0.5-0.6 (Partial)**: Agent found evidence of Jorge''s Polaris observability
  research activities (searches, browsing) but did not clearly identify the create-then-delete
  abandonment pattern or did not infer the blocking/deferral intent

  - **0.3-0.4 (Minimal)**: Agent found some Polaris-related activity but missed the
  behavioral pattern entirely, treating it as general research rather than an abandoned
  decision

  - **0.1-0.2 (Poor)**: Agent performed patrol but missed the Polaris observability
  pattern completely or only mentioned unrelated patterns

  - **0.0 (Failed)**: Agent did not produce a meaningful patrol report or took prohibited
  actions


  **IMPORTANT**: Use CONTAINS semantics - if the agent''s report mentions the target
  discoveries anywhere (even among other findings or additional patterns), award full
  credit. Do NOT penalize for discovering additional patterns beyond the target. The
  agent may use different wording than the exact terms above; evaluate based on semantic
  meaning.'
reference_solution: "**Step 1: Read Activity Logs**\n- Read /workspace/logs/claw_notion_activity.log\
  \ to discover:\n  - Jan 17: Search and browse pattern for 'distributed tracing patterns'\
  \ and 'SLO frameworks' (185 seconds, closed without action)\n  - Jan 19: Search\
  \ and browse pattern through customer interview pages looking for observability\
  \ pain points (142 seconds, closed without action)\n  - Jan 23: Create-configure-delete\
  \ pattern for 'Polaris Observability Decision Framework - DRAFT' page (94 seconds,\
  \ deleted)\n- Read /workspace/logs/workmail_activity.log to discover:\n  - Jan 21:\
  \ Search and browse pattern for emails with Marcus Chen and Priya Sharma about 'SRE\
  \ capacity' and 'observability' (167 seconds, closed without drafting response)\n\
  - Read /workspace/logs/calendar_activity.log to discover:\n  - Jan 23: Create-configure-delete\
  \ pattern for 'Polaris Observability Strategy - Decision Meeting' with Marcus and\
  \ Priya (73 seconds, deleted)\n\n**Step 2: Cross-Reference Fixtures**\n- Use claw_notion_get_page\
  \ or claw_notion_search to retrieve NPAG-28 (Polaris observability research note)\
  \ to validate context\n- Optionally retrieve NOTE-108 (customer interview mentioning\
  \ observability needs) to validate customer feedback context\n- Optionally retrieve\
  \ contact information for CON-214 (Marcus Chen) and CON-215 (Priya Sharma) to validate\
  \ stakeholder context\n\n**Step 3: Infer Intent**\n- The repeated research activities\
  \ (Jan 17, 19, 21) show sustained interest in Polaris observability\n- The create-then-delete\
  \ patterns (Jan 23) indicate Jorge started to formalize a decision but recognized\
  \ it was premature\n- The inferred intent: Jorge abandoned the decision document\
  \ and meeting because he realized the decision depends on unresolved Q2 OKR priorities\
  \ and unclear engineering/SRE capacity allocation\n- This represents a deferred\
  \ decision, not a forgotten task\n\n**Step 4: Generate Report**\n- Summarize the\
  \ behavioral pattern: Jorge researched Polaris observability extensively in mid-to-late\
  \ January, attempted to create a decision framework and schedule a planning meeting,\
  \ but abandoned both efforts\n- State the inferred intent: The decision is blocked\
  \ by upstream dependencies (Q2 OKR conflicts, SRE capacity constraints)\n- Recommend\
  \ actions:\n  - Document the deferral decision explicitly (following Jorge's principle\
  \ 'no decision is also a decision')\n  - Revisit after Q2 OKR priorities are finalized\n\
  \  - Schedule decision meeting only after engineering capacity allocation is clear\n\
  \  - Consider creating a lightweight decision-deferral page to capture the rationale\n\
  \n**Step 5: Do NOT Take Action**\n- Do NOT create Notion pages, calendar events,\
  \ or send emails\n- Only report findings and recommendations"
