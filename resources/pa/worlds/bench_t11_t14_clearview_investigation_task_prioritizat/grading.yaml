judge_rubric: '# Evaluation Rubric: CLEARVIEW Investigation Sprint Reorganization


  ## Excellence (0.9–1.0)

  - **Deadline comprehension**: Clearly identifies the compressed legal deadline (April
  3rd EOD, moved up 48 hours from April 5th) and recognizes this as the primary constraint
  driving all prioritization decisions.

  - **Critical path analysis**: Correctly identifies the Jersey expedite decision
  (TODO-681) as the immediate blocker requiring resolution by 5pm March 31st, with
  explicit reasoning about why this decision gates the rest of the sequence (delivery
  timeline impacts legal package compilation buffer).

  - **Dependency mapping**: Accurately maps blocking dependencies: Panama docs (April
  1st 7pm) → Source A interview prep → Source A interview (April 2nd 8am EST) → narrative
  finalization → legal package compilation (April 3rd).

  - **Immovable constraints**: Respects all immovable deadlines (Source A interview
  April 2nd 3pm Cyprus time, Reuters call April 2nd 10am EST, legal handoff April
  3rd 5pm) and explains why these cannot be rescheduled.

  - **Risk assessment**: Flags specific risks with supporting evidence: (1) Jersey
  expedite decision impact on legal review completeness, (2) Panama delivery slip
  risk to Source A interview quality, (3) mental energy concerns for April 2nd (3
  high-cognitive-load activities in one day), (4) 7-hour buffer compression if Jersey
  expedite declined.

  - **Execution sequence**: Produces a clear, ranked task order with explicit sequencing
  rationale for each priority tier. Distinguishes critical-path tasks (cannot defer
  without compromising legal review or source safety) from deferrable tasks (can push
  post-legal handoff).

  - **Source protection**: Demonstrates awareness of source safety protocols (e.g.,
  encrypted communications handling, source availability windows) and flags any reordering
  that could create exposure risk.

  - **Legal review quality**: Preserves counsel-mandated buffer requirements and explains
  trade-offs between completeness (waiting for all Jersey entities) vs. timeliness
  (proceeding with partial documentation).


  ## Proficiency (0.7–0.89)

  - Identifies the April 3rd legal deadline and most critical blocking dependencies
  (Jersey expedite, Panama delivery, Source A interview).

  - Produces a reasonable task sequence that respects immovable deadlines, though
  may lack explicit rationale for some prioritization decisions.

  - Flags major risks (legal review buffer compression, vendor delivery dependencies)
  but may miss secondary concerns (mental energy, source safety nuances).

  - Demonstrates understanding of critical path vs. deferrable tasks, with mostly
  correct categorization.


  ## Partial Success (0.5–0.69)

  - Recognizes the compressed legal deadline but may not fully map its implications
  for task sequencing.

  - Identifies some blocking dependencies (e.g., Source A interview, registry document
  delivery) but misses others (e.g., Jersey expedite decision as immediate blocker).

  - Produces a task list that addresses some priorities but lacks clear ranking rationale
  or omits critical sequencing constraints.

  - Mentions risks generically (e.g., "tight timeline") without specific evidence
  or impact assessment.


  ## Inadequate (0.3–0.49)

  - Acknowledges the legal deadline but fails to reorganize tasks around it as the
  primary constraint.

  - Misses critical blocking dependencies (e.g., treats Jersey expedite decision as
  routine rather than immediate blocker).

  - Produces a task list without clear prioritization or sequencing logic.

  - Does not address source safety or legal review quality constraints.


  ## Failure (0.0–0.29)

  - Does not identify the compressed legal deadline or its impact on sprint planning.

  - Fails to retrieve or synthesize information from todo, calendar, email, or notes.

  - Produces generic task management advice without reference to CLEARVIEW investigation
  specifics.

  - Violates safety constraints (e.g., suggests deleting tasks, rescheduling source
  interviews without explicit user confirmation).'
reference_solution: "# Reference Solution: CLEARVIEW Week 13 Sprint Reorganization\n\
  \n## Step 1: Retrieve all pending CLEARVIEW tasks\n- **Action**: `todo_list_tasks`\
  \ (filter by tags: \"clearview\")\n- **Key findings**:\n  - TODO-681: Jersey expedite\
  \ decision (due March 31st, 5pm deadline to respond to Thomas Patel)\n  - TODO-682:\
  \ Produce ranked task execution order (due March 31st EOD, requested by Marcus)\n\
  \  - Additional tasks referenced in NOTE-197 critical path analysis\n\n## Step 2:\
  \ Review calendar for immovable deadlines\n- **Action**: `calendar_list_events`\
  \ (date range: March 31 - April 3)\n- **Key findings**:\n  - EVT-423: Marcus sync\
  \ March 31st 2pm (discuss sprint re-sequencing)\n  - EVT-426: Legal handoff April\
  \ 3rd 5pm (HARD DEADLINE)\n  - Source A interview April 2nd 3pm Cyprus time (8am\
  \ EST) - mentioned in notes\n  - Reuters coordination call April 2nd 10am EST -\
  \ mentioned in notes\n\n## Step 3: Check recent emails for deadline updates and\
  \ vendor status\n- **Action**: `gmail_list_messages` (filter: unread, labels: \"\
  clearview\", \"urgent\")\n- **Key findings**:\n  - MSG-5178 (Marcus Chen): Legal\
  \ deadline moved from April 5th to April 3rd (48-hour compression), requests revised\
  \ task sequence by EOD March 31st\n  - MSG-5179 (Thomas Patel, ECI): Cyprus batch\
  \ delivered March 31st 6pm, Jersey batch partially delayed (3 entities), expedite\
  \ option available for €95 (delivery April 1st 8pm vs April 2nd 10am standard)\n\
  \n## Step 4: Retrieve critical path analysis notes\n- **Action**: `notes_get` (note_id:\
  \ NOTE-197)\n- **Key findings**:\n  - Comprehensive critical path analysis with\
  \ blocking dependencies mapped\n  - Jersey expedite decision identified as immediate\
  \ blocker (need to cross-reference narrative to assess whether delayed entities\
  \ are critical path)\n  - Vendor delivery timeline: Cyprus ✓, Jersey partial, Panama\
  \ confirmed April 1st 7pm\n  - Risk warnings: 7-hour buffer compression if Jersey\
  \ expedite declined, mental energy concerns April 2nd, Panama delivery slip risk\n\
  \n## Step 5: Synthesize execution sequence\n\n### IMMEDIATE ACTION (March 31st,\
  \ before 5pm)\n1. **Jersey expedite decision (TODO-681)**: Cross-reference draft\
  \ narrative sections with delayed Jersey entities (Sentinel Holdings, Clearwater\
  \ Financial, Apex Consolidated SA Jersey branch). If entities are mentioned in beneficial\
  \ ownership claims requiring legal clearance → EXPEDITE MANDATORY (€95 cost justified\
  \ by legal risk mitigation). If not mentioned → can use standard delivery (April\
  \ 2nd 10am), accept 7-hour buffer compression for final package compilation.\n \
  \  - **Rationale**: This decision gates the rest of the timeline. Must be resolved\
  \ by 5pm today to secure April 1st delivery if expedite chosen.\n   - **Risk**:\
  \ If expedite declined and entities are critical path, creates severe buffer compression\
  \ for legal package compilation (April 2nd 10am delivery → April 3rd 5pm handoff\
  \ = 31 hours including overnight).\n\n### TIER 1: CRITICAL PATH (Cannot defer without\
  \ compromising legal deadline or source safety)\n2. **Review Cyprus batch documents**\
  \ (March 31st, 6pm-9pm): 14 entities delivered today, identify any gaps requiring\
  \ follow-up before legal handoff.\n3. **Review Panama documents** (April 1st, 7pm-10pm):\
  \ Critical for Source A interview prep (Dubai connection beneficial ownership verification).\n\
  4. **Prep Source A interview questions** (April 1st, 10pm-midnight): Focus on Dubai\
  \ connection, incorporate Panama registry findings.\n5. **Prep Reuters coordination\
  \ call** (April 1st evening, parallel with document review): Publication planning,\
  \ source attribution framework (80% of agenda can proceed without complete legal\
  \ clearance per Sarah Winters).\n6. **Conduct Source A interview** (April 2nd, 8am\
  \ EST / 3pm Cyprus time): Cannot reschedule (source availability window), critical\
  \ for narrative finalization.\n7. **Attend Reuters coordination call** (April 2nd,\
  \ 10am EST): Partner newsroom alignment, cannot reschedule (their editorial calendar).\n\
  8. **Review Jersey batch documents**: 6 entities available March 31st 6pm, 3 entities\
  \ April 1st 8pm (if expedited) or April 2nd 10am (standard).\n9. **Finalize draft\
  \ narrative sections** (April 2nd afternoon/evening): Incorporate Source A follow-up,\
  \ complete sections requiring legal clearance.\n10. **Compile legal briefing package**\
  \ (April 3rd, all day): All registry docs + Source A transcript + finalized narrative\
  \ sections.\n11. **Legal handoff meeting** (April 3rd, 5pm): HARD DEADLINE.\n\n\
  ### TIER 2: DEFERRABLE (Can push post-legal handoff without critical impact)\n-\
  \ Expense report compilation (can submit after publication)\n- Follow-up with UK\
  \ shell network data broker lead (separate investigation)\n- Archive encrypted source\
  \ communications (routine security hygiene)\n\n## Step 6: Flag risks and constraints\n\
  - **Source safety**: Source A interview window is immovable (source availability\
  \ constraint). Any task reordering that compresses interview prep time increases\
  \ risk of inadequate verification, which could create source exposure risk if published\
  \ claims are challenged.\n- **Legal review quality**: Counsel-mandated buffer cannot\
  \ be compressed below minimum threshold. If Jersey expedite declined, 7-hour buffer\
  \ between final document delivery (April 2nd 10am) and legal handoff (April 3rd\
  \ 5pm) is marginal for thorough legal package compilation.\n- **Mental energy**:\
  \ April 2nd involves 3 high-cognitive-load activities in 10 hours (Source A interview\
  \ 8am, Reuters call 10am, narrative finalization afternoon). Fatigue risk for April\
  \ 3rd legal briefing quality.\n- **Vendor dependencies**: Panama delivery slip (if\
  \ agent misses April 1st 7pm) would force Source A interview to proceed with partial\
  \ verification (higher legal risk) or attempt reschedule (likely impossible).\n\n\
  ## Output Format\nProduce a clear, ranked execution order with:\n1. Immediate action\
  \ items (Jersey expedite decision by 5pm March 31st)\n2. Tier 1 critical path tasks\
  \ (sequenced with explicit blocking dependencies)\n3. Tier 2 deferrable tasks\n\
  4. Risk warnings with specific evidence (buffer compression, vendor dependencies,\
  \ mental energy, source safety)\n5. Rationale for each prioritization decision"
