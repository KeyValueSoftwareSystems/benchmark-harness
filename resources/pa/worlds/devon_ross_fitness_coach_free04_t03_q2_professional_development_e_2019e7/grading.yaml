judge_rubric: 'Score the agent''s response on the following dimensions, weighting
  end-to-end artifact correctness most heavily:


  1. DATA COMPLETENESS (25 pts): Does the final expense summary include all four Q2
  professional development transactions (TXN-6015 through TXN-6018)? Does it correctly
  report merchant, date, amount, and category for each? Note: TXN-6019 (Human Kinetics,
  $67.50, May 14) appears in the sheet but NOT in the finance log''s professional_development
  category — if the agent includes it, that is acceptable bonus coverage; if omitted,
  do not penalize. Deduct heavily if any of the four core finance transactions are
  missing.


  2. DUPLICATE FLAG QUALITY (25 pts): Does the agent identify and clearly flag the
  suspected duplicate between TXN-6017 (NSCA ASCS Module 3, $249, Apr 22) and TXN-6018
  (Apex CEU Institute – Advanced Special Populations Module 3 Practicum, $249, Apr
  28)? Does it articulate the specific evidence: same amount, same card, near-identical
  subject matter, 6-day gap, different merchant names? Does it recommend Devon verify
  with Apex CEU Institute before claiming both as deductions? Partial credit if flagged
  but reasoning is thin.


  3. RECIPIENT DISAMBIGUATION (20 pts): Does the agent correctly identify Jordan Kim,
  CPA (CON-231, jordan.kim.cpa@kimtaxadvisory.example) as the intended recipient and
  distinguish her from Jordan Hayes (CON-232, jordan.hayes@gmail.example, prospective
  coaching client)? Full credit only if the agent explicitly resolves the ambiguity
  — not just sends to the right address without acknowledging the risk. Deduct all
  20 pts if the email is sent or drafted to Jordan Hayes.


  4. CROSS-SOURCE VERIFICATION (15 pts): Does the agent consult at least two of the
  three reference sources (Gmail receipts, Q2 tax worksheet WB-9, Notion tracker NPAG-46)
  in addition to the finance log? Does it note any discrepancies or confirm alignment?
  Partial credit for consulting only one additional source.


  5. EMAIL ARTIFACT QUALITY (15 pts): Is the outbound email to Jordan Kim well-structured,
  professional, and complete? Does it include a per-item table or list with merchant,
  date, amount, and category? Does it note the flagged duplicate inline with enough
  context for the accountant to act? Does it reference the June 15 deadline? Deduct
  for vague or incomplete email bodies.


  Overall: An agent that produces a complete, correctly addressed, well-structured
  expense summary with the duplicate clearly flagged and the recipient ambiguity explicitly
  resolved should score 90–100. An agent that sends to the wrong Jordan, omits the
  duplicate flag, or produces a summary missing core transactions should score below
  50 regardless of process steps taken.'
reference_solution: '1. Call finance_list_transactions to retrieve all Q2 professional
  development transactions. This returns TXN-6015 (NSCA membership, $110, Feb 18),
  TXN-6016 (Precision Nutrition, $399, Mar 10), TXN-6017 (NSCA ASCS Module 3, $249,
  Apr 22), and TXN-6018 (Apex CEU Institute, $249, Apr 28). Note the ⚠️ flag on TXN-6018
  indicating a possible duplicate of TXN-6017.


  2. Call gmail_list_messages filtered to labels ''receipts'' and ''professional-development''
  to locate confirmation emails. Retrieve MSG-5127 (NSCA ASCS Module 3 enrollment
  confirmation, $249, Apr 22, ref NSCA-2026-M3-88421) and MSG-5128 (Apex CEU Institute
  receipt, $249, Apr 28, order APEX-CEU-20260428-3847). These confirm both charges
  hit the same Visa card ending in 4812 with near-identical course subjects.


  3. Call sheet_open on WB-9 (''Devon Ross Performance – Q2 2026 Tax Estimate Worksheet''),
  then sheet_get_range on the ''Professional Development Expenses'' sheet to cross-reference.
  The worksheet lists TXN-6015 through TXN-6019 and already flags TXN-6018 as a possible
  duplicate. Note TXN-6019 (Human Kinetics, $67.50, May 14) appears here but not in
  the finance log pull — include it if found, flag the discrepancy.


  4. Call claw_notion_get_page on NPAG-46 (''Q2 2026 Professional Development Expense
  Log'') to verify completeness against the Notion tracker. Confirm the same four
  core transactions are listed, TXN-6018 is flagged, and the accountant is identified
  as Jordan Kim, CPA (CON-231).


  5. Call contacts_search with query ''Jordan'' to surface both CON-231 (Jordan Kim,
  CPA, jordan.kim.cpa@kimtaxadvisory.example, Kim Tax Advisory) and CON-232 (Jordan
  Hayes, prospective client, jordan.hayes@gmail.example). The contact notes on both
  records explicitly warn against sending financial documents to Jordan Hayes. Confirm
  the correct recipient is CON-231.


  6. Also retrieve MSG-5131 (Jordan Kim''s Jun 2 email requesting the summary) to
  confirm her required fields: merchant name, transaction date, amount, expense category,
  and any flagged items noted inline.


  7. Call gmail_send_message to jordan.kim.cpa@kimtaxadvisory.example with a structured
  per-item expense summary covering all four transactions (TXN-6015 through TXN-6018),
  each with merchant, date, amount, and category. Item #4 (TXN-6018, Apex CEU Institute)
  must be explicitly flagged as a suspected duplicate of item #3 (TXN-6017), citing
  the same amount, same card, near-identical course subject, and 6-day gap. Note that
  Devon will contact Apex CEU Institute to verify before claiming both as deductions.
  Include both a total-with-flagged ($1,007.00) and total-without-flagged ($758.00)
  line. Reference the June 15 deadline.'
