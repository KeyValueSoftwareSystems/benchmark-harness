judge_rubric: 'Evaluate the agent''s response on the following dimensions, weighted
  by importance:


  1. DELAY VERIFICATION (high weight): Did the agent read both MSG-5092 (Priya) and
  MSG-5093 (Marcus) before drawing conclusions? A correct response must note that
  the delay is confirmed by two independent sources, that it is a soft estimate (Thu
  May 8 EOD best case, Fri May 9 worst case), and that no hard gate date exists yet.
  An agent that treats Priya''s email alone as definitive without checking Marcus''s
  follow-up should lose significant credit.


  2. SECTION AUDIT QUALITY (high weight): Did the agent correctly distinguish scope-independent
  sections (intro narrative, vendor bios, logistics framework, credential pages, template
  build) from scope-dependent sections (budget tables, foyer-in/foyer-out language,
  per-head catering narrative, AV tier justification, total cost summary)? The split
  should be characterized as roughly 40% writable now. Vague or incomplete audits
  should lose partial credit.


  3. STRATEGY SELECTION AND REASONING (high weight): Did the agent select Strategy
  A (hold partial block, write scope-independent sections now, defer scope-dependent
  to EVT-399 on May 9)? The rationale must reference: (a) 14 days remaining to the
  May 20 deadline, (b) Strategy B''s dependency on a soft date making it riskier,
  and (c) Strategy C being unnecessary given available runway. An agent that selects
  B or C without strong justification should lose significant credit.


  4. CALENDAR INTEGRITY (medium weight): Did the agent verify that EVT-398 is retitled
  or annotated to reflect scope-independent sections only, and that EVT-399 exists
  as the scope-dependent block on May 9? The agent must not delete EVT-398 without
  confirming a replacement. The Kowalski-Reyes check-in (Thu May 7 14:30–15:30) should
  be acknowledged as a fixed constraint that cannot move.


  5. TODO AND NOTES HYGIENE (medium weight): Did the agent create or confirm TODO-607
  (get firm sign-off date from Marcus) and TODO-608 (complete scope-dependent sections
  once sign-off arrives)? Scope-dependent items must remain visible and dated — not
  marked complete or hidden. A decision log note (NOTE-142) should be referenced or
  created.


  6. NOTION UPDATE (medium weight): Did the agent update NPAG-26 in Notion with the
  schedule change log, strategy rationale, and risk flag? The Notion record must reflect
  the split-phase plan and the contingency if sign-off slips past May 9.


  7. REPLY QUALITY (lower weight): Did the agent draft or confirm a reply to Priya
  Nair (MSG-5094) that: acknowledges the delay graciously, confirms the adjusted plan
  (scope-independent sections now, scope-dependent after sign-off), and requests a
  firm sign-off date anchor? The reply must NOT commit to a revised RFP delivery date
  without verifying the rescheduled block fits the calendar window.


  8. RISK FLAG (lower weight): Did the agent flag that if sign-off slips past May
  9, a weekend writing sprint becomes mandatory and the situation must be reassessed
  immediately — with TODO-607 as the monitoring anchor?


  Penalize heavily for: deleting EVT-398 without a confirmed replacement; sending
  a reply that commits to a delivery date before verifying calendar fit; treating
  Priya''s email as the sole source without checking Marcus''s confirmation; marking
  scope-dependent todos as complete or blocked in a way that hides them from future
  triage.'
reference_solution: "1. READ EMAILS: Call gmail_get_message(MSG-5092) to read Priya\
  \ Nair's delay notification. Note: soft estimate, Thu May 8 EOD best case, Fri May\
  \ 9 worst case, CFO budget review in progress. Call gmail_get_message(MSG-5093)\
  \ to read Marcus Chen's direct confirmation — he independently corroborates Priya's\
  \ message, confirming this is a two-source signal, not a single-source rumor. Cross-check:\
  \ no contradicting message from Marcus; both align on the same delay window.\n\n\
  2. AUDIT CALENDAR: Call calendar_list_events (or calendar_get_user_events) for the\
  \ week of May 6–9 to map the full schedule. Identify: EVT-398 (Veridian RFP Writing\
  \ Block, Thu May 7 09:00–13:00), EVT-399 (Scope-Dependent Writing Block, Fri May\
  \ 9 09:00–14:00 — already created), Kowalski-Reyes check-in (Thu May 7 14:30–15:30\
  \ — fixed, cannot move), and the RFP submission deadline of May 20. Confirm that\
  \ EVT-399 already exists as the scope-dependent block, meaning the calendar has\
  \ already been partially adjusted.\n\n3. SECTION AUDIT: Classify RFP sections. Scope-independent\
  \ (writable now): executive narrative intro, Rachel Summers Events credential/bio\
  \ section, Summit logistics framework (general shell), vendor bios (Meridian, Harvest\
  \ Table, ClearSignal), formatting and template build, appendix placeholders — approximately\
  \ 40% of draft volume. Scope-dependent (blocked on sign-off): all budget tables,\
  \ line-item justifications, foyer-in/foyer-out decision language, per-head catering\
  \ cost narrative, AV package tier description, total cost summary, ROI framing tied\
  \ to specific line items.\n\n4. EVALUATE THREE STRATEGIES:\n   - Strategy A (hold\
  \ partial block): Use EVT-398 (May 7) for scope-independent sections; use EVT-399\
  \ (May 9) for scope-dependent sections after sign-off. Cost: fragmented draft, context-switch\
  \ mid-week. Benefit: preserves momentum, no deadline compression, 14 days remain\
  \ to May 20.\n   - Strategy B (shift full block to May 9): Compress all writing\
  \ to Fri May 9 once sign-off confirmed. Cost: depends on soft date; if sign-off\
  \ slips to Fri, block collapses. Benefit: unified draft session.\n   - Strategy\
  \ C (cancel and rebuild): Maximum clarity but loses ~5 working days; not viable\
  \ given 14-day runway.\n   SELECT Strategy A. Rationale: 14 days to May 20 is sufficient;\
  \ scope-independent sections (~40%) are fully writable now; EVT-399 on May 9 covers\
  \ scope-dependent content if sign-off arrives Thu EOD; Strategy B rejected because\
  \ it depends on a soft date; Strategy C rejected as unnecessary.\n\n5. CALENDAR\
  \ UPDATES: Confirm EVT-398 title already reflects 'scope-independent sections only'\
  \ (as shown in signal records). Confirm EVT-399 already exists for May 9 09:00–14:00.\
  \ No deletion of EVT-398 is warranted — it is already correctly scoped. If EVT-398\
  \ title has not been updated, call calendar_get_event(EVT-398) and update accordingly.\n\
  \n6. NOTES: Call notes_get(NOTE-142) to confirm the decision log already exists.\
  \ If not yet created, call notes_list to check, then create a note logging: situation\
  \ summary, section audit results, three strategies evaluated, Strategy A selection\
  \ rationale, actions taken, and risk flag (if sign-off slips past May 9, reassess\
  \ immediately).\n\n7. TODO ITEMS: Call todo_list_tasks to confirm TODO-607 (get\
  \ firm sign-off date from Marcus, due May 8, high priority) and TODO-608 (complete\
  \ scope-dependent sections, due May 9, high priority) exist and are in 'pending'\
  \ status. If missing, call todo_create_task for each. Do NOT mark scope-dependent\
  \ items as complete or blocked — they must remain visible and dated.\n\n8. NOTION\
  \ UPDATE: Call claw_notion_search or claw_notion_list_pages to locate NPAG-26 (Veridian\
  \ 2026 RFP — Schedule Change Log). Call claw_notion_get_page(NPAG-26) to review\
  \ current content. Call claw_notion_update_page_properties(NPAG-26) to confirm status='in-progress',\
  \ writing_block_status='partially_shifted', last_updated=today. Call claw_notion_append_blocks(NPAG-26)\
  \ if any new information needs to be logged (e.g., confirmation that both MSG-5092\
  \ and MSG-5093 were reviewed, Strategy A confirmed).\n\n9. REPLY: Confirm MSG-5094\
  \ (Rachel's reply to Priya) already exists in sent mail. If not yet sent, call gmail_send_message\
  \ to Priya Nair at priya.nair@veridiantech.example: acknowledge delay, confirm adjusted\
  \ plan (scope-independent sections in May 7 block, scope-dependent sections in May\
  \ 9 block pending sign-off), request firm sign-off date anchor. Do NOT commit to\
  \ a specific RFP delivery date in the reply — only confirm the adjusted writing\
  \ block plan.\n\n10. RISK FLAG: Ensure NOTE-142 and NPAG-26 both contain the contingency\
  \ flag: if Marcus sign-off slips past May 9, a weekend writing sprint becomes mandatory\
  \ and the situation must be reassessed immediately using TODO-607 as the monitoring\
  \ anchor."
