scoring_components:
- name: Identified Tierra Verde accelerated deadline as top priority
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Tierra Verde
      - pitch deck
      - James Okafor
    - - March 29
      - March 30
      - board meeting moved up
      - compressed timeline
      - accelerated
    - - critical
      - highest priority
      - most urgent
      - immediate focus
      - cannot defer
- name: Recognized GreenRoot deadline extension opportunity to relieve pressure
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - GreenRoot
      - Maya Chen
      - brand guidelines
    - - April 4
      - extension
      - moved back
      - deadline change
      - postponed
    - - accept
      - relieves pressure
      - reduces crunch
      - breathing room
      - defer to Q2
- name: Identified Swift Print promo expiration and financial constraint
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Swift Print
      - BULK25
      - Café Verdant
      - print order
    - - March 31
      - promo expires
      - deadline
      - 11:59 PM
    - - payment in full
