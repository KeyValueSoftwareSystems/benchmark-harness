judge_rubric: 'Award full marks if the response: (1) Correctly identifies Tierra Verde
  pitch deck (March 29 EOD deadline after board meeting moved up) as the most critical
  priority requiring immediate action; (2) Recognizes the GreenRoot deadline extension
  from March 31 to April 4 as an opportunity to accept and relieve Q1 pressure; (3)
  Flags the Swift Print BULK25 promo expiration on March 31 and connects it to the
  financial constraint that GreenRoot payment doesn''t arrive until April 3; (4) Provides
  a clear prioritization framework distinguishing hard deadlines (cannot defer) from
  tasks that can be postponed to Q2; (5) Links urgency drivers to specific evidence
  from emails, calendar, and finance records. Award partial credit if the response
  identifies 2 of 3 key deadline situations but lacks financial constraint analysis
  or clear prioritization rationale. Award minimal credit if the response only lists
  tasks without synthesizing deadline changes, financial dependencies, or priority
  ranking. The response should demonstrate synthesis across multiple data sources
  (gmail deadline changes, calendar conflicts, finance payment timing) rather than
  simply listing tasks.'
reference_solution: '**Step 1**: Call `todo_list_tasks` to retrieve all pending tasks.
  Identify TODO-864 (Tierra Verde pitch deck, March 29 deadline), TODO-865 (Swift
  Print order, March 31 deadline), TODO-866 (GreenRoot response needed, March 27 deadline),
  and TODO-867 (this audit task itself).


  **Step 2**: Call `gmail_list_messages` to search for recent client communications.
  Retrieve MSG-5320 (James Okafor - Tierra Verde board meeting moved up from April
  1 to March 30, requiring deck delivery by March 29 EOD instead of March 31), MSG-5318
  (Maya Chen - GreenRoot requesting extension from March 31 to April 4), and MSG-5319
  (Swift Print BULK25 promo expiring March 31, requires full payment at order placement).


  **Step 3**: Call `calendar_list_events` to identify scheduling blocks. Note EVT-566
  (March 29 deep work block for Tierra Verde), EVT-567 (March 31 evening for Swift
  Print order), and EVT-568 (March 28-29 overnight for this audit session).


  **Step 4**: Call `finance_list_transactions` to assess cash flow constraints. Identify
  TXN-6179 (GreenRoot payment of $2,800 expected April 3) and TXN-6181 (prior Café
  Verdant print order of $650 already paid). Calculate that Swift Print order (~$580)
  can be covered by available cash (~$1,200) before GreenRoot payment arrives.


  **Step 5**: Call `notes_get` for NOTE-297 to review the existing priority audit
  analysis if available (this provides the synthesized decision framework).


  **Step 6**: Synthesize findings into priority ranking:

  - **TIER 1 (Critical - Cannot Defer)**: Tierra Verde pitch deck (March 29 EOD) -
  board meeting moved up 2 days, eliminates buffer, highest client relationship risk.
  Recommend accepting James''s offer to simplify slide 8 to save 4-6 hours.

  - **TIER 1 (Critical - Financial Deadline)**: Swift Print order (March 31 by 11:59
  PM) - promo expires, 25% discount worth ~$145, cash flow workable until GreenRoot
  payment arrives April 3.

  - **TIER 2 (Accept Extension)**: GreenRoot brand guidelines - Maya requested extension
  to April 4, low risk to accept, relieves Q1 pressure significantly.

  - **Communication Required**: Respond to Maya Chen by March 27 EOD accepting April
  4 deadline; confirm slide 8 simplification with James Okafor by March 29 AM.


  **Step 7**: Present prioritized action plan with explicit rationale linking each
  task to its urgency drivers (deadline compression, financial loss avoidance, client
  relationship impact) and recommended sequencing for Carlos''s night-owl work pattern.'
