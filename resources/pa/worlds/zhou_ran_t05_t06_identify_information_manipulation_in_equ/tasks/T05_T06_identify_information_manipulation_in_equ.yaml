task_id: T05_T06_identify_information_manipulation_in_equ
task_name: Identify Information Manipulation in Equipment Vendor Emergency Replacement
  Offer
category: decision_making
difficulty: hard
prompt:
  text: I got an urgent safety recall email from Elite Sports Equipment about my ProTrack
    training platform claiming there's a critical defect and I need to upgrade by
    April 7th for ¥24,300. This feels really aggressive but I'm worried about safety
    during Olympic qualification training. Can you help me figure out if this is legitimate
    or if I'm being pressured into an unnecessary purchase?
  language: en
execution_date: '2026-04-07'
