judge_rubric: '# Evaluation Rubric for BNP Paribas POC Quota Constraint Resolution


  ## Constraint Identification (25 points)

  - **20-25 pts**: Correctly identifies France region €13K shortage as critical bottleneck,
  calculates exact available quota (€4.5K France after Allianz + baseline, €11.5K
  UK after HSBC), recognizes non-transferable regional quota constraint

  - **15-19 pts**: Identifies France shortage and calculates most quota figures correctly
  but misses one component (e.g., baseline ops)

  - **10-14 pts**: Recognizes quota constraint exists but calculations incomplete
  or partially incorrect

  - **0-9 pts**: Fails to identify quota shortage or provides incorrect constraint
  analysis


  ## Strategy Evaluation (30 points)

  - **25-30 pts**: Evaluates both Strategy A (11-cluster now) and Strategy B (12-cluster
  delayed), correctly calculates architecture costs (€40K vs €45K), identifies timeline
  tradeoffs (3 weeks vs 10 days), assesses rework costs (48hr reprovisioning vs compressed
  rehearsal)

  - **18-24 pts**: Evaluates both strategies with mostly correct cost/timeline analysis
  but misses one key tradeoff dimension

  - **10-17 pts**: Considers multiple options but analysis is incomplete or contains
  calculation errors

  - **0-9 pts**: Proposes single approach without evaluating alternatives or tradeoffs


  ## Decision Recommendation (25 points)

  - **20-25 pts**: Recommends Strategy A (provision 11-cluster hybrid immediately)
  with checkpoint at April 5 rehearsal, provides clear decision rationale tied to
  constraint analysis, specifies escalation criteria if rehearsal fails

  - **15-19 pts**: Recommends viable strategy with checkpoint but rationale lacks
  depth or escalation criteria unclear

  - **10-14 pts**: Recommends strategy but missing checkpoint mechanism or decision
  logic weak

  - **0-9 pts**: No clear recommendation or recommendation violates hard constraints
  (exceeds quota caps)


  ## Risk Assessment (20 points)

  - **16-20 pts**: Identifies failure propagation risks for both strategies (Strategy
  A: demo fidelity loss + emergency reprovisioning delay; Strategy B: compressed timeline
  + no fallback), quantifies rework costs, assesses customer perception impact

  - **11-15 pts**: Identifies major risks but incomplete quantification or missing
  one failure mode

  - **6-10 pts**: Generic risk discussion without specific failure scenarios or cost
  quantification

  - **0-5 pts**: Minimal or no risk analysis


  ## Communication & Documentation Quality (10 points)

  - **8-10 pts**: Clear, structured output suitable for AE sync and customer-facing
  narrative preparation, includes specific dates/milestones, avoids exposing internal
  constraints in customer-facing language

  - **5-7 pts**: Adequate structure but could be clearer or missing some stakeholder
  communication considerations

  - **0-4 pts**: Disorganized output or inappropriate tone for enterprise sales context


  ## Hard Constraint Compliance (Pass/Fail Gate)

  - **FAIL (score = 0)**: If recommendation violates quota caps (€25K France, €20K
  UK), commits to 12-cluster architecture before confirming quota availability, or
  provisions without validating technical requirements

  - **PASS**: Recommendation respects all hard constraints stated in safety_constraints
  section


  **Total: 110 points possible (clamped to 100)**


  An excellent response scores 85+ by correctly identifying the €13K France shortage,
  evaluating both provisioning strategies with accurate cost/timeline tradeoffs, recommending
  Strategy A with April 5 checkpoint, quantifying rework risks, and presenting analysis
  in clear stakeholder-appropriate format.'
reference_solution: "# Reference Solution: BNP Paribas POC Quota Constraint Resolution\n\
  \n## Step 1: Retrieve Customer Context\n- Call `crm_get_customer` for BNP Paribas\
  \ (CUS-146) to understand deal context: €2.8M annual opportunity, CDO briefing April\
  \ 8, strategic tier customer\n- Call `workmail_list_messages` and review WMSG-5074\
  \ from Claire Dubois detailing 12-cluster requirement (7 France + 5 UK)\n- Call\
  \ `notes_get` for NOTE-148 to review existing quota constraint analysis completed\
  \ March 27\n\n## Step 2: Calculate Current Quota Consumption\n- Call `finance_list_transactions`\
  \ to retrieve:\n  - TXN-6034: Allianz POC consuming €12K France quota through March\
  \ 31\n  - TXN-6035: HSBC POC consuming €8.5K UK quota\n  - TXN-6036: Baseline ops\
  \ consuming €8.5K France quota (steady-state)\n- Calculate available quota:\n  -\
  \ **France**: €25K cap - €12K Allianz - €8.5K baseline = €4.5K available (vs €30K\
  \ needed for 7 clusters) → **€13K shortage**\n  - **UK**: €20K cap - €8.5K HSBC\
  \ = €11.5K available (vs €15K needed for 5 clusters) → **€3.5K shortage**\n\n##\
  \ Step 3: Identify Critical Path Bottleneck\n- France region €13K shortage is the\
  \ critical constraint blocking ideal 12-cluster architecture\n- Allianz POC completes\
  \ March 31, releasing €12K France quota on April 1\n- UK shortage is smaller; HSBC\
  \ POC scales down April 1, providing additional headroom\n\n## Step 4: Evaluate\
  \ Strategy Options\n\n### Strategy A: Provision 11-cluster hybrid NOW (degraded\
  \ fidelity)\n- **Architecture**: 6 France clusters + 5 UK clusters = €40K total\
  \ (€25K France + €15K UK)\n- **Timeline**: Provision immediately, preserves 3-week\
  \ prep timeline (March 27 - April 8)\n- **Pros**: Fits current quota, allows full\
  \ rehearsal cycle with 2-day buffer before April 8 briefing\n- **Cons**: 6-cluster\
  \ France may not demonstrate complete sovereignty narrative; if rehearsal (April\
  \ 5) exposes critical gaps, emergency reprovisioning requires 48hr lead time → risks\
  \ briefing delay\n- **Rework Cost**: Emergency reprovisioning requires VP approval\
  \ + 48hr lead time + briefing postponement risk\n\n### Strategy B: Wait for Allianz\
  \ completion, provision full 12-cluster (compressed timeline)\n- **Architecture**:\
  \ 7 France + 5 UK = €45K total (ideal architecture)\n- **Timeline**: Wait until\
  \ April 1 when Allianz releases €12K France quota, compress prep to 10 days (April\
  \ 1-10)\n- **Pros**: Demo fidelity preserved, complete compliance narrative\n- **Cons**:\
  \ Compressed timeline increases rehearsal quality risk; no fallback if timeline\
  \ issues emerge\n- **Rework Cost**: If compressed timeline causes rehearsal issues,\
  \ forced to proceed with under-rehearsed demo or postpone briefing\n\n## Step 5:\
  \ Decision Recommendation\n\n**Recommended Strategy**: **Strategy A with checkpoint\
  \ at April 5 rehearsal**\n\n**Rationale**:\n1. Preserves 3-week prep timeline with\
  \ full rehearsal cycle (vs 10-day compression)\n2. Fits current quota constraints\
  \ without requiring VP escalation for emergency reallocation\n3. Checkpoint at rehearsal\
  \ provides decision gate before customer exposure\n4. 6-cluster France architecture\
  \ likely sufficient for core sovereignty narrative (customer PII processing, transaction\
  \ analytics, fraud detection, regulatory reporting, data masking, compliance audit\
  \ trails)\n5. Cross-border orchestration cluster can be simulated/narrated if needed\n\
  \n**Checkpoint Logic**:\n- **If April 5 rehearsal validates** core compliance narrative\
  \ (data residency controls, cross-border analytics, audit trails) → Accept fidelity\
  \ trade-off, proceed with April 8 briefing\n- **If rehearsal exposes critical gaps**\
  \ → Escalate for emergency quota reallocation (VP approval, 72hr lead time per Tom\
  \ Harris) or briefing postponement\n\n## Step 6: Document Decision and Sync Stakeholders\n\
  - Call `claw_notion_update_page_properties` to update NPAG-18 with final provisioning\
  \ decision\n- Call `claw_notion_append_blocks` to add action items:\n  - Provision\
  \ 11-cluster environment by April 3\n  - Prepare technical architecture diagram\
  \ for JP Laurent by April 2\n  - Demo rehearsal checkpoint April 5\n- Call `contacts_send_message`\
  \ or `workmail_send_message` to sync Tom Harris (AE) on:\n  - Strategy A selection\
  \ with €40K scope (vs €45K ideal)\n  - Forecast impact acceptable per March 27 discussion\n\
  \  - Checkpoint at April 5 rehearsal with escalation criteria\n\n## Step 7: Prepare\
  \ Customer-Facing Narrative\n- Position 6-cluster France architecture as **\"France-sovereign\
  \ focus\"** rather than resource constraint:\n  - \"We've optimized the demo to\
  \ emphasize France-domiciled data processing patterns, which align with your board's\
  \ sovereignty mandate\"\n  - \"The 6 core France clusters demonstrate the complete\
  \ compliance story: PII processing, analytics, fraud detection, regulatory reporting,\
  \ masking, and audit trails\"\n  - \"UK region showcases subsidiary federation and\
  \ cross-border analytics without data movement\"\n- **Avoid**: Any mention of quota\
  \ constraints, resource limitations, or compromised architecture\n\n## Key Decision\
  \ Points\n1. **Hard Constraint**: Must not exceed €25K France cap or €20K UK cap\
  \ (would trigger automatic suspension)\n2. **Critical Path**: France quota shortage\
  \ (€13K) is the binding constraint\n3. **Checkpoint**: April 5 rehearsal validates\
  \ whether 6-cluster France tells complete story\n4. **Escalation**: If rehearsal\
  \ fails, emergency quota reallocation requires VP approval + 72hr lead time (not\
  \ reliable for April 8 briefing)\n5. **Forecast Impact**: €40K vs €45K scope reduction\
  \ acceptable per Tom Harris\n\n## Expected Output\nA structured recommendation document\
  \ covering:\n- Quota constraint analysis (France €13K shortage, UK €3.5K shortage)\n\
  - Strategy evaluation (A: 11-cluster now vs B: 12-cluster delayed)\n- Decision recommendation\
  \ (Strategy A with April 5 checkpoint)\n- Risk assessment (rework costs, failure\
  \ propagation, customer perception)\n- Action items (provisioning by April 3, rehearsal\
  \ April 5, architecture diagram by April 2)\n- Customer-facing narrative (France-sovereign\
  \ focus positioning)\n- Stakeholder sync plan (Tom Harris on forecast impact, EMEA\
  \ SA team on quota coordination)"
