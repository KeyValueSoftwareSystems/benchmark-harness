judge_rubric: 'Award full marks if the agent: (1) correctly identified all three vendor
  commitments (Nordic M&A SEK 285k, CIP AB SEK 245k, TransLog SEK 320k) and the SEK
  850k budget cap, (2) built a violation cost analysis considering direct costs, downstream
  impacts, and cascading consequences for each commitment, (3) correctly prioritized
  TransLog (CEO explicit priority + regulatory deadline) and Nordic M&A (board-mandated
  Aurora integration) over CIP AB Phase 2, (4) selected the scenario honoring TransLog
  + Nordic M&A while deferring CIP AB Phase 2 to Q3, (5) drafted preemptive remediation
  communication to CIP AB proposing Phase 1 extension and Q3 Phase 2 deferral with
  compensation commitments, (6) documented the decision rationale in Notion with an
  explicit ''what would change my mind'' section identifying conditions under which
  the decision should be revisited (CFO budget increase, CEO priority downgrade, Nordic
  M&A discount extension), and (7) created follow-up calendar reminders and todo items
  for downstream mitigation (CEO notification of May board deliverable scope change,
  Q3 budget reservation for CIP AB Phase 2). Deduct points if: the agent selected
  a scenario that violates the CEO explicit priority (TransLog deferral), failed to
  communicate preemptively with affected vendors at least 3 days before the April
  10 Nordic M&A discount deadline, did not document the decision rationale in Notion
  before sending vendor notifications (audit trail requirement), or committed to Q3
  budget allocations without noting the need for CFO pre-approval. The solution must
  demonstrate structured tradeoff analysis across rigidity hierarchy (CEO priority
  > board-mandated deliverable > vendor relationship) and minimize total violation
  cost including cascading effects.'
reference_solution: 'Step 1: Query finance service using finance_list_transactions
  to retrieve Q2 external advisor budget cap (TXN-6069: SEK 850k) and all three preliminary
  commitments (TXN-6070: Nordic M&A SEK 285k, TXN-6071: CIP AB SEK 245k, TXN-6072:
  TransLog SEK 320k). Total commitments SEK 850k exactly match budget cap, but all
  three cannot be honored simultaneously without violating at least one due to overlapping
  constraints.


  Step 2: Retrieve Workmail threads using workmail_list_messages and workmail_get_message
  to identify commitment terms, deadlines, and priority flags: WMSG-5155 (CFO budget
  reduction notice), WMSG-5156 (Nordic M&A discount expires April 10), WMSG-5158 (CEO
  explicit priority flag on TransLog with April 18 regulatory deadline).


  Step 3: Search Notion decision logs using claw_notion_search or claw_notion_list_pages
  to find prior rationale on each engagement''s strategic priority. Review NPAG-79
  (Q2 External Advisor Budget Allocation Crisis decision log) which contains violation
  cost matrix and scenario analysis.


  Step 4: Build violation cost matrix for each commitment: (a) Nordic M&A cancellation:
  lose SEK 42.75k discount, risk Aurora integration timeline (board-mandated), board
  presentation at risk → CFO escalation (HIGH cost); (b) CIP AB Phase 2 cancellation:
  vendor relationship damage, BU portfolio review incomplete (CEO deliverable), May
  board deliverable scope change required (MEDIUM cost); (c) TransLog deferral: 6-month
  regulatory delay, CEO explicit priority violated, Q3 strategic option blocked →
  CEO escalation (CRITICAL cost).


  Step 5: Enumerate feasible allocation scenarios: Scenario A (Nordic + CIP, defer
  TransLog) violates CEO priority = CRITICAL cost. Scenario B (Nordic + TransLog,
  cancel CIP Phase 2) = MEDIUM cost. Scenario C (CIP + TransLog, lose Nordic discount)
  = MEDIUM-HIGH cost. Select Scenario B as minimum-loss option prioritizing CEO explicit
  priority (TransLog) > board-mandated deliverable (Nordic M&A) > vendor relationship
  (CIP AB).


  Step 6: Draft preemptive remediation plan for CIP AB using workmail_send_message:
  notify CIP AB by April 9 (3 days before Nordic M&A April 10 discount deadline) of
  Phase 2 deferral to Q3, request Phase 1 extension to preserve vendor relationship,
  propose compensation commitments (priority Q3 scheduling, fee discount on next engagement).
  Communicate to CEO that May board portfolio review will be Phase 1 only (competitive
  positioning analysis deferred).


  Step 7: Update Notion decision log using claw_notion_create_page or claw_notion_append_blocks
  to document selected scenario (B: Nordic + TransLog), violation analysis, remediation
  steps, and ''what would change my mind'' section: (1) if CFO approves SEK 200k budget
  increase (total SEK 1,050k), restore CIP AB Phase 2 commitment; (2) if CEO downgrades
  TransLog priority, defer TransLog to Q3 and honor all three commitments within SEK
  850k cap; (3) if Nordic M&A offers 10% discount extension beyond April 10, evaluate
  Scenario C (reduced Aurora scope).


  Step 8: Create calendar reminders using calendar_create_event for follow-up actions:
  vendor response deadlines (CIP AB by April 12), CFO budget reconfirmation check
  (April 15), board materials impact assessment (April 20 for May board meeting).


  Step 9: Add todo items using todo_create_task for downstream mitigation: (1) schedule
  meeting with CEO to discuss May board deliverable scope change (portfolio review
  Phase 1 only), (2) reserve SEK 280k in Q3 budget for CIP AB Phase 2 + data refresh
  (requires CFO pre-approval once Q3 budget finalized), (3) notify board secretary
  of portfolio review scope adjustment for May board materials.'
