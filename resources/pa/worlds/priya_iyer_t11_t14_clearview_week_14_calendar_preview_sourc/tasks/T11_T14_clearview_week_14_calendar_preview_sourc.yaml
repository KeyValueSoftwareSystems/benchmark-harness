scoring_components:
- name: Identified T.W. source interview as critical upcoming event requiring preparation
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - T.W.
      - Panama
      - whistleblower
      - banking source
    - - April 7
      - Monday interview
      - 7th
    - - Signal
      - encrypted
      - secure communication
      - video call
- name: Flagged technical preparation requirement for encrypted interview platform
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - Signal test
      - platform test
      - encryption test
      - technical setup
      - communication test
    - - 24 hours
      - day before
      - April 6
      - prior to interview
      - advance preparation
- name: Detected scheduling conflict between partner call and source secure window
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - conflict
      - overlap
      - timing issue
      - schedule clash
    - - partner
      - Reuters
      - coordination call
      - newsroom call
    - - delegation
      - Marcus
      - coverage
      - assign
- name: Assessed legal review deadline buffer adequacy
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - legal review
      - deadline
      - April 10
      - Rajesh
    - - buffer
      - tight timeline
      - compressed
      - limited time
      - only 2 days
      - insufficient time
      - extension
- name: Retrieved calendar events for 7-day window
  weight: 0.15
  check:
    type: tool_called
