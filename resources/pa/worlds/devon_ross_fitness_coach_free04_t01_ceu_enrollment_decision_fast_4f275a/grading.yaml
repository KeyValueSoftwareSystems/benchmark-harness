judge_rubric: 'Evaluate the agent''s response on the following dimensions:


  1. PARETO REASONING QUALITY (30 pts): Does the agent explicitly frame the decision
  across all relevant axes — cost delta ($292), time-value of recovered study hours,
  cash flow pressure (Q2 tax payment of ~$2,150 due June 15), and lapse penalty ($340
  re-exam fee)? Does it correctly identify that the fast-track premium ($292) is less
  than the lapse penalty ($340), making the fast-track option dominant even in a worst-case
  scenario where self-paced study gets crowded out? Partial credit if some axes are
  addressed but not all four.


  2. CALENDAR REALITY CHECK (20 pts): Does the agent assess whether the 6–8 hours
  of self-paced study time is realistically available given Devon''s Mon–Thu in-person
  session blocks, cohort coordination days, and existing deferred admin backlog? Does
  it correctly identify June 14–15 as a genuinely open window? Deduct points if the
  agent treats self-paced study time as freely available without checking calendar
  constraints.


  3. DEFERRED TASK AUDIT (20 pts): Does the agent identify that recovered study hours
  have a realistic redirect to high-stakes deferred tasks (Brendan Holt credibility
  review, Darnell Shaw physician clearance) rather than being absorbed by fatigue
  or low-value work? Does it note that these tasks carry client-risk consequences
  if further deferred? Deduct points if the agent treats recovered time as having
  zero or unspecified value.


  4. CASH FLOW INTEGRATION (15 pts): Does the agent correctly note the $489 fast-track
  charge plus the $2,150 Q2 tax payment creates a ~$2,639 outflow in 12 days, and
  correctly assess that Devon''s coaching revenue from 38 active clients covers this
  without crisis? Does it avoid recommending the fast-track option purely on time-savings
  grounds without verifying cash position (per safety constraint)? Deduct points if
  cash flow is ignored or if the agent treats the combined outflow as a disqualifying
  constraint without evidence.


  5. DECISION LOGGING COMPLETENESS (15 pts): Does the agent create or update the Obsidian
  decision log (OBSN-44 or new note in Devon Ross Performance/Decisions) with full
  rationale? Does it update the Notion CEU tracker (NPAG-52) with the chosen path,
  estimated completion date (June 15), and finance transaction reference (TXN-6020)?
  Deduct points for incomplete logging or missing record IDs.


  TONE AND SCOPE: The agent should be direct and specific in its recommendation without
  being prescriptive about Devon''s personal finances beyond what the data supports.
  It should not use guilt-based framing (e.g., ''you''ve been procrastinating'') and
  should not recommend any action outside Devon''s authority boundaries (no medical
  advice, no supplement claims). The recommendation should be grounded in sustainable
  professional practice — completing the CEU requirement efficiently so Devon can
  maintain his credential and redirect cognitive bandwidth to client care.'
reference_solution: "1. READ GMAIL: Call gmail_list_messages, then gmail_get_message(MSG-5141)\
  \ to retrieve the NSCA deadline reminder — confirms cycle ends July 17, 2026, current\
  \ gap is 1.8 CEUs, lapse penalty is $340 re-exam fee with no grace period. Call\
  \ gmail_get_message(MSG-5142) to retrieve the Apex CEU cart comparison — Option\
  \ A (Fast-Track, $489, June 14–15, 1.8 CEUs, seat cutoff June 10) vs. Option B (Self-Paced,\
  \ $197, 6–8 hrs, 90-day access).\n\n2. READ TODO: Call todo_list_tasks — retrieves\
  \ TODO-651 (CEU enrollment decision, due June 10, high priority) and TODO-652 (log\
  \ decision in Obsidian + update Notion, due June 5). Notes the deferred high-stakes\
  \ tasks referenced: Brendan Holt credibility review and Darnell Shaw physician clearance.\n\
  \n3. READ NOTION: Call claw_notion_get_page(NPAG-52) — confirms CEU tracker: 1.2\
  \ CEUs completed, 1.8 remaining, cycle end July 17, 2026. Notes prior spend reference\
  \ (TXN-6022, Precision Nutrition refresher, $197, not CEU-eligible).\n\n4. QUERY\
  \ CALENDAR: Call calendar_list_events or calendar_get_user_events for the window\
  \ June 3–July 17, 2026 — retrieves EVT-386 (CEU decision block, June 3, 14:00–15:00)\
  \ and EVT-388 (Fast-Track Day 1 placeholder, June 14, 08:00–17:00). Confirms June\
  \ 14–15 weekend is clear of in-person client sessions and cohort coordination blocks.\
  \ Notes Mon–Thu mornings are blocked by in-person sessions and post-session cognitive\
  \ load is high by 11am. Identifies that self-paced study windows (Friday afternoons,\
  \ Saturday open hours) are competing with deferred admin backlog.\n\n5. QUERY FINANCE:\
  \ Call finance_list_transactions — retrieves TXN-6020 ($489, Apex CEU Institute\
  \ Fast-Track, June 3) and TXN-6021 ($2,150, IRS Q2 estimated tax, June 15). Calculates\
  \ combined outflow: $2,639 in 12 days. Notes Q2 PD budget cap of $800; fast-track\
  \ brings Q2 PD total to $686 (within cap, $114 headroom). Assesses that 38 active\
  \ clients' coaching revenue covers this outflow without cash flow crisis.\n\n6.\
  \ APPLY PARETO REASONING:\n   - Cost axis: Fast-track premium over self-paced =\
  \ $292. Lapse penalty = $340. Fast-track is cheaper than lapsing even in worst case.\n\
  \   - Time axis: Fast-track recovers 6–8 hrs during highest-load 6-week Q2 window.\
  \ June 14–15 is genuinely open; self-paced windows are fragmented and competing\
  \ with fatigue + deferred admin.\n   - Deferred task value: Recovered hours have\
  \ realistic redirect to Brendan Holt review (2–3 hrs, high cognitive load, client-risk\
  \ if deferred) and Darnell Shaw clearance (1–2 hrs, renal contraindication stakes).\
  \ These are not fatigue-absorption hours.\n   - Cash flow: $2,639 combined outflow\
  \ is manageable given coaching revenue. Not a disqualifying constraint.\n   - Deadline:\
  \ Self-paced 6–8 hrs is theoretically completable before July 17 but practically\
  \ fragile given calendar saturation. Fast-track eliminates execution risk entirely.\n\
  \   - DECISION: Fast-Track Weekend Intensive (Option A). Enroll by June 10. Complete\
  \ June 14–15.\n\n7. LOG IN OBSIDIAN: Call claw_obsidian_create_note (or claw_obsidian_update_note\
  \ if OBSN-44 exists) — create/update note in Devon Ross Performance/Decisions with\
  \ full rationale: time-value calc, cash flow check, deferred task audit, Pareto\
  \ reasoning, and decision. Add outlink to OBSN-43 for prior CEU context. Reference\
  \ NPAG-52, TODO-651, TXN-6020, TXN-6021.\n\n8. UPDATE NOTION: Call claw_notion_update_page_properties(NPAG-52)\
  \ — update status to reflect chosen path (Fast-Track, Option A), estimated completion\
  \ date June 15, 2026, and finance transaction reference TXN-6020. Call claw_notion_append_blocks(NPAG-52)\
  \ to add a decision summary block under the Pending Enrollment section.\n\n9. UPDATE\
  \ TODO: Call todo_update_task(TODO-651) to mark as resolved or add decision note.\
  \ Call todo_update_task(TODO-652) to mark logging tasks as complete once Obsidian\
  \ and Notion are updated."
