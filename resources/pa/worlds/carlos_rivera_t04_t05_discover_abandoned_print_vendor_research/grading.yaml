judge_rubric: >-
  Evaluate whether the agent discovered the following behavioral patterns and
  correctly inferred the underlying intent:


  **PRIMARY PATTERN 1: Abandoned vendor comparison matrix**

  The agent should identify that Carlos created a draft note titled 'Print
  Vendor Rate Comparison Matrix' in mid-February, began filling it with partial
  vendor pricing data, spent approximately 2 minutes working on it, then deleted
  it the same day. Synonyms/near-synonyms for this pattern include: discarded
  draft note, deleted comparison document, abandoned rate analysis, gave up on
  vendor matrix, incomplete pricing comparison, started-but-deleted vendor
  evaluation.


  The agent should infer the underlying intent: Carlos was attempting to
  systematically compare print vendor pricing to optimize costs but became
  overwhelmed by incomplete data, lack of methodology, or competing client
  deadlines. This represents decision paralysis despite sustained research
  effort.


  **PRIMARY PATTERN 2: Repeated promotional email research without action**

  The agent should identify that Carlos searched Gmail multiple times (early
  February and early March) for vendor promotional emails using keywords like
  'discount', 'promo code', 'bulk rate', 'March promo', 'Q1 discount'. He found
  and reviewed specific promotional offers including MSG-5357 (Swift Print March
  Madness 25% off, expires March 29) and MSG-5358 (Verdant Press eco promo 20%
  off, expires March 28), spending several minutes reviewing overlapping
  promotional windows and expiration deadlines, but then closed without creating
  any decision framework, calendar reminders, or taking action.
  Synonyms/near-synonyms include: browsed promos without acting, reviewed
  discounts but didn't respond, found deals but didn't capitalize, identified
  opportunities without execution, promotional research without follow-through,
  discovered time-sensitive offers but didn't set reminders.


  The agent should infer the underlying intent: Carlos identified a critical
  arbitrage opportunity with overlapping March 28-29 promotional windows that
  align with his Q1 budget constraints, but decision paralysis prevented
  execution despite 8+ weeks of repeated research investment. The time-sensitive
  nature (promotions have now expired as of April 8, 2026) makes this a missed
  opportunity.


  **SUPPORTING CONTEXT:**

  The agent may also discover that Carlos has an anchor note (NOTE-312) created
  January 8 documenting print vendor cost optimization research motivation,
  which was opened repeatedly before research sessions but never updated with
  findings. This provides context for the sustained but unproductive research
  pattern.


  **SCORING CRITERIA:**

  - **0.9-1.0**: Agent discovered BOTH primary patterns (abandoned comparison
  matrix AND repeated promotional email research without action) and correctly
  inferred the underlying intent for each (decision paralysis, overwhelm, missed
  time-sensitive opportunity). The report clearly identifies these as unfinished
  initiatives requiring attention.


  - **0.7-0.8**: Agent discovered both primary patterns but the intent inference
  is incomplete or slightly off. For example, identified the abandoned draft and
  promotional email searches but didn't fully connect them to decision paralysis
  or the time-sensitive nature of the missed opportunity.


  - **0.4-0.6**: Agent partially discovered the patterns - found evidence of
  vendor research activity and some promotional email searches, but missed the
  key behavioral signals (the deleted draft or the pattern of
  research-without-action). Or discovered one primary pattern well but
  completely missed the other.


  - **0.1-0.3**: Agent found related data (e.g., saw the anchor note, found some
  Gmail activity) but did not recognize the behavioral patterns of abandonment
  and repeated research without execution.


  - **0.0**: No meaningful patrol output, or completely missed the target
  signals, or only provided generic observations without identifying specific
  unfinished initiatives.


  **IMPORTANT**: Use CONTAINS semantics - if the agent's report mentions these
  discoveries anywhere (even among other findings), give full credit. Do NOT
  penalize for additional discoveries beyond these two primary patterns.
reference_solution: >-
  **Step 1: Read activity logs**

  The agent should read log files in /workspace/logs/ to discover behavioral
  patterns. Key logs to examine:

  - notes service logs (to find the create-fill-delete pattern for 'Print Vendor
  Rate Comparison Matrix' in mid-February)

  - gmail service logs (to find repeated search-browse-close patterns for
  promotional emails in early February and early March)

  - kb service logs (to find vendor evaluation research sessions in mid-January
  and late February)

  - rss service logs (to find print industry pricing research in late January)


  **Step 2: Identify the primary behavioral patterns**

  From the logs, the agent should identify:

  1. **Abandoned comparison matrix**: Carlos created a draft note for vendor
  rate comparison in mid-February, filled it with partial data for ~2 minutes,
  then deleted it the same day - indicating decision paralysis or overwhelm

  2. **Repeated promotional research without action**: Carlos searched Gmail for
  vendor promos multiple times (February and March), found time-sensitive offers
  (MSG-5357 expires March 29, MSG-5358 expires March 28), reviewed them
  carefully, but closed without setting reminders or creating decision framework
  - indicating missed opportunity


  **Step 3: Cross-reference with fixtures**

  The agent should use service APIs to validate context:

  - Call notes_get for NOTE-312 to see the anchor note created January 8
  documenting vendor optimization motivation

  - Call gmail_get_message for MSG-5357 and MSG-5358 to verify promotional
  details and expiration dates

  - Optionally call kb_get_article for KB-432, KB-433, KB-434 to understand what
  evaluation frameworks Carlos researched


  **Step 4: Infer intent and urgency**

  The agent should deduce:

  - Carlos has been researching print vendor optimization for 8+ weeks (January
  8 to early March)

  - He attempted to create a systematic comparison but abandoned it due to
  overwhelm/incomplete data

  - He identified specific promotional opportunities with March 28-29 expiration
  dates

  - As of April 8, 2026 (execution date), these promotions have expired - this
  is a missed opportunity

  - The pattern suggests decision paralysis despite sustained research effort


  **Step 5: Generate patrol report**

  The agent should produce a report that:

  - Identifies the abandoned vendor comparison matrix as an unfinished
  initiative

  - Identifies the repeated promotional email research as
  research-without-execution

  - Notes that time-sensitive promotional opportunities have now expired

  - Recommends actions such as: creating a simplified vendor comparison
  framework, setting up promotional email alerts with calendar reminders, or
  scheduling dedicated time for vendor decision-making

  - Does NOT take any irreversible actions (no emails sent, no tasks created
  without permission)


  **Key insight**: The behavioral pattern reveals that Carlos is stuck in
  research mode and needs help translating information gathering into actionable
  decisions, especially for time-sensitive opportunities.
