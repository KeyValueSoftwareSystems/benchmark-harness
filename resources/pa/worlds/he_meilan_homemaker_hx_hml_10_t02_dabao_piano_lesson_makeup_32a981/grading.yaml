judge_rubric: 'Evaluate the agent''s response from He Meilan''s perspective as a detail-oriented
  full-time mother (ISFJ personality) who prioritizes: (1) children''s healthy development
  and learning quality, (2) household financial balance, and (3) harmonious relationships.


  **Excellent (0.9-1.0)**: Recommends the professional substitute teacher (Ms. Li
  Jing, 180 RMB) with clear multi-dimensional reasoning: (a) identifies that Dabao
  is in critical recital preparation phase (April 20 recital, only 3 weeks away, 70%
  progress on Clementi Sonatina), making teaching continuity paramount; (b) recognizes
  Liu Ting relationship risk - only 2 casual interactions since March 15, no prior
  favor exchanges, creating inappropriate social pressure and future reciprocal obligation;
  (c) evaluates cost difference (80 RMB savings) as minimal compared to recital preparation
  stakes; (d) notes professional substitute''s advantages: 8 years experience, briefed
  on Dabao''s progress, maintains Teacher Zhao''s teaching plan. Shows understanding
  that the child''s health and growth outweighs minor cost savings, and preserves
  relationship harmony by not imposing on distant neighbor.


  **Good (0.7-0.89)**: Recommends professional substitute with solid reasoning on
  2-3 key dimensions (recital timing, teaching quality, or relationship appropriateness)
  but misses some nuances. May not fully quantify the social capital cost or may underweight
  the recital preparation criticality. Demonstrates reasonable judgment aligned with
  He Meilan''s priorities.


  **Adequate (0.5-0.69)**: Identifies the core tradeoff (cost vs. quality vs. relationship)
  but provides incomplete analysis. May recommend professional substitute without
  sufficient justification, or may suggest asking Liu Ting without adequately assessing
  relationship appropriateness risk. Shows some alignment with He Meilan''s values
  but lacks depth.


  **Poor (0.3-0.49)**: Recommends asking Liu Ting despite clear relationship distance
  (infrequent contact, no favor history) or fails to consider recital preparation
  criticality. May focus narrowly on cost savings (80 RMB) without evaluating teaching
  quality risk or social obligation. Shows weak understanding of He Meilan''s priorities
  (child development, relationship harmony).


  **Failing (0.0-0.29)**: Provides recommendation without investigating key data sources
  (WeChat history, piano progress notes, school email), makes decision based on assumptions
  rather than evidence, or recommends action that violates relationship norms (e.g.,
  sending direct request to Liu Ting without assessing interaction frequency). Fails
  to demonstrate multi-dimensional tradeoff reasoning appropriate for the task.'
reference_solution: '**Step 1**: Retrieve school substitute teacher notification from
  gmail (MSG-5136) to understand professional option details: Ms. Li Jing, 180 RMB,
  8 years experience, briefed on Dabao''s progress, maintains Teacher Zhao''s teaching
  plan.


  **Step 2**: Check Dabao''s current piano learning stage in notes (NOTE-211): 70%
  complete on Clementi Sonatina, April 20 recital in 3 weeks, Teacher Zhao''s feedback
  indicates right hand improving but left hand needs work, critical preparation period
  where lesson continuity matters.


  **Step 3**: Review Liu Ting''s teaching background research note (NOTE-212): 3rd
  year music student, informal teaching experience with beginners/early intermediate
  (ages 5-8), no confirmed recital preparation experience, uncertain availability,
  cost ~100 RMB red envelope.


  **Step 4**: Check WeChat interaction history with Liu Ting (WCC-0022): Last interaction
  March 15 (casual greeting at community event), before that January Spring Festival
  greeting, total 2-3 interactions per year, no previous favor exchanges, LOW interaction
  frequency.


  **Step 5**: Retrieve Liu Ting''s contact profile (CON-300): Confirms music education
  major, intermediate teaching skill, good with younger children, availability uncertain
  due to full-time student schedule, last interaction March 15.


  **Step 6**: Verify calendar for Wednesday April 2 time slot (EVT-423): Confirms
  4:30-5:30 PM piano lesson slot, no mention of Xiaobao swimming lesson conflict at
  5:00 PM in provided calendar data.


  **Step 7**: Conduct multi-dimensional tradeoff analysis:

  - **Teaching quality dimension**: Professional substitute (Ms. Li Jing) offers guaranteed
  quality, 8 years experience, briefed on Dabao''s progress vs. Liu Ting''s uncertain
  quality, no recital prep experience, informal teaching background. Winner: Professional
  substitute.

  - **Learning continuity dimension**: Dabao is 3 weeks from April 20 recital, 70%
  progress, needs consistent guidance on left hand technique. Professional substitute
  maintains Teacher Zhao''s plan; Liu Ting may introduce conflicting approach. Winner:
  Professional substitute.

  - **Cost dimension**: 180 RMB (professional) vs. ~100 RMB red envelope (Liu Ting)
  = 80 RMB difference. Savings modest relative to monthly piano budget (720 RMB/month).
  Slight advantage: Liu Ting.

  - **Relationship appropriateness dimension**: Liu Ting interaction frequency is
  LOW (2-3 times/year, last contact March 15 casual greeting), no prior favor exchanges.
  Asking for teaching help creates sudden social pressure and future reciprocal obligation.
  Risk: relationship awkwardness, perceived as transactional. Winner: Professional
  substitute (avoids relationship risk).

  - **Social capital cost dimension**: Liu Ting help creates ongoing obligation, expectation
  of future reciprocity, potential discomfort if teaching doesn''t go well. Professional
  substitute is clean transaction with no social debt. Winner: Professional substitute.


  **Step 8**: **Recommendation**: Accept professional substitute teacher Ms. Li Jing
  (180 RMB) for April 2 lesson. Rationale: (1) Dabao is in critical recital preparation
  phase where teaching quality and continuity are paramount for the child''s health
  and growth; (2) 80 RMB cost difference is minimal within the household financial
  balance context (monthly piano budget 720 RMB); (3) Liu Ting relationship is too
  distant (infrequent contact, no favor history) to appropriately request teaching
  favor, preserving relationship harmony; (4) Professional substitute eliminates teaching
  quality risk and social obligation complications.


  **Step 9**: Execute decision by replying to Harmony Music School gmail (MSG-5136)
  confirming acceptance of Ms. Li Jing substitute teacher for April 2, 4:30-5:30 PM,
  180 RMB.'
