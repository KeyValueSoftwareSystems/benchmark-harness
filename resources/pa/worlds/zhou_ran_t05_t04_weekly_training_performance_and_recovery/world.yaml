scoring_components:
- name: Training completion rate calculated
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - 81.8%
      - 81.8 percent
      - 9 of 11
      - 9 out of 11
      - nine of eleven
    - - completion rate
      - completion percentage
      - sessions completed
- name: Physiotherapy compliance identified
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - 100%
      - 100 percent
      - 3 of 3
      - 3 out of 3
      - all three
    - - physiotherapy
      - physio sessions
      - physio compliance
      - physiotherapy attendance
- name: Biomechanics lab utilization assessed
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - 75%
      - 75 percent
      - 9 of 12
      - 9 out of 12
    - - Q1 quota
      - quarterly quota
      - biomechanics lab
      - lab utilization
- name: Missed session reasons identified
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - physiotherapy appointment ran over
      - extended physio
      - physio session extended
      - physio ran long
    - - biomechanics lab rescheduled
      - lab session rescheduled
      - equipment calibration
      - force plate calibration
- name: Recommendations provided
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - buffer
      - buffer time
      - scheduling buffer
      - time cushion
    - - pre-book
