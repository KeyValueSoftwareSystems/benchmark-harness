judge_rubric: 'Award full marks if the response: (1) correctly identifies the SEK
  850k budget cap and SEK 180k shortfall (total demand SEK 1,030k across four workstreams),
  (2) calculates opportunity costs for constraint violations (TransLog window miss:
  SEK 1.2M, org restructuring deferral: SEK 400k, Aurora scope reduction: SEK 200-300k
  synergy leakage), (3) evaluates both CFO escalation path (fast, preserves all workstreams,
  but 5-7 day delay + 40% rejection risk incompatible with April 15 TransLog deadline)
  and budget-preserving reallocation path (slow, incurs SEK 400k opportunity cost
  but preserves hard deadline), (4) selects the budget-preserving path with explicit
  allocation breakdown (Aurora SEK 240k reduced scope, TransLog SEK 285k full scope,
  BU portfolio Phase 2 SEK 285k conditional, org restructuring deferred to Q3), (5)
  documents decision rationale with ''what would change my mind'' criteria (e.g.,
  if Anna signals budget flexibility before April 10, if TransLog window extends,
  if Aurora advisor confirms 90%+ synergy capture at reduced scope), and (6) drafts
  appropriate Workmail communications (vendor scope negotiation with Integration Advisory
  Partners, Henrik deferral notification with BU 4 mitigation plan, CFO budget forecast
  update). Deduct points if: the agent recommends exceeding the SEK 850k cap without
  CFO approval (authority violation), ignores the April 15 TransLog regulatory window
  hard constraint, fails to quantify opportunity costs, or omits the ''what would
  change my mind'' section required by Sven''s quality focus. Partial credit for correct
  constraint identification and opportunity cost analysis even if the final allocation
  differs, provided the logic respects hard constraints (budget cap, board mandate
  for Aurora, CEO priority for TransLog).'
reference_solution: '**Step 1**: Query finance service using `finance_list_transactions`
  to retrieve Q2 external advisor budget allocation (TXN-6064: SEK 850k cap) and all
  four competing workstream proposals (TXN-6065: Aurora SEK 320k, TXN-6066: BU portfolio
  Phase 2 SEK 245k, TXN-6067: TransLog SEK 285k, TXN-6068: org restructuring SEK 180k).
  Calculate total demand: SEK 1,030k vs SEK 850k cap = SEK 180k shortfall.


  **Step 2**: Retrieve Notion decision log (NPAG-77) using `claw_notion_get_page`
  to access opportunity cost analysis: TransLog regulatory window miss incurs SEK
  1.2M opportunity cost in deal timing flexibility (CEO strategic optionality), org
  restructuring deferral to Q3 incurs SEK 400k opportunity cost in delayed efficiency
  gains and extended BU 4 resistance, Aurora integration scope reduction risks SEK
  200-300k synergy capture quality degradation over 12 months.


  **Step 3**: Evaluate two constraint resolution paths documented in NPAG-77: (a)
  Fast path (CFO budget increase escalation): request Anna Karlsson approval for SEK
  180k increase to SEK 1,030k, preserves all workstreams at full scope, but introduces
  5-7 day approval timeline incompatible with April 15 TransLog regulatory window,
  plus Anna signaled Q2 budget discipline suggesting ~40% rejection probability. (b)
  Slow path (budget-preserving reallocation): defer org restructuring engagement to
  Q3 (saves SEK 180k), negotiate Aurora scope reduction to SEK 240k (saves SEK 80k),
  preserve TransLog and BU portfolio Phase 2 at full scope, fits SEK 850k cap, incurs
  SEK 400k org restructuring opportunity cost but preserves TransLog hard deadline.


  **Step 4**: Select slow path (budget-preserving reallocation) based on constraint
  prioritization: TransLog April 15 regulatory window is hard constraint with SEK
  1.2M opportunity cost if missed, CFO escalation introduces unacceptable timeline
  risk (5-7 days) and approval uncertainty (40% rejection probability), deferring
  org restructuring to Q3 incurs lower opportunity cost (SEK 400k) than missing TransLog
  window (SEK 1.2M), Aurora board mandate preserved via reduced scope negotiation.


  **Step 5**: Document final allocation in Notion budget forecast (NPAG-78) using
  `claw_notion_get_page`: Aurora integration SEK 240k (reduced scope, critical path
  only), BU portfolio Phase 2 SEK 285k (full scope, conditional on Phase 1 quality
  gate), TransLog due diligence SEK 285k (full scope, CEO priority), org restructuring
  SEK 0 (deferred to Q3), contingency reserve SEK 40k (Project Njord). Total committed
  spend: SEK 810k (95% utilization within SEK 850k cap).


  **Step 6**: Draft Workmail communications using `workmail_send_message`: (a) WMSG-5151
  to Integration Advisory Partners (maria.svensson@integrationadvisory.example) requesting
  Aurora scope reduction proposal targeting SEK 240k with 90%+ synergy capture quality
  confirmation, (b) WMSG-5152 to Henrik Andersson notifying org restructuring deferral
  to Q3 with interim BU 4 resistance mitigation plan (internal stakeholder engagement,
  1:1 sessions with BU 4 GM, detailed Q&A document), (c) WMSG-5153 to Anna Karlsson
  (CFO) providing final Q2 budget allocation forecast with decision rationale and
  ''what would change my mind'' criteria.


  **Step 7**: Create todo tasks using `todo_create_task` to track follow-up actions:
  TODO-661 (finalize Aurora scope reduction with Integration Advisory Partners by
  April 9), TODO-662 (update Q2 budget forecast in finance system), TODO-664 (monitor
  TransLog regulatory window confirmation with Johan Nyström by April 10, reassess
  allocation if window extends).


  **Step 8**: Document ''what would change my mind'' criteria in Notion decision log
  (NPAG-77): (a) if Anna Karlsson signals budget flexibility before April 10, revisit
  CFO escalation path to restore org restructuring engagement, (b) if TransLog regulatory
  window extends beyond April 15 (confirmed by Johan Nyström), reconsider org restructuring
  prioritization, (c) if Aurora integration advisor confirms reduced scope maintains
  90%+ synergy capture quality, lock in SEK 240k allocation.'
