judge_rubric: "Award full marks if the response: (1) correctly identifies the BU
  portfolio review completion as the most critical overdue item requiring
  immediate attention this week, (2) flags Lars Eriksson's dual allocation as an
  ongoing resource constraint requiring CFO/CEO awareness, (3) includes Project
  Njord Phase 2 quality assessment with contingency budget recommendation as a
  key deliverable, (4) proposes Q2 board planning kickoff for week of April 7,
  (5) respects the non-negotiable 6:30am rowing constraint by not scheduling
  meetings before 8:30am, (6) provides explicit rationale for task
  prioritization tied to board preparation cascade and resource constraints, and
  (7) includes a 'what would change my mind' section or equivalent decision
  criteria (e.g., conditions under which priorities would shift, such as CEO
  requesting earlier Q2 planning or Lars becoming unavailable). Award partial
  credit if 4-5 of these elements are present. Award low marks if the response
  misses the overdue portfolio review, fails to flag resource constraints, or
  proposes tasks that conflict with Sven's rowing schedule."
reference_solution: "Step 1: Query claw_notion_get_page for page_id NPAG-57 ('Q1
  Board Materials - Master Executive Readout') to retrieve current workstream
  status and remaining milestones. Step 2: Call todo_list_tasks to review
  existing high-priority pending tasks (TODO-610: MTG-7020 action item
  extraction due April 3, TODO-614: weekly CFO/CEO summary due April 3). Step 3:
  Call calendar_list_events to scan this week's availability and confirm no
  conflicts with 6:30am rowing sessions (non-negotiable constraint). Step 4:
  Analyze Notion page blocks to identify post-board priorities: (a) Priority 1 -
  MTG-7020 action items (already captured in TODO-610), (b) Priority 2 - BU
  portfolio review completion (OVERDUE since March 10, now 3+ weeks late due to
  delayed BU 4 data), (c) Priority 3 - Project Njord Phase 2 assessment with
  contingency budget recommendation, (d) Priority 4 - Q2 board planning kickoff
  (target week of April 7). Step 5: Flag resource constraint: Lars Eriksson
  dual-allocated to M&A and portfolio work, capacity stretched during Q1 board
  prep sprint (week of Feb 23-27). Note Emma Johansson compliance training lock
  now resolved (completed Feb 25). Step 6: Create new todo tasks if needed (or
  confirm existing TODO-610 and TODO-614 cover immediate action items). Step 7:
  Prepare Workmail summary to CFO (anna.karlsson@vasaholm.se) and CEO
  (per.johansson@vasaholm.se) outlining this week's focus areas, flagging Lars
  resource constraint, and proposing Q2 planning session. Step 8: Document task
  creation rationale in Notion decision log per audit trail requirement.
  Expected output: A prioritized task breakdown emphasizing BU portfolio review
  completion (overdue, CEO waiting), Project Njord assessment (board expects
  contingency plan overview), Q2 planning kickoff proposal, and explicit
  resource constraint escalation for Lars Eriksson's dual allocation."
primary_dimensions:
  - completion
  - robustness
