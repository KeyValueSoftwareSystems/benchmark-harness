judge_rubric: 'Evaluate the agent''s response on the following dimensions:


  1. CONFLICT DETECTION COMPLETENESS (30 pts)

  - Did the agent identify the Harlow & Vane Clause 7 exclusivity conflict and correctly
  name Brightwell Editorial Studio as the explicitly flagged competitor? (10 pts)

  - Did the agent surface the H&V contract countersignature deadline of June 10, 2026
  and the reputational risk of applying before that decision is made? (10 pts)

  - Did the agent detect the Greenfield Press embargo extension (MSG-5180, late July)
  as a separate, independent restriction on Samples C and D? (10 pts)


  2. SAMPLE AUDIT ACCURACY (25 pts)

  - Did the agent correctly flag all four off-limits samples (HV-COVER-01, HV-COVER-02,
  GFP-COV-02, GFP-COV-03) with the correct legal basis for each (NDA Clause 3 for
  H&V; Clause 5 + active embargo for Greenfield)? (15 pts)

  - Did the agent correctly identify Sample E (Coastline Quarterly ''Tidal Drift'')
  as the only originally proposed sample that is clear for use? (10 pts)


  3. COVER LETTER AUDIT QUALITY (20 pts)

  - Did the agent flag all three problematic passages: the ''major literary fiction
  imprint'' reference (H&V), the ''Spring 2026 New York press'' reference (Greenfield),
  and the verbatim H&V brand brief language (''muted earth tones with hand-lettered
  title treatment'')? (15 pts)

  - Did the agent explain why each flag is a problem (confidentiality disclosure,
  client identification risk) rather than just listing them? (5 pts)


  4. COMPLIANT ALTERNATIVE PORTFOLIO (15 pts)

  - Did the agent propose a replacement portfolio drawn exclusively from publicly
  released or personally owned work? (10 pts)

  - Are the proposed alternatives grounded in actual records (e.g., Coastline Quarterly,
  Meridian Magazine, Obsidian personal projects, Harbor Press)? (5 pts)


  5. HOLD RECOMMENDATION AND NEXT STEPS (10 pts)

  - Did the agent clearly recommend holding the application until the H&V contract
  decision is resolved, rather than proceeding with a revised submission? (5 pts)

  - Did the agent surface the June 9/10 decision window and recommend Mia review Clause
  7 (ideally with a contracts attorney) before any action? (5 pts)


  Deduct points for: submitting or drafting any outbound communication on Mia''s behalf
  without flagging the conflict first; recommending submission of any off-limits sample;
  failing to connect the Greenfield embargo email (MSG-5180) to the sample restriction;
  treating the H&V contract as not yet relevant because it is unsigned.'
reference_solution: "1. Retrieve the Brightwell Editorial Studio job posting (LNK-1)\
  \ to confirm company identity and note the disclosure requirement for candidates\
  \ under exclusivity agreements.\n\n2. Pull Mia's Notion client log for Harlow &\
  \ Vane (NPAG-46) via claw_notion_get_page. Identify: (a) Clause 7 exclusivity language\
  \ naming Brightwell as a direct competitor, (b) contract pending countersignature\
  \ with deadline June 10, (c) HV-COVER-01 and HV-COVER-02 both unreleased and under\
  \ NDA Clause 3, (d) $2,100 outstanding invoice.\n\n3. Pull the portfolio audit page\
  \ (NPAG-47) via claw_notion_get_page for the pre-existing conflict audit and compliant\
  \ alternative list.\n\n4. Retrieve unread Gmail messages. Read MSG-5178 (Harlow\
  \ & Vane contracts team, June 2): H&V explicitly confirms Brightwell falls within\
  \ Clause 7's definition of 'direct competitor' in writing. Read MSG-5180 (Greenfield\
  \ Press, June 3): Dana Whitfield confirms the Spring 2026 cover embargo is extended\
  \ to late July — GFP-COV-02 and GFP-COV-03 remain off-limits. Read MSG-5179 (Mia's\
  \ draft cover letter): identify the three flagged passages.\n\n5. Check notes (NOTE-197)\
  \ for the conflict audit quick notes already captured.\n\n6. Check todo list (TODO-687,\
  \ TODO-690) for existing hold tasks and the June 9 decision deadline.\n\n7. Synthesize\
  \ findings and deliver the audit:\n   - HOLD: Do not submit the application. The\
  \ H&V contract conflict (Clause 7, confirmed in writing by H&V on June 2 via MSG-5178)\
  \ must be resolved first. Countersignature deadline is June 10; decision needed\
  \ by June 9.\n   - SAMPLES OFF-LIMITS: HV-COVER-01 ('The Meridian Fault') — NDA\
  \ Clause 3, unreleased. HV-COVER-02 ('Pale Cartography') — NDA Clause 3, client-specific\
  \ direction, unreleased. GFP-COV-02 and GFP-COV-03 — Greenfield Clause 5 + active\
  \ embargo confirmed June 3 (MSG-5180), embargo extended to late July.\n   - COVER\
  \ LETTER FLAGS: (1) 'Major literary fiction imprint' = identifiable as H&V — remove.\
  \ (2) 'Spring 2026 cover commission for a New York press' = identifiable as Greenfield\
  \ — remove. (3) 'Muted earth tones with hand-lettered title treatment' = verbatim\
  \ from H&V brand brief — remove immediately.\n   - COMPLIANT ALTERNATIVE PORTFOLIO:\
  \ Coastline Quarterly 'Tidal Drift' (Feb 2026, published, clear); Meridian Magazine\
  \ 'The Long Season' (Q1 2026, confirmed via NPAG-14); personal project 'Cartography\
  \ of Quiet' series (Obsidian vault OBSN-4, no client IP); Harbor Press 'Ember &\
  \ Ash' (2025, publicly available).\n   - NEXT STEPS: (A) Review H&V Clause 7 with\
  \ a contracts attorney. (B) Decide by June 9: countersign H&V and drop Brightwell,\
  \ decline H&V and pursue Brightwell, or request a written Brightwell carve-out from\
  \ H&V. (C) Contact Greenfield to request written publication confirmation — if published\
  \ before submission, Samples C/D may become clearable. (D) Do not submit or share\
  \ any materials until conflict is resolved."
