    keywords:
    - - CloudFlare
      - CDN
      - cloud flare
    - - maintenance
      - scheduled maintenance
      - emergency maintenance
    - - April 28
      - April 29
      - Window C
      - 28-29
      - 4/28
      - 4/29
    - - conflict
      - overlap
      - collision
      - same window
      - coincides
- name: Made launch hold decision and recommended pivot
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - HOLD
      - halt
      - stop
      - pause launch
      - cancel Window C
      - abort
    - - Window A
      - Window B
      - backup window
      - alternative window
      - reschedule
    - - customer-facing
      - downtime
      - outage
      - SLA
      - platform availability
- name: Executed urgent notifications to engineering and marketing
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - Priya
      - engineering
    - - Sarah Kim
      - product marketing
      - marketing
    - - customer communications
      - customer comms
      - external communications
      - launch communications
    - - immediately
      - urgent
      - stop
      - halt
      - before
