judge_rubric: 'Evaluate the response from He Meilan''s perspective as a full-time
  mother managing two children''s overlapping activities during her husband''s business
  trip. Award high scores (8-10) if the agent: (1) correctly identifies the vaccination
  appointment on Thursday April 3 as a non-negotiable hard constraint that cannot
  be postponed beyond April 4 per clinic policy, (2) detects the temporal conflict
  where He Meilan cannot simultaneously take Xiaobao to the 3:30pm vaccination and
  pick up Dabao from school at 3:30pm, (3) proposes a concrete backup helper solution
  (preferably sister He Meifang) to cover Dabao''s pickup with appropriate advance
  notice requirements (24 hours), (4) addresses the secondary Wednesday April 2 conflict
  between Dabao''s piano lesson (4:30-5:30pm) and Xiaobao''s kindergarten pickup (5:00pm),
  ideally by confirming Liu Fang''s availability from WeChat messages, (5) prioritizes
  children''s health (vaccination) over optional trial activities (robotics can be
  rescheduled or made up on Saturday), and (6) demonstrates sensitivity to family
  relationship dynamics by choosing reliable helpers and maintaining balanced attention
  between both children. Award medium scores (5-7) if the agent identifies key conflicts
  and constraints but proposes incomplete solutions (e.g., suggests rescheduling vaccination
  despite hard deadline, fails to secure backup helper with proper notice, ignores
  Wednesday conflict). Award low scores (1-4) if the agent misses the core Thursday
  conflict, proposes solutions that violate medical deadlines, or fails to account
  for He Meilan''s physical impossibility of being in two locations simultaneously.
  The response should reflect He Meilan''s ISFJ traits: thorough planning, attention
  to detail, concern for both children''s needs, and proactive coordination with family/community
  support network.'
reference_solution: '**Step 1**: Call `calendar_list_events` with date range 2026-04-01
  to 2026-04-05 to retrieve all scheduled activities during the conflict week. Identify
  EVT-501 (Dabao robotics trial Tuesday 4:00-5:30pm), EVT-502 (Xiaobao vaccination
  Thursday 3:30pm with note ''CANNOT POSTPONE BEYOND THIS WEEK''), and EVT-505 (husband''s
  business trip April 1-5, no backup available).


  **Step 2**: Call `gmail_get_message` for MSG-5235 (vaccination appointment confirmation)
  to extract hard constraint: ''This vaccination must be administered within the scheduled
  week (March 31 - April 4) per national immunization program guidelines. Rescheduling
  beyond April 4 will require restarting the vaccination series.'' Recognize this
  as non-negotiable medical deadline. Call `gmail_get_message` for MSG-5234 (robotics
  workshop email) to verify makeup policy: ''First trial session (April 1): Can be
  rescheduled to Thursday April 3, 3:00-4:30pm if needed'' — but note this conflicts
  with vaccination at 3:30pm.


  **Step 3**: Call `todo_list_tasks` to retrieve TODO-773 and TODO-774, which outline
  the conflict analysis and backup helper coordination plan. Note the priority: ''Medical
  appointment (vaccination) is non-negotiable. Robotics trial can potentially be made
  up on Saturday.''


  **Step 4**: Detect the core Thursday April 3 conflict: Xiaobao''s vaccination at
  3:30pm requires He Meilan''s presence (parent must accompany child per clinic requirements),
  but Dabao''s school dismissal is also at 3:30pm. Physical impossibility: cannot
  be in two locations simultaneously.


  **Step 5**: Call `claw_wechat_get_chat` for WCC-0038 (sister He Meifang) to verify
  backup availability. Extract message from 2026-03-31 20:30:00: ''No problem! Thursday
  at what time? Dabao''s dismissal is 3:30 right? I can go to school to pick him up,
  then bring him back to your home and wait for you to return.'' Confirm Meifang is
  available and reliable, but requires 24-hour advance notice (must contact by Wednesday
  April 2 morning).


  **Step 6**: Call `claw_wechat_get_chat` for WCC-0039 (Liu Fang) to verify Wednesday
  April 2 solution. Extract message from 2026-04-01 20:28:00: ''Okay, I''ll pick up
  Xiaobao from kindergarten at 5pm on Wednesday, you can focus on accompanying Dabao
  to piano class!'' Confirm Liu Fang has already agreed to handle Wednesday conflict.


  **Step 7**: Review the week''s constraints gathered above.


  **Step 8**: Generate resolution plan:

  - **Thursday April 3 (CRITICAL)**: Contact sister He Meifang by Wednesday April
  2 morning to confirm she will pick up Dabao from school at 3:30pm and supervise
  him at home. He Meilan takes Xiaobao to 3:30pm vaccination appointment (non-negotiable
  medical deadline). Expected return by 5:30pm.

  - **Wednesday April 2 (RESOLVED)**: Liu Fang picks up Xiaobao from kindergarten
  at 5:00pm while He Meilan accompanies Dabao to piano lesson (4:30-5:30pm). Pickup
  Xiaobao from Liu Fang''s home by 5:30pm.

  - **Tuesday April 1**: Manageable — drop Dabao at robotics 4:00pm, pick up Xiaobao
  at 5:00pm, return for Dabao at 5:30pm.

  - **Robotics trial decision**: Evaluate by Friday April 4 5pm deadline whether to
  continue enrollment. If conflicts persist, Saturday makeup sessions are available.


  **Step 9**: Call `todo_update_task` for TODO-774 to mark ''Contact sister He Meifang''
  as in-progress with deadline Wednesday April 2 morning. Optionally call `todo_create_task`
  to add reminder: ''Confirm Liu Fang pickup for Wednesday April 2 5pm (Xiaobao kindergarten).''


  **Step 10**: Present comprehensive plan to He Meilan emphasizing: (1) vaccination
  is non-negotiable and takes priority, (2) backup helpers are secured with appropriate
  notice, (3) both children''s needs are addressed without sacrificing either, (4)
  robotics trial can be evaluated after resolving immediate conflicts, and (5) compensation
  time with Dabao on Saturday April 5 when husband returns.'
