scoring_components:
- name: Discovered software purchase decision abandonment pattern
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - software purchase
      - design software
      - DesignSoftwareHub
      - Adobe
      - Figma
    - - deadline pressure
      - promotion expires
      - February 28
      - promo code
      - DESIGN25
    - - abandoned decision
      - deleted calendar
      - removed reminder
      - unresolved decision
      - incomplete analysis
    - - cash flow
      - payment timing
      - financial risk
      - budget concern
- name: Discovered contract conflict hesitation pattern
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - UrbanNest
      - contract
      - Section 4.2
      - licensing requirement
    - - drafted email
      - composed message
      - discarded draft
      - abandoned email
    - - clarification needed
      - uncertainty
      - unclear requirements
      - professional concern
    - - Amanda Park
      - legal team
      - Sketch files
      - software standards
- name: Cross-referenced incomplete note for context validation
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - NOTE-225
      - software purchase analysis
      - incomplete note
      - abandoned analysis
    - - reimbursement
      - out-of-pocket
      - $179.97
      - client payment
    - - TechFlow
      - GreenLeaf
      - pending payment
      - $2,800
      - $1,450
- name: Identified CRM and finance research activity
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - searched CRM
      - reviewed contracts
      - checked client records
      - looked up customer
    - - finance transactions
      - account balance
      - payment status
      - reviewed finances
    - - reimbursement policy
      - contract terms
      - client agreement
