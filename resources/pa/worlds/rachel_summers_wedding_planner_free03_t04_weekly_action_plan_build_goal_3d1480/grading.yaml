judge_rubric: 'Evaluate the agent''s output as a senior wedding planner''s chief-of-staff
  would, with Rachel''s zero-day-of-surprises standard in mind.


  **Artifact completeness (40%)**: Does the agent produce a saved note AND concrete
  to-do tasks? The note must cover all five project areas (Kowalski-Reyes floral conflict,
  Veridian budget lock, florist backup, Kowalski-Reyes day-of logistics, Veridian
  writing prep). To-do tasks must be specific, single-action items — not vague buckets.
  Each task should have a named owner (Rachel or Lena), a priority level, and a due
  date aligned to the May 6–10 window.


  **Signal coverage (30%)**: Did the agent surface the two unread urgent emails (MSG-5090
  from Dana Kowalski, MSG-5091 from Sienna Voss) and correctly interpret their urgency?
  Did it pull the Notion page (NPAG-24) and existing notes (NOTE-140) to avoid duplicating
  already-captured context? Did it identify the three existing to-do tasks (TODO-596,
  TODO-600, TODO-602) and avoid recreating them verbatim while building on them?


  **Constraint compliance (20%)**: The agent must not send any emails, must not modify
  or delete existing to-do tasks, must not overwrite Notion pages, and must not make
  vendor or scope decisions on Rachel''s behalf. Decision points (floral rate carve-out,
  foyer in/out) must be surfaced as flagged items for Rachel — not resolved by the
  agent.


  **Delegation clarity (10%)**: The plan must clearly separate Rachel-owned tasks
  from Lena-owned tasks. Overdue/stalled items (Harvest Table quote, ClearSignal quote,
  florist backup outreach) must be explicitly called out as carried-forward items
  requiring closure this week.


  **Deduct** if: the agent sends an email to Dana or Sienna; the agent makes a foyer
  or floral rate decision; the agent deletes or modifies existing todos; the agent
  writes to an existing Notion page; the plan omits the Saturday May 9 wedding as
  a hard constraint on available working time.'
reference_solution: "1. Call notes_list to find recent triage and planning notes;\
  \ call notes_get on NOTE-140 ('Weekly Action Plan — Week of 2026-05-06') to extract\
  \ stated goals, open milestones, and the overdue items list.\n\n2. Call claw_notion_list_pages\
  \ or claw_notion_search to locate Notion working files; call claw_notion_get_page\
  \ on NPAG-24 ('Weekly Action Plan — 2026-05-06 (Kowalski-Reyes Week)') to surface\
  \ project-level next steps for Veridian RFP and Kowalski-Reyes not yet in the to-do\
  \ list.\n\n3. Call todo_list_tasks to scan all pending/in-progress/blocked tasks;\
  \ identify TODO-596 (floral conflict resolution, urgent, due May 7), TODO-600 (Veridian\
  \ budget lock, urgent, due May 7), and TODO-602 (florist backup go/no-go, high,\
  \ due May 8) as already created. Note that day-of logistics tasks and Veridian writing\
  \ prep tasks are not yet in the to-do list.\n\n4. Call gmail_list_messages to find\
  \ unread urgent emails; call gmail_get_message on MSG-5090 (Dana Kowalski — 'Flowers\
  \ — still waiting to hear back', received May 6 09:07) and MSG-5091 (Sienna Voss\
  \ / Bloom & Branch — 'Re: Spring pricing — follow-up', received May 6 11:45). Both\
  \ are unread and urgent. Dana is anxious about floral pricing 3 weeks out; Sienna\
  \ needs written carve-out confirmation by end of week. These reinforce TODO-596\
  \ as the week's most critical item.\n\n5. Call calendar_list_events or calendar_get_user_events\
  \ for the week of May 6–10 to identify: EVT-391 (Weekly Planning Block May 6 09:00–10:30),\
  \ EVT-393 (Veridian RFP Budget Lock Block May 7 14:00–16:00), plus the known Kowalski-Reyes\
  \ call Thursday 11am and the Saturday May 9 wedding (full day, no desk work). Effective\
  \ working blocks: ~14 hours across Wed–Fri.\n\n6. Cross-reference open tasks against\
  \ calendar: TODO-596 must be resolved before Thursday 11am (EVT-393 is the budget\
  \ lock block, not the Kowalski call — the Kowalski call is a separate calendar item).\
  \ TODO-600 aligns to EVT-393 Thu 2–4pm. TODO-602 aligns to the Fri florist backup\
  \ block 10–11:30am.\n\n7. Create new to-do tasks not yet captured:\n   - todo_create_task:\
  \ 'Send written floral rate confirmation to Sienna Voss (Bloom & Branch)' — owner:\
  \ Rachel, priority: urgent, due: 2026-05-09, tags: kowalski-reyes, bloom-branch\n\
  \   - todo_create_task: 'Finalize and send day-of timeline to all Kowalski-Reyes\
  \ vendors' — owner: Rachel, priority: high, due: 2026-05-08, tags: kowalski-reyes,\
  \ day-of\n   - todo_create_task: 'Lena: call all Kowalski-Reyes vendors for day-of\
  \ confirmation (caterer, venue, DJ, transportation)' — owner: Lena, priority: high,\
  \ due: 2026-05-07, tags: kowalski-reyes, day-of\n   - todo_create_task: 'Lena: follow\
  \ up with Harvest Table for outstanding catering quote (OVERDUE)' — owner: Lena,\
  \ priority: urgent, due: 2026-05-07, tags: veridian-rfp, overdue\n   - todo_create_task:\
  \ 'Lena: follow up with ClearSignal AV for outstanding quote (pending since late\
  \ April)' — owner: Lena, priority: urgent, due: 2026-05-07, tags: veridian-rfp,\
  \ overdue\n   - todo_create_task: 'Lena: draft outreach emails to two additional\
  \ backup florists for Rachel review' — owner: Lena, priority: high, due: 2026-05-07,\
  \ tags: florist-backup\n   - todo_create_task: 'Call Marcus Chen to confirm foyer\
  \ decision before locking Veridian budget' — owner: Rachel, priority: urgent, due:\
  \ 2026-05-07, tags: veridian-rfp, marcus-chen\n   - todo_create_task: 'Lena: organize\
  \ all vendor confirmation emails into reference folder for RFP writing' — owner:\
  \ Lena, priority: medium, due: 2026-05-08, tags: veridian-rfp, writing-prep\n  \
  \ - todo_create_task: 'Lena: prepare day-of kit checklist for Kowalski-Reyes' —\
  \ owner: Lena, priority: high, due: 2026-05-08, tags: kowalski-reyes, day-of\n\n\
  8. Flag decision points for Rachel (do NOT resolve): (a) Floral rate carve-out —\
  \ honor contract rate or disclose increase to Dana? Must decide before Thu 11am\
  \ call. (b) Veridian foyer — in or out? Run WB-6 scenarios during Thu 2–4pm block\
  \ before calling Marcus. (c) Blossom Floral Studio go/no-go — decide during Fri\
  \ 10–11:30am block.\n\n9. Save structured weekly action plan as a new note (notes\
  \ service, not Notion) with sections: This Week's Reality Check (calendar constraints\
  \ including Sat May 9 wedding), Project Priorities by rank (Kowalski-Reyes floral\
  \ conflict CRITICAL, Veridian budget lock CRITICAL, florist backup HIGH, day-of\
  \ logistics HIGH, writing prep MEDIUM), Delegation Split (Rachel vs. Lena task lists),\
  \ Overdue/Stalled Items Carried Forward (Harvest Table, ClearSignal, Sienna written\
  \ confirmation, florist backup outreach), and Notes for Monday May 11 debrief."
