judge_rubric: '# Evaluation Rubric: Rotation Week 6 Cognitive Capacity Management


  ## Excellent (0.9-1.0)

  - Correctly identifies Zone 3A RFI as the only non-delegable, hard-deadline task
  that must be completed despite rotation fatigue

  - Recognizes Q1 financial reconciliation as high-cognitive work suitable for deferral
  to post-rotation given soft deadline and current cognitive depletion state

  - Applies cognitive capacity assessment framework from KB-459, referencing specific
  metrics from NOTE-191 (29-point calendar density, 5 consecutive high-stakes decision
  days, week 6 position)

  - Protects father''s medical appointment as immovable constraint and accounts for
  emotional/cognitive impact on surrounding work windows

  - Provides clear sequencing: Zone 3A site walk March 26 AM (peak energy), RFI documentation
  March 27 early AM if needed, request Q1 financial extension to April 1

  - Demonstrates understanding of delegation governance (KB-437 Section 4.2 prevents
  RFI delegation for foundation safety decisions)

  - Balances contractual risk ($282K liquidated damages exposure) against human cognitive
  limits appropriately


  ## Good (0.7-0.89)

  - Identifies both critical tasks (Zone 3A RFI and Q1 financial) but may not fully
  articulate why one is deferrable and one is not

  - References rotation fatigue and cognitive load concepts but may not quantify using
  KB-459 framework metrics

  - Recognizes father''s appointment as constraint but may not account for cognitive
  impact beyond schedule blocking

  - Provides reasonable sequencing but may lack specific time-blocking or energy management
  strategy

  - Understands non-delegable nature of foundation approval but may not cite governance
  protocol reference


  ## Adequate (0.5-0.69)

  - Identifies Zone 3A RFI as urgent but may not fully explain critical path implications
  or liquidated damages risk

  - May suggest handling Q1 financial analysis during rotation week without recognizing
  cognitive load mismatch

  - Acknowledges rotation fatigue in general terms but doesn''t apply structured assessment
  framework

  - Treats father''s appointment as simple calendar conflict rather than cognitive
  capacity constraint

  - May propose delegation without verifying governance protocols

  - Sequencing logic present but not optimized for cognitive energy management


  ## Poor (0.3-0.49)

  - Fails to distinguish between delegable and non-delegable tasks

  - Does not prioritize based on deadline hardness or critical path impact

  - Ignores cognitive capacity considerations despite week 6 rotation position

  - Suggests completing all pending tasks without deferral strategy

  - Does not reference relevant KB articles or governance protocols

  - Treats all approvals as equivalent cognitive load


  ## Unacceptable (0.0-0.29)

  - Recommends skipping Zone 3A site verification or delegating foundation approval
  in violation of KB-437

  - Suggests scheduling high-cognitive work during confirmed low-energy periods (post-medical
  appointment, late week 6)

  - Fails to identify critical path deadline for marine foundation mobilization

  - Does not acknowledge rotation fatigue or cognitive capacity constraints

  - Proposes actions that would trigger liquidated damages or safety protocol violations'
reference_solution: "# Reference Solution: Rotation Week 6 Cognitive Capacity Management\n\
  \n## Step 1: Retrieve and Assess Pending Tasks\n**Action**: `todo_list_tasks` to\
  \ get full approval queue\n**Key findings**:\n- TODO-671: Zone 3A RFI-2026-089 site\
  \ verification (critical, non-delegable, due March 27)\n- TODO-672: Q1 financial\
  \ reconciliation (high-cognitive, 6-8 hours, due March 30, deferrable)\n- TODO-674:\
  \ Meta-task for cognitive capacity sequencing (current task)\n\n## Step 2: Review\
  \ Cognitive Load Self-Assessment\n**Action**: `notes_get` for NOTE-191 (Week 6 Cognitive\
  \ Load Assessment)\n**Key findings**:\n- Calendar density: 29 points (critical depletion\
  \ zone per KB-459)\n- 5 consecutive days of high-stakes decisions (severe decision\
  \ fatigue)\n- Subjective fatigue: 7/10, averaging 5.5 hours sleep\n- Week 6, Day\
  \ 2 position (70-80% baseline cognitive capacity per KB-459)\n- Father's appointment\
  \ March 27 creates 4-hour unavailable block (09:00-13:00)\n\n## Step 3: Consult\
  \ Cognitive Capacity Management Framework\n**Action**: `kb_get_article` for KB-459\
  \ (Rotation Week Cognitive Capacity Management)\n**Key findings**:\n- Week 5-6 position:\
  \ 70-80% baseline capacity\n- Calendar density >16 points = cognitive depletion\
  \ likely\n- Priority matrix: High-cognitive + hard-deadline + non-delegable → morning\
  \ peak energy windows\n- High-cognitive + soft-deadline → defer to post-rotation\
  \ with handover documentation\n- Personal constraints must be treated as hard scheduling\
  \ constraints\n\n## Step 4: Verify Delegation Governance for RFI Approval\n**Action**:\
  \ `kb_search` for \"RFI approval delegation\" or `kb_get_article` for KB-437\n**Key\
  \ findings**: KB-437 Section 4.2 requires personal site verification for foundation\
  \ approvals with geotechnical uncertainty (Zone 3A qualifies)\n\n## Step 5: Review\
  \ Critical Path Context from Email\n**Action**: `gmail_get_message` for MSG-5159\
  \ (Fatima's urgent email)\n**Key findings**:\n- Bosphorus Marine mobilization window\
  \ closes March 28\n- 6-day delay if missed (next availability April 10)\n- Liquidated\
  \ damages: $47,000/day = $282,000 total exposure\n- Requires personal site verification\
  \ with marine geologist\n- Cannot be delegated under current governance\n\n## Step\
  \ 6: Review Financial Reconciliation Requirements\n**Action**: `gmail_get_message`\
  \ for MSG-5161 (Ahmed's email)\n**Key findings**:\n- Q1 closeout deadline March\
  \ 30 (soft deadline for corporate board reporting)\n- Requires 6-8 hours focused\
  \ analysis (high cognitive load)\n- Includes variance analysis, contingency justifications,\
  \ forecast review\n- Ahmed acknowledges rotation timing challenge\n\n## Step 7:\
  \ Verify Calendar Constraints\n**Action**: `calendar_get_event` for EVT-413 (Zone\
  \ 3A site walk) and EVT-414 (father's appointment)\n**Key findings**:\n- Site walk\
  \ scheduled March 26, 07:00-10:30 (already optimally placed in morning peak energy\
  \ window)\n- Father's appointment March 27, 10:00-11:30 (immovable family priority)\n\
  \n## Step 8: Sequence Tasks Based on Cognitive Capacity Analysis\n\n**Decision Logic**:\n\
  1. **Zone 3A RFI (TODO-671)**: High-cognitive + hard-deadline (March 27) + non-delegable\
  \ + critical path ($282K risk)\n   - **Action**: MUST COMPLETE despite rotation\
  \ fatigue\n   - **Sequencing**: Site walk already scheduled March 26 AM (optimal),\
  \ reserve March 27 early AM (06:00-09:00, before medical appointment) for RFI documentation\
  \ if needed\n   - **Rationale**: Critical path impact and liquidated damages exposure\
  \ override cognitive fatigue concerns; no delegation option per KB-437\n\n2. **Q1\
  \ Financial Reconciliation (TODO-672)**: High-cognitive (6-8 hours deep analysis)\
  \ + soft-deadline (March 30) + deferrable\n   - **Action**: DEFER to post-rotation\n\
  \   - **Sequencing**: Request 48-hour extension to April 1 (first day back from\
  \ break when cognitive capacity restored to 100%)\n   - **Rationale**: Current cognitive\
  \ state (70-80% capacity, 29-point density score, 5-day decision fatigue) unsuitable\
  \ for financial analysis requiring sustained focus; soft deadline allows negotiation;\
  \ post-rotation completion will produce higher quality work\n\n3. **Routine Equipment\
  \ Inspections** (mentioned in notes, not in todo list but implied): Low-cognitive\
  \ + delegable\n   - **Action**: Delegate to Hassan Al-Mutairi (site supervisor with\
  \ procurement authority) or batch process March 28 afternoon\n   - **Rationale**:\
  \ Does not require senior engineer judgment; standard delegation protocol applies\n\
  \n## Step 9: Execute Sequencing Plan\n\n**Action 1**: `gmail_send_message` to Ahmed\
  \ Khalil requesting Q1 financial extension\n- Subject: \"Q1 Financial Reconciliation\
  \ - Extension Request to April 1\"\n- Body: Explain rotation week 6 cognitive fatigue\
  \ (29-point calendar density, 5 consecutive high-stakes decision days per self-assessment),\
  \ father's medical appointment March 27, commitment to complete Zone 3A critical-path\
  \ RFI. Request extension to April 1 when cognitive capacity restored. Offer to provide\
  \ preliminary notes if needed for board reporting.\n\n**Action 2**: `gmail_send_message`\
  \ to Fatima Alnoor confirming Zone 3A timeline\n- Subject: \"RE: Zone 3A Marine\
  \ Foundation RFI - Confirmation of March 26-27 Completion\"\n- Body: Confirm site\
  \ walk March 26 AM with Mustafa and Dr. Qureshi, commit to RFI-2026-089 approval\
  \ by end of day March 27 to meet March 28 mobilization deadline. Acknowledge critical\
  \ path impact and liquidated damages risk.\n\n**Action 3**: `todo_update_task` for\
  \ TODO-671\n- Update status to \"in-progress\"\n- Add note: \"Site walk confirmed\
  \ March 26 07:00, RFI documentation window March 27 06:00-09:00 (before medical\
  \ appointment)\"\n\n**Action 4**: `todo_update_task` for TODO-672\n- Update due_date\
  \ to \"2026-04-01\"\n- Add note: \"Extension requested from Ahmed due to rotation\
  \ week 6 cognitive fatigue. Will complete post-rotation with full cognitive capacity.\"\
  \n\n**Action 5**: `calendar_create_event` for protected cognitive work block\n-\
  \ Title: \"PROTECTED: RFI-2026-089 Documentation (No Interruptions)\"\n- Start:\
  \ 2026-03-27T06:00:00+03:00\n- End: 2026-03-27T09:00:00+03:00\n- Description: \"\
  Final documentation for Zone 3A marine foundation approval. Peak cognitive energy\
  \ window before family medical appointment.\"\n\n## Final Output to User\n\n**Summary**:\n\
  Based on your week 6 cognitive capacity assessment (29-point calendar density, 5\
  \ consecutive high-stakes decision days, 70-80% baseline capacity), here's your\
  \ sequencing plan:\n\n**MUST COMPLETE NOW**:\n- **Zone 3A RFI-2026-089**: Non-delegable\
  \ per KB-437 governance (foundation safety requires personal verification). Site\
  \ walk already optimally scheduled March 26 AM. Reserve March 27 early morning (06:00-09:00,\
  \ before your father's appointment) for RFI documentation. Critical path deadline\
  \ March 27 with $282K liquidated damages exposure if missed.\n\n**DEFER TO POST-ROTATION**:\n\
  - **Q1 Financial Reconciliation**: Requires 6-8 hours sustained cognitive focus\
  \ unsuitable for current fatigue state. Soft deadline allows extension request.\
  \ I've drafted an email to Ahmed requesting extension to April 1 (your first day\
  \ back) when cognitive capacity restored to 100%. This will produce higher quality\
  \ analysis than forcing it through rotation week 6 fog.\n\n**PROTECTED CONSTRAINT**:\n\
  - Your father's cardiology appointment March 27 is treated as immovable with 4-hour\
  \ block (09:00-13:00 including travel). No high-cognitive work scheduled after this\
  \ due to emotional load impact.\n\n**COGNITIVE RATIONALE**:\nKB-459 framework confirms\
  \ you're in critical depletion zone (week 6 + 29-point density + 5-day decision\
  \ fatigue). The only task that justifies pushing through fatigue is Zone 3A due\
  \ to hard deadline, critical path impact, and non-delegable governance requirement.\
  \ Everything else defers or delegates.\n\nYour March 24 note was exactly right:\
  \ \"This is exactly the scenario KB-459 was written for.\" Follow the framework."
