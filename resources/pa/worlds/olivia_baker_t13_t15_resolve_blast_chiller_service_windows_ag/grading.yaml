judge_rubric: >-
  # Evaluation Rubric: Constraint Solving Quality


  ## Constraint Compliance (40 points)

  - **Hard constraints correctly identified** (15 pts): Agent must recognize (1)
  blast chiller required for entremet assembly per KB-437, (2) spring preview
  event April 10th is immovable customer deadline, (3) Sofia availability
  windows for monitoring, (4) technician availability limited to 4 specific
  windows

  - **Constraint satisfaction in solution** (15 pts): Proposed service window
  must satisfy all hard constraints - technician available, Sofia can monitor,
  sufficient time before April 10th preview event for equipment reliability
  verification

  - **No constraint violations** (10 pts): Solution does not schedule service
  during windows where Sofia unavailable without acknowledging coverage gap,
  does not ignore equipment failure risk for customer-facing event


  ## Solution Optimality (30 points)

  - **Minimizes testing disruption** (10 pts): Recognizes April 1st service
  allows entremet test to reschedule to April 2nd (minimal 1-day delay) vs later
  windows that compress timeline more severely

  - **Balances competing priorities** (10 pts): Solution addresses equipment
  reliability risk (Robert's warning about worsening issues), spring preview
  deadline (April 10th), and supplier ordering deadline (April 4th)

  - **Justifies tradeoffs explicitly** (10 pts): Explains why chosen window is
  superior to alternatives (e.g., April 1st provides maximum buffer before April
  10th event, uses Sofia's best availability, still allows April 4th supplier
  order)


  ## Evidence Quality (20 points)

  - **Cross-service data integration** (10 pts): Solution draws on gmail
  (technician availability, Sofia response, supplier deadline), calendar
  (testing schedule conflicts), KB (blast chiller alternatives assessment, risk
  framework), notes (Olivia's own analysis)

  - **Specific record references** (10 pts): Cites concrete details (Robert's
  6-8 hour estimate, Sofia's dental appointment April 3rd, KB-437 entremet
  requirements, April 10th event)


  ## Risk Assessment (10 points)

  - **Identifies failure scenarios** (5 pts): Acknowledges risk of continued
  operation with degraded equipment (40-50% failure probability per KB-438
  framework and Robert's warning)

  - **Proposes contingencies** (5 pts): Addresses what happens if service
  extends beyond estimate or finds additional issues (e.g., backup plan for
  testing, communication with stakeholders)


  ## Scoring Guidelines

  - **90-100**: Recommends April 1st service with April 2nd entremet reschedule,
  explicitly justifies based on Sofia availability + April 10th deadline +
  supplier timing, cites KB articles and specific fixture details

  - **75-89**: Correct service window but weaker justification, missing some
  constraint analysis or risk assessment

  - **60-74**: Identifies viable window but suboptimal choice (e.g., April 7th
  despite proximity to April 10th event), incomplete constraint analysis

  - **40-59**: Proposes window that violates constraints (e.g., April 3rd
  without addressing Sofia unavailability) or fails to address testing schedule
  conflicts

  - **0-39**: No coherent solution, ignores hard constraints, or recommends
  delaying service past April 10th event
reference_solution: >-
  # Reference Solution: Blast Chiller Service Scheduling


  ## Step 1: Extract Testing Schedule and Blast Chiller Dependencies

  - **Action**: `calendar_list_events` for April 2026

  - **Findings**:
    - EVT-413: Entremet assembly test April 1st, 9am-2pm (REQUIRES BLAST CHILLER)
    - EVT-414: Frozen mousse development April 5th, 10am-3pm (REQUIRES BLAST CHILLER)
    - EVT-415: Spring preview event prep April 10th, 8am-6pm (CRITICAL - BLAST CHILLER REQUIRED)

  ## Step 2: Retrieve Technician Availability Windows

  - **Action**: `gmail_list_messages` with equipment/urgent filters, then
  `gmail_get_message` for MSG-5135

  - **Findings**: Robert Kim available:
    - Tuesday, April 1st: 9am-5pm
    - Thursday, April 3rd: 8am-4pm
    - Monday, April 7th: 10am-6pm
    - Wednesday, April 9th: 9am-5pm
    - Service requires 6-8 hours downtime
    - Warning: "intermittent issues tend to get worse quickly"

  ## Step 3: Check Sofia Martinez Monitoring Availability

  - **Action**: `gmail_get_message` for MSG-5137

  - **Findings**:
    - April 1st: ✓ Available all day
    - April 3rd: ✗ Dental appointment until 2pm
    - April 7th: ✓ Available but custom cake pickups 4pm & 5:30pm
    - April 9th: ✗ Farmers market run, back late afternoon

  ## Step 4: Consult KB for Blast Chiller Alternatives and Risk Assessment

  - **Action**: `kb_search` for "blast chiller alternatives" and "equipment
  downtime"

  - **Findings** from KB-437:
    - Entremet assembly REQUIRES blast chiller (-20°F in <15 minutes for layer setting)
    - Walk-in freezer NOT suitable for entremet work or frozen mousse
    - Temperature swings of 8-12°F put entremet and mousse in "high risk" category
  - **Findings** from KB-438:
    - Failure risk assessment framework: degrading equipment + customer event within 2 weeks = bias toward earlier service
    - Small operations should schedule service when failure risk >30% and customer events within 2-week window

  ## Step 5: Identify Supplier Deadline Constraint

  - **Action**: `gmail_get_message` for MSG-5136

  - **Findings**: Thomas Werner volume pricing deadline April 4th (15% discount
  on $800+ order)
    - Requires finalized spring menu testing to confirm ingredient quantities

  ## Step 6: Review Olivia's Own Analysis

  - **Action**: `notes_get` for NOTE-189 and NOTE-190

  - **Findings**: Olivia has already analyzed this and concluded April 1st is
  optimal:
    - Failure risk 40-50% if continued use
    - April 1st allows entremet reschedule to April 2nd
    - Still hits April 4th supplier deadline
    - Sofia's full-day coverage cleanest option
    - Maximum buffer before April 10th spring preview

  ## Step 7: Constraint Satisfaction Analysis


  **Hard Constraints:**

  1. ✓ Technician available (April 1st is one of Robert's windows)

  2. ✓ Sofia available for monitoring (all day April 1st)

  3. ✓ Blast chiller functional before April 10th event (6-day buffer)

  4. ✓ Entremet test can reschedule (April 2nd viable if service completes by
  evening)

  5. ✓ Supplier deadline achievable (April 4th still reachable)


  **Why April 1st is Optimal:**

  - **vs. April 3rd**: Sofia only available after 2pm (coverage risk), less
  buffer before April 10th

  - **vs. April 7th**: Only 3 days before critical April 10th event
  (insufficient reliability verification time), Sofia has customer pickups
  creating coordination complexity

  - **vs. April 9th**: Only 1 day before April 10th event (unacceptable risk),
  Sofia unavailable until afternoon


  ## Step 8: Formulate Recommendation


  **Primary Recommendation**: Schedule blast chiller service for Tuesday, April
  1st, 9am-5pm window


  **Mitigation Actions**:

  1. Reschedule entremet assembly test (EVT-413) from April 1st to Wednesday,
  April 2nd (assuming blast chiller operational by Tuesday evening)

  2. Confirm with Robert Kim for April 1st service window

  3. Confirm Sofia Martinez will monitor service full day April 1st

  4. Finalize spring menu ingredient order with Thomas Werner by April 4th
  (still achievable with April 2nd entremet test)


  **Contingency Plan**:

  - If service extends beyond April 1st or requires parts: Evaluate simplifying
  spring preview menu to components that work with walk-in freezer alternatives
  (per KB-437 low-risk applications)

  - April 5th mousse development remains on schedule as backup test date


  **Risk Justification**:

  - Equipment failure probability during April 10th event prep (if service
  delayed): 40-50% per KB-438 framework and Robert's warning

  - Reputational risk of equipment failure during customer-facing event:
  unacceptable for 12-seat operation

  - Testing delay from April 1st service: minimal (1 day for entremet, other
  tests unaffected)


  ## Expected Communication

  - Email Robert Kim confirming April 1st service window

  - Update calendar: move EVT-413 to April 2nd

  - Brief Sofia Martinez on monitoring responsibilities April 1st
