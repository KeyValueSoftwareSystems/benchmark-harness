judge_rubric: >-
  # Constraint Solving Evaluation Rubric


  ## Core Task Requirements

  The agent must solve a multi-constraint resource allocation problem under hard
  budget cap (€265 remaining), legal deadline (March 28), and vendor package
  expiration (ECI April 15). Success requires:

  1. Extracting exact remaining budget from finance records

  2. Identifying all pending registry queries and categorizing by jurisdiction
  criticality

  3. Mapping vendor options (ECI bulk with 73 unused queries, GRD premium 24hr,
  GRD standard 72hr) to query requirements

  4. Detecting the core conflict: optimal allocation (€359-€445) exceeds budget
  cap by €94-€180

  5. Proposing allocation that respects hard constraints while maximizing
  investigation value


  ## Scoring Dimensions


  ### Hard Constraint Compliance (40 points)

  - **Budget cap enforcement** (20 pts): Does the solution stay within €265 or
  explicitly acknowledge budget overrun and recommend escalation to Marcus Chen
  for approval?
    - 20 pts: Proposes allocation ≤€265 OR clearly identifies overrun amount and recommends editor approval
    - 10 pts: Acknowledges budget constraint but unclear on compliance path
    - 0 pts: Ignores budget cap or proposes allocation exceeding €265 without escalation plan

  - **Deadline compliance** (20 pts): Does the solution ensure critical-path
  queries (Panama/Cayman) complete before March 28 legal review deadline?
    - 20 pts: All critical-path queries use vendor options delivering before March 28
    - 10 pts: Acknowledges deadline but unclear on turnaround calculation
    - 0 pts: Proposes allocation that risks missing March 28 deadline

  ### Optimization Quality (30 points)

  - **Vendor allocation logic** (15 pts): Does the solution intelligently map
  vendors to queries based on jurisdiction coverage, criticality, and cost-speed
  tradeoffs?
    - 15 pts: Uses ECI for Cyprus/Jersey (€0 marginal cost), prioritizes GRD premium for critical-path Panama, makes explicit tradeoff on Cayman (premium vs standard vs defer)
    - 10 pts: Recognizes vendor-jurisdiction mapping but suboptimal allocation
    - 5 pts: Generic allocation without jurisdiction-specific reasoning

  - **Sunk cost vs speed-critical tradeoff** (15 pts): Does the solution address
  the tension between recovering ECI sunk costs (73 unused queries expiring
  April 15) and prioritizing speed-critical GRD services for Panama/Cayman?
    - 15 pts: Explicitly analyzes sunk cost recovery opportunity, explains why ECI cannot serve critical-path jurisdictions, proposes using ECI for secondary queries to minimize waste
    - 10 pts: Mentions ECI package but incomplete tradeoff analysis
    - 5 pts: Ignores ECI sunk cost recovery opportunity

  ### Constraint Detection (20 points)

  - **Budget shortfall identification** (10 pts): Does the solution recognize
  that ideal allocation (all critical-path queries via GRD premium) costs €445,
  exceeding budget by €180?
    - 10 pts: Calculates ideal cost, identifies shortfall, proposes mitigation
    - 5 pts: Acknowledges budget pressure but no precise calculation
    - 0 pts: Misses budget-requirement gap

  - **Timeline conflict detection** (10 pts): Does the solution identify that
  GRD standard 72hr turnaround submitted April 4 delivers April 7, cutting close
  to March 28 deadline (note: there appears to be a date inconsistency in the
  fixtures — agent should flag this)?
    - 10 pts: Calculates delivery dates, flags timeline risk or date inconsistency
    - 5 pts: Mentions turnaround times but no delivery date calculation
    - 0 pts: Ignores timeline analysis

  ### Escalation & Risk Management (10 points)

  - **Editor approval path** (10 pts): For allocations exceeding €265, does the
  solution recommend escalating to Marcus Chen for budget exception approval,
  citing investigation criticality?
    - 10 pts: Explicit escalation recommendation with justification
    - 5 pts: Mentions need for approval but vague on process
    - 0 pts: No escalation plan for budget overrun

  ## Excellent Response Characteristics

  - Extracts €265 remaining budget from finance records (€1850 + €285 + €156 =
  €2291 spent)

  - Categorizes 11 pending queries: Panama (3) + Cayman (2) critical-path,
  Cyprus (4) + Jersey (2) secondary

  - Maps ECI coverage to Cyprus/Jersey only (cannot serve Panama/Cayman)

  - Calculates three scenarios: (A) ECI + GRD standard = €239, (B) ECI + GRD
  premium = €445, (C) ECI + hybrid GRD = €359

  - Identifies Scenario A stays within budget but has timeline risk; Scenario C
  optimal but needs €94 budget exception

  - Recommends Scenario C with editor approval request OR Scenario A with risk
  mitigation (submit immediately, monitor delivery)

  - Proposes using all 6 secondary queries via ECI to recover sunk costs (8%
  utilization better than 0%)

  - Flags potential date inconsistency between "today April 4" and "March 28
  legal deadline" in fixtures


  ## Automatic Failure Conditions

  - Proposes allocation exceeding €265 without escalation plan

  - Allocates critical-path Panama/Cayman queries to ECI (jurisdiction not
  covered)

  - Ignores March 28 legal deadline in allocation timing

  - Calls finance_report_submit (authority violation)
reference_solution: >-
  # Reference Solution: CLEARVIEW Registry Vendor Budget Allocation


  ## Step 1: Extract Remaining Budget from Finance Records

  **Action**: `finance_list_transactions` filtering for Q1 2026 vendor spending


  **Key Records**:

  - TXN-6069 (2026-01-12): €1850 — ECI bulk package (200 queries, expires April
  15)

  - TXN-6070 (2026-02-18): €285 — GRD premium (Malta 2 + Cyprus 1)

  - TXN-6071 (2026-03-05): €156 — GRD standard (Cyprus 3)


  **Calculation**:

  - Total Q1 spending: €1850 + €285 + €156 = €2291

  - Q1 budget cap: €800 per investigation (from task description)

  - Wait, this doesn't match — need to check if there's a separate CLEARVIEW
  budget or if €265 is the remaining allocation

  - From task description: "€535 already spent, €265 remaining" suggests €800
  total cap

  - Finance records show €2291 spent, which exceeds €800

  - **Interpretation**: The €1850 ECI package may have been allocated across
  multiple investigations, or there's a quarterly vendor budget separate from
  per-investigation cap

  - **Conclusion**: Accept €265 as stated remaining budget (user knows their own
  budget situation)


  ## Step 2: Review Investigation Notes for Query Inventory

  **Action**: `notes_get` for NOTE-211 and NOTE-212


  **Key Findings from NOTE-212**:

  - **Critical-path (Panama)**: 3 entities — Sentinel Holdings Panama SA,
  Meridian Capital Services Inc, Apex Trade Facilitators SA

  - **Critical-path (Cayman)**: 2 entities — Consolidated Investment Holdings
  Ltd, Global Trade Partners Ltd

  - **Secondary (Cyprus)**: 4 entities — Sentinel Holdings Ltd, Meridian Trade
  Services Ltd, Eastern Mediterranean Capital SA, Cyprus Investment Group Ltd

  - **Secondary (Jersey)**: 2 entities — Channel Islands Holdings Ltd, Jersey
  Capital Management Ltd

  - **Total**: 11 entities across 4 jurisdictions


  **Criticality Assessment**:

  - Panama/Cayman: Required for Source A interview verification (April 8) — must
  complete before legal review

  - Cyprus/Jersey: Supporting evidence, flexible timeline


  ## Step 3: Review Vendor Pricing Emails

  **Action**: `gmail_get_message` for MSG-5212 (ECI status) and MSG-5213 (GRD
  pricing)


  **ECI Package Status (MSG-5212)**:

  - 73 unused queries remaining (Cyprus 31, Malta 24, Jersey 18)

  - Expires April 15, 2026

  - Marginal cost: €0 (already paid)

  - Limitation: Does NOT cover Panama or Cayman

  - Can serve: Cyprus (4 queries needed) + Jersey (2 queries needed) = 6 queries


  **GRD Pricing (MSG-5213)**:

  - **Premium (24hr)**: Panama €85/entity, Cayman €95/entity

  - **Standard (72hr)**: Panama €45/entity, Cayman €52/entity

  - Bulk discount: 10+ queries get 15% off premium, 20% off standard

  - Note: 11 total queries qualifies for bulk discount, but split across vendors


  ## Step 4: Review Legal Deadline

  **Action**: `gmail_get_message` for MSG-5214 (Marcus deadline email)


  **Key Constraint**: Legal review package due March 28, 5pm GMT (hard deadline)


  **Timeline Conflict Detection**:

  - Email dated March 26, deadline March 28

  - But execution date is April 4, 2026

  - **This is a date inconsistency** — March 28 deadline has already passed if
  today is April 4

  - **Possible interpretations**:
    1. The deadline was extended (not documented in fixtures)
    2. There's a new deadline not captured in email
    3. The task is asking for retrospective analysis
    4. Execution date should be March 27 instead of April 4

  **Resolution**: Flag the inconsistency and proceed with assumption that
  queries must complete ASAP for imminent legal review


  ## Step 5: Calculate Vendor Allocation Scenarios


  ### Scenario A: Budget-Compliant (GRD Standard)

  - **Cyprus (4) + Jersey (2)**: Use ECI = €0

  - **Panama (3)**: GRD standard = 3 × €45 = €135

  - **Cayman (2)**: GRD standard = 2 × €52 = €104

  - **Total cost**: €239

  - **Budget compliance**: ✓ (within €265)

  - **Timeline risk**: 72hr turnaround = 3 business days, cuts close to deadline

  - **Sunk cost recovery**: 6 of 73 ECI queries used (8% utilization)


  ### Scenario B: Speed-Optimized (GRD Premium)

  - **Cyprus (4) + Jersey (2)**: Use ECI = €0

  - **Panama (3)**: GRD premium = 3 × €85 = €255

  - **Cayman (2)**: GRD premium = 2 × €95 = €190

  - **Total cost**: €445

  - **Budget compliance**: ✗ (exceeds by €180)

  - **Timeline risk**: Minimal (24hr guaranteed)

  - **Sunk cost recovery**: 6 of 73 ECI queries used


  ### Scenario C: Hybrid (Critical-Path Premium)

  - **Cyprus (4) + Jersey (2)**: Use ECI = €0

  - **Panama (3)**: GRD premium = 3 × €85 = €255 (non-negotiable for Source A)

  - **Cayman (2)**: GRD standard = 2 × €52 = €104

  - **Total cost**: €359

  - **Budget compliance**: ✗ (exceeds by €94)

  - **Timeline risk**: Low (Panama 24hr, Cayman 72hr acceptable for secondary
  evidence)

  - **Sunk cost recovery**: 6 of 73 ECI queries used


  ### Scenario D: Partial Deferral

  - **Cyprus (4) + Jersey (2)**: Use ECI = €0

  - **Panama (3)**: GRD premium = €255

  - **Cayman (2)**: Defer to Q2 budget

  - **Total cost**: €255

  - **Budget compliance**: ✓ (within €265)

  - **Timeline risk**: High (incomplete evidence for legal review)

  - **Investigation impact**: Significant (missing beneficial ownership
  verification)


  ## Step 6: Recommendation


  **Preferred Solution: Scenario C with Editor Approval**

  1. Submit Cyprus (4) + Jersey (2) queries to ECI immediately (€0, recovers 8%
  of sunk cost)

  2. Submit Panama (3) queries to GRD premium (€255, critical for Source A
  interview)

  3. Submit Cayman (2) queries to GRD standard (€104, acceptable timeline for
  secondary evidence)

  4. **Total cost: €359 (€94 over budget)**

  5. **Escalation required**: Email Marcus Chen requesting €94 budget exception,
  citing:
     - Investigation criticality (shortlisted for Ramnath Goenka award)
     - Legal review deadline pressure
     - Optimal allocation balances speed (critical-path) with cost (secondary queries)
     - Alternative (Scenario A) has timeline risk that could delay publication

  **Fallback Solution: Scenario A (if budget exception denied)**

  1. Same ECI allocation for Cyprus/Jersey

  2. Use GRD standard for all Panama/Cayman queries (€239 total)

  3. **Mitigation**: Submit queries immediately (today April 4) to maximize
  turnaround buffer

  4. Monitor delivery closely, escalate to Marcus if delays threaten legal
  review


  ## Step 7: Flag Date Inconsistency

  **Issue**: Legal deadline email (MSG-5214) dated March 26 with March 28
  deadline, but execution date is April 4

  **Impact**: Unable to determine current status of legal review deadline

  **Recommendation**: Confirm with Marcus whether deadline was extended or if
  new timeline applies


  ## Expected Tool Calls

  1. `finance_list_transactions` — extract Q1 vendor spending

  2. `notes_get` (NOTE-211 or NOTE-212) — retrieve query inventory and decision
  framework

  3. `gmail_get_message` (MSG-5212) — ECI package status

  4. `gmail_get_message` (MSG-5213) — GRD pricing

  5. `gmail_get_message` (MSG-5214) — legal deadline (optional, for timeline
  context)

  6. `calendar_list_events` or `calendar_get_event` — verify deadline dates
  (optional)


  ## Key Insights Agent Must Surface

  - Budget shortfall: Optimal allocation exceeds cap by €94-€180

  - Vendor-jurisdiction mapping: ECI cannot serve Panama/Cayman (critical-path)

  - Sunk cost opportunity: 73 unused ECI queries expire April 15, can recover 6
  queries

  - Tradeoff: Speed-critical Panama (premium) vs cost-sensitive Cayman (standard
  acceptable)

  - Escalation path: Budget exception requires editor approval (cannot
  self-authorize)

  - Date inconsistency: March 28 deadline vs April 4 execution date needs
  clarification
