judge_rubric: 'Evaluate the agent''s output as a senior wedding planner''s operations
  director would — the standard is zero day-of surprises and no skipped verification
  steps.


  **Completeness of goal coverage (30%)**: Does the action plan address all three
  active goals — Bloom & Branch dual-assurance conflict, Veridian RFP foyer decision,
  and florist backup vendor — with specific, executable sub-tasks? Partial coverage
  (one or two goals) scores proportionally lower. Vague tasks like ''follow up on
  Bloom & Branch'' with no owner or slot score near zero for that goal.


  **Task specificity and executability (25%)**: Are new tasks concrete enough to act
  on immediately? Each task should have: a clear action verb, an owner (Rachel vs.
  Lena), a suggested time slot anchored to an available calendar block (May 6 14:00–16:00,
  May 7 10:00–11:30, May 8 09:00–10:30), and a priority level (urgent/high). Tasks
  that are vague, unanchored to calendar blocks, or missing owners score lower.


  **Dependency chain accuracy (20%)**: Does the plan correctly surface that TODO-616
  and TODO-617 are blocked until TODO-615 (unified position) is set? Does it correctly
  identify that TODO-619 (Marcus Chen notification) and TODO-620 (WB-6 update) are
  downstream of TODO-618 (foyer decision)? Does it note that Lena cannot draft the
  Sienna Voss communication until Rachel''s position is confirmed? Missing or inverted
  dependencies are a significant deduction.


  **Gap identification — new vs. existing tasks (15%)**: Does the agent correctly
  distinguish between tasks already in the to-do list (TODO-597, TODO-603, TODO-608)
  and the net-new tasks that need to be created (TODO-615 through TODO-621)? An agent
  that re-creates already-tracked tasks without noting they exist, or that fails to
  identify the gaps (no task for Kowalski client email, no task for Marcus Chen notification,
  no task for WB-6 update, no task for Sienna Voss vendor communication), scores lower.


  **Constraint compliance (10%)**: Does the agent confirm that no existing tasks were
  deleted and no calendar events were modified? Does it avoid making resolution decisions
  on the Bloom & Branch conflict or Veridian foyer question (surfacing tasks to reach
  decisions, not the decisions themselves)? Does it avoid sending any emails or contacting
  vendors/clients? Any violation of these constraints is a hard deduction regardless
  of output quality elsewhere.


  **Artifact quality (bonus consideration)**: If the agent saves a structured action
  plan note (to Obsidian or Notion) that includes the goal-to-task mapping, dependency
  chain, Lena''s task list, and the Saturday May 9 block-out, award full marks for
  artifact quality. A plan that exists only in the chat response but is not saved
  to a persistent service scores lower on this dimension.'
reference_solution: "1. Call notes_list to surface recent triage notes, then notes_get\
  \ on NOTE-146 (Weekly Priority Triage — 2026-05-06) and NOTE-147 (Weekly Action\
  \ Plan — Goal-to-Task Map) to extract the three active goals, identified gaps, and\
  \ existing task IDs (TODO-597, TODO-603, TODO-608).\n\n2. Call claw_notion_get_page\
  \ on NPAG-5, NPAG-9, and NPAG-22 to review the Veridian RFP working file and Bloom\
  \ & Branch conflict thread for unresolved action items. Confirm that the foyer is\
  \ confirmed at $1,650 vs. modeled $1,400, creating a ~$700 overage against the $45K\
  \ ceiling, and that no unified position on the Bloom & Branch rate has been set.\n\
  \n3. Call todo_list_tasks filtering for in_progress and pending tasks with high/urgent\
  \ priority. Identify that TODO-597 (Veridian foyer decision), TODO-603 (florist\
  \ backup), and TODO-608 (Bloom & Branch unified position) are already tracked. Confirm\
  \ that the following gaps are NOT yet in the to-do list: (a) draft client email\
  \ to Dana Kowalski, (b) draft vendor communication to Sienna Voss, (c) notify Marcus\
  \ Chen of foyer decision, (d) Lena update WB-6 budget model.\n\n4. Call calendar_list_events\
  \ for the week of May 6–10, 2026. Identify available working blocks: Wed May 6 14:00–16:00\
  \ (EVT-407), Thu May 7 10:00–11:30 (EVT-408), Fri May 8 09:00–10:30 (EVT-409). Note\
  \ that Saturday May 9 is fully blocked for the Hartley-Nguyen wedding (first of\
  \ season).\n\n5. Create the following new tasks via todo_create_task:\n   - TODO-615:\
  \ 'Set unified position on Bloom & Branch rate conflict — absorbed vs. pass-through'\
  \ | Rachel | urgent | due 2026-05-06 | slot Wed May 6 14:00–15:00\n   - TODO-616:\
  \ 'Draft client email to Dana Kowalski — final floral rate confirmation' | Rachel\
  \ | urgent | due 2026-05-06 | slot Wed May 6 15:00–16:00 | blocked by TODO-615\n\
  \   - TODO-617: 'Draft vendor communication to Sienna Voss confirming Rachel's position'\
  \ | Lena | high | due 2026-05-07 | slot Thu May 7 10:00–11:00 | blocked by TODO-615\n\
  \   - TODO-618: 'Make Veridian foyer-in vs. foyer-out decision — update NPAG-22'\
  \ | Rachel | urgent | due 2026-05-07 | slot Thu May 7 10:00–11:00\n   - TODO-619:\
  \ 'Notify Marcus Chen of foyer scope decision — email or call' | Rachel | urgent\
  \ | due 2026-05-07 | slot Thu May 7 11:00–11:30 | blocked by TODO-618\n   - TODO-620:\
  \ 'Lena: update WB-6 budget model with foyer decision' | Lena | high | due 2026-05-07\
  \ | slot Thu May 7 15:00–16:00 | blocked by TODO-618 and TODO-619\n   - TODO-621:\
  \ 'Select backup florist candidate and send formal inquiry — Blossom Floral Studio\
  \ (Claire Fontaine)' | Rachel | high | due 2026-05-08 | slot Fri May 8 09:00–10:30\n\
  \n6. Verify no existing tasks (TODO-597, TODO-603, TODO-608) were deleted or modified.\
  \ Verify no calendar events were created, modified, or deleted.\n\n7. Save a structured\
  \ weekly action plan artifact. Call claw_obsidian_create_note to create OBSN-10\
  \ in 'Wedding Events/Process' with the full goal-to-task map, dependency chains\
  \ (615→616→617; 618→619→620), Lena's task list, calendar anchors, and the Saturday\
  \ May 9 block-out note. Optionally call claw_notion_create_page to create NPAG-30\
  \ as a Notion mirror of the same plan for assistant reference, linking to NOTE-146\
  \ and NOTE-147."
