judge_rubric: '# LLM Judge Rubric


  ## Core Evaluation Criteria


  ### 1. Hard Constraint Compliance (Critical — failure = 0 score)

  - **9-hour calendar capacity**: Did the agent verify available interview time March
  8-14 and ensure the selected interview combination does not exceed 9 total hours?

  - **Two-source standard**: Did the agent ensure section 4 material claims have two
  independent sources, not leaving any claim with single-source verification?

  - **Irreversible deadlines**: Did the agent respect source availability windows
  (Leung departure March 10, Mendez relocation March 12, Okonkwo document access uncertainty)?


  ### 2. Optimization Quality (High weight)

  - **Corroboration coverage maximization**: Did the agent identify which 3-source
  combination provides the best two-source verification coverage for section 4 material
  claims?

  - **Deadline urgency weighting**: Did the agent correctly prioritize sources with
  imminent/irreversible deadlines (Leung, Mendez, Okonkwo) over flexible sources (Zhao
  available through Q2)?

  - **Combinatorial reasoning**: Did the agent evaluate multiple 3-source combinations
  and select based on dual criteria (corroboration coverage × deadline feasibility)?


  ### 3. Investigation Vault Integration (Medium weight)

  - **Corroboration matrix retrieval**: Did the agent search/retrieve the section
  4 corroboration matrix from Obsidian to understand which sources verify which material
  claims?

  - **Decision audit trail**: Did the agent document the interview selection rationale
  in the investigation vault decision log for legal review?


  ### 4. Execution Completeness (Medium weight)

  - **Calendar scheduling**: Did the agent schedule the three selected interviews
  with prep/debrief blocks within the March 8-14 window?

  - **Todo task creation**: Did the agent create todo items for one-pager prep and
  post-interview write-ups for each selected source?

  - **Editor notification**: Did the agent draft a workmail message to the editor
  explaining the prioritization decision and expected corroboration status?


  ### 5. Journalistic Standards Alignment (Medium weight)

  - **Two independent sources per material claim**: Did the solution uphold Hannah''s
  core standard that every material claim requires two independent sources?

  - **No premature draft sharing**: Did the agent avoid sharing investigation drafts
  over email (drafts live in CMS, links only)?

  - **Audit trail preservation**: Did the agent maintain decision documentation suitable
  for legal review?


  ## Scoring Guidance


  **Excellent (0.9–1.0)**: Agent identifies optimal 3-source combination (likely Leung
  + Okonkwo + Mendez based on deadline urgency and corroboration coverage), verifies
  9-hour capacity compliance, schedules interviews respecting availability windows,
  documents decision rationale in vault, and notifies editor via workmail.


  **Good (0.7–0.89)**: Agent selects a reasonable 3-source combination respecting
  hard constraints, schedules interviews, and documents decision, but may miss some
  optimization nuance (e.g., not fully articulating why Zhao is deprioritized despite
  providing critical ownership chain corroboration).


  **Adequate (0.5–0.69)**: Agent respects hard constraints (capacity, two-source standard)
  but makes suboptimal source selection (e.g., includes Zhao over a deadline-constrained
  source) or incomplete execution (missing decision log or editor notification).


  **Poor (0.3–0.49)**: Agent violates one hard constraint (e.g., schedules 4 interviews
  exceeding capacity, or selects combination leaving section 4 claims single-sourced)
  but otherwise attempts reasonable approach.


  **Failing (<0.3)**: Agent violates multiple hard constraints, makes arbitrary source
  selection without corroboration analysis, or fails to execute scheduling and documentation
  steps.'
reference_solution: "# Reference Solution\n\n## Step 1: Retrieve Section 4 Corroboration\
  \ Matrix\n- Use `claw_obsidian_search` with query \"section 4 corroboration\" or\
  \ \"material claims matrix\" in the shipping sanctions investigation vault\n- Expected\
  \ to find note mapping which sources can verify which material claims (e.g., \"\
  Leung verifies claims 4.1, 4.3, 4.5; Okonkwo verifies 4.2, 4.4, 4.5; Mendez verifies\
  \ 4.1, 4.2, 4.6; Zhao verifies 4.3, 4.7\")\n- Identify that optimal coverage requires\
  \ selecting sources whose claim coverage overlaps to achieve two-source verification\n\
  \n## Step 2: Verify Calendar Capacity\n- Use `calendar_list_events` for March 8-14,\
  \ 2026 date range\n- Expected to find legal review commitments consuming significant\
  \ blocks, leaving exactly 9 hours available for interviews across the week\n- Confirm\
  \ hard constraint: total interview time (including prep/debrief) cannot exceed 9\
  \ hours\n\n## Step 3: Extract Source Deadline Constraints\n- Use `contacts_search`\
  \ or `contacts_get` to retrieve contact records for Marcus Leung, Sarah Okonkwo,\
  \ Vincent Zhao, Dr. Patricia Mendez\n- Expected to find:\n  - **Marcus Leung**:\
  \ Departing Hong Kong March 10 (imminent, irreversible)\n  - **Sarah Okonkwo**:\
  \ Document access uncertain post-merger (time-sensitive, may lose access)\n  - **Dr.\
  \ Patricia Mendez**: Relocating to Geneva March 12 (imminent, irreversible)\n  -\
  \ **Vincent Zhao**: Available through Q2 2026 (flexible, no urgency)\n- May also\
  \ check gmail for correspondence confirming these constraints\n\n## Step 4: Calculate\
  \ Corroboration Coverage\n- Evaluate all possible 3-source combinations (4 choose\
  \ 3 = 4 combinations):\n  1. Leung + Okonkwo + Mendez\n  2. Leung + Okonkwo + Zhao\n\
  \  3. Leung + Mendez + Zhao\n  4. Okonkwo + Mendez + Zhao\n- For each combination,\
  \ count how many section 4 material claims achieve two-source verification\n- Expected\
  \ optimal: Leung + Okonkwo + Mendez provides maximum two-source coverage for section\
  \ 4 claims\n\n## Step 5: Apply Deadline Urgency Filter\n- Eliminate combinations\
  \ requiring interviews after source availability windows close\n- Zhao is flexible\
  \ (available through Q2), so any combination including Zhao is feasible but deprioritizes\
  \ deadline-constrained sources\n- Leung, Okonkwo, Mendez all have imminent/irreversible\
  \ constraints\n\n## Step 6: Select Optimal Combination\n- **Decision**: Prioritize\
  \ Leung + Okonkwo + Mendez\n- **Rationale**: Maximizes corroboration coverage while\
  \ respecting all three imminent deadline constraints; Zhao's critical ownership\
  \ chain corroboration (claim 4.7) can be addressed in follow-up reporting since\
  \ he remains available through Q2\n- Document this decision rationale in investigation\
  \ vault\n\n## Step 7: Schedule Interviews\n- Use `calendar_create_event` to schedule\
  \ three interviews within March 8-14 window:\n  - Marcus Leung: Before March 10\
  \ (e.g., March 9, 2-hour block including prep/debrief)\n  - Sarah Okonkwo: Early\
  \ in window given merger uncertainty (e.g., March 8, 3-hour block)\n  - Dr. Patricia\
  \ Mendez: Before March 12 (e.g., March 11, 3-hour block)\n- Total: 8 hours (within\
  \ 9-hour cap)\n- Use `todo_create_task` for each interview:\n  - Prep one-pager\
  \ (due 24h before interview)\n  - Post-interview write-up (due 24h after interview)\n\
  \n## Step 8: Notify Editor\n- Use `workmail_send_message` to draft message to editor\
  \ explaining:\n  - Selected Leung + Okonkwo + Mendez based on corroboration coverage\
  \ analysis\n  - Deprioritized Zhao due to Q2 availability flexibility vs. imminent\
  \ deadlines for other three sources\n  - Expected corroboration status: section\
  \ 4 claims will achieve two-source standard except claim 4.7 (Zhao-only), which\
  \ can be addressed in follow-up\n  - Interview schedule respects 9-hour capacity\
  \ constraint\n- Use `claw_obsidian_create_note` or `claw_obsidian_update_note` to\
  \ add decision log entry in investigation vault for legal review audit trail\n\n\
  ## Expected Outcome\n- Three interviews scheduled within capacity and deadline constraints\n\
  - Section 4 material claims achieve maximum feasible two-source corroboration given\
  \ resource constraints\n- Decision rationale documented for legal review\n- Editor\
  \ informed of prioritization logic and expected coverage gaps"
