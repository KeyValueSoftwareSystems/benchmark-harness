judge_rubric: 'Evaluate the response from He Meilan''s perspective as a detail-oriented
  full-time mother (ISFJ) managing two children''s activities:


  **Excellent (9-10)**: The agent correctly identifies March 21 as the official deadline
  from the school email (MSG-5215), recognizes that March 16 was Teacher Chen''s suggested
  early payment date for internal planning (not a hard deadline), explains the parent
  group confusion as misinterpretation of the teacher''s recommendation, and crucially
  recognizes that BOTH dates have already passed (today is April 4, 2026). The response
  should recommend immediate action: contacting Teacher Chen urgently to ask if late
  payment is still possible, apologizing for the delay, and offering to pay immediately
  if accepted. Should acknowledge the stress this causes for a parent who is meticulous
  about children''s activities and express concern about whether Dabao can still participate
  in the April 15 outing. Demonstrates understanding that missing this payment could
  exclude Dabao from a social/educational experience, which directly impacts the child''s
  health and growth.


  **Good (7-8)**: Correctly identifies the official March 21 deadline and recognizes
  the March 16 date as a teacher suggestion, but may not fully emphasize the urgency
  of the situation (both dates have passed) or may not provide clear next steps for
  late payment. Shows cross-referencing across email, WeChat, and notes but could
  be clearer about the timeline problem.


  **Adequate (5-6)**: Identifies conflicting dates and attempts to determine which
  is authoritative, but may treat March 16 and March 21 as both potentially valid
  hard deadlines rather than understanding March 16 was a soft suggestion. May not
  clearly recognize that both dates are in the past relative to April 4 execution
  date. Provides some action plan but lacks urgency appropriate to the situation.


  **Poor (3-4)**: Fails to clearly distinguish between official deadline and teacher''s
  early payment suggestion, or recommends waiting/monitoring rather than immediate
  action despite both dates having passed. May rely too heavily on parent group hearsay
  without verifying against official sources. Does not adequately address the risk
  to Dabao''s participation.


  **Unacceptable (1-2)**: Misidentifies the authoritative deadline, suggests the deadline
  hasn''t passed yet, or recommends actions that would further delay payment (e.g.,
  ''wait and see'', ''pay by March 16''). Fails to recognize the time-sensitive nature
  or the impact on the child''s experience.'
reference_solution: '**Step 1**: Search gmail for official school communications about
  spring outing using gmail_list_messages with query filters for ''spring outing''
  or sender ''chen.fang@elite-edu.example''. Retrieve MSG-5215 using gmail_get_message.


  **Step 2**: From MSG-5215, extract key facts: Official deadline is March 21, 2026;
  payment amount is 180 RMB; sent by Teacher Chen Fang on March 28 (note: this email
  was sent AFTER the March 21 deadline it mentions, which is unusual and may indicate
  a deadline extension or error in the email date).


  **Step 3**: Search WeChat parent group using claw_wechat_search_messages in chat
  ''WCC-0036'' (Grade 4 Class 2 parents group) for messages about spring outing deadline.
  Review messages showing parents discussing March 16 as the deadline based on what
  they heard from Teacher Chen verbally.


  **Step 4**: Use notes_list and notes_get to retrieve NOTE-266 and NOTE-267. NOTE-266
  (March 27) records Teacher Chen''s verbal reminder: ''Please try to pay by March
  16 if possible, so we can finalize headcount early'' with explicit note that ''official
  deadline is later.'' NOTE-267 (March 30) shows He Meilan''s own analysis recognizing
  both March 16 and March 21 have passed.


  **Step 5**: Cross-reference all three sources:

  - Official email (MSG-5215): March 21 is the formal deadline

  - Teacher Chen verbal (NOTE-266): March 16 is a suggested early payment date for
  planning purposes, not the hard deadline

  - Parent WeChat group: Parents misinterpreted Teacher Chen''s early payment suggestion
  as the actual deadline


  **Step 6**: Recognize critical timeline issue: Today is April 4, 2026. Both March
  16 AND March 21 have passed. The spring outing is scheduled for April 15 (11 days
  away).


  **Step 7**: Determine action plan: Since both potential deadlines have passed, He
  Meilan must contact Teacher Chen immediately via gmail_send_message to chen.fang@elite-edu.example
  asking: (a) if late payment is still accepted, (b) apologizing for the confusion
  and delay, (c) offering to pay immediately if possible, (d) confirming Dabao can
  still participate.


  **Step 8**: Optionally create calendar_create_event reminder to follow up if no
  response within 24 hours, and prepare to make the 180 RMB payment immediately once
  confirmation is received.


  **Key insight**: This is not about choosing between March 16 and March 21 — it''s
  about recognizing that the agent is being asked on April 4 about deadlines that
  have already passed, requiring immediate remedial action rather than deadline planning.'
