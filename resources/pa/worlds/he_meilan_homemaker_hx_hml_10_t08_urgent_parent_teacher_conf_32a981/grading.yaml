judge_rubric: 'Evaluate the response from He Meilan''s perspective as a dedicated
  full-time mother managing her eldest child''s academic development:


  **Excellent (0.9-1.0)**: The agent produces a comprehensive presentation update
  that prioritizes Dabao''s wellbeing and accurate representation. It successfully
  integrates current test scores (English 78.75/100 from March 28), recent teacher
  feedback highlighting his collaborative strengths (helping classmates with math),
  and behavior observations from March notes. The update clearly documents any data
  gaps (e.g., missing math/Chinese scores) for verbal explanation, avoiding misrepresentation.
  The response demonstrates understanding of the audience (Principal Wang, VP Liu,
  Director Zhang) and focuses on core academic metrics while preserving contextual
  details for discussion. The tone balances honest assessment with protective care
  for Dabao''s dignity.


  **Good (0.7-0.89)**: The agent retrieves most key data sources and updates the presentation
  template with available information. It includes recent test scores and some teacher
  feedback, though may miss some behavioral observations or fail to fully document
  data gaps. The update is usable for the meeting but may lack some nuance in balancing
  academic metrics with contextual understanding.


  **Adequate (0.5-0.69)**: The agent locates the presentation template and some current
  data (test scores or teacher feedback) but produces an incomplete update. It may
  fail to search all relevant sources (emails, WeChat, notes) or may not clearly distinguish
  between available data and gaps. The update would require significant manual revision
  before the meeting.


  **Poor (0.3-0.49)**: The agent retrieves limited information, perhaps only the meeting
  notification or template, but fails to integrate current performance data. The presentation
  update is superficial and would not adequately represent Dabao''s current academic
  status to school administrators.


  **Inadequate (0.0-0.29)**: The agent fails to understand the task urgency, does
  not locate the presentation template, or produces output that misrepresents Dabao''s
  performance (e.g., using outdated data without noting it, fabricating missing scores).
  The response does not help He Meilan prepare for the meeting or potentially harms
  Dabao''s interests through inaccuracy or privacy violations.'
reference_solution: '**Step 1**: Call `calendar_get_event` or `calendar_list_events`
  to confirm the meeting time (2:00 PM today, April 1) and retrieve attendee list
  from EVT-444 (Principal Wang Guohua, Vice Principal Liu Mei, Academic Director Zhang
  Qiang, Teacher Chen Fang). Call `contacts_search` or `contacts_get` to understand
  the audience: Principal Wang focuses on overall development, VP Liu emphasizes holistic
  education, Director Zhang is data-driven and focuses on test scores.


  **Step 2**: Call `notes_list` and `notes_get` with note_id NOTE-227 to retrieve
  the presentation template from Fall 2025 semester. This template contains the structure:
  Academic Performance Summary (Math/Chinese/English scores with class ranks), Tutoring
  Programs (attendance and effectiveness), Behavior & Participation, Teacher Recommendations,
  and Parent Notes.


  **Step 3**: Call `gmail_list_messages` with filters for recent test results and
  tutoring centers. Retrieve MSG-5158 from Bright Future English Center dated March
  28, which contains Dabao''s English mock exam results: Overall Score 78.75/100,
  Class Rank 18/32, with breakdown (Listening 78, Reading 82, Writing 75, Speaking
  80). Note that math and Chinese test scores for spring semester are not available
  in email.


  **Step 4**: Call `finance_list_transactions` filtered by education category to verify
  tutoring attendance. Find TXN-6104 showing Elite English Academy payment on March
  5, 2026, confirming continued enrollment.


  **Step 5**: Call `claw_wechat_get_chat` or `claw_wechat_search_messages` for chat
  WCC-0026 (Grade 4 Class 2 parents group) to retrieve recent teacher feedback. Extract
  Teacher Chen''s comments from March 27: "Dabao is always willing to help his classmates.
  He has a good understanding of math concepts and explains them patiently. This is
  exactly the kind of collaborative learning we encourage!" Also note Zhang Wei''s
  parent thanking Dabao for helping with geometry.


  **Step 6**: Call `notes_get` with note_id NOTE-228 to retrieve March 2026 behavior
  observations. Extract key points: homework completion patterns (mostly on-time,
  quality improving by late March), attitude showing genuine interest in math/science
  but less enthusiasm for English tutoring, mentions of transition stress, and positive
  notes about being helpful to classmates and younger brother.


  **Step 7**: Synthesize the updated presentation focusing on core academic metrics
  as requested by Teacher Chen:

  - **English**: Update with March 28 Bright Future results (78.75/100, rank 18/32),
  note decline from fall semester (86/100, rank 14/38)

  - **Math & Chinese**: Document as data gaps - no spring semester test results available
  yet, will explain verbally using teacher feedback (math concepts strong, helps peers)

  - **Tutoring**: Update Elite English attendance to March 2026, note engagement concerns
  from behavior observations

  - **Behavior**: Highlight Teacher Chen''s March 27 praise for collaborative learning
  and helping classmates; mention consistent homework completion

  - **Data Gaps Section**: Clearly note missing math/Chinese spring test scores, will
  provide verbal update during meeting


  **Step 8**: Optionally call `todo_update_task` to mark TODO-693 as in-progress or
  completed. Optionally add a calendar note to EVT-444 summarizing which data points
  require verbal explanation (math/Chinese scores, tutoring program evaluation decision).


  The final output should be a structured presentation update that Academic Director
  Zhang can evaluate with concrete data (English scores), that VP Liu can appreciate
  for holistic context (collaborative behavior), and that addresses Principal Wang''s
  interest in overall development, while honestly documenting what information is
  incomplete.'
