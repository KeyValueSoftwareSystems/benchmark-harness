judge_rubric: >-
  # Evaluation Rubric: Parallel Workflow Execution with Conflict Analysis


  ## Excellent (0.9-1.0)

  - **Conflict detection**: Correctly identifies Summary_Dashboard,
  Validation_Checks, and Sensitivity_Tables as shared-resource bottlenecks
  requiring serialization due to cross-bank formula dependencies and write
  conflicts

  - **Phased execution design**: Proposes clear multi-phase plan with Phase 1
  (parallel bank-tab updates), Phase 2 (serial Summary_Dashboard aggregation),
  Phase 3 (serial Sensitivity_Tables regeneration), with explicit rationale for
  each serialization decision

  - **Dependency mapping**: Accurately traces read-after-write dependencies
  (e.g., Sensitivity_Tables reads from Summary_Dashboard, so Phase 3 must wait
  for Phase 2 completion)

  - **Task assignments**: Sends detailed workmail to Sofia Romano and junior
  analysts with explicit tab ownership, conflict warnings about touching shared
  tabs during Phase 1, and checkpoint schedule

  - **Isolation strategy**: Evaluates Git worktree feasibility for Phase 4
  validation checks (read-only parallel execution) with cost-benefit analysis

  - **Compliance awareness**: Maintains audit trail considerations, warns
  against parallel writes that would corrupt formulas and violate research
  documentation standards

  - **Temporal planning**: Creates calendar blocks for phase execution windows
  and sync checkpoints at phase boundaries


  ## Good (0.7-0.89)

  - Identifies most shared-resource bottlenecks (Summary_Dashboard,
  Sensitivity_Tables) but may miss Validation_Checks or not fully explain
  formula dependency chains

  - Proposes phased execution with parallel and serial phases but rationale for
  serialization decisions may be incomplete or lack technical depth

  - Sends task assignments with conflict warnings but may not emphasize
  checkpoint discipline or provide explicit "do not touch" guidance for shared
  tabs

  - Considers isolation strategies but cost-benefit analysis may be superficial

  - Creates some calendar structure but may not align checkpoints with phase
  boundaries


  ## Adequate (0.5-0.69)

  - Identifies at least one major shared-resource bottleneck (Summary_Dashboard)
  requiring serialization

  - Proposes some form of phased execution but phases may not be optimally
  structured or rationale may be vague

  - Sends basic task assignments but conflict warnings may be generic or miss
  critical details

  - May not evaluate isolation strategies or provide only cursory analysis

  - Calendar planning may be minimal or misaligned with execution phases


  ## Poor (0.3-0.49)

  - Recognizes need for coordination but does not clearly identify which
  resources require serialization

  - Proposes execution plan but lacks clear phase structure or serialization
  logic

  - Communication to team is minimal or does not address conflict risks

  - Does not consider isolation strategies

  - Minimal or no calendar planning


  ## Failing (0.0-0.29)

  - Does not identify shared-resource bottlenecks or incorrectly suggests full
  parallelization without conflict analysis

  - No coherent execution plan or proposes approach that would create merge
  conflicts

  - Does not communicate plan to team or sends incomplete/misleading guidance

  - Ignores compliance and data integrity risks

  - No temporal planning


  ## Key Evaluation Criteria

  1. **Correctness of conflict analysis**: Does the agent correctly identify
  Summary_Dashboard, Validation_Checks, and Sensitivity_Tables as serialization
  bottlenecks due to cross-bank formula dependencies?

  2. **Quality of phased execution design**: Are phases logically structured
  with parallel work (Phase 1 bank tabs) separated from serial work (Phases 2-3
  aggregation/sensitivity)?

  3. **Clarity of serialization rationale**: Does the agent explain WHY certain
  tasks must be serialized (formula dependencies, read-after-write hazards,
  write conflicts)?

  4. **Effectiveness of team communication**: Does the workmail provide explicit
  tab assignments, conflict warnings, and checkpoint schedule?

  5. **Feasibility of isolation strategies**: Does the agent evaluate Git
  worktree approach for Phase 4 validation with realistic cost-benefit analysis?

  6. **Compliance and safety awareness**: Does the agent maintain audit trail
  considerations and warn against operations that would corrupt the master
  workbook?
reference_solution: >-
  # Reference Solution: Parallel Q1 Earnings Model Updates


  ## Step 1: Retrieve and analyze EU_Banks_Coverage workbook structure

  - Call `sheet_list_workbooks` to find WB-38 (EU_Banks_Coverage.xlsx)

  - Call `sheet_open` on WB-38 to examine sheet structure

  - Identify workbook components:
    - **Independent write targets**: UniCredit, Intesa, BPM, BPER tabs (each analyst can own one tab with zero cross-tab write dependencies)
    - **Shared bottlenecks**: Summary_Dashboard (aggregates cross-bank metrics via VLOOKUP formulas), Validation_Checks (runs sum checks across all bank tabs), Sensitivity_Tables (cross-bank valuation scenarios with formulas reading from all bank tabs)
    - **Read-only resources**: Historical_Data, Methodology_Notes

  ## Step 2: Retrieve pending Q1 update tasks

  - Call `todo_list_tasks` to find TODO-719, TODO-720, TODO-721, TODO-722

  - Note that TODO-719 (workbook structure analysis) and TODO-720 (conflict
  matrix construction) are marked completed

  - TODO-721 (phased execution plan design) is marked completed

  - TODO-722 (send task assignments) is in_progress


  ## Step 3: Review existing conflict analysis

  - Call `sheet_open` on WB-39 (Q1_Model_Update_Conflict_Matrix) to retrieve
  existing conflict analysis

  - Review Read_Write_Footprint sheet: Confirms UniCredit/Intesa/BPM/BPER
  updates are independent, but all require Summary_Dashboard write access
  (conflict)

  - Review Conflict_Matrix sheet: Confirms high-severity write conflicts between
  bank updates and Summary_Dashboard aggregation

  - Review Execution_Plan sheet: Confirms 4-phase structure already designed


  ## Step 4: Review detailed execution plan in notes

  - Call `notes_list` to find NOTE-178 (Q1 Earnings Model Update - Parallel
  Execution Plan & Conflict Resolution)

  - Call `notes_get` on NOTE-178 to retrieve full execution plan with rationale

  - Key insights from note:
    - Phase 1 (parallel): 4 independent bank-tab updates save 12 hours vs serial execution
    - Phase 2 (serial): Summary_Dashboard aggregation MUST be serial because Sensitivity_Tables reads from it (read-after-write dependency)
    - Phase 3 (serial): Sensitivity_Tables regeneration MUST wait for Phase 2 completion
    - Phase 4 (parallel with isolation): Validation checks can run in parallel on Git worktree copies (read-only, 30-second creation cost per worktree)
    - Critical serialization rationale: Summary_Dashboard and Sensitivity_Tables have complex cross-tab formula dependencies; concurrent writes would corrupt formulas and require 12-15 hours of manual reconciliation

  ## Step 5: Send task assignments with conflict warnings

  - Call `workmail_send_message` to sofia.romano@milanbank.eu,
  analyst1@milanbank.eu, analyst2@milanbank.eu, analyst3@milanbank.eu

  - Message content should include:
    - Phase 1 task assignments: Sofia (UniCredit), Analyst 1 (Intesa), Analyst 2 (BPM), Analyst 3 (BPER)
    - **Critical conflict warning**: DO NOT TOUCH Summary_Dashboard, Sensitivity_Tables, or Validation_Checks during Phase 1 (would create race conditions and formula corruption)
    - Phase 2 assignment: Sofia Romano only (serial execution of Summary_Dashboard aggregation)
    - Phase 3 assignment: Lucia Moretti only (serial execution of Sensitivity_Tables regeneration)
    - Phase 4 assignment: All analysts (parallel validation on Git worktree copies)
    - Checkpoint schedule: Phase 1 ends 1pm March 30, Phase 2 checkpoint 3:30pm March 30, Phase 3 checkpoint 6pm March 30, Phase 4 checkpoint 10am March 31
    - Rationale for serialization: Summary_Dashboard aggregates data from all bank tabs via formulas; concurrent access would create read-after-write hazards

  ## Step 6: Create calendar blocks for phased execution

  - Call `calendar_create_event` for Phase 1: March 30, 9am-1pm, attendees:
  lucia.moretti@milanbank.eu, sofia.romano@milanbank.eu, analyst1@milanbank.eu,
  analyst2@milanbank.eu, analyst3@milanbank.eu

  - Call `calendar_create_event` for Phase 1 Checkpoint: March 30, 1pm-1:30pm

  - Call `calendar_create_event` for Phase 2: March 30, 2pm-3:30pm, attendees:
  sofia.romano@milanbank.eu, lucia.moretti@milanbank.eu

  - Call `calendar_create_event` for Phase 2 Checkpoint: March 30, 3:30pm-4pm

  - Call `calendar_create_event` for Phase 3: March 30, 4pm-6pm, attendee:
  lucia.moretti@milanbank.eu

  - Call `calendar_create_event` for Phase 4: March 31, 9am-10am, all analysts


  ## Step 7: Update TODO-722 to mark task assignments complete

  - Call `todo_update_task` on TODO-722 to change status from "in_progress" to
  "completed"


  ## Key Decision Points

  1. **Why Phase 1 is parallel-safe**: UniCredit/Intesa/BPM/BPER tabs are
  independent namespaces with zero cross-tab write dependencies. Each analyst
  owns exactly one tab.

  2. **Why Phase 2 must be serial**: Summary_Dashboard writes to cells that
  Sensitivity_Tables reads. Concurrent access would create read-after-write
  hazards (stale data).

  3. **Why Phase 3 must be serial**: Sensitivity_Tables formulas depend on
  Summary_Dashboard completion. Parallel execution would read incomplete
  aggregation data.

  4. **Why Phase 4 can be parallel with isolation**: Validation checks are
  read-only. Git worktrees provide isolated copies (30-second creation cost)
  with no merge conflict risk if analysts follow read-only protocol.

  5. **Critical safety constraint**: Must not allow parallel writes to
  Summary_Dashboard or cross-bank valuation formulas - would corrupt master
  workbook and require hours of manual reconciliation, violating research
  documentation standards.


  ## Expected Artifact

  The agent should produce:

  1. Clear identification of shared-resource bottlenecks (Summary_Dashboard,
  Validation_Checks, Sensitivity_Tables) with technical rationale (cross-bank
  formula dependencies, write conflicts)

  2. Phased execution plan with explicit serialization decisions and dependency
  mapping

  3. Workmail to team with task assignments, conflict warnings, and checkpoint
  schedule

  4. Calendar blocks for phase execution windows and sync checkpoints

  5. Documentation of isolation strategy (Git worktrees for Phase 4) with
  cost-benefit analysis
