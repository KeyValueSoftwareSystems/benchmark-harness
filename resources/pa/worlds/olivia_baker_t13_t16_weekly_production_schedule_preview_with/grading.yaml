judge_rubric: 'Award full marks if the response: (1) Clearly identifies the blast
  chiller reliability issue as the critical risk factor for Saturday''s entremet testing,
  citing Sofia''s observations and the intermittent temperature performance. (2) Recognizes
  that Monday''s service appointment creates a production blackout window (10am-12pm)
  but more importantly determines whether Saturday testing should proceed. (3) Recommends
  making the rhubarb ingredient order conditional on equipment status confirmation,
  rather than ordering blindly. (4) Explicitly connects the timing dependency: Saturday
  testing viability depends on blast chiller reliability, which won''t be confirmed
  until after Monday''s service evaluation — creating a decision dilemma about whether
  to proceed with testing or postpone. (5) Presents findings in a structured preview
  format suitable for a morning review. Deduct points for: missing the equipment reliability
  risk entirely, failing to recognize the conditional dependency between ingredient
  ordering and equipment status, treating the service appointment as merely a scheduling
  item rather than a critical decision gate, or recommending Saturday testing proceed
  without acknowledging the equipment uncertainty.'
reference_solution: 'Step 1: Call calendar_list_events with start_date 2026-04-02
  and end_date 2026-04-09 to retrieve the week''s events. This returns EVT-417 (Saturday
  April 5 entremet testing requiring blast chiller), EVT-418 (Sunday April 6 ice skating
  session), and EVT-419 (Monday April 7 blast chiller service evaluation).


  Step 2: Call todo_list_tasks to retrieve pending tasks. This returns TODO-654 (confirm
  blast chiller service with Robert Kim), TODO-655 (order rhubarb for April 5 testing),
  and TODO-656 (review weekend testing schedule for equipment conflicts).


  Step 3: Call notes_list to identify relevant notes, then call notes_get for NOTE-191
  (voice memo about blast chiller performance concerns from March 31) and NOTE-192
  (weekend testing equipment dependency map from April 1). These notes reveal Sofia''s
  observation of 15-minute cooldown delays, Olivia''s concern about equipment reliability
  for entremet work, and the explicit dependency mapping showing Saturday testing
  is HIGH RISK due to blast chiller uncertainty.


  Step 4: Optionally call gmail_list_messages and gmail_get_message to retrieve MSG-5139
  (Robert Kim''s service appointment confirmation detailing 2-3 hour diagnostic window)
  and MSG-5140 (Sofia''s email flagging slower blast chiller cooldown on March 31).


  Step 5: Synthesize findings into a structured preview report:

  - **Critical Risk**: Saturday April 5 entremet testing (EVT-417) requires blast
  chiller for 6-hour window (9am-3pm), but equipment shows intermittent temperature
  issues (15-minute cooldown delays, temperature fluctuations in 5-8°C range per Sofia''s
  March 31 observations).

  - **Decision Gate**: Monday April 7 service evaluation (EVT-419, 10am-12pm) will
  determine blast chiller reliability. This creates production blackout during service
  window but more importantly determines whether Saturday testing should proceed.

  - **Conditional Dependency**: Rhubarb order (TODO-655, due April 3) should be made
  conditional on equipment status. Notes explicitly state ''make it conditional on
  equipment status confirmation'' and ''postpone if equipment issues persist''.

  - **Schedule Conflict Analysis**: Sunday ice skating session (EVT-418, 6am) does
  NOT conflict with Sunday testing window. No equipment overlap between Saturday and
  Sunday tests.

  - **Recommendation**: Monitor blast chiller performance Wednesday-Friday. If Sofia
  reports further issues, postpone Saturday testing regardless of timeline pressure.
  Olivia''s notes emphasize ''cannot risk another material loss'' and perfectionist
  standards override schedule gains.'
