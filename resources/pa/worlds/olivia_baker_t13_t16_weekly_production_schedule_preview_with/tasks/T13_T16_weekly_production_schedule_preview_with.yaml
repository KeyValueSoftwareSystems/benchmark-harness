scoring_components:
- name: Identified blast chiller dependency and reliability risk for Saturday testing
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - blast chiller
      - chiller equipment
      - blast-chiller
    - - Saturday
      - April 5
      - April 5th
      - weekend testing
    - - reliability
      - performance issue
      - temperature issue
      - intermittent
      - slower cooldown
      - equipment concern
- name: Flagged Monday service appointment creates production blackout
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Monday
      - April 7
      - April 7th
    - - service
      - maintenance
      - technician
      - evaluation
      - diagnostic
    - - blackout
      - unavailable
      - downtime
      - cannot use
      - out of service
      - production conflict
- name: Recognized critical dependency between Saturday testing viability and Monday
    service outcome
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - Saturday testing
      - entremet
      - strawberry rhubarb
      - April 5
    - - depends on
      - contingent
      - conditional
      - postpone
      - delay
      - wait for
    - - service results
      - equipment status
      - reliability confirmation
      - Monday evaluation
- name: Cross-referenced ingredient order deadline with equipment uncertainty
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - rhubarb
      - ingredient order
      - delivery
    - - April 3
      - Friday
      - Wednesday
    - - conditional
      - depends on
      - confirm equipment
      - wait for status
- name: Retrieved calendar events for the week
  weight: 0.15
  check:
    type: tool_called
