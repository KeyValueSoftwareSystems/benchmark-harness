task_id: T28_T16_bnp_paribas_q2_poc_early_demo_environmen
task_name: BNP Paribas Q2 POC - Early Demo Environment Provisioning Decision Under
  Budget Approval Uncertainty
category: decision_making
difficulty: simple
prompt:
  text: I need your recommendation on the BNP Paribas demo environment provisioning
    decision. The executive briefing is April 12, but we're stuck between locking
    in the France quota now versus waiting for budget confirmation. Walk me through
    the trade-offs and tell me what you think we should do.
  language: en
execution_date: '2026-04-02'
tools:
- name: gmail_list_messages
  description: 'List inbox messages. Returns subject/from/date (no body). Default:
    last 7 days, max 20 results. Response includes ''total'' (all matching) and ''returned''
    (this page) counts. Use query to search (matches if ALL words appear in subject
    or sender). Use offset for pagination. If query returns 0, retry without query
    to browse all messages.'
