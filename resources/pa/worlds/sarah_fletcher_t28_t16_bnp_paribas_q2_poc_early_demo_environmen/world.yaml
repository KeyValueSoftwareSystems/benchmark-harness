      - procurement approval
      - budget confirmation
    - - not confirmed
      - not yet confirmed
      - pending
      - uncertain
      - uncertainty
    - - April 8
      - April 9
      - 7 days
- name: Identified France quota window constraint
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - France quota
      - France region quota
      - France allocation
    - - €25K
      - '25000'
      - 25K
    - - April 7
      - 5 days
      - quota window closes
    - - Allianz
      - drops to €13K
      - reduces to €13K
      - reduced quota
- name: Recognized irreversibility and sunk cost risk
