judge_rubric: '# LLM Judge Rubric: BNP Paribas Demo Provisioning Decision


  ## Evaluation Perspective

  You are evaluating the agent''s response from the perspective of Arjun Menon, a
  principal solutions architect at Snowflake who needs a clear, risk-aware recommendation
  on whether to provision the BNP Paribas demo environment immediately or wait for
  budget confirmation.


  ## Scoring Dimensions (0-10 scale for each)


  ### 1. Constraint Identification (0-10)

  - **10**: Clearly identifies BOTH core constraints: (a) budget approval uncertainty
  (expected April 8-9, not confirmed, ~15-25% failure risk based on procurement tone),
  and (b) France quota window closing April 7 (drops from €25K to €13K due to Allianz
  extension)

  - **7-9**: Identifies both constraints but misses nuances (e.g., doesn''t quantify
  approval failure probability, doesn''t explain Allianz impact)

  - **4-6**: Identifies only one constraint clearly, or identifies both but with significant
  factual errors

  - **1-3**: Misses one or both core constraints, or conflates them with secondary
  issues

  - **0**: Does not identify the decision constraints


  ### 2. Risk Assessment Quality (0-10)

  - **10**: Performs explicit expected value calculation or structured risk assessment
  (probability of budget failure × €45K sunk cost vs. opportunity cost of architectural
  downgrade + narrative rework + demo fidelity loss). Recognizes irreversibility of
  demo credit allocation as key asymmetric risk factor.

  - **7-9**: Discusses sunk cost risk and opportunity cost trade-off qualitatively,
  recognizes irreversibility, but doesn''t quantify expected loss

  - **4-6**: Mentions risk but doesn''t compare Option A vs. Option B systematically,
  or ignores irreversibility

  - **1-3**: Superficial risk discussion (e.g., "there''s some risk") without analyzing
  consequences

  - **0**: No risk assessment


  ### 3. Decision Recommendation Clarity (0-10)

  - **10**: Provides clear, justified recommendation (wait for confirmation OR provision
  immediately) with explicit rationale tied to risk assessment. Explains why the chosen
  option''s benefits outweigh its costs given the specific constraints.

  - **7-9**: Clear recommendation but rationale is incomplete (e.g., recommends waiting
  but doesn''t explain how to mitigate architectural downgrade)

  - **4-6**: Ambiguous recommendation ("it depends") without sufficient decision criteria,
  or recommendation doesn''t align with the risk analysis

  - **1-3**: Contradictory or poorly justified recommendation

  - **0**: No recommendation provided


  ### 4. Mitigation and Contingency Planning (0-10)

  - **10**: Includes actionable mitigation plan for the recommended option (e.g.,
  if waiting: pre-draft contingency narratives, reserve UK quota immediately, monitor
  procurement daily, define escalation trigger if approval confidence increases)

  - **7-9**: Mentions mitigation strategies but lacks specificity or misses key actions

  - **4-6**: Generic mitigation suggestions not tailored to the BNP context

  - **1-3**: No mitigation planning

  - **0**: N/A


  ### 5. Authority and Escalation Awareness (0-10)

  - **10**: Recognizes that committing €45K under budget uncertainty may require AE
  (Tom Harris) or regional VP approval, and either confirms authority boundaries or
  flags the need to escalate the decision

  - **7-9**: Mentions need to coordinate with Tom Harris but doesn''t explicitly address
  authority boundaries

  - **4-6**: Proceeds with recommendation without considering approval authority

  - **1-3**: Makes unilateral commitment decision that exceeds likely SA authority

  - **0**: N/A


  ### 6. Use of Evidence from Multiple Sources (0-10)

  - **10**: Synthesizes evidence from CRM (BNP account context, CDO requirements),
  workmail (Claire''s procurement update, CFO questions), finance (quota availability,
  Allianz timeline), config (provisioning decision tracker), and Slack/notes (team
  discussion, risk assessment)

  - **7-9**: Uses 3-4 sources effectively

  - **4-6**: Uses 1-2 sources, misses key evidence

  - **1-3**: Minimal evidence gathering

  - **0**: No evidence cited


  ## Overall Quality Assessment

  Provide a holistic 0-10 score considering:

  - Does the response give Arjun a clear, actionable recommendation he can take to
  Tom Harris?

  - Is the risk assessment rigorous enough for a €45K decision under uncertainty?

  - Does the agent demonstrate understanding of the temporal constraints (April 4
  reservation deadline, April 7 quota drop, April 8-9 approval, April 12 briefing)?

  - Would this response help or hinder the deal?


  ## Final Score Calculation

  Average the six dimension scores, then apply a holistic adjustment (-1 to +1) based
  on overall quality. Return a final score from 0-10.'
reference_solution: "# Reference Solution: BNP Paribas Demo Provisioning Decision\n\
  \n## Step 1: Gather Context from CRM\n- Call `crm_get_customer` with customer_id=\"\
  CUS-149\" (BNP Paribas)\n- Extract key facts:\n  - Q2 POC executive briefing scheduled\
  \ April 12 (10 days from execution date 2026-04-02)\n  - Multi-region demo environment\
  \ required (France + UK clusters, €45K credit allocation)\n  - CDO Jean-Pierre Laurent\
  \ requested cross-border analytics demo fidelity\n  - Procurement budget approval\
  \ (€50K cap) expected April 9 but not yet confirmed\n  - Critical decision: provision\
  \ immediately (locks €25K France quota before Allianz extension reduces it to €13K\
  \ on April 7) vs. wait for budget confirmation (forces 11-cluster architecture)\n\
  \  - Non-refundable demo credits create sunk cost risk if budget approval fails\n\
  \n## Step 2: Check Workmail for Procurement Approval Status\n- Call `workmail_list_messages`\
  \ to find recent BNP Paribas correspondence\n- Call `workmail_get_message` with\
  \ message_id=\"WMSG-5084\" (Claire Dubois email from April 1)\n- Extract procurement\
  \ timeline:\n  - Procurement committee meets Friday April 4\n  - CFO's office flagged\
  \ questions about France + UK cluster architecture costs\n  - CDO championing the\
  \ POC\n  - Formal approval confirmation expected Tuesday April 8 or Wednesday April\
  \ 9\n  - Claire asks about demo credit reversibility if budget gets reduced/rejected\n\
  - **Key signal**: Claire's tone suggests moderate confidence but not certainty.\
  \ CFO questions are a yellow flag.\n\n## Step 3: Check Finance Records for Quota\
  \ and Budget Details\n- Call `finance_list_transactions` to find BNP-related allocations\n\
  - Review transaction TXN-6044 (France region quota reservation):\n  - €25K available\
  \ NOW for 7-cluster France allocation\n  - Quota window closes April 7 when Allianz\
  \ Q1 extension reduces pool to €13K\n  - Non-refundable if POC budget approval fails\n\
  - Review transaction TXN-6045 (BNP Q2 POC budget pending):\n  - €45K total allocation\
  \ (France + UK)\n  - Budget approval pending, expected April 8-9\n  - Provisioning\
  \ decision required by April 4 to lock France quota\n\n## Step 4: Check Config Service\
  \ for Provisioning Decision Context\n- Call `config_get_integration` with integration_id=\"\
  INT-111\"\n- Extract decision parameters:\n  - France quota: €25K now, drops to\
  \ €13K on April 7\n  - Budget approval expected April 8-9 but not confirmed\n  -\
  \ Immediate provisioning: locks 12-cluster architecture, creates €45K sunk cost\
  \ risk if approval fails (20% probability estimate)\n  - Waiting: avoids waste,\
  \ forces 11-cluster downgrade, weakens CDO-requested demo fidelity\n  - Decision\
  \ deadline: April 4 to guarantee France quota reservation\n  - Reversibility: demo\
  \ credits non-refundable, no alternative use\n\n## Step 5: Review Notes for Risk\
  \ Assessment\n- Call `notes_get` with note_id=\"NOTE-153\"\n- Extract detailed risk\
  \ assessment:\n  - Estimated approval failure probability: 15-25% (conservative:\
  \ 20%)\n  - Option A (provision immediately): €45K × 20% = €9K expected sunk cost\n\
  \  - Option B (wait for confirmation): architectural downgrade + narrative rework\
  \ + demo fidelity loss\n  - Irreversibility: provisioned credits cannot be refunded\
  \ or reallocated\n  - Recommendation: WAIT for confirmation\n  - Rationale: non-trivial\
  \ failure probability + irreversible allocation = prudent to confirm budget first\n\
  \  - Mitigation: pre-draft contingency narratives, reserve UK quota immediately,\
  \ monitor procurement daily\n\n## Step 6: Check Slack for Team Coordination\n- Call\
  \ `claw_slack_list_channels` and identify \"bnp-paribas-q2-poc\" (SLKC-56)\n- Call\
  \ `claw_slack_list_messages` for channel SLKC-56\n- Confirm team alignment:\n  -\
  \ Arjun documented risk assessment, recommends waiting\n  - Sophie Laurent can reserve\
  \ UK quota immediately (€20K, no conflicts)\n  - Tom Harris agrees with waiting\
  \ recommendation, considers €9K sunk cost risk material\n  - 11-cluster architecture\
  \ defensible as phased deployment\n\n## Step 7: Synthesize Decision Recommendation\n\
  \n### Core Trade-Off Analysis\n**Option A: Provision Immediately (by April 4)**\n\
  - Pros: Locks €25K France quota → 12-cluster architecture (7 France + 5 UK), preserves\
  \ full cross-border demo fidelity\n- Cons: €45K sunk cost if budget approval fails,\
  \ expected loss = 20% × €45K = €9K\n\n**Option B: Wait for Budget Confirmation (until\
  \ April 8-9)**\n- Pros: Avoids wasted provisioning, zero sunk cost risk\n- Cons:\
  \ Forces 11-cluster architecture (6 France + 5 UK), requires last-minute narrative\
  \ redesign, weakens demo fidelity\n\n### Recommendation: WAIT FOR BUDGET CONFIRMATION\n\
  \n**Rationale:**\n1. Non-trivial failure probability (20%) × high sunk cost (€45K)\
  \ = €9K expected loss is material for EMEA demo budget\n2. Irreversibility of demo\
  \ credit allocation creates asymmetric risk (cannot recover if approval fails)\n\
  3. 11-cluster architecture is defensible: can frame as phased deployment, preserves\
  \ core cross-border capability (6 France clusters still demonstrate federation)\n\
  4. Narrative rework is manageable: 2-3 days sufficient for compliance story adjustment\
  \ before April 12 briefing\n5. CDO has strong executive sponsorship (Jean-Pierre\
  \ pushing CFO office), so approval is likely but prudent to confirm\n\n**Mitigation\
  \ Plan:**\n- Pre-draft two compliance narratives (12-cluster ideal, 11-cluster contingency)\n\
  - Coordinate with Sophie Laurent to reserve UK quota (€20K) immediately (lower risk,\
  \ no Allianz conflict)\n- Monitor procurement approval daily via Claire Dubois\n\
  - If approval confirmed April 8, provision France quota immediately with 11-cluster\
  \ architecture\n- Frame architectural constraint as \"phased approach prioritizing\
  \ UK regulatory environment, France expansion in Phase 2\"\n\n**Escalation Trigger:**\n\
  If Claire signals approval confidence >90% before April 4 deadline, reconsider immediate\
  \ provisioning.\n\n**Authority Check:**\nConfirm with Tom Harris (AE) that this\
  \ recommendation aligns with commercial risk tolerance. As a principal SA, Arjun\
  \ should coordinate large speculative allocations (€45K under budget uncertainty)\
  \ with the account executive before final commitment.\n\n## Step 8: Document and\
  \ Communicate\n- Notify Tom Harris via workmail of the recommendation\n- Document\
  \ decision rationale in notes (already done in NOTE-153)\n- Coordinate with Sophie\
  \ Laurent on UK quota reservation\n- Set up daily check-ins with Claire Dubois for\
  \ procurement status updates"
