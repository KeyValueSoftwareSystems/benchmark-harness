task_id: T18_T17_wellington_contract_breach_vs_nhs_emerge
task_name: Wellington contract breach vs NHS emergency trauma activation - role identity
  conflict resolution
category: conflict_detection
difficulty: simple
prompt:
  text: I've got a major trauma activation at Royal London at 12:45 today (April 2nd)
    and my Wellington private session this afternoon. Help me figure out what to do.
  language: en
execution_date: '2026-04-02'
