services:
  challenge-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: character
    networks:
      default:
        aliases:
          - character
    healthcheck:
      test:
        - CMD-SHELL
        - (echo > /dev/tcp/127.0.0.1/1337) >/dev/null 2>&1 || nc -z 127.0.0.1
          1337
      interval: 2s
      retries: 60
