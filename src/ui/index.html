<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smithy</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 8h13c0 2.5-1.5 4-4 4h-1v3h2v3H7v-3h2v-3H8C5 12 3 10.5 3 8Z"/><path d="M16 8h5l-2 3h-3"/></svg>
    <span class="brand-name">Smithy</span>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" aria-current="page" type="button">Models</button>
    <button class="tab" type="button" disabled title="Coming soon">Frameworks</button>
    <button class="tab" type="button" disabled title="Coming soon">Agents</button>
    <button class="tab" type="button" disabled title="Coming soon">Tools</button>
  </nav>
  <button id="runs" class="btn" type="button">Runs</button>
  <button id="theme" class="icon-btn" type="button" aria-label="Switch to dark theme"></button>
</header>
<main class="layout">
  <section class="col" aria-labelledby="models-h"><h2 id="models-h" class="col-h">Models</h2><div id="list"></div></section>
  <section class="col center" aria-labelledby="bench-h"><h2 id="bench-h" class="col-h">Benchmark</h2><div id="stage"></div></section>
  <section class="col" aria-labelledby="queue-h"><h2 id="queue-h" class="col-h">Queue</h2><div id="queue"></div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
