x-netra: &netra
  NETRA_OTLP_ENDPOINT: ${NETRA_OTLP_ENDPOINT:-}
  NETRA_API_KEY: ${NETRA_API_KEY:-}
  NETRA_ENV: ${NETRA_ENV:-local}
  NETRA_DEBUG: ${NETRA_DEBUG:-}

networks:
  default:
    name: bench

volumes:
  redis-data:
  # SQLite (runs), per-model result JSON and generated reports; shared by api, reports and the Slack bot.
  harness-data:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Provisions one agent container per job via the docker socket (agent containers never get it).
  api:
    # Fixed so the api can join itself to per-job networks by name (see API_CONTAINER_NAME).
    container_name: bench-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      <<: *netra
      REDIS_URL: redis://redis:6379
      RESOURCES_DIR: ${PWD}/resources
      MGMT_KEY: ${MGMT_KEY:?set MGMT_KEY in .env}
      API_CONTAINER_NAME: bench-api
      # Model turns an agent may take per run before it is aborted; unset or 0 means unlimited.
      MAX_TURNS: ${MAX_TURNS:-}
      # The MODELS entry that judges PA runs.
      JUDGE_MODEL: ${JUDGE_MODEL:-}
    depends_on:
      - redis
    volumes:
      - harness-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path as on the host: challenge compose files run against the host's docker daemon.
      - ${PWD}/resources:${PWD}/resources:ro
    ports:
      - "3000:3000"

  # Builds an HTML report from chosen models' results: `docker compose run --rm reports --benchmark cyber --models a,b`.
  reports:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile.reports
    environment:
      RESULTS_DIR: /data/results
      REPORTS_DIR: /data/reports
      # Optional: one model config as JSON to write the report narrative (never the api's MODELS).
      NARRATIVE_MODEL: ${NARRATIVE_MODEL:-}
    volumes:
      - harness-data:/data

  # AI Scout Slack bot (../Quartermaster): reads the harness SQLite and reports read-only.
  # Publish: `docker compose --profile bot run --rm quartermaster python publish.py --report /data/reports/<id>.html --model <name>`
  quartermaster:
    profiles: ["bot"]
    build:
      context: ../Quartermaster
    restart: unless-stopped
    env_file:
      - path: ../Quartermaster/.env
        required: false
    environment:
      QUARTERMASTER_DB_PATH: /data/harness.db
    volumes:
      - harness-data:/data:ro

  # Agent images only: built by `npm run up`, started per job by the api (never as a compose service).
  minimal:
    image: bench/minimal
    profiles: ["agents"]
    build:
      context: .
      dockerfile: docker/Dockerfile.minimal
    environment:
      <<: *netra
      BENCHMARK: minimal
      API_URL: http://api:3000
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cyber:
    image: bench/cyber
    profiles: ["agents"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cyber

  pa:
    image: bench/pa
    profiles: ["agents"]
    build:
      context: .
      dockerfile: docker/Dockerfile.pa
    environment:
      <<: *netra
      BENCHMARK: pa
      API_URL: http://api:3000
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # One image per personal assistant under test (PAA_IMAGES in src/pa/constants.ts); see docker/paa/<name>/.
  pa-paa-openclaw:
    image: bench/pa-paa-openclaw
    profiles: ["agents"]
    build:
      context: .
      dockerfile: docker/paa/openclaw/Dockerfile
