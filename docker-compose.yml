x-netra: &netra
  NETRA_OTLP_ENDPOINT: ${NETRA_OTLP_ENDPOINT:-}
  NETRA_API_KEY: ${NETRA_API_KEY:-}
  NETRA_ENV: ${NETRA_ENV:-local}
  NETRA_DEBUG: ${NETRA_DEBUG:-}

networks:
  default:
    name: bench

volumes:
  redis-data:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Provisions one agent container per job via the docker socket (agent containers never get it).
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      <<: *netra
      REDIS_URL: redis://redis:6379
      RESOURCES_DIR: ${PWD}/resources
      # Model turns an agent may take per run before it is aborted; unset or 0 means unlimited.
      MAX_TURNS: ${MAX_TURNS:-}
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path as on the host: challenge compose files run against the host's docker daemon.
      - ${PWD}/resources:${PWD}/resources:ro
    ports:
      - "3000:3000"

  # Agent images only: built by `npm run up`, started per job by the api (never as a compose service).
  minimal:
    image: bench/minimal
    profiles: ["agents"]
    build:
      context: .
      dockerfile: docker/Dockerfile.minimal
    environment:
      <<: *netra
      BENCHMARK: minimal
      API_URL: http://api:3000
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cyber:
    image: bench/cyber
    profiles: ["agents"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cyber
